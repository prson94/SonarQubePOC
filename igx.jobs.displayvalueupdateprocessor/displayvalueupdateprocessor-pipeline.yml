trigger:
  branches:
    include:
    - '*sprint*'
pr:
  autoCancel: false
  drafts: false
  branches:
    include:
    - '*sprint*'
  paths:
    include:
    - /igx.jobs
    - /d360.core
    - /d360.model
    - /d360.extensions
    - /igx.jobs.displayvalueupdateprocessor
name: WebJob-DisplayValueUpdateProcessor-$(SourceBranchName)-$(Date:MM-dd-yyyy)$(Rev:.r)
resources:
  repositories:
  - repository: self
    type: git
  - repository: templates
    type: github
    name: Infogix/govern-pipeline-templates
    ref: refs/heads/main
    endpoint: 'govern-build - Service Endpoint'
stages:
- stage: BUILD_NAME
  displayName: 'Set build name'
  dependsOn: []
  jobs:
  - template: build/jobs/job-build-name.yml@templates
- stage: BUILD_SOLUTION
  displayName: 'Build DisplayValueUpdateProcessor'
  dependsOn: []
  jobs:
  - job: BUILD
    displayName: 'Build DisplayValueUpdateProcessor'
    timeoutInMinutes: 0
    cancelTimeoutInMinutes: 1
    pool:
      vmImage: windows-2019
    steps:
    - checkout: self
    - template: build/seteps/step-azure-key-vault.yml@templates
      parameters:
        secretsFilter: 'whitesourceApiKey,blackduckApi'
    - template: build/steps/step-t4-transform.yml@templates
    - task: Cache@2
      displayName: 'Cache NuGet packages'
      inputs:
        key: 'nuget-temp | "$(Agent.OS)" | $(Build.SourcesDirectory)/**/packages.config, !$(Build.SourcesDirectory)/igx.jobs.genericcommandprocessor/packages.config'
        restoreKeys: |
          nuget-temp | "$(Agent.OS)"
          nuget-temp
        path: $(UserProfile)/.nuget/packages/
    - template: build/steps/step-dotnet-build.yml
      parameters:
        solutionToRestore: .
        solutionToBuild: d360.core/d360.core.csproj
        nuGetCommand: 'restore -Project2ProjectTimeOut 20'
        buildArguments: '/p:Configuration=Release /t:Rebuild'
    - task: MSBuild@1
      displayName: Build solution d360.extensions/d360.extensions.csproj
      inputs:
        solution: d360.extensions/d360.extensions.csproj
        msbuildArguments: /p:Configuration=Release /t:Rebuild
        maximumCpuCount: true
    - task: MSBuild@1
      displayName: Build solution d360.model/d360.model.csproj
      inputs:
        solution: d360.model/d360.model.csproj
        msbuildArguments: /p:Configuration=Release /t:Rebuild
        maximumCpuCount: true
    - task: MSBuild@1
      displayName: Build solution d360.utils.company/d360.utils.company.csproj
      inputs:
        solution: d360.utils.company/d360.utils.company.csproj
        msbuildArguments: /p:Configuration=Release /t:Rebuild
        clean: true
        maximumCpuCount: true
    - task: MSBuild@1
      displayName: Build solution igx.jobs/igx.jobs.csproj
      inputs:
        solution: igx.jobs/igx.jobs.csproj
        msbuildArguments: /p:Configuration=Release /t:Rebuild
    - task: MSBuild@1
      displayName: 'Build WebJob Display Value Update Processor '
      inputs:
        solution: igx.jobs.displayvalueupdateprocessor/igx.jobs.displayvalueupdateprocessor.csproj
        msbuildArguments: /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(Build.Repository.LocalPath)/displayvalueupdateprocessor/"
        clean: true
        maximumCpuCount: true
    - template: build/jobs/job-whitesource-blackduck-scan.yml@templates
      parameters:
        whitesourceApiKey: $(whitesourceApiKey)
        blackduckApi: $(blackduckApi)
        artifactName: DisplayValueUpdateProcessor
        projectName: 'Display Value Update Processor' 
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact: Display Value Update Processor'
      inputs:
        PathtoPublish: $(Build.Repository.LocalPath)/displayvalueupdateprocessor/
        ArtifactName: DisplayValueUpdateProcessor