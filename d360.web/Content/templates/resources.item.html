<div class="row">
    <div class="col s12 m12 l5">
        <div class="tile tile-detail">
            <div class="row">
                <div class="col l3 m3 s12">
                    <img src="/resources/image/{{ID}}?size=200" style="border-radius: 5px;margin-top:5px;width:100%" />
                </div>
                <div class="col l9 m9 s12" id="SocialTile"></div>
            </div>
            <div class="row">
                <div id="DetailTile" class="col l12 m9 s12"></div>
            </div>
        </div>

        <div id="AssignmentsTile" class="tile tile-detail" data-bind="template: {name: 'homePageCountTileTmpl' }"></div>

    </div>
    <div class="col s12 m12 l7">
        <div class="tile tile-detail">
          <div class="row">
              <div id="OwnedTile" class="col s12"></div>
          </div>
          <div class="row">
              <div id="FollowingTile" class="col s12"></div>
          </div>
        </div>
    </div>
</div>
