<div class="row">
    <div class="col l1 s2">
        <img src="/resources/image/{{ID}}?size=100" style="border-radius: 5px" />
    </div>
    <div class="col l11 s10">
        <div class="row">
            <div class="col s3">
                <div id="DetailTile"></div>
            </div>
            <div class="col s6">
                <div class="tile tile-detail">
                    <div style="display: inline-block; width: 49%; margin: auto">
                        <div id="OwnedTile"></div>
                    </div>
                    <div style="display: inline-block; width: 49%; margin: auto">
                        <div id="FollowingTile"></div>
                    </div>
                    <div class="clearfix"></div>
                </div>
            </div>
            <div class="col s3">
                <div id="SocialTile" class="tile tile-detail" data-bind="template: { name: 'profileSocialMicroTileTmpl' }"></div>
                <div id="RandomQuestion" class="tile tile-detail"></div>
            </div>

            <div class="col s12">
                <div class="tile tile-detail">
                    <header>{{Title}}'s Board</header>
                    <article id="ProfileBoard" data-bind="template: {name: 'boardTmpl' }"></article>
                </div>
            </div>
        </div>
    </div>
</div>
