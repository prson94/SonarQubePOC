<div class="row">
    <div class="col s12 m3 l3">
        <div class="tile tile-detail" style="margin-bottom: 15px">
            <div id="PolicyGrid"></div>
        </div>
    </div>
    <div class="col s12 m9 l9">

        <div class="row">
            <div class="col s12 m8 l8">
                <div id="DetailContainerTile" class="tile tile-detail">
                    <div id="DetailTile"></div>
                    <div id="AttributesTile"></div>
                </div>
            </div>
            <div class="col s12 m4 l4">
                <div id="PanelButtonsTile" class="root-tile" style="text-align: right">
                    <button id="ShowImpact"><i class="fa fa-lg fa-warning green-text"></i>Display Impact</button>
                    <button id="ShowLineage"><i class="fa fa-lg fa-code-fork green-text"></i>Display Lineage</button>
                </div>
                <div id="StatusTile" class="tile tile-detail"></div>
                <div id="StatisticsTile" class="tile tile-detail" style="height: 100%" data-bind="template: {name: 'policyRuleStatisticsTileTmpl' }"></div>
                <div id="AggregatesTileContainer" class="tile tile-detail"></div>
            </div>
        </div>
        <div id="Responsibilities" class="tile tile-detail"></div>
    </div>
</div>
