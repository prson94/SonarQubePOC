<div class="row">
    <div class="col l3 m5 s12"><div id="Tree"></div></div>
    <div class="col l9 m7 s12">
        <div class="row">
            <div class="col s12 m7 l7">
                <div id="DetailContainerTile" class="tile tile-detail">
                    <div id="DetailTile"></div>
                    <div id="SynonymsTile"></div>
                    <div id="AttributesTile"></div>
                </div>
                <div id="GovernanceTile" class="tile tile-detail"></div>
            </div>
            <div class="col s12 m5 l5">
                <div id="PanelButtonsTile" class="root-tile" style="text-align: right">
                    <button id="ShowImpact"><i class="fa fa-lg fa-warning green-text"></i>Display Impact</button>
                    <button id="ShowLineage"><i class="fa fa-lg fa-code-fork green-text"></i>Display Lineage</button>
                </div>
                <div id="StatisticsTile" class="tile tile-detail"></div>
                <div id="AggregatesTileContainer" class="tile tile-detail"></div>
                <div id="Survey" data-bind="template: {name: 'surveyTmpl' }"></div>
            </div>
        </div>
    </div>
</div>
