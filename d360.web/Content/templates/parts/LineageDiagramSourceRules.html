<div class="rule-list">
    {{#each Rules}}
    <div class="rule-name" style="float: left; width: 92%">{{Name}}</div>
    <table>
        <thead>
            <tr>
                <th style="padding-right:5px">Order</th>
                <th>Source</th>
            </tr>
        </thead>
        <tbody>
            {{#each Items}}
            <tr class="rule-item-name">
                <td class="rule-item" rowspan="3" style="text-align:center">{{SortOrder}}</td>
                <td class="rule-item">{{SourceTypeName}} : {{SourceObjectName}}</td>
            </tr>
            <tr>
                <td><i>Contexts: </i>{{{ItemContexts}}}</td>
            </tr>
            <tr>
                <td><i>Description: </i>{{{Description}}}</td>
            </tr>
            {{/each}}
        </tbody>
    </table>
    <div style="height:20px"></div>
    {{/each}}
</div>
