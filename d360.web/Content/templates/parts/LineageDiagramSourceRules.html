<div class="rule-list">
    <table>
        <thead>
            <tr>
                <th style="padding-right:5px">Order</th>
                <th>Source</th>
            </tr>
        </thead>
        <tbody>
            {{#each this}}
            <tr class="rule-item-name">
                <td class="rule-item" rowspan="3" style="text-align:center">{{Sequence}}</td>
                <td class="rule-item">{{SubjectTypeName}} : {{SubjectName}}</td>
            </tr>
            <tr>
                <td><i>Contexts: </i>{{{Contexts}}}</td>
            </tr>
            <tr>
                <td><i>Description: </i>{{{Description}}}</td>
            </tr>
            {{/each}}
        </tbody>
    </table>
</div>
