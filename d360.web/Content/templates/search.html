<div id="SearchArea">
    <div class="search-input-container search-control-area searchinput" id="simpleSearch">
            <div class="search-input-text-container">
                <input type="text" id="home-search-text" placeholder="What do you want to find?" class="search-input-text" autofocus autocomplete="off" />
            </div>
            <div class="search-input-adv-container">
                <button type="button" name="action" id="home-adv-btn" class="adv-search-btn">
                    Advanced&nbsp;<i class="fa fa-caret-down"></i>
                </button>
            </div>
            <div class="search-input-button-container">
                <button type="button" name="action" id="home-search-btn" class="search-input-btn">
                    <i class="fa fa-search"></i>
                </button>
            </div>
    </div>    
    <div class="row searchinput" id="advancedSearch" style="display:none;">
        <div class="col s12">
            <div class="tile tile-detail">
                <div class="row">                    
                    <div class="col s1 offset-s11">
                        <button type="button" name="simple" class="simple-search-btn right">Simple&nbsp;<i class="fa fa-caret-down"></i></button>
                    </div>
                </div>
                <div id="AdvancedSearchFilters" data-bind="template: {name: 'advancedSearchFilterTmpl' }">
                </div>
                <div class="row">
                    <div class="col s1 offset-s1">
                        <button class="btn waves-effect waves-light brown lighten-1 saveButton" type="button" name="advsearch" id="do-adv-search-btn">Search</button>
                    </div>                    
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col l2 m4 hide-on-small-only">
            <div class="tile tile-detail">
                <h4 class="search-result-categories">Categories</h4>
                <div class="widget search-category-area" id="CategoryResults" data-bind="template: {name: 'searchResultsCategoryTmpl', foreach: categories }"></div>
            </div>
         </div>
        <div class="col l10 m8 s12">
            <div class="tile tile-detail">
                <h6 data-bind="text: elapsedTime" class="search-result-summary"></h6>
                <div id="SearchResults"></div>
                </div>
            </div>
    </div>
</div>
