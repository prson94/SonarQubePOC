<div class="row">
    <div class="col s5">
        <div class="tile tile-detail">
            <header>Alerts</header>
            <div id="AlertsTile"></div>
        </div>
        <div class="tile tile-detail">
            <header>Alert History</header>
            <div id="AlertHistoryTile">
                <div id="AlertHistoryChart" style="height: 300px; width: 98%"></div>
            </div>
        </div>
    </div>
    <div class="col s5">
        <div class="tile tile-detail">
            <header>Products</header>
            <div id="ProductsTile"></div>
        </div>
        <div class="tile tile-detail">
            <header>Discussions</header>
            <div id="ThreadsTile"></div>
        </div>
    </div>
    <div class="col s2">
        <div class="tile tile-detail">
            <header>Community Sentiment</header>
            <div id="SentimentTile">
                <div class="Rating ExtraLargeAbsoluteRating HighRating">92%</div>
                <div id="SentimentChart"></div>
            </div>
        </div>
        <div class="tile tile-detail">
            <header>Quality</header>
            <div id="QualityTile">
                <div class="Rating ExtraLargeAbsoluteRating MediumRating">78%</div>
                <div id="QualityChart"></div>
            </div>
        </div>
        <div class="tile tile-detail">
            <header>Timeliness</header>
            <div id="TimelinessTile">
                <div class="Rating ExtraLargeAbsoluteRating MediumRating">64%</div>
                <div id="TimelinessChart"></div>
            </div>
        </div>
        <div class="tile tile-detail">
            <header>Completeness</header>
            <div id="CompletenessTile">
                <div class="Rating ExtraLargeAbsoluteRating HighRating">96%</div>
                <div id="CompletenessChart"></div>
            </div>
        </div>
    </div>
</div>
