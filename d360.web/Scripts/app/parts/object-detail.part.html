<div style="line-height:10px">&nbsp;</div>
<div *ngFor="let row of rows;let i=index" >
    <div class="row" style="margin-bottom: 10px" attr.data-category="{{rows[i].Category}}">
        <div *ngIf="columns == 1">
            <div class="col l2 m3 s12">
                <div *ngFor="let field of rows[i].FirstColumnFields; let j=index;">
                    <div class="FieldName FieldDisplayName">{{rows[i].FirstColumnFields[j].Name}}</div>
                </div>
            </div>
            <div class="col l10 m9 s12">
                <div *ngFor="let field of rows[i].FirstColumnFields; let j=index;">
                    <div class="FieldDisplayContent"></div>
                </div>
            </div>
        </div>
        <div *ngIf="columns != 1">
            <div class="col l2 m3 s12">
                <div *ngFor="let field of rows[i].FirstColumnFields; let j=index;">
                    <div class="FieldName FieldDisplayName">{{rows[i].FirstColumnFields[j].Name}}</div>
                </div>
            </div>
            <div class="col l4 m3 s12">
                <div *ngFor="let field of rows[i].FirstColumnFields; let j=index;">
                    <div class="FieldDisplayContent"></div>
                </div>
            </div>
            <div class="col l2 m3 s12">
                <div *ngFor="let field of rows[i].SecondColumnFields; let j=index;">
                    <div class="FieldName FieldDisplayName">{{rows[i].SecondColumnFields[j].Name}}</div>
                </div>
            </div>
            <div class="col l4 m3 s12">
                <div *ngFor="let field of rows[i].SecondColumnFields; let j=index;">
                    <div class="FieldDisplayContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>
