<div class="row">
    <div class="col l4 m6 s12">

        <div>
            <ng-table [config]="config.sorting"
                      [rows]="domainTypes" [columns]="columns">
            </ng-table>
        </div>
        <div id="List"></div>
    </div>
    <div class="col l8 m6 s12">
        <div class="row">
            <div class="col s12">
                <div id="DetailTile" class="tile tile-detail">
                    <object-detail [objectType]="objectType" [objectId]="objectId"></object-detail>
                </div>
            </div>
            <div class="col s12">
                <div id="FieldsTile" class="tile tile-detail"></div>
            </div>
            <div class="col s12">
                <div id="GovernanceTile" class="tile tile-detail"></div>
            </div>
        </div>
    </div>
</div>
