<div class="grid-actions-header column-layout">
	<div class="grid-actions-header-row">
		<div class="simple-search">
			<ig-search-field [debounce]="600"
							 [(ngModel)]="simpleFilterValue"
							 (onSearch)="dt.filterGlobal($event, 'contains')"
							 mode="Keypress">
			</ig-search-field>
		</div>
		<div class="grid-action-buttons">
			<button [igDataCy]="'Policy_Add'"
					(click)="add()"
					igButton
					pTooltip="Add Policy"
					i18n-pTooltip
					tooltipPosition="top"
					tooltipStyleClass="ig-tooltip"
					class="ig-button-primary"
					icon="fa-plus">
			</button>
		</div>
	</div>
</div>

<div class="grid-wrapper">
	<p-table #dt [value]="items"
			 [scrollable]="true" 
			 scrollHeight="flex" 
			 selectionMode="single"
			 [metaKeySelection]="true"
			 [globalFilterFields]="['name', 'uid', 'assetTypeName', 'roleName']"
			 [pageLinks]="3"
			 [paginator]="true"
			 [(first)]="first"
			 [rows]="rowsPerPage"
			 [rowsPerPageOptions]="defaultPagingOptions"
			 [selection]="selected"
			 (selectionChange)="selectRow($event)"
			 [stateStorage]="gridStateStorage"
			 stateKey="{{gridStorageKey}}"
			 [loading]="isLoading"
			 [loadingIcon]="'fa fa-spinner fa-spin'">
		<ng-template pTemplate="header">
			<tr>
				<th [pSortableColumn]="'name'">
					<ng-container i18n>Name</ng-container>
					<sort-icon [field]="'name'"></sort-icon>
				</th>
				<th [pSortableColumn]="'assetTypeName'">
					<ng-container i18n>Asset Type</ng-container>
					<sort-icon [field]="'assetTypeName'"></sort-icon>
				</th>
				<th [pSortableColumn]="'roleName'">
					<ng-container i18n>Role</ng-container>
					<sort-icon [field]="'roleName'"></sort-icon>
				</th>
				<th style="width: 40px"></th>
			</tr>
		</ng-template>
		<ng-template pTemplate="body" let-item>
			<tr #tableRow (click)="selected=item;selectedChange.emit(selected);"
				(contextmenu)="positionContextMenu($event, floatButton, floatMenu, gridTools); selected=item;"
				(dblclick)="open(item.uid)"
				[pSelectableRow]="item"
				style="position:relative;"
				[attr.data-uid]="item.uid">
				<td>{{item.name}}</td>
				<td>{{item.assetTypeName}}</td>
				<td>{{item.roleName}}</td>
				<td #gridTools>
					@if (item.MenuItems) {
					<div class="token-popup-menu">
						<button igButton type="button" icon="fa-ellipsis-v" (click)="tokenMenu.toggle($event);"></button>
						<ig-popup-menu [items]="item.MenuItems"
									   #tokenMenu
									   [tabIndex]="1"></ig-popup-menu>
					</div>
					}

					<button class="ig-float-popup-container" #floatButton>
						<ig-popup-menu [items]="item.MenuItems" #floatMenu [tabIndex]="1">
						</ig-popup-menu>
					</button>
				</td>
			</tr>
		</ng-template>
		<ng-template pTemplate="summary">
			<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
		</ng-template>
	</p-table>
</div>

<policy-delete [item]="selected" 
			   [isModalVisible]="showDelete" 
			   (onCancel)="showDelete=false" 
			   (onDelete)="deleteItem($event)"></policy-delete>
<policy-editor [item]="selected" 
			   [options]="options" 
			   [isModalVisible]="showEditor" 
			   (onCancel)="closeEditor()" 
			   (onSave)="onSave($event)"></policy-editor>
