<d3s-modal additionalClasses="modal-dyn-editor asset-editor medium-dialog modal-form"
           [showTitle]="false"
           (onClose)="cancel();"
           [isVisible]="isModalVisible">
    <div class="editor-container">
        <div class="form-editor-container">
            <div class="form-header-wrapper">
                <div class="form-header">
                    <h2 i18n>Assign Owner</h2>
                </div>
                <ig-form-feedback-badges class="ig-form-feedback-badges" [igformGroup]="frm" [inputContainer]="formElement"></ig-form-feedback-badges>
            </div>
            <ig-message-box>
                <span i18n>Assign a role to a user or group directly on this asset. This assignment is specific to the current asset only.</span>
            </ig-message-box>

            <loading [isLoading]="isLoading"></loading>
			<div class="form-wrapper">
				@if (!isLoading) {
				<form (ngSubmit)="onSubmit()" [formGroup]="frm">
					<div inputs>
						<div class="form-group">
							<div class="row">
								<div class="field-col">
									<label for="roleUid" class="ig-label" i18n>Role</label>
									<p-dropdown igDropdown
												igSize="full"
												[igDataCy]="'PolicyOverride_Dropdown_Role'"
												[ellipsisDirection]="'rtl'"
												filter="true"
												appendTo="body"
												formControlName="roleUid"
												optionLabel="name"
												optionValue="uid"
												showClear="false"
												[options]="roles"
												required>
									</p-dropdown>
								</div>
							</div>

							<div class="row">
								<div class="field-col">
									<input type="hidden" formControlName="securityType" />
									<label for="securityUid" class="ig-label" i18n>Assignee</label>
									<p-dropdown igDropdown
												igSize="full"
												[igDataCy]="'PolicyOverride_Dropdown_Assignee'"
												[ellipsisDirection]="'rtl'"
												filter="true"
												filterBy="label"
												appendTo="body"
												showClear="false"
												formControlName="securityUid"
												optionLabel="label"
												optionValue="value"
												[options]="assigneeOptions"
												[alwaysShowFilter]="true"
												(onChange)="assigneeChanged($event)"
												required>
										<ng-template let-item pTemplate="selectedItem">
											<div>
												<i [class]="'fa ' + item.icon"></i><span style="margin-left: 16px">{{ item.label }}</span>
											</div>
										</ng-template>
										<ng-template let-item pTemplate="item">
											<div>
												<span style="margin-left: 16px">{{ item.label }}</span><i [class]="'fa ' + item.icon"></i>
											</div>
										</ng-template>
									</p-dropdown>
								</div>
							</div>

							<div class="row">
								<div class="field-col">
									<label for="context" class="ig-label" i18n>Context</label>
									<textarea formControlName="context" style="height:150px; width:100%" pTextarea></textarea>
								</div>
							</div>
						</div>
					</div>
				</form>
				}
			</div>
        </div>
    </div>
    <div class="action-bar">
        <button igButton [disabled]="isSaving" class="ig-button-secondary" type="button" (click)="cancel()" label="{{cancelLabel}}"></button>
        <span class="grow"></span>
        <button [disabled]="isSubmitDisabled || isSaving" [loading]="isSaving" igButton igAutoFocus class="ig-button-primary" margin (click)="onSubmit()" type="submit" i18n label="{{saveLabel}}"></button>
    </div>
</d3s-modal>
