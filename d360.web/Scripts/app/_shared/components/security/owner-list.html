<owners-sidepanel-wrapper [selectedItem]="selectedItem" [sidePanelStorageKey]="sidePanelStorageKey">
	<div class="grid-actions-header column-layout">
		<div class="grid-actions-header-row">
			<div class="simple-search">
				<ig-search-field [debounce]="600"
								 [(ngModel)]="simpleFilterValue"
								 (onSearch)="dt.filterGlobal($event, 'contains')"
								 mode="Keypress">
				</ig-search-field>
			</div>
			<div class="grid-action-buttons">
				@if (hasAddResponsibilitiesPermissions()) {
				}
				<button [igDataCy]="'PolicyOverride_Add'"
						(click)="add()"
						igButton
						pTooltip="Add Assignment"
						i18n-pTooltip
						tooltipPosition="top"
						tooltipStyleClass="ig-tooltip"
						class="ig-button-primary"
						icon="fa-plus">
				</button>
			</div>
		</div>
	</div>

	<div class="grid-wrapper">
		<p-table #dt
				 [value]="items"
				 selectionMode="single"
				 (onRowSelect)="onRowSelect($event.data)"
				 [metaKeySelection]="true"
				 [globalFilterFields]="['groupName', 'resourceName', 'roleName']"
				 [paginator]="true"
				 paginatorDropdownAppendTo="body"
				 [rows]="defaultInitialItemsPerPage"
				 [rowsPerPageOptions]="defaultPagingOptions"
				 (sortFunction)="columnSort($event)"
				 [scrollable]="true">
			<ng-template pTemplate="header">
				<tr>
					<th style="width: 30%; min-width: 200px" [pSortableColumn]="'roleName'">
						<ng-container i18n>Role</ng-container>
						<sort-icon [field]="'roleName'"></sort-icon>
					</th>
					<th [pSortableColumn]="'resourceName'">
						<ng-container i18n>Resource</ng-container>
						<sort-icon [field]="'resourceName'"></sort-icon>
					</th>
					<th [pSortableColumn]="'groupName'">
						<ng-container i18n>Group</ng-container>
						<sort-icon [field]="'groupName'"></sort-icon>
					</th>
					<th style="width: 40px"></th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-item>
				<tr (dblclick)="onDoubleClick(item)" [pSelectableRow]="item">
					<td style="min-width: 200px">{{item.roleName}}</td>
					<td style="min-width: 200px">{{item.resourceName}}</td>
					<td style="min-width: 200px">{{item.groupName}}</td>
					<td #gridTools>
						@if (item.MenuItems && item.isOverride) {
						<div class="token-popup-menu">
							<button igButton type="button" icon="fa-ellipsis-v" (click)="tokenMenu.toggle($event);"></button>
							<ig-popup-menu [items]="item.MenuItems" #tokenMenu [tabIndex]="1"></ig-popup-menu>
						</div>
						<button class="ig-float-popup-container" #floatButton>
							<ig-popup-menu [items]="item.MenuItems" #floatMenu [tabIndex]="1"></ig-popup-menu>
						</button>
						}
					</td>
				</tr>
			</ng-template>
			<ng-template pTemplate="emptymessage" i18n>
				No owners found
			</ng-template>
			<ng-template pTemplate="summary">
				<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
			</ng-template>
		</p-table>
	</div>
</owners-sidepanel-wrapper>

<owner-create [isModalVisible]="isAdding"
			  [assetUid]="assetUid"
			  (onSave)="load(); isAdding=false;"
			  (onCancel)="isAdding=false;">
</owner-create>

<owner-delete [isModalVisible]="isDeleting"
			  [item]="selectedItem"
			  (onSave)="load(); isDeleting=false;"
			  (onCancel)="isDeleting=false;">
</owner-delete>

<owner-edit [isModalVisible]="isEditing"
			[uid]="selectedItem.uid"
			[model]="selectedItem"
			(onSave)="load(); isEditing=false;"
			(onCancel)="isEditing=false;">
</owner-edit>
