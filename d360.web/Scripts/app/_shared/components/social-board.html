<div class="social-board">
	<loading [isLoading]="isLoading" showTransparentLoader="true"></loading>
	@if (commentsEnabled) {

	<comment-form [assetUid]="assetUid" [comment]="newComment" [isVisible]="isAddingNew" (onCancel)="closeEditor()" (onSave)="onSave($event)"></comment-form>
		
	@if (!isAddingNew) {
	<div class="header-bar">
		<input type="text" placeholder="Add a comment" i18n-placeholder class="fakeInput" (click)="isAddingNew = true">
	</div>
	}

	}

	@for(comment of comments; track comment) {
	<comment-item [comment]="comment" [assetUid]="assetUid" [commentsEnabled]="commentsEnabled" (delete)="deleteComment($event);" [isAdmin]="isAdmin" (edit)="onSave($event);"></comment-item>
	}

	<div style="margin-top:10px;">
		<button igButton type="button" class="ig-button-primary" margin [disabled]="!hasMore || isLoading" [loading]="isLoading" (click)="loadComments();" i18n-label label="Load more comments..."></button>
		@if (hasCloseButton) {
		<button igButton class="ig-button-secondary" type="button" (click)="close.emit();" i18n-label label="Close"></button>
		}
	</div>
</div>
