<div class="row">
    <div class="col s12">        
        <div class="tile tile-detail">
            <header *ngIf="!showDelete && !showEditor">
                &nbsp; <d3s-tile-actions [hasAdd]="hasAddAssetPermissions()"
                                         [hasExport]="true"
                                         [isExportDisabled]="!canExportRecords()"
                                         [exportDisabledMessage]="'Export not available for over ' + maxExportRows + ' rows'"
                                         (addClick)="showAdd(0)"
                                         (exportClick)="exportExcel(0)"></d3s-tile-actions>
            </header>
            <div *ngIf="!showDelete && !showEditor && assetType && assetType.Description && assetType.Description.length >0"
                 [innerHtml]="assetType.Description"
                 class="item-description"></div>
            <p-treeTable #treeTable
                         [pageLinks]="3"
                         [paginator]="true"
                         [rows]="rowsPerPage"
                         [rowsPerPageOptions]="defaultPagingOptions"
                         *ngIf="!showDelete && !showEditor"
                         [value]="treeNodeArray"
                         selectionMode="single"
                         [(selection)]="selected"
                         styleClass="breadcrumbTree treetable"
                         [style]="{'line-height':'25px'}"
                         [globalFilterFields]="filterColumns"
                         [loading]="isLoading"
                         [loadingIcon]="'fa fa-spinner fa-spin'"
                         [lazy]="true"
                         (onLazyLoad)="loadNodes($event)"
                         (onNodeExpand)="onNodeExpand($event)"
                         dataKey="AssetUid">
                <!--(onFilter)="expandNodes()"-->
                <ng-template pTemplate="caption">
                    <div>
                        <input type="text" #inputBox pInputText placeholder="Search" (input)="treeTable.filterGlobal($event.target.value, 'contains')" style="width: 100%;margin-bottom:10px;">
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width:100px"></th>
                        <th *ngFor="let column of columns"
                            [ttSortableColumn]="column.sortable === true ? column.datafield : null">
                            {{column.text}}
                            <p-treeTableSortIcon *ngIf="column.sortable === true"
                                                 [field]="column.datafield"></p-treeTableSortIcon>
                        </th>
                        <th style="width: 40px"></th>
                        <th style="width: 40px"></th>
                        <th style="width: 40px"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body"
                             let-rowNode
                             let-item="rowData">
                    <tr [ttSelectableRow]="rowNode">
                        <td class="no-text-overflow">
                            <d3s-treeTableToggler [rowNode]="rowNode"></d3s-treeTableToggler>
                        </td>
                        <td class="no-text-overflow" *ngFor="let column of columns">
                            <d3s-dynamic-field-value [column]="column"
                                                     [fields]="fields"
                                                     [useApiName]="true"
                                                     [item]="item"></d3s-dynamic-field-value>
                        </td>
                        <td>
                            <div class="RowTools">
                                <a style="cursor:pointer;"
                                   (click)="selected = rowNode.node; showAdd(item.Level)"
                                   *ngIf="(assetType.MaximumDepth > item.Level) && hasAddAssetPermissions()"><i class="fa fa-plus"></i></a>
                            </div>
                        </td>
                        <td>
                            <div class="RowTools"
                                 *ngIf="item.P_CanEdit">
                                <a style="cursor:pointer;"
                                   (click)="selected = rowNode.node; showEditor = true;"><i class="fa fa-pencil"></i></a>
                            </div>
                        </td>
                        <td>
                            <div class="RowTools"
                                 *ngIf="item.P_CanDelete">
                                <a *ngIf="!rowNode.node.children || rowNode.node.children?.length == 0"
                                   style="cursor:pointer;"
                                   (click)="selected = rowNode.node; showDelete=true;"><i class="fa fa-trash-o"></i></a>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="summary">
                    <d3s-grid-paging-info [first]="treeTable.first"
                                          [rows]="treeTable.rows"
                                          [totalRecords]="treeTable.totalRecords"></d3s-grid-paging-info>
                </ng-template>
            </p-treeTable>
            <d3s-dynamic-editor *ngIf="showEditor"
                                [objectID]="selected ? selected?.ObjectID : gridObject?.ID"
                                [objectType]="gridObject.Object"
                                [title]="selected?.Name ? selected?.Name : gridObject?.Name + ' Item'"
                                [selection]="selected"
                                [rowID]="rowID"
                                [objectTypeUid]="gridObject?.AssetTypeUID"
                                (saveClick)="saveItem($event)"
                                [isV2API]="true"
                                (closeClick)="closeEditor()"></d3s-dynamic-editor>
            <d3s-asset-delete-editor *ngIf="showDelete"
                                     [uid]="selected?.AssetUid"
                                     [assetTypeUid]="gridObject?.AssetTypeUID"
                                     [displayValue]="(deleteName ? deleteName : 'Artifact')"
                                     (onCancel)="showDelete = false"
                                     (onDeleted)="onDeleted()">
            </d3s-asset-delete-editor>
        </div>

    </div>
</div>
