<div class="row hierarchy-grid">
    <as-split unit="pixel"
              direction="horizontal"
              [gutterSize]="sidePanelService.draggableAreaWidth"
              class="col s12 split"
              style="display: flex"
              [class.side-panel-close]="!sidePanelOpen"
              (dragEnd)="onSidePanelDragEnd(sidePanelStorageKey, $event)">
        <as-split-area class="tile tile-detail main-panel">
            <ig-portal-content-provider name="asset-description"
                                        [template]="description">
                <ng-template #description>
                    <d3s-info-tooltip [titleValue]="infoIconHtmlString"
                                      *ngIf="assetType && assetType.Description && assetType.Description.length > 0">
                        <div [innerHtml]="assetType.Description | sanitize"></div>
                    </d3s-info-tooltip>
                </ng-template>
            </ig-portal-content-provider>

            <div class="grid-actions-header column-layout"
                 *ngIf="!showDelete">
                <div class="grid-actions-header-row">
                    <div class="simple-search">
                        <ig-search-field mode="Keypress"
                                         [debounce]="600"
                                         (onSearch)="loadNodes()"
                                         [(ngModel)]="simpleFilterValue">
                        </ig-search-field>
                    </div>
                    <div class="grid-action-buttons">
                        <button *ngIf="hasAddAssetPermissions()"
                                igButton
                                pTooltip="Add new asset"
                                i18n-pTooltip
                                tooltipPosition="top"
                                tooltipStyleClass="ig-tooltip"
                                class="ig-button-primary"
                                icon="fa-plus"
                                [disabled]="isLoading"
                                [igDataCy]="'Assets_Add'"
                                (click)="showAdd(0)">
                        </button>

                        <div [pTooltip]="exportTooltip"
                             tooltipPosition="left"
                             tooltipStyleClass="ig-tooltip">
                            <button igButton
                                    [disabled]="!canExportRecords() || isExportInProgress"
                                    icon="fa-download"
                                    [loading]="isExportInProgress"
                                    [igDataCy]="'Assets_Export'"
                                    (click)="exportExcel(0)">
                            </button>
                        </div>
                    </div>
                </div>
                <div class="grid-actions-header-row">
                    <advanced-filtering [loadIdentifier]="assetTypeUid"
                                        [gridType]="'Tree'"
                                        (onLoad)="onFiltersLoaded()"
                                        (onChange)="advancedFiltersChanged($event)"></advanced-filtering>
                </div>
            </div>

            <div class="tree-wrapper-wrapper"
                 *ngIf="!showDelete">
                <div class="tree-wrapper">
                    <p-treeTable #treeTable
                                 [pageLinks]="3"
                                 [paginator]="true"
                                 [rows]="rowsPerPage"
                                 [rowsPerPageOptions]="defaultPagingOptions"
                                 [value]="treeNodeArray"
                                 [metaKeySelection]="true"
                                 selectionMode="single"
                                 [selection]="selected"
                                 (selectionChange)="selectAsset($event)"
                                 styleClass="breadcrumbTree treetable"
                                 [style]="{'line-height':'25px'}"
                                 [globalFilterFields]="filterColumns"
                                 dataKey="AssetUid"
                                 [loading]="isLoading"
                                 [loadingIcon]="'fa fa-spinner fa-spin'"
                                 [showLoader]="true"
                                 (onNodeExpand)="nodeExpanded($event)"
                                 (onPage)="numberOfRowsByCategoryService.onPage($event)"
                                 (onNodeCollapse)="nodeCollapsed($event)">
                        <ng-template pTemplate="header">
                            <tr>
                                <th *ngFor="let column of columns"
                                    [ttSortableColumn]="column.sortable === true ? column.datafield : null"
                                    (click)="onSort()"
                                    [style.width]="column.columnWidth ? column.columnWidth + 'px' : null"
                                    [style.maxWidth]="column.columnWidth === 0 ? '500px' : null">
                                    {{column.text}}
                                    <p-treeTableSortIcon *ngIf="column.sortable === true"
                                                         [field]="column.datafield"></p-treeTableSortIcon>
                                </th>
                                <th class="asset-grid-tools" style="width: 40px"></th>
                                <th style="width: 0; padding: 0"></th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body"
                                     let-rowNode
                                     let-item="rowData">
                            <tr [ttRow]="rowNode"
                                [ttSelectableRow]="rowNode"
                                (click)="selectAsset(rowNode.node)"
                                (contextmenu)="positionContextMenu($event, floatButton, floatMenu, assetGridTools); selectAsset(rowNode.node)">
                                <td class="no-text-overflow"
                                    *ngFor="let column of columns; let i = index"
                                    [style.width]="column.columnWidth ? column.columnWidth + 'px' : null">
                                    <p-treeTableToggler [rowNode]="rowNode"
                                                        style="margin-right: 8px;"
                                                        [igDataCy]="'Hierarchy_Toggler_' + item.AssetUid"
                                                        *ngIf="i === 0"></p-treeTableToggler>
                                    <ng-container *ngIf="i === linkColumnIndex">
                                        <a (click)="showHierarchy($event, item)"
                                           context-link
                                           [isOpenDefault]="true"
                                           [ngStyle]="setTreeNodeStyles(rowNode.node)"
                                           [igDataCy]="'Hierarchy_Item_' + item.AssetUid">
                                            <d3s-dynamic-field-value [column]="column"
                                                                     [fields]="fields"
                                                                     [useApiName]="true"
                                                                     styleClass="cell-link"
                                                                     [item]="item"
                                                                     [isDateUTC]="true"
                                                                     [interceptLinkClick]="true">
                                            </d3s-dynamic-field-value>
                                        </a>
                                    </ng-container>
                                    <ng-container *ngIf="i !== linkColumnIndex">
                                        <d3s-dynamic-field-value [column]="column"
                                                                 [fields]="fields"
                                                                 [useApiName]="true"
                                                                 [item]="item"
                                                                 [isDateUTC]="true"
                                                                 [interceptLinkClick]="true"></d3s-dynamic-field-value>
                                    </ng-container>
                                </td>
                                <td class="asset-grid-tools"
                                    #assetGridTools>
                                    <div>
                                        <button igButton
                                                type="button"
                                                icon="fa-ellipsis-v"
                                                [igDataCy]="'Hierarchy_Menu_Button_' + item.AssetUid"
                                                (click)="selectAsset(rowNode.node);linkMenu.toggle($event)"></button>
                                        <ig-popup-menu (onSelect)="clickMenuItem($event, rowNode.node)"
                                                       [items]="item[menuKey]"
                                                       [dataCy]="'Hierarchy_Menu_Popup_' + item.AssetUid"
                                                       #linkMenu
                                                       [tabIndex]="1"></ig-popup-menu>
                                    </div>
                                </td>
                                <button class="ig-float-popup-container"
                                        #floatButton
                                        [igDataCy]="'Hierarchy_Menu_Button_' + item.AssetUid">
                                    <ig-popup-menu (onSelect)="clickMenuItem($event, rowNode.node)"
                                                   [items]="item[menuKey]"
                                                   [dataCy]="'Hierarchy_Menu_Popup_' + item.AssetUid"
                                                   #floatMenu
                                                   [tabIndex]="1">
                                    </ig-popup-menu>
                                </button>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="summary">
                            <d3s-grid-paging-info [first]="treeTable.first"
                                                  [rows]="treeTable.rows"
                                                  [totalRecords]="treeTable.totalRecords"></d3s-grid-paging-info>
                        </ng-template>
                    </p-treeTable>
                </div>
            </div>


            <d3s-asset-delete-editor *ngIf="showDelete"
                                     [uid]="selected?.data?.AssetUid"
                                     [assetTypeUid]="assetTypeUid"
                                     [displayValue]="(selected?.data?.Path ? selected?.data?.Path : objectName)"
                                     (onCancel)="showDelete = false; filter(null);"
                                     (onDeleted)="onDeleted();">
            </d3s-asset-delete-editor>

            <d3s-modal additionalClasses="modal-dyn-editor large-dialog asset-editor"
                       (onClose)="showEditor=false"
                       [showTitle]="false"
                       [isVisible]="showEditor">
                <asset-editor #dynamicEditor
                              *ngIf="showEditor"
                              [objectID]="selected ? selected?.ObjectID : objectTypeId"
                              [objectType]="object"
                              [title]="assetEditorTitle"
                              [selection]="selected?.data"
                              [objectTypeUid]="assetTypeUid"
                              [parentID]="selectedParentId"
                              [assetTypePath]="getAssetPath()"
                              (saveClick)="save($event)"
                              [showAsModal]="true"
                              [isV2API]="true"
                              (closeClick)="closeEditor()"></asset-editor>

            </d3s-modal>
            <ng-container *ngIf="sidePanelOpen && secondarySidePanelOpen">
                <div #semanticTile
                     class="secondary-side-panel">
                    <div class="panel-header">
                        <span class="header-label"
                              i18n>Information</span>
                        <div class="button-container">
                            <button igButton
                                    [attr.data-cy]="'Semantic_Secondary_Close'"
                                    icon="fa-times"
                                    (click)="secondarySidePanelOpen=false;"
                                    [tooltip]="Close"
                                    class="close-button"></button>
                        </div>
                    </div>
                    <div class="details-container">
                        <ng-container *ngIf="semanticType && secondarySidePanel=='detail'">
                            <semantic-detail [qualifier]="semanticType.qualifier"
                                             [isSidePanel]="true"
                                             [showHeader]="true"
                                             [semanticType]="semanticType"
                                             (close)="secondarySidePanelOpen=false;"
                                             (linkClicked)="secondaryPanelOpen($event)">
                            </semantic-detail>
                        </ng-container>
                        <ng-container *ngIf="resourceUid && secondarySidePanel=='user'">
                            <ig-asset-detail [objectUID]="resourceUid"
                                             [objectType]="'Resource'"
                                             [useAccordion]="true"
                                             [shouldBePadded]="true"
                                             [showHeader]="true"
                                             [showHeaderLine]="false"
                                             [spacerHeight]="'16px'"
                                             [tooltipAlign]="'left'"
                                             [isSidePanel]="true"
                                             [interceptLinkClick]="true"
                                             (close)="secondarySidePanelOpen=false;"></ig-asset-detail>
                        </ng-container>
                        <ng-container *ngIf="secondarySidePanel=='status'">
                            <semantic-status-detail (close)="secondarySidePanelOpen=false;"></semantic-status-detail>
                        </ng-container>
                    </div>
                </div>
            </ng-container>

        </as-split-area>
        <as-split-area [size]="getSidePanelWidth()"
                       [minSize]="getSidePanelMinWidth()"
                       [maxSize]="getSidePanelMaxWidth()"
                       class="tile tile-detail side-panel">
            <side-panel [(expanded)]="sidePanelOpen"
                        (selectedPanelChange)="sidePanelTab=$event"
                        [selectedItem]="selected?.data"
                        [panelApplies]="panelApplies"
                        [hasProfiling]="hasProfiling"
                        [setMinMaxWidth]="false"
                        hasDetail="true"
                        [storageKey]="sidePanelStorageKey">
                <ng-container *ngIf="sidePanelOpen && selected?.data != null && sidePanelLoading">
                    <d3s-loading [isLoading]="true"></d3s-loading>
                </ng-container>
                <ng-container *ngIf="sidePanelOpen && selected?.data != null && !sidePanelLoading">
                    <ng-container *ngIf="sidePanelTab === 'dataprofile' && selected?.data?.HasProfiling">
                        <data-profile [dataProfile]="dataProfile"
                                      (secondaryPanelLinkClicked)="secondaryPanelOpen($event)"></data-profile>
                    </ng-container>
                    <ng-container *ngIf="sidePanelTab === 'detail'">
                        <ig-asset-detail *ngIf="!selectedReferenceItem && !selectedTag"
                                         #assetDetail
                                         [objectUID]="selectedAsset ? selectedAsset.uid : selected?.data?.AssetUid"
                                         [objectType]="selectedAsset ? selectedAsset.type : object"
                                         [useAccordion]="true"
                                         [shouldBePadded]="false"
                                         [showHeaderLine]="false"
                                         [showHeader]="true"
                                         [spacerHeight]="'16px'"
                                         [tooltipAlign]="'left'"
                                         [isSidePanel]="true"
                                         [hasEditLink]="true"
                                         [interceptLinkClick]="true"
                                         [hasAddRelationshipsPermissions]="false"
                                         [hasModifyRelationshipsPermissions]="false"
                                         [hasDeleteRelationshipsPermissions]="false"
                                         (onEditClick)="showEditor=true"></ig-asset-detail>

                        <ng-container *ngIf="selectedReferenceItem">
                            <ig-asset-type-detail [uid]="selectedReferenceItem.uid"
                                                  [highlightUid]="selectedReferenceItem.assetUid"
                                                  [baseUrl]="selectedReferenceItem.url">
                            </ig-asset-type-detail>
                        </ng-container>
                        <ng-container *ngIf="selectedTag">
                            <ig-tagged-assets-detail [uid]="selectedTag.uid"></ig-tagged-assets-detail>
                        </ng-container>
                    </ng-container>
                </ng-container>                
            </side-panel>
        </as-split-area>
    </as-split>
</div>
