<div class="row hierarchy-grid">
    <div class="col s12" style="display:flex">
        <div class="tile tile-detail main-panel">
            <div *ngIf="!showDelete && assetType && assetType.Description && assetType.Description.length >0"
                 [innerHtml]="assetType.Description"
                 class="item-description"></div>

            <div class="grid-actions-header" *ngIf="!showDelete">
                <div class="simple-search">
                    <ig-search-field mode="Keypress"
                                     [debounce]="600"
                                     (onSearch)="loadNodes()"
                                     [(ngModel)]="simpleFilterValue"
                                     [infoTooltip]="simpleSearchTooltipHTML">
                    </ig-search-field>
                </div>
                <advanced-filtering [loadIdentifier]="assetTypeUid" [gridType]="'Tree'" (onLoad)="onFiltersLoaded()" (onChange)="advancedFiltersChanged($event)"></advanced-filtering>
                <div class="grid-action-buttons">
                    <button *ngIf="hasAddAssetPermissions()"
                            igButton
                            pTooltip="Add new asset"
                            tooltipPosition="top"
                            tooltipStyleClass="ig-tooltip"
                            class="ig-button-primary"
                            icon="fa-plus"
                            [disabled]="isLoading"
                            (click)="showAdd(0)">
                    </button>

                    <div pTooltip="{{(canExportRecords() ? 'Export to Excel' : 'Export not available for over ' + maxExportRows + ' rows')}}"
                         tooltipPosition="left"
                         tooltipStyleClass="ig-tooltip">
                        <button igButton
                                [disabled]="!canExportRecords() || isExportInProgress"
                                icon="fa-download"
                                [loading]="isExportInProgress"
                                (click)="exportExcel(0)">
                        </button>
                    </div>
                </div>
            </div>

            <div class="tree-wrapper" *ngIf="!showDelete">
                <p-treeTable #treeTable
                             [pageLinks]="3"
                             [paginator]="true"
                             [rows]="rowsPerPage"
                             [rowsPerPageOptions]="defaultPagingOptions"
                             [value]="treeNodeArray"
                             [metaKeySelection]="true"
                             selectionMode="single"
                             [selection]="selected"
                             (selectionChange)="selectAsset($event)"
                             styleClass="breadcrumbTree treetable"
                             [style]="{'line-height':'25px'}"
                             [globalFilterFields]="filterColumns"
                             dataKey="AssetUid"
                             [loading]="isLoading"
                             [loadingIcon]="'fa fa-spinner fa-spin'"
                             [showLoader]="true"
                             (onNodeExpand)="nodeExpanded($event)"
                             (onNodeCollapse)="nodeCollapsed($event)">
                    <ng-template pTemplate="header">
                        <tr>
                            <th *ngFor="let column of columns"
                                [ttSortableColumn]="column.sortable === true ? column.datafield : null"
                                (click)="onSort()">
                                {{column.text}}
                                <p-treeTableSortIcon *ngIf="column.sortable === true" [field]="column.datafield"></p-treeTableSortIcon>
                            </th>
                            <th style="width: 40px"></th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body"
                                 let-rowNode
                                 let-item="rowData">
                        <tr [ttRow]="rowNode" [ttSelectableRow]="rowNode" (focus)="selectAsset(rowNode.node)">
                            <td class="no-text-overflow" *ngFor="let column of columns; let i = index">
                                <p-treeTableToggler [rowNode]="rowNode" *ngIf="i === 0"></p-treeTableToggler>
                                <ng-container *ngIf="i === linkColumnIndex">
                                    <a (click)="showHierarchy(item)"
                                       [ngStyle]="setTreeNodeStyles(rowNode.node)">
                                        <d3s-dynamic-field-value [column]="column"
                                                                 [fields]="fields"
                                                                 [useApiName]="true"
                                                                 styleClass="cell-link"
                                                                 [item]="item"></d3s-dynamic-field-value>
                                    </a>
                                </ng-container>
                                <ng-container *ngIf="i !== linkColumnIndex">
                                    <d3s-dynamic-field-value [column]="column"
                                                             [fields]="fields"
                                                             [useApiName]="true"
                                                             [item]="item"></d3s-dynamic-field-value>
                                </ng-container>
                            </td>
                            <td class="asset-grid-tools">
                                <div>
                                    <button igButton type="button" icon="fa-ellipsis-v" (click)="selectAsset(rowNode.node);linkMenu.toggle($event)"></button>
                                    <ig-popup-menu (onSelect)="clickMenuItem($event, rowNode.node)" [items]="item[menuKey]" #linkMenu [tabIndex]="1"></ig-popup-menu>
                                </div>
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="summary">
                        <d3s-grid-paging-info [first]="treeTable.first"
                                              [rows]="treeTable.rows"
                                              [totalRecords]="treeTable.totalRecords"></d3s-grid-paging-info>
                    </ng-template>
                </p-treeTable>
            </div>


            <d3s-asset-delete-editor *ngIf="showDelete"
                                     [uid]="selected?.data?.AssetUid"
                                     [assetTypeUid]="assetTypeUid"
                                     [displayValue]="(selected?.data?.Path ? selected?.data?.Path : objectName)"
                                     (onCancel)="showDelete = false; filter(null);"
                                     (onDeleted)="onDeleted();">
            </d3s-asset-delete-editor>

            <d3s-modal additionalClasses="modal-dyn-editor large-dialog asset-editor"
                       (onClose)="showEditor=false"
                       [showTitle]="false"
                       [isVisible]="showEditor">
                <asset-editor #dynamicEditor
                              *ngIf="showEditor"
                              [objectID]="selected ? selected?.ObjectID : objectTypeId"
                              [objectType]="object"
                              [title]="selected ? 'Edit Asset' : 'Create New Asset'"
                              [selection]="selected?.data"
                              [objectTypeUid]="assetTypeUid"
                              [parentID]="selectedParentId"
                              [assetTypePath]="selected ? selected?.data?.Path : assetType?.Path"
                              (saveClick)="save($event)"
                              [showAsModal]="true"
                              [isV2API]="true"
                              (closeClick)="closeEditor()"></asset-editor>

            </d3s-modal>
        </div>
        <div class="tile tile-detail side-panel">
            <side-panel [(expanded)]="sidePanelOpen"
                        (selectedPanelChange)="sidePanelTab=$event"
                        [selectedItem]="selected?.data"
                        [panelApplies]="panelApplies"
                        [hasProfiling]="hasProfiling"
                        hasDetail="true"
                        [storageKey]="sidePanelStorageKey">
                <ng-container *ngIf="sidePanelOpen && selected?.data != null && sidePanelLoading">
                    <d3s-loading [isLoading]="true"></d3s-loading>
                </ng-container>
                <ng-container *ngIf="sidePanelOpen && selected?.data != null && !sidePanelLoading">
                    <ng-container *ngIf="sidePanelTab === 'dataprofile' && selected?.data?.HasProfiling">
                        <data-profile [dataProfile]="dataProfile"></data-profile>
                    </ng-container>
                    <ng-container *ngIf="sidePanelTab === 'detail'">
                        <ig-asset-detail [objectUID]="selected?.data?.AssetUid"
                                         [objectType]="object"
                                         [useAccordion]="true"
                                         [shouldBePadded]="false"
                                         [showHeaderLine]="false"
                                         [showHeader]="true"
                                         [spacerHeight]="'16px'"
                                         [paddingLeft]="'11px'"
                                         [tooltipAlign]="'left'"
                                         [isSidePanel]="true"
                                         [hasAddRelationshipsPermissions]="false"
                                         [hasModifyRelationshipsPermissions]="false"
                                         [hasDeleteRelationshipsPermissions]="false"
                                         (onEditClick)="showEditor=true"></ig-asset-detail>
                    </ng-container>
                </ng-container>
            </side-panel>
        </div>
    </div>
</div>
