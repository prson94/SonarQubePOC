<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading">
    <div class="row">
        <div>
            <as-split unit="pixel"
                      direction="horizontal"
                      [gutterSize]="16"
                      class="col s12 split"
                      style="display: flex"
                      [class.side-panel-close]="!sidePanelOpen"
                      (dragEnd)="onSidePanelDragEnd(sidePanelStorageKey, $event)">
                <as-split-area class="tile tile-detail main-panel">
                    <d3s-object-definition-tile [nymTypes]="assetType?.NymTypes"
                                                [objectPermissions]="objectPermission"
                                                [objectType]="objectType"
                                                [useV2Api]="true"
                                                [objectID]="selected?.ID"
                                                (onEditComplete)="editComplete($event)"
                                                [interceptLinkClick]="true"
                                                [synonymPermission]="synonymPermission"></d3s-object-definition-tile>
                </as-split-area>
                <as-split-area [size]="getSidePanelWidth()"
                               [minSize]="getSidePanelMinWidth()"
                               [maxSize]="getSidePanelMaxWidth()"
                               class="tile tile-detail side-panel">
                    <side-panel (expandedChange)="sidePanelOpen=$event"
                                [hasProfiling]="false"
                                [expanded]="sidePanelOpen"
                                [storageKey]="sidePanelStorageKey"
                                (selectedPanelChange)="sidePanelTab=$event"
                                [selectedPanel]="sidePanelTab"
                                [setMinMaxWidth]="false"
                                hasDetail="true">
                        <ng-container *ngIf="sidePanelOpen && sidePanelTab === 'detail'">
                            <div class="empty-overlay"
                                 *ngIf="!selectedAsset && !selectedReferenceItem && !selectedTag">
                                <div class="content">
                                    <div class="icon-holder">
                                        <i class="fa fa-info-circle"></i>
                                    </div>
                                    <span i18n>Click a link or a tag to display the properties of a referenced
                                        item</span>
                                </div>
                            </div>
                            <ng-container *ngIf="selectedAsset">
                                <ig-asset-detail [objectUID]="selectedAsset.uid"
                                                 [objectType]="selectedAsset.type"
                                                 [useAccordion]="true"
                                                 [shouldBePadded]="false"
                                                 [showHeader]="true"
                                                 [showHeaderLine]="false"
                                                 [spacerHeight]="'16px'"
                                                 [tooltipAlign]="'left'"
                                                 [isSidePanel]="true"
                                                 [interceptLinkClick]="true"
                                                 [hasAddRelationshipsPermissions]="false"
                                                 [hasModifyRelationshipsPermissions]="false"
                                                 [hasDeleteRelationshipsPermissions]="false"></ig-asset-detail>
                            </ng-container>
                            <ng-container *ngIf="selectedReferenceItem">
                                <ig-asset-type-detail [uid]="selectedReferenceItem.uid"
                                                      [highlightUid]="selectedReferenceItem.assetUid"
                                                      [baseUrl]="selectedReferenceItem.url">
                                </ig-asset-type-detail>
                            </ng-container>

                            <ng-container *ngIf="selectedTag">
                                <ig-tagged-assets-detail [uid]="selectedTag.uid"></ig-tagged-assets-detail>
                            </ng-container>
                        </ng-container>
                    </side-panel>
                </as-split-area>
            </as-split>
        </div>
    </div>
</div>
