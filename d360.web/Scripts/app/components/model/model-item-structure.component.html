<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div class="tile tile-detail"
     *ngIf="!isLoading">
    <header *ngIf="!showDelete && !showEditor">
        &nbsp; <d3s-tile-actions [hasAdd]="hasModifyAssetPermissions()"
                                 (addClick)="showAdd(0)"></d3s-tile-actions>
    </header>
    <div *ngIf="!showDelete && !showEditor && model && model.Description && model.Description.length >0"
         [innerHtml]="model.Description"
         class="item-description"></div>
    <input type="text"
           pInputText
           [(ngModel)]="searchValue"
           (keyup)="filter($event)"
           placeholder="Search"
           style="width: 100%;margin-bottom:10px;"
           *ngIf="!showDelete && !showEditor">
    <p-treeTable #treeTable *ngIf="!showDelete && !showEditor"
                 [value]="treeNodeArray"
                 selectionMode="single"
                 [(selection)]="selected"
                 styleClass="breadcrumbTree"
                 [style]="{'line-height':'25px'}">
        <ng-template pTemplate="header">
            <tr>
                <th>Item</th>
                <th *ngFor="let column of columns"
                    [ttSortableColumn]="column.sortable === true ? column.datafield : null">
                    {{column.text}}
                    <p-treeTableSortIcon *ngIf="column.sortable === true"
                                         [field]="column.datafield"></p-treeTableSortIcon>
                </th>
                <th style="width: 40px"></th>
                <th style="width: 40px"></th>
                <th style="width: 40px"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body"
                     let-rowNode
                     let-item="rowData">
            <tr [ttSelectableRow]="rowNode">
                <td title="{{item.DisplayValue}}" class="no-text-overflow">
                    <d3s-treeTableToggler [rowNode]="rowNode"></d3s-treeTableToggler>
                    <a (click)="showHierarchy(item.ID)"
                       [ngStyle]="setTreeNodeStyles(rowNode.node)"
                       class="link">
                        {{item.DisplayValue}} <i *ngIf="item?.HasChildren"
                                                 class="fa fa-share-alt"
                                                 aria-hidden="true"
                                                 title="Item has relationships"
                                                 style="color:#999;"></i>
                    </a>
                </td>
                <td class="no-text-overflow" *ngFor="let column of columns">
                    <d3s-dynamic-field-value [column]="column"
                                             [fields]="fields"
                                             [item]="item"></d3s-dynamic-field-value>
                </td>
                <td>
                    <div class="RowTools">
                        <a style="cursor:pointer;"
                           (click)="selected=rowNode.node;showAdd(item.Level)"
                           *ngIf="( model.MaximumDepth > item.Level ) && hasModifyAssetPermissions()"><i class="fa fa-plus"></i></a>
                    </div>
                </td>
                <td>
                    <div class="RowTools"
                         *ngIf="item.P_CanEdit">
                        <a style="cursor:pointer;"
                           (click)="selected=rowNode.node;showEditor=true;"><i class="fa fa-pencil"></i></a>
                    </div>
                </td>
                <td>
                    <div class="RowTools"
                         *ngIf="item.P_CanDelete">
                        <a *ngIf="!rowNode.node.children || rowNode.node.children?.length == 0"
                           style="cursor:pointer;"
                           (click)="selected=rowNode.node;showDelete=true;"><i class="fa fa-trash-o"></i></a>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-treeTable>
    <d3s-asset-delete-editor *ngIf="showDelete"
                             [uid]="selected?.data?.Uid"
                             [assetTypeUid]="model?.AssetTypeUID"
                             [displayValue]="(selected?.data?.DisplayValue ? selected?.data?.DisplayValue : 'Model')"
                             (onCancel)="showDelete = false;filter(null);"
                             (onDeleted)="onDeleted();">
    </d3s-asset-delete-editor>    

    <d3s-asset-editor *ngIf="showEditor" 
                      (onClose)="closeEditor()"
                      (onSave)="saveTaxonomy()"
                      [assetTypeUid]="model?.AssetTypeUID"
                      [assetTypeID]="model?.ID"
                      [parentId]="selectedParentId"
                      [selectedItem]="selected"
                      [editorObjectType]="'Taxonomy'"
                      [editorTitle]="modelTaxonomyTitle()"
                      ></d3s-asset-editor>
</div>
