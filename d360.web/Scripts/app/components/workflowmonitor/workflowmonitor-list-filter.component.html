<ng-container *ngIf="!usePredefinedFilters; else exportOnly">
    <div class="row">
        <div class="col s2 FieldName" style="padding-left: 0px" i18n>Workflow Types</div>
        <div class="col s10" style="padding-right: 0px">
            <d3s-loading *ngIf="isLoading" isLoading="true"></d3s-loading>
            <div *ngIf="!isLoading">
                <table style="table-layout: fixed">
                    <tbody>
                    <tr>
                        <td>
                            <p-multiSelect [options]="items" [style]="{'width':'98%'}" [ngModel]="selection"
                                           (ngModelChange)="change($event)"
                                           selectedItemsLabel="{0} items selected"></p-multiSelect>
                        </td>
                        <td [ngClass]="{'actions-disabled':isExportDisabled}" *ngIf="showExport" style="width:32px">
                            <a class="Action" style="font-size:1.1em"
                               (click)="isExportDisabled ? return : exportClick.emit()" [pTooltip]="exportTooltip"><i
                                    class="fa fa-download fa-fw"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="row">
        <d3s-workflowmonitor-list-column-filter (exportToExcel)="exportToExcel.emit()" [fields]="filtercolumns"
                                                [(filters)]="columnFilters"
                                                (filtersChange)="columFilterChanged($event)"></d3s-workflowmonitor-list-column-filter>
    </div>
</ng-container>
<ng-template #exportOnly>
    <div class="row">
        <div class="col s12" style="padding-right: 0px">
            <div [ngClass]="{'actions-disabled':isExportDisabled}" *ngIf="showExport" style="width: 32px; float: right">
                <a class="Action" style="font-size:1.1em" (click)="isExportDisabled ? return : exportClick.emit()"
                   [pTooltip]="exportTooltip"><i class="fa fa-download fa-fw"></i></a>
            </div>
        </div>
    </div>
</ng-template>
