<div class="search-page-full">
    <div #title class="title-bar search">
        <div class="title">
            <span class="d3s-icon asset-icon"><i class="fa fa-search"></i></span>
            <h1>Search Results</h1>
            <div class="titlebar-search">
                <div class="field grow mr10">
                    <d3s-header-typeahead-search [additionalCssClasses]="'gov-search'"
                                                 [autocompletePlaceholder]="'What are you looking for?'"
                                                 [searchOptions]="searchTypes"
                                                 [defaultValue]="searchText"
                                                 [keepFilter]="true">
                    </d3s-header-typeahead-search>
                </div>
            </div>
        </div>
    </div>
    <div class="search-container">
        <div class="search-content">
            <div class="filterbar">
                <advanced-filtering #advancedFilter
                                    [loadIdentifier]="'GlobalSearch'"
                                    [fieldsObserver]="filterFields$"
                                    [externalStorage]="getSavedFilters()"
                                    [enableFilterSaving]="false"
                                    (onLoad)="onFiltersLoaded()"
                                    (onChange)="advancedFiltersChanged($event)">
                </advanced-filtering>
                <div class="grid-action-buttons">
                    <div [pTooltip]="searchExportTooltip"
                         tooltipPosition="left"
                         tooltipStyleClass="ig-tooltip">
                        <button igButton
                                icon="fa-download"
                                [disabled]="!isExportEnabled()"
                                [loading]="isExportInProgress"
                                (click)="doExport()">
                        </button>
                    </div>
                </div>

            </div>
            <div class="cardlist">
                <div *ngIf="!(searchStateService.loading | async) && (searchStateService.resultCount | async) == 0">
                    <div class="row">
                        <div class="tile tile-detail search-nodata">
                            <header>Your search did not find any results.</header>
                            <span style="padding-left:15px">Suggestions:</span>
                            <ul>
                                <li>Check your spelling</li>
                                <li>Try broader search criteria</li>
                                <li>Try a different keyword</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <ng-container *ngIf="!(searchStateService.loading | async)">
                    <div *ngFor="let result of searchStateService.results | async">
                        <d3s-search-result-item [result]="result" [selection]="selection" (onSelect)="resultSelected($event)"></d3s-search-result-item>
                    </div>
                </ng-container>
                <d3s-loading [isLoading]="(searchStateService.loading | async)"></d3s-loading>
            </div>
            <d3s-paginator [page]="searchStateService.pageNumber | async" [rows]="resultsPerPage" [totalRecords]="searchStateService.resultCount | async" (onPageChange)="paginate($event)" [hideLastButton]="true"></d3s-paginator>
        </div>
        <div class="tile tile-detail side-panel">
            <side-panel (expandedChange)="sidePanelOpen=$event"
                        (selectedPanelChange)="sidePanelTab=$event"
                        [expanded]="sidePanelOpen"
                        [selectedItem]="selection"
                        [panelApplies]="panelApplies"
                        hasProfiling="true"
                        hasDetail="true"
                        [height]="'calc(100vh - 200px)'"
                        [extraButtons]="extraButtons"
                        [storageKey]="sidePanelStorageKey">
                <ng-container *ngIf="sidePanelOpen && selection != null && sidePanelLoading">
                    <d3s-loading [isLoading]="true"></d3s-loading>
                </ng-container>
                <ng-container *ngIf="sidePanelOpen && sidePanelTab === 'filters'">
                    <d3s-check-tree #catagoryFilter
                                    [loading]="(searchStateService.treeLoading | async)"
                                    [value]="searchStateService.categories | async"
                                    [(selection)]="searchStateService.selectedFilters"
                                    (selectionChange)="filterCheckTree($event)"
                                    [emptyMessage]="'No categories found'">
                    </d3s-check-tree>
                </ng-container>
                <ng-container *ngIf="sidePanelOpen && selection?.AssetUid != null && !sidePanelLoading">
                    <ng-container *ngIf="sidePanelTab === 'dataprofile' && selection?.HasProfiling">
                        <data-profile [dataProfile]="dataProfile" (secondaryPanelLinkClicked)="secondaryPanelOpen($event)"></data-profile>
                    </ng-container>
                    <ng-container *ngIf="sidePanelTab === 'detail' && selection.ObjectType === 'Semantic Type'">
                        <semantic-detail [qualifier]="getQualifier(selection)"
                                         [isSidePanel]="true"
                                         [showHeader]="true"></semantic-detail>
                    </ng-container>
                    <ng-container *ngIf="sidePanelTab === 'detail' && selection.ObjectType !== 'Semantic Type'">
                        <ig-asset-detail #elseAssetDetail
                         [objectUID]="selection.AssetUid"
                         [objectType]="selection.ObjectType"
                         [useAccordion]="true"
                         [shouldBePadded]="false"
                         [showHeader]="true"
                         [showHeaderLine]="false"
                         [spacerHeight]="'16px'"
                         [tooltipAlign]="'left'"
                         [isSidePanel]="true"
                         [hasEditLink]="false"
                         [hasAddRelationshipsPermissions]="false"
                         [hasModifyRelationshipsPermissions]="false"
                         [hasDeleteRelationshipsPermissions]="false"
                         (onEditClick)="showEditor=true"></ig-asset-detail>
                    </ng-container>
                </ng-container>
                <ng-container *ngIf="secondarySidePanelOpen && semanticType">
                    <div #semanticTile class="secondary-side-panel">
                        <div class="panel-header">
                            <span class="header-label">Information</span>
                            <div class="button-container">
                                <button igButton [attr.data-cy]="'Semantic_Secondary_Close'" icon="fa-times" (click)="secondarySidePanelOpen=false;" [tooltip]="Close" class="close-button"></button>
                            </div>
                        </div>
                        <div class="details-container">
                            <ng-container *ngIf="semanticType">
                                <semantic-detail [qualifier]="semanticType.qualifier"
                                                 [isSidePanel]="true"
                                                 [showHeader]="true"
                                                 [semanticType]="semanticType"
                                                 (close)="secondarySidePanelOpen=false;"></semantic-detail>
                            </ng-container>
                        </div>
                    </div>
                </ng-container>
            </side-panel>
        </div>
    </div>
    <d3s-loading [isLoading]="isLoading"></d3s-loading>

    <d3s-modal additionalClasses="modal-dyn-editor large-dialog asset-editor"
               (onClose)="showEditor=false"
               [showTitle]="false"
               [isVisible]="showEditor">
        <asset-editor #dynamicEditor
                      *ngIf="showEditor"
                      [objectID]="selection?.AssetUid"
                      [objectType]="selection?.ObjectType"
                      [title]="selection ? 'Edit Asset' : 'Create New Asset'"
                      [selection]="selection"
                      [objectTypeUid]="selection?.Data?.AssetTypeUid"
                      [assetTypePath]="''"
                      (saveClick)="saveItem($event)"
                      [showAsModal]="true"
                      [isV2API]="true"
                      (closeClick)="showEditor=false"></asset-editor>
    </d3s-modal>
