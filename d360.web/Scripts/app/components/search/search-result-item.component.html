<div class="card-res"
     tabindex="0"
     (touchend)="onTouchEnd()"
     (click)="onClick()"
     (keydown)="onKeyDown($event)"
     (focus)="onFocus()"
     [ngClass]="{'selected': isSelected}">
    <div class="card-row title-row">
        <div *ngIf="result?.Icon" class="d3s-icon asset-icon"><i class="fa {{result?.Icon}}"></i></div>
        <div *ngIf="result?.ImageUrl" class="d3s-icon asset-icon"><img [src]="result.ImageUrl" /></div>
        <div (click)="navigateLink()" class="name" [innerText]="result?.DisplayName"></div>
        <d3s-simple-badge *ngIf="showStatus"
                          [badgeValue]="result?.Status"
                          [badgeType]="'Status'">
        </d3s-simple-badge>
        <div class="right-container">
            <div #scorecontainer *ngIf="result?.Scores.length > 0" class="d3s-score-container">
                <d3s-score-badge *ngFor="let score of result.Scores" [score]="score" [precision]="1">
                </d3s-score-badge>
            </div>
            <div class="menu-container">
                <button type="button" igButton #cardmenubutton icon="fa-ellipsis-v" (click)="cardmenu.toggle($event)" tooltip="More..."></button>
                <ig-popup-menu [items]="menuitems" #cardmenu (onSelect)="clickMenuItem($event)"></ig-popup-menu>
            </div>
        </div>
    </div>
    <div class="card-row elide-container">
        <div class="path category elided" title="{{formatPathAsString()}}">
            {{result?.Group}}<span *ngIf="result?.AssetPath?.length"><i class="fa fa-angle-right"></i><asset-path-widget [path]="result.AssetPath" [withType]="true"></asset-path-widget></span>
        </div>

    </div>
    <div class="card-row elide-container description" *ngIf="result?.Description"><div class="elided" [innerHtml]="result.Description" title="{{result.Description}}"></div></div>
    <div *ngIf="result?.Tags && result?.Tags.length > 0" class="card-row tags tagsnomanagewidth">
        <d3s-tag-view [ignoreResizing]="true" [data]="parseTagResult(result?.Tags)" [assetUID]="result?.Uid"></d3s-tag-view>
    </div>
    <div *ngIf="result?.Fields && result?.Fields.length > 0" class="card-row">
        <scroller-widget>
            <div class="search-result-field" *ngFor="let item of result?.Fields">
                <ng-container *ngIf="item.Prefix || item.Suffix; else labelvalue">
                    <div class="statement" title="{{getFieldDisplayValue(item, true)}}" [innerHtml]="getFieldDisplayValue(item)"></div>
                </ng-container>
                <ng-template #labelvalue>
                    <div class="label" title="{{item.Label}}">{{item.Label}}:</div><div class="value" title="{{getFieldDisplayValue(item, true)}}" [innerHtml]="getFieldDisplayValue(item)"></div>
                </ng-template>
            </div>
        </scroller-widget>
    </div>
    <div *ngIf="result?.SemanticName" class="card-row">
        <scroller-widget>
            <div class="search-result-field">
                <div class="label nomax"><ng-container i18n>Semantic Type Name</ng-container>:</div><div class="value nomax">{{ result.SemanticName }}</div>
            </div>
            <div class="search-result-field">
                <div class="label nomax"><ng-container i18n>Semantic Type Qualifier</ng-container>:</div><div class="value nomax">{{ result.SemanticQualifier }}</div>
            </div>
        </scroller-widget>
    </div>
        <div class="card-row" *ngIf="result?.Explanation"><explain-widget [json]="result?.Explanation"></explain-widget></div>
    </div>
