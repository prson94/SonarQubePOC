<div *ngIf="!isLoading">
    <div #searchContainer class="search-container">
        <div class="search-content">
            <div class="categories">
                <div class="scrollpane">
                    <h2>Filter by Category</h2>
                    <d3s-loading [isLoading]="(searchStateService.treeLoading | async)"></d3s-loading>
                    <d3s-check-tree *ngIf="!(searchStateService.treeLoading | async)"
                                    [value]="searchStateService.categories | async"
                                    [(selection)]="searchStateService.selectedFilters"
                                    (onNodeSelect)="nodeSelectDeselect($event)"
                                    (onNodeUnselect)="nodeSelectDeselect($event)"
                                    [emptyMessage]="'No categories found'">
                    </d3s-check-tree>
                </div>
            </div>
            <div class="cardlist">
                <d3s-chips-filter [filterOption]="newFilterOptions" (applyFlter)="filterChanged($event)"></d3s-chips-filter>
                <div *ngIf="!(searchStateService.loading | async) && (searchStateService.resultCount | async) == 0">
                    <div class="row">
                        <div class="tile tile-detail search-nodata">
                            <header>Your search did not find any results.</header>
                            <span style="padding-left:15px">Suggestions:</span>
                            <ul>
                                <li>Check your spelling</li>
                                <li>Try broader search criteria</li>
                                <li>Try a different keyword</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div *ngIf="!(searchStateService.loading | async)" class="scrollpane">
                    <div *ngFor="let result of searchStateService.results | async">
                        <d3s-search-result-item [result]="result"></d3s-search-result-item>
                    </div>
                </div>
                <d3s-loading [isLoading]="(searchStateService.loading | async)"></d3s-loading>
                <d3s-paginator [page]="pageNumber()" [rows]="itemsPerPage" [totalRecords]="searchStateService.resultCount | async" (onPageChange)="paginate($event)" [hideLastButton]="true"></d3s-paginator>
            </div>
        </div>
    </div>
</div>
