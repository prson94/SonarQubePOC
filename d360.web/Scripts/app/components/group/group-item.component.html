<div class="row">
    <div class="col s12">
        <d3s-loading [isLoading]="isLoading"></d3s-loading>
        <div class="row" *ngIf="!isLoading">
            <div class="col s12">
                <div class="tile tile-detail">
                    <d3s-group-responsibility [group]="model?.group"></d3s-group-responsibility>
                </div>
            </div>
            <div class="col s12">
                <div class="tile tile-detail">
                    <d3s-group-members [groupUid]="model?.group?.Uid"
                                       [readOnly]="!model?.CurrentResourceIsAdmin"></d3s-group-members>
                </div>
            </div>
        </div>
    </div>
</div>
