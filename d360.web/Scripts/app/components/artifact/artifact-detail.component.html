<div *ngIf="isLoading">
    <div style="width:100%;text-align:center;"><i class="fa fa-spinner fa-spin"></i></div>
</div>
<div *ngIf="!isLoading">
    <p-accordion [multiple]="true">
        <p-accordionTab header="Definition" [selected]="true">
            <object-detail [objectID]="artifact?.ID" [objectType]="'Artifact'"></object-detail>
        </p-accordionTab>
        <p-accordionTab header="Synonyms ({{synonyms.itemCount}})" >
            <d3s-synonyms-tile #synonyms [objectID]="artifact?.ID" [objectType]="'Artifact'" [readonly]="false"></d3s-synonyms-tile>
        </p-accordionTab>
        <p-accordionTab header="Attributes ({{attributes.itemCount}})">
            <d3s-attributes-tile #attributes [objectID]="artifact?.ID" [objectType]="'Artifact'" [readonly]="false"></d3s-attributes-tile>
        </p-accordionTab>
        <p-accordionTab header="Structure">
            artifact structure
        </p-accordionTab>
    </p-accordion>
</div>
