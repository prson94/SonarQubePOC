<div class="row">
    <div class="col s12" style="display: flex">
        <d3s-loading [isLoading]="isLoading"></d3s-loading>
        <div class="tile tile-detail main-panel"
             *ngIf="!isLoading">
            <d3s-asset-grid [gridObject]="gridObject" (selectedChange)="selectAsset($event)" (hasProfilingChange)="hasProfiling=$event"></d3s-asset-grid>
        </div>
        <div class="tile tile-detail side-panel" *ngIf="!isLoading">
            <side-panel [(expanded)]="sidePanelOpen" 
                        (selectedPanelChange)="sidePanelTab=$event" 
                        [selectedItem]="selection"
                        [panelApplies]="panelApplies"
                        [hasProfiling]="hasProfiling"
                        [disableProfiling]="selection == null ? false : !selection.HasProfiling"
                        hasDetail="true">
                <ng-container *ngIf="sidePanelOpen && selection != null && sidePanelLoading">
                    <d3s-loading [isLoading]="true"></d3s-loading>
                </ng-container>
                <ng-container *ngIf="sidePanelOpen && selection != null && !sidePanelLoading">
                    <ng-container *ngIf="sidePanelTab === 'dataprofile' && selection?.HasProfiling">
                        <data-profile [dataProfile]="dataProfile"></data-profile>
                    </ng-container>
                    <ng-container *ngIf="sidePanelTab === 'detail'">
                        <ig-asset-detail [objectUID]="selection.AssetUid"
                                         objectType="artifact"
                                         [useAccordion]="true"
                                         [shouldBePadded]="false"
                                         [showHeader]="true"
                                         [tooltipAlign]="'left'"
                                         [hasAddRelationshipsPermissions]="false"
                                         [hasModifyRelationshipsPermissions]="false"
                                         [hasDeleteRelationshipsPermissions]="false"></ig-asset-detail>
                    </ng-container>
                </ng-container>
            </side-panel>
        </div>
    </div>
</div>
