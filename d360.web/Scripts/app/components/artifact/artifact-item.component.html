<d3s-loading [isLoading]="isLoading"></d3s-loading>                                                
<div *ngIf="!isLoading">                                    
    <div class="row">
        <div class="col s12">
            <div class="tile tile-detail">                               
                <d3s-object-definition-tile [objectPermissions]="permissions" [objectID]="artifact?.ID" [objectType]="'Artifact'" [hasAttributes]="artifact?.AllowAttributes" [nymTypes]="artifact?.NymTypes" (onEditComplete)="editArtifact($event)" [useV2Api]="true"></d3s-object-definition-tile>
            </div>
        </div>
    </div>                    
</div>
