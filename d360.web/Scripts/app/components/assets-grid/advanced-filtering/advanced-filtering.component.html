<div class="advanced-filtering">
    <div class="filters-list" *ngIf="visible">
        <div class="filter-item" *ngFor="let item of conditions.filters">
            <filter-item [assetTypeUid]="assetTypeUid" [condition]="item" [fields]="fields" [operators]="operators" [relationshipTypes]="relationshipTypes"></filter-item>
        </div>
    </div>

</div>
