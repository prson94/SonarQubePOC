<div class="advanced-filtering" *ngIf="visible">
    <div class="filters-list">
        <div class="filter-item" *ngFor="let item of conditions.filters">
            <filter-item [assetTypeUid]="assetTypeUid" [condition]="item" [fields]="fields" [operators]="operators"></filter-item>
        </div>
    </div>

</div>
<br />
<br />
<ng-container *ngIf="filters">
    {{filters.filter}}
</ng-container>
