<div class="filter-block" pTooltip="{{condition.getTooltipValue()}}" tooltipPosition="top" tooltipStyleClass="ig-tooltip" [escape]="false">
    <div class="ig-button filter-label" (click)="updateFilter()" [innerHTML]="condition.getFilterLabel()"></div>

    <div class="field-selection" [hidden]="!isSelectingCurrentField">
        <p-dropdown #dropdownRef
                    igDropdown
                    [styleClass]="'auto-open-dropdown'"
                    [options]="allFieldsDropdown"
                    [group]="true"
                    [filter]="true"
                    [(ngModel)]="condition.field"
                    (onChange)="onFieldSelected($event)"
                    igSize="medium"
                    panelStyleClass="ig-dropdown-grouped headerless"
                    appendTo="body">
            <ng-template let-group pTemplate="group">
                <div class="group-item">
                    <div>{{group.label}}</div>
                </div>
            </ng-template>
            <ng-template let-field pTemplate="item">
                <div class="field-item">
                    <div>{{field.label}}</div>
                </div>
            </ng-template>
        </p-dropdown>
    </div>

    <div class="value-selection" [hidden]="!isSelectingValue">
        <p-dropdown igDropdown
                    [options]="getOperators(condition)"
                    [(ngModel)]="currentOperator"
                    igSize="full"
                    appendTo="body">
        </p-dropdown>
        <ng-container *ngIf="needsValue()">
            <input *ngIf="fieldInputType() === 'text'" igInput igSize="full" type="text" [(ngModel)]="currentValue" required />
            <ig-number-input *ngIf="fieldInputType() === 'number'" igSize="full" [(ngModel)]="currentValue" required></ig-number-input>

            <ng-container *ngIf="fieldInputType() === 'multi-number'">
                <ig-number-input igSize="full" [(ngModel)]="currentValue" required></ig-number-input>
                <div class="value-separator">and</div>
                <ig-number-input igSize="full" [(ngModel)]="currentValue2" required></ig-number-input>
            </ng-container>

            <ig-date *ngIf="fieldInputType() === 'date'" [(ngModel)]="currentValue" required></ig-date>
            <ng-container *ngIf="fieldInputType() === 'multi-date'">
                <ig-date [(ngModel)]="currentValue" required></ig-date>
                <div class="value-separator">and</div>
                <ig-date [(ngModel)]="currentValue2" required></ig-date>
            </ng-container>

            <ig-date *ngIf="fieldInputType() === 'date-time'" [(ngModel)]="currentValue" [showTime]="true" required></ig-date>
            <ng-container *ngIf="fieldInputType() === 'multi-date-time'">
                <ig-date [(ngModel)]="currentValue" required [showTime]="true"></ig-date>
                <div class="value-separator">and</div>
                <ig-date [(ngModel)]="currentValue2" required [showTime]="true"></ig-date>
            </ng-container>

            <ng-container *ngIf="fieldInputType() === 'lookup' && currentField">
                <div class="lookup-selection">
                    <p-table [metaKeySelection]="true"
                             selectionMode="single"
                             [value]="currentField.Values"
                             [(selection)]="currentValue"
                             dataKey="value">
                        <ng-template pTemplate="header">
                            <tr>
                                <th style="width: 3rem">
                                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                                </th>
                                <th>Code</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-item>
                            <tr [pSelectableRow]="item">
                                <td>
                                    <p-tableCheckbox [value]="item"></p-tableCheckbox>
                                </td>
                                <td>
                                    <span class="item-value">{{item.value}}</span>
                                </td>
                            </tr>
                        </ng-template>
                    </p-table>
                </div>
            </ng-container>

        </ng-container>
        <div class="buttons flex">
            <button igButton icon="fa-trash" style="margin-left:0px;" tooltip="Close" (click)="remove()"></button>

            <div class="flex-grow"></div>
            <button igButton icon="fa-times" tooltip="Close" (click)="cancel()"></button>
            <button igButton class="ig-button-primary" icon="fa-check" tooltip="Save" (click)="confirmValue()"></button>
        </div>
    </div>

</div>
