<div class="row">
    <div class="col s12">&nbsp;</div>
    <div class="form-instructions" i18n>Please select how you would like to see the exported results formatted.</div>
    <div class="col s12" *ngFor="let option of exportOptions">
        <a (click)="doExport(option)" class="{{option.IsDownloading ? 'disabled-link' : ''}}" style="padding:2px;cursor:pointer">{{option.Name}}</a>
        <i *ngIf="option.IsDownloading" class="fa fa-spinner fa-spin" aria-hidden="true"></i>

        <span *ngIf="option.Description">- {{option.Description}}</span>
    </div>
    <div class="col s12">&nbsp;</div>
    <div class="col s12 buttons">
        <button igButton class="ig-button-primary" type="button" i18n-label label="Close"
                (click)="closeClick.emit()"></button>
    </div>
</div>
