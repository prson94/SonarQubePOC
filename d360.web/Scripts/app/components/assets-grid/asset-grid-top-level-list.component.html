<div class="row">
    <div class="col s12">
        <d3s-loading [isLoading]="isLoading"></d3s-loading>
        <div class="tile tile-detail"
             *ngIf="!isLoading">
            <header></header>
            <input type="text"
                   [(ngModel)]="searchValue"
                   placeholder="Search"
                   i18n-placeholder
                   style="width: 100%;margin-bottom:10px;">
            <p-treeTable [value]="ArtifactTypes | treeSearch: searchValue:'name'"
                         selectionMode="single"
                         [(selection)]="selectedRow"
                         [style]="{ 'width': '100%' }">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 20%" i18n>Name</th>
                        <th style="width: 70%" i18n>Description</th>
                        <th style="width: 5%" i18n>Count</th>
                        <th style="width: 5%"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body"
                             let-rowNode
                             let-item="rowData">
                    <tr [ttSelectableRow]="rowNode">
                        <td style="vertical-align: top">
                            <d3s-treeTableToggler [rowNode]="rowNode"></d3s-treeTableToggler>
                            <a (click)="navigate(item.uid)"
                               class="link">
                                {{item.name}}
                            </a>
                        </td>
                        <td *ngIf="item.description;else other_content"
                            [innerHtml]="item.description"></td>
                        <ng-template #other_content>
                            <td>&nbsp;</td>
                        </ng-template>
                        <td style="overflow: auto; padding-left: 15px; text-align: center">
                            {{item.count}}
                        </td>
                        <td>
                            <div class="RowTools">
                                <d3s-preview-tooltip objectType="ArtifactType"
                                                     [uid]="item.uid"
                                                     icon="info"></d3s-preview-tooltip>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-treeTable>
        </div>
    </div>
</div>
