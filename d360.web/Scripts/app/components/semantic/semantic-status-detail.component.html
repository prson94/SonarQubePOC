<div class="asset-detail">  
    <ng-container>
        <div class="asset-detail-header">
            <div class="asset-name">
                Status
            </div>
            <div class="class-name">
                Status List
            </div>
        </div>
    </ng-container>
    <div>
        <ng-container>
            <ng-container *ngIf="isLoading">
                <d3s-loading [isLoading]="true"></d3s-loading>
            </ng-container>
            <ng-container *ngIf="!isLoading">
                <div class="grid-actions-header" style="padding-left:16px">
                    <div style="width:100%">
                        <label style="vertical-align:middle; line-height:24px;" class="ig-label">Items</label>
                    </div>                    
                    <div class="grid-action-buttons">
                        <div pTooltip="Export to Excel"
                             tooltipPosition="left"
                             tooltipStyleClass="ig-tooltip">
                            <button igButton
                                    [disabled]="isExportInProgress"
                                    [igDataCy]="'Semantic_Status_Export'"
                                    icon="fa-download"
                                    [loading]="isExportInProgress"
                                    (click)="export()">
                            </button>
                        </div>
                    </div>
                </div>
                <div class="row asset-grid-wrapper" style="padding-left:16px">
                    <p-table [value]="statuses" class="status-table">
                        <ng-template pTemplate="header">
                            <tr>
                                <th>Code</th>
                                <th>Color</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-item>
                            <tr>
                                <td>
                                    {{item.Name}}
                                </td>
                                <td>
                                    <span class="ig-colorfield-swatch" [style.background-color]="item.Color"></span>
                                    {{item.ColorName}}
                                </td>
                            </tr>
                        </ng-template>
                    </p-table>
                </div>
            </ng-container>
        </ng-container>
    </div>
</div>
