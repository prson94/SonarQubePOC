<div class="asset-detail">  
    <ng-container>
        <div class="asset-detail-header">
            <div class="asset-name" i18n>
                Status
            </div>
            <div class="class-name" i18n>
                Status List
            </div>
        </div>
    </ng-container>
    <div>
        <ng-container>
            <ng-container *ngIf="isLoading">
                <d3s-loading [isLoading]="true"></d3s-loading>
            </ng-container>
            <ng-container *ngIf="!isLoading">
                <div class="grid-actions-header" style="padding-left:16px">
                    <div style="width: 100%">
                        <label class="ig-label" i18n>Items</label>
                    </div>
                    <div class="export-link">
                        <a (click)="export()">
                            <i class="fa fa-download"></i><ng-container i18n>Export to Excel</ng-container>
                        </a>
                    </div>
                </div>                                    
                <div class="row asset-grid-wrapper" style="padding-left:16px">
                    <p-table [value]="statuses" class="status-table">
                        <ng-template pTemplate="header">
                            <tr>
                                <th i18n>Code</th>
                                <th i18n>Color</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-item>
                            <tr>
                                <td>
                                    {{item.Name}}
                                </td>
                                <td>
                                    <span class="ig-colorfield-swatch" [style.background-color]="item.Color"></span>
                                    {{item.ColorName}}
                                </td>
                            </tr>
                        </ng-template>
                    </p-table>
                </div>
            </ng-container>
        </ng-container>
    </div>
</div>
