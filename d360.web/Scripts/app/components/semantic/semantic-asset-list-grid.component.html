<div *ngIf="!isSidePanel" class="grid-actions-header">
    <div class="simple-search">
        <ig-search-field mode="Keypress"
                         [debounce]="600"
                         (onSearch)="onSimpleSearch($event)"
                         [(ngModel)]="simpleFilter"
                         [infoTooltip]="simpleSearchTooltipHTML">
        </ig-search-field>
    </div>
    <advanced-filtering [loadIdentifier]="'SemanticTypeAssets'" [fieldsObserver]="filterFields$" (onLoad)="onFiltersLoaded()" (onChange)="advancedFiltersChanged($event)"></advanced-filtering>
    <div class="grid-action-buttons">
        <div pTooltip="{{exportTooltip}}"
             tooltipPosition="left"
             tooltipStyleClass="ig-tooltip">
            <button igButton
                    [disabled]="!canExportRecords() || isExportInProgress"
                    [igDataCy]="'Semantic_Assets_Export'"
                    icon="fa-download"
                    [loading]="isExportInProgress"
                    (click)="export()">
            </button>
        </div>
    </div>
</div>
<div class="row {{(isSidePanel ? 'asset-grid-sidepanel-wrapper' : 'asset-grid-wrapper')}}">
    <div class="col s12">
        <p-table #dt [value]="assets"
                    selectionMode="single"
                    [(selection)]="selectedAsset"
                    [metaKeySelection]="true"
                    [paginator]="true"
                    [pageLinks]="3"
                    [rows]="rowsPerPage"
                    [rowsPerPageOptions]="defaultPagingOptions"
                    [totalRecords]="assetsTotal"
                    [scrollable]="true"
                    scrollWidth="100%"
                    [loading]="isLoading"
                    [loadingIcon]="'fa fa-spinner fa-spin'"
                    [lazy]="true"
                    (onLazyLoad)="lazyLoad($event)"
                    (selectionChange)="selectRow($event)"
                    [style]="{ 'width': '100%' }">
            <ng-template pTemplate="header">
                <tr>
                    <th [pSortableColumn]="'Path'">
                        <ng-container i18n>Asset Path</ng-container>
                        <d3s-sortIcon [field]="'Path'"></d3s-sortIcon>
                    </th>
                    <th *ngIf="!isSidePanel" [pSortableColumn]="'AssetTypePath'">
                        <ng-container i18n>Asset Type Path</ng-container>
                        <d3s-sortIcon [field]="'AssetTypePath'"></d3s-sortIcon>
                    </th>
                    <th alignFrozen="right" pFrozenColumn></th>
                    <th alignFrozen="right" pFrozenColumn></th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item>
                <tr (dblclick)="selectSemanticTypeAsset(item)" [pSelectableRow]="item" (focus)="selectRow(item)">
                    <td>
                        <a (click)="selectSemanticTypeAsset(item)"
                           class="link">
                            {{item.path}}
                        </a>
                    </td>
                    <td *ngIf="!isSidePanel">
                        {{item.assetTypePath}}| item effective: {{item.effectiveDate}} | semantic type: {{semanticType.effectiveDate}}
                    </td>
                    <td class="asset-grid-tools" alignFrozen="right" pFrozenColumn style=" width: 32px; text-align: center; padding-top:7px;">
                        <div style="display:inline-block" *ngIf="semanticType.effectiveDate>item.effectiveDate">
                            <i class="fa fa-exclamation-triangle"
                               pTooltip="<b>Out of date classification</b> - This asset was identified as a semantic type of Date, but the definition of this semantic type has since changed."
                               [escape]="false"
                               [hideDelay]="1000"
                               tooltipPosition="top"
                               tooltipStyleClass="ig-tooltip ig-tooltip-medium"></i>
                        </div>
                    </td>
                    <td *ngIf="!isSidePanel" class="asset-grid-tools" alignFrozen="right" pFrozenColumn style="width: 32px;">                        
                        <div style="display:inline-block">
                            <button igButton type="button" icon="fa-ellipsis-v" (click)="selectRow(item); menu.toggle($event)"></button>
                            <ig-popup-menu (onSelect)="clickMenuItem($event, item)" [items]="menuItems" #menu [tabIndex]="1"></ig-popup-menu>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage" i18n>
                No assets found
            </ng-template>
            <ng-template pTemplate="summary">
                <d3s-grid-paging-info [first]="dt.first"
                                        [rows]="dt.rows"
                                        [totalRecords]="assetsTotal"></d3s-grid-paging-info>
            </ng-template>
        </p-table>
    </div>
</div>
