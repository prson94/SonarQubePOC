<div class="row" *ngIf="!isLoading" [ngSwitch]="pageMode">
    <div *ngSwitchDefault>
        <div class="col s12 m6 l6">
            <div class="tile tile-detail">
                <div class="row">
                    <header>
                        <d3s-tile-actions [hasApi]="isMe" [hasPassword]="isMe && allowChangePassword" [hasEdit]="isMe" (editClick)="action('edit')" (apiClick)="action('api')" (passwordClick)="action('password')"></d3s-tile-actions>
                    </header>
                    <div class="col l3 m3 s12">
                        <img [src]="'/resources/image/' + resourceId + '?size=200'" style="margin-top:5px;width:100%" />
                    </div>
                    <div class="col l9 m9 s12">
                        <div style="padding-bottom:0">
                            <object-detail [objectType]="'Resource'" [objectID]="resourceId"></object-detail>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col s12 m6 l6">
            <div>
                <d3s-assignments *ngIf="!isMe" [resourceId]="resourceId" (showItemDetail)="showAssignment($event)"></d3s-assignments>
                <d3s-assignments *ngIf="isMe" (showItemDetail)="showAssignment($event)"></d3s-assignments>
            </div>
            <d3s-resource-groups [resourceId]="resourceId"></d3s-resource-groups>
            <div *ngIf="!isLoading" [ngSwitch]="pageMode" class="row">
                <div *ngSwitchDefault>
                    <div class="tile tile-detail">
                        <d3s-resource-responsibility-tile [resource]="resource"></d3s-resource-responsibility-tile>
                    </div>
                    <div class="tile tile-detail">
                        <d3s-resource-following-tile [resource]="resource"></d3s-resource-following-tile>
                    </div>
                </div>
                <div *ngSwitchCase="PageMode.Board">
                    <div class="tile tile-detail">
                        <div style="text-align:right;cursor:pointer;font-size:1.6rem;" (click)="pageMode = PageMode.Default"><i class="fa fa-remove"></i></div>
                        <d3s-social-board [hasNewInput]="false" [hasCloseButton]="'true'" [objectType]="'Resource'" [objectID]="resourceId" [objectName]="'Current User'" (countsChanged)="updateStatistics()" (close)="pageMode = pageMode.Default"></d3s-social-board>
                    </div>
                </div>
                <div *ngSwitchCase="PageMode.Governance">
                    <div class="tile tile-detail">
                        <div style="text-align:right;cursor:pointer;font-size:1.6rem;" (click)="pageMode = PageMode.Default"><i class="fa fa-remove"></i></div>
                        <d3s-object-health-details [objectID]="resourceId" [objectType]="'Resource'" [objectName]="resource?.FirstName + ' ' + resource?.LastName"></d3s-object-health-details>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div *ngSwitchCase="PageMode.EditingInfo">
        <div class="col s12">
            <div class="tile tile-detail">
                <d3s-dynamic-editor
                                    objectType="resourceself"
                                    title="Your Bio"
                                    objectID="-1"
                                    hasCloseButton="true"
                                    [selection]="resource"
                                    (closeClick)="pageMode = PageMode.Default;"
                                    (saveClick)="save($event)">
                </d3s-dynamic-editor>
            </div>
        </div>
    </div>
    <div *ngSwitchCase="PageMode.EditingPassword">
        <div class="col s12">
            <div class="tile tile-detail">
                <d3s-resource-password (onClose)="pageMode = PageMode.Default" (onSave)="pageMode = PageMode.Default">
                </d3s-resource-password>
            </div>
        </div>
    </div>
    <div *ngSwitchCase="PageMode.ViewingAPICredentials">
        <div class="col s12">
            <div class="tile tile-detail">
                <d3s-resource-api hasCloseButton="true" (onClose)="pageMode = PageMode.Default"></d3s-resource-api>
            </div>
        </div>
    </div>
</div>
