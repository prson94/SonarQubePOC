<d3s-loading [isLoading]="isSavingProcess" i18n>Saving is in process...</d3s-loading>
<div class="row" *ngIf="!isLoading" [ngSwitch]="pageMode">
    <div *ngSwitchDefault>
        <div class="col s12 m6 l6">
            <div class="tile tile-detail">
                <div class="row">
                    <header>
                        <d3s-tile-actions [hasApi]="isMe && showAllUsersAPIKey" [hasPassword]="isMe && allowChangePassword" [hasEdit]="isMe" (editClick)="action('edit')" (apiClick)="action('api')" (passwordClick)="action('password')"></d3s-tile-actions>
                    </header>
                    <div class="col l3 m3 s12">
                        <img [src]="'/api/v2/membership/users/' + resourceUid + '/image?size=200'" style="margin-top:5px;width:100%" />
                    </div>
                    <div class="col l9 m9 s12">
                        <div style="padding-bottom:0">
                            <object-detail [objectType]="'Resource'" [objectID]="resourceId"></object-detail>
                            <span *ngIf="totNumber != 0" class="FieldName FieldDisplayName" style="padding-left: 10px;" i18n>Total of <font color="forestgreen"><b>{{totNumber}}</b></font> Comments Posted for the Past <font color="forestgreen"><b>{{days}}</b></font> Days</span>
                            <span *ngIf="totNumber == 0" class="FieldName FieldDisplayName" style="padding-left: 10px;" i18n>No Comments were Posted for the Past <font color="forestgreen"><b>{{days}}</b></font> Days</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col s12 m6 l6">
            <div>
                <d3s-assignments *ngIf="!isMe" [resourceId]="resourceId" (showItemDetail)="showAssignment($event)"></d3s-assignments>
                <d3s-assignments *ngIf="isMe" (showItemDetail)="showAssignment($event)"></d3s-assignments>
            </div>
        </div>
    </div>
    <div *ngSwitchCase="PageMode.EditingInfo">
        <div class="col s12">
            <div class="tile tile-detail">
                <d3s-dynamic-editor objectType="resourceself"
                                    title="Your Bio"
                                    i18n-title
                                    objectID="-1"
                                    hasCloseButton="true"
                                    [selection]="resource"
                                    (closeClick)="pageMode = PageMode.Default;"
                                    (saveClick)="save($event)">
                </d3s-dynamic-editor>
            </div>
        </div>
    </div>
    <div *ngSwitchCase="PageMode.EditingPassword">
        <div class="col s12">
            <div class="tile tile-detail">
                <d3s-resource-password (onClose)="pageMode = PageMode.Default" (onSave)="pageMode = PageMode.Default">
                </d3s-resource-password>
            </div>
        </div>
    </div>
    <div *ngSwitchCase="PageMode.NotFound">
        <div class="col s12">
            <div class="tile tile-detail">
                <header i18n>Resource not found</header>
            </div>
        </div>
    </div>
</div>
<d3s-resource-api *ngIf="showAllUsersAPIKey" [isVisible]="isApiKeysPopupVisible" (onClose)="isApiKeysPopupVisible=false"></d3s-resource-api>
