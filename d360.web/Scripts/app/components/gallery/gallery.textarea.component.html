<div class="tile tile-detail">
    <header>Text Area Directive</header>
    <p>Angular directive that can be applied to Html input controls.</p>
</div>

<div class="tile tile-detail">
    <header>Basic Usage</header>
    <code>{{sampleUsage}}</code>
</div>

<div class="tile tile-detail">
    <header>Examples</header>
    <div class="gallery-section">
        <h4>Basic</h4>
        <div>
            <textarea igTextArea></textarea>
        </div>
    </div>
    <div class="gallery-section">
        <h4>Large (624px)</h4>
        <div>
            <textarea igTextArea class="ig-field-width-large"></textarea>
        </div>
    </div>
    <div class="gallery-section">
        <h4>Required</h4>
        <div>
            <textarea igTextArea required></textarea>
        </div>
    </div>
    <div class="gallery-section">
        <h4>Disabled</h4>
        <div>
            <textarea igTextArea disabled></textarea>
        </div>
    </div>
    <div class="gallery-section">
        <h4>Resizeable</h4>
        <div>
            <textarea igTextArea class="resize"></textarea>
        </div>
    </div>
</div>

<div class="tile tile-detail">
    <header>Properties</header>
    <p-table [value]="properties">
        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Default</th>
                <th>Description</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-property>
            <tr>
                <td>{{property.Name}}</td>
                <td>{{property.Type}}</td>
                <td>{{property.Default}}</td>
                <td>{{property.Description}}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
