<div class="tile tile-detail">
    <header>Button Directive</header>
    <p>Angular component to show text in a message box.</p>
</div>

<div class="tile tile-detail">
    <header>Basic Usage</header>
    <code>{{sampleUsage}}</code>
</div>

<div class="tile tile-detail">
    <header>Examples</header>
    <header>Information</header>
    <div class="gallery-section">
        <h4>Basic</h4>
        <div>
            <ig-message-box [message]="message"></ig-message-box>
        </div>
    </div>
    <div class="gallery-section">
        <h4>Long text</h4>
        <div>
            <ig-message-box [message]="lorem"></ig-message-box>
        </div>
    </div>

    <header>Warning</header>
    <div class="gallery-section">
        <h4>Basic</h4>
        <div>
            <ig-message-box [message]="message" [messagetype]="'warning'"></ig-message-box>
        </div>
    </div>
    <div class="gallery-section">
        <h4>Long text</h4>
        <div>
            <ig-message-box [message]="lorem" [messagetype]="'warning'"></ig-message-box>
        </div>
    </div>
</div>

<div class="tile tile-detail">
    <header>Properties</header>
    <p-table [value]="properties">
        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Default</th>
                <th>Description</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-property>
            <tr>
                <td>{{property.Name}}</td>
                <td>{{property.Type}}</td>
                <td>{{property.Default}}</td>
                <td>{{property.Description}}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
