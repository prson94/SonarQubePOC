<div class="tile tile-detail">
    <header>Feature Flags</header>
    <p>Current Feature Flags set for this environment.</p>
</div>

<div class="tile tile-detail">
    <header>Govern Feature Flags</header>
    <p-table [value]="featureFlags" tableStyle="width:fit-content">
        <ng-template pTemplate="header">
            <tr>
                <th>Flag</th>
                <th>Value</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{item.flag}}</td>
                <td>{{item.value}}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
