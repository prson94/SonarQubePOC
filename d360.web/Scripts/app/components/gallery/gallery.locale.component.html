﻿<div class="tile tile-detail">
    <header i18n>Locale Section</header>
    <p i18n>Angular setup for multi locale support.</p>
</div>

<div class="tile tile-detail">
    <header>Examples</header>
    <div class="gallery-section">
        <h4 i18n>Change language</h4>
        <button igButton [label]="txtEn" (click)="changeLang('en-us');"></button>&nbsp;&nbsp;
        <button igButton [label]="txtDe" (click)="changeLang('de');"></button>&nbsp;&nbsp;
        <button igButton [label]="txtFr" (click)="changeLang('fr');"></button>&nbsp;&nbsp;

    </div>

    <div class="gallery-section">
        <h4 i18n>Html template example!</h4>
        <p i18n>This text comes from HTML template.</p>
    </div>

    <div class="gallery-section">
        <h4 i18n>Translation coming from .ts!</h4>
        <p>{{translatedText}}</p>
    </div>

    <div class="gallery-section">
        <h4 i18n>Usage as components attributes</h4>
        <button igButton icon="fa-ellipsis-v" tooltip="{{tooltipText}}"></button>
    </div>
</div>
