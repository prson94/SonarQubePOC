<div class="tile tile-detail">
    <header>Loading Component</header>
    <p>Angular component that shows a loading wheel</p>
</div>

<div class="tile tile-detail">
    <header>Basic Usage</header>
    <code>{{sampleUsage}}</code>
</div>

<div class="tile tile-detail">
    <header>Examples</header>
    <div class="gallery-section">
        <h4>Basic</h4>
        <div>
            <d3s-loading [isLoading]="isLoading1"></d3s-loading>
        </div>
        <div>
            <button igButton label="Toggle" (click)="isLoading1 = !isLoading1"></button>
        </div>
    </div>
    <div class="gallery-section">
        <h4>Transparent</h4>
        <div>
            <d3s-loading [isLoading]="isLoading2" [showTransparentLoader]="true"></d3s-loading>
        </div>
        <div>
            <button igButton label="Toggle" (click)="isLoading2 = !isLoading2"></button>
        </div>
    </div>
</div>

<div class="tile tile-detail">
    <header>Properties</header>
    <p-table [value]="properties">
        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Default</th>
                <th>Description</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-property>
            <tr>
                <td>{{property.Name}}</td>
                <td>{{property.Type}}</td>
                <td>{{property.Default}}</td>
                <td>{{property.Description}}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
