<header>
    <d3s-tile-actions [hasExport]="true" [isExportDisabled]="!canExportRecords()" (exportClick)="export()" [exportDisabledMessage]="exportMsg"></d3s-tile-actions>
</header>
<span>
    <input type="text"
           [hidden]="!showSimpleFilter"
           pInputText
           size="100"
           (input)="$event.target.value;dt.filterGlobal($event.target.value, 'contains')"
           placeholder="Search..."
           i18n-placeholder
           class="grid-simple-filter">
    <p-table #dt
             [value]="artifacts?.items"
             [lazy]="true"
             [totalRecords]="artifacts?.total"
             (onLazyLoad)="loadArtifactsLazy($event)"
             selectionMode="single"
             [metaKeySelection]="true"
             [globalFilterFields]="globalFilterFields"
             [pageLinks]="3"
             [paginator]="true"
             [loading]="isLoading"
             [loadingIcon]="'fa fa-spinner fa-spin'"
             [rows]="numberOfRows"
             [rowsPerPageOptions]="defaultPagingOptions">
        <ng-template pTemplate="header">
            <tr>
                <th *ngFor="let column of columns"
                    [pSortableColumn]="column.sortable ? column.datafield : null">
                    {{column.text}}
                    <d3s-sortIcon *ngIf="column.sortable"
                                  [field]="column.datafield"></d3s-sortIcon>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body"
                     let-item>
            <tr [pSelectableRow]="item">
                <td *ngFor="let column of columns">
                    <a (click)="selectArtifact(item)">
                        <d3s-dynamic-field-value [column]="column"
                                                 [fields]="fields"
                                                 [item]="item"
                                                 [useApiName]="true"></d3s-dynamic-field-value>
                    </a>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="summary">
            <d3s-grid-paging-info [first]="dt.first"
                                  [rows]="dt.rows"
                                  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
        </ng-template>
    </p-table>
</span>
