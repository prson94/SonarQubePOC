<div class="row">
    <div class="col s12">
        <div class="tile tile-detail main-panel">
            <div class="grid-actions-header">
                <advanced-filtering [loadIdentifier]="getLoadIdentifier()" [fieldsObserver]="filterFields$" (onLoad)="onFiltersLoaded()" (onChange)="advancedFiltersChanged($event)"></advanced-filtering>
                <div class="grid-action-buttons">
                    <div pTooltip="{{(canExportRecords() ? 'Export to Excel' : 'Export not available for over ' + maxExportRows + ' rows')}}"
                         tooltipPosition="left"
                         tooltipStyleClass="ig-tooltip">
                        <button igButton
                                [disabled]="!canExportRecords() || isExportInProgress"
                                icon="fa-download"
                                [loading]="isExportInProgress"
                                (click)="export()">
                        </button>
                    </div>
                </div>
            </div>
            <div class="grid-table-wrapper">
                <p-table #dt
                         [loading]="isLoading"
                         loadingIcon="fa fa-spinner"
                         [sortField]="sortField"
                         [sortOrder]="-1"
                         [scrollable]="true"
                         scrollHeight="flex"
                         scrollDirection="both"
                         scrollWidth="100%"
                         [lazy]="true"
                         (onLazyLoad)="loadAuditsLazy($event)"
                         [totalRecords]="totalRecords"
                         [value]="audits"
                         selectionMode="single"
                         [metaKeySelection]="true"
                         [globalFilterFields]="getFieldNames()"
                         [pageLinks]="3"
                         [paginator]="true"
                         [rows]="rowsPerPage"
                         [rowsPerPageOptions]="defaultPagingOptions"
                         [(selection)]="selected">
                    <ng-template pTemplate="colgroup">
                        <colgroup>
                            <col *ngFor="let column of columns" [style]="'width:' + column.columnWidth + 'px'">
                        </colgroup>
                    </ng-template>
                    <ng-template pTemplate="header">
                        <tr>
                            <th *ngFor="let column of columns" [pSortableColumn]="column.datafield" [style]="'width:' + column.columnWidth + 'px'">
                                {{column.text}}
                                <d3s-sortIcon [field]="column.datafield"></d3s-sortIcon>
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-item>
                        <tr [pSelectableRow]="item">
                            <td>{{item.resourceName}}</td>
                            <td>
                                <span>{{item.date | date: 'medium'}}</span>
                            </td>
                            <td>{{item.action}}</td>
                            <td>{{item.field}}</td>
                            <td *ngIf="item.newValue;else emptyValue">
                                <span [ngSwitch]="(item.fieldType?item.fieldType:'').toLowerCase()">
                                    <div *ngSwitchCase="'date'" [innerHtml]="item.newValue | date: 'shortDate'"></div>
                                    <div *ngSwitchCase="'datetime'" [innerHtml]="item.newValue | date: 'medium'"></div>
                                    <div *ngSwitchDefault [innerHtml]="item.newValue"></div>
                                </span>
                            </td>
                            <td *ngIf="item.previousValue;else emptyValue">
                                <span [ngSwitch]="(item.fieldType?item.fieldType:'').toLowerCase()">
                                    <div *ngSwitchCase="'date'" [innerHtml]="item.previousValue | date: 'shortDate'"></div>
                                    <div *ngSwitchCase="'datetime'" [innerHtml]="item.previousValue | date: 'medium'"></div>
                                    <div *ngSwitchDefault [innerHtml]="item.previousValue"></div>
                                </span>
                            </td>
                            <ng-template #emptyValue><td></td></ng-template>
                            <td>{{item.actionObject}}</td>
                            <td>{{item.actionObjectTypeName}}</td>
                            <td>{{item.actionObjectName}}</td>
                            <td>{{item.actionDescription}}</td>
                            <td>{{item.version}}</td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="summary">
                        <d3s-grid-paging-info [first]="dt.first"
                                              [rows]="dt.rows"
                                              [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</div>
