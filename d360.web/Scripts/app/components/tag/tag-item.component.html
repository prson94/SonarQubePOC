<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div class="row">
    <div class="col s12">
        <div class="tile tile-detail" *ngIf="!isLoading">
            <header>
                <d3s-tile-actions [hasAdd]="false"
                                  [hasFilterMode]="true"
                                  [(filterMode)]="showSimpleFilter"
                                  [hasExport]="true" 
                                  (exportClick)="export()"
                                  ></d3s-tile-actions>
            </header>
            <input type="text" [hidden]="!showSimpleFilter" pInputText size="100" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search..." class="grid-simple-filter">
            <p-table #dt [value]="tagUsage" selectionMode="single" [metaKeySelection]="true" [globalFilterFields]="['DisplayValue']" sortField="DisplayValue" [sortOrder]="1" [pageLinks]="3" [paginator]="true" [rows]="10" [(selection)]="selected">
                <ng-template pTemplate="header">
                    <tr>
                        <th [pSortableColumn]="'DisplayValue'" style="width: 20%">
                            Asset
                            <d3s-sortIcon [field]="'DisplayValue'"></d3s-sortIcon>
                        </th>
                        <th style="width: 20%">
                            Asset Type
                        </th>
                        <th style="width: 50%">
                            Tags
                        </th>
                        <th style="width: 10%"></th>
                    </tr>
                    <tr [hidden]="showSimpleFilter">
                        <th><d3s-column-filter [field]="'DisplayValue'" [datatype]="'text'"></d3s-column-filter></th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-item>
                    <tr [pSelectableRow]="item">
                        <td>{{item.DisplayValue}}</td>
                        <td [innerHTML]="getAssetType(item)"></td>
                        <td>
                            <div class="tag-list">
                                <div class="tag-item" *ngFor="let tag of item.Tags">
                                    <button class="button" (click)="openTagPage(tag)">{{tag.Value}}</button>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="RowTools">
                                <d3s-preview-tooltip [objectType]="item.Object"
                                                     [objectId]="item.ObjectID"
                                                     icon="info"></d3s-preview-tooltip>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template *ngIf="dt.totalRecords" pTemplate="summary">
                    <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
