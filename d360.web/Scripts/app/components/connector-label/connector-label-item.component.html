<as-split [gutterSize]="sidePanelService.draggableAreaWidth"
		  [class.side-panel-close]="!sidePanelOpen"
		  (dragEnd)="onSidePanelDragEnd(sidePanelStorageKey, $event)"
		  unit="pixel"
		  direction="horizontal"
		  class="col s12 split"
		  style="display: flex">
	<as-split-area class="tile tile-detail main-panel">
		<div *ngIf="!isLoading && !isWhereUsedPage">
			<div class="button-top-right">
				<button igButton
						class="ig-button-primary"
						icon="fa-pencil"
						i18n-label
						label="Edit"
						(click)="isEditorVisible=true"></button>
			</div>
			<d3s-connector-label-definition [label]="label" [isSidePanel]="false" (onLinkClicked)="onResourceLinkClick($event)"></d3s-connector-label-definition>
		</div>
		<div *ngIf="!isLoading && isWhereUsedPage">
			<div class="grid-actions-header column-layout">
				<div class="grid-actions-header-row">
					<div class="simple-search">
						<ig-search-field mode="Keypress"
										 [debounce]="600"
										 (onSearch)="dt.filterGlobal($event, 'contains')">
						</ig-search-field>
					</div>
					<div class="grid-action-buttons">
						<div pTooltip="Export"
							 i18n-pTooltip
							 tooltipPosition="left"
							 tooltipStyleClass="ig-tooltip">
							<button igButton
									class="ig-button-secondary"
									[igDataCy]="'Connector_Label_Export'"
									icon="fa-download"
									(click)="export()">
							</button>
						</div>
					</div>
				</div>
			</div>


			<p-table #dt [value]="usage"
					 selectionMode="single"
					 [metaKeySelection]="true"
					 [globalFilterFields]="['Diagram','AssetTypeName','Occurrences']"
					 sortField="Diagram"
					 [sortOrder]="1"
					 [pageLinks]="3"
					 [paginator]="true"
					 [rowsPerPageOptions]="defaultPagingOptions"
					 [rows]="10" 
					 [(selection)]="selected"
					 (onRowSelect)="onRowSelected($event)">
				<ng-template pTemplate="header">
					<tr>
						<th [pSortableColumn]="'Diagram'" style="width: 20%">
							<ng-container i18n>Diagram</ng-container>
							<d3s-sortIcon (changeCallback)="updateSort($event);" [field]="'Diagram'"></d3s-sortIcon>
						</th>
						<th [pSortableColumn]="'AssetTypeName'">
							<ng-container i18n>Asset Type</ng-container>
							<d3s-sortIcon (changeCallback)="updateSort($event);" [field]="'AssetTypeName'"></d3s-sortIcon>

						</th>
						<th [pSortableColumn]="'Occurrences'" style="width: 200px;">
							<ng-container i18n>Occurrences</ng-container>
							<d3s-sortIcon (changeCallback)="updateSort($event);" [field]="'Occurrences'"></d3s-sortIcon>

						</th>
						<th style="width: 50px;"></th>
					</tr>
					<tr [hidden]="showSimpleFilter">
						<th><d3s-column-filter (onChangeCallback)="onFilterChange($event)" [field]="'Diagram'" [datatype]="'text'"></d3s-column-filter></th>
						<th><d3s-column-filter (onChangeCallback)="onFilterChange($event)" [field]="'AssetTypeName'" [datatype]="'text'"></d3s-column-filter></th>
						<th><d3s-column-filter (onChangeCallback)="onFilterChange($event)" [field]="'Occurrences'" [datatype]="'text'"></d3s-column-filter></th>
						<th></th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-item>
					<tr [pSelectableRow]="item">
						<td>
							<a href="{{item.url}}" target="_blank">
								{{item.Diagram}}
							</a>
						</td>
						<td [innerHTML]="formatValue(item)"></td>
						<td>{{item.Occurrences}}</td>
						<td>
							<div class="token-popup-menu" *ngIf="item.MenuItems">
								<button igButton type="button" icon="fa-ellipsis-v" (click)="tokenMenu.toggle($event);"></button>
								<ig-popup-menu [items]="item.MenuItems"
											   #tokenMenu
											   [tabIndex]="1"></ig-popup-menu>
							</div>
						</td>
					</tr>
				</ng-template>
				<ng-template *ngIf="dt.totalRecords" pTemplate="summary">
					<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
				</ng-template>
			</p-table>
		</div>
	</as-split-area>
	<as-split-area [size]="getSidePanelWidth()"
				   [minSize]="getSidePanelMinWidth()"
				   [maxSize]="getSidePanelMaxWidth()"
				   class="tile tile-detail side-panel">
		<side-panel [selectedItem]="selectedForInfoPanel"
					[setMinMaxWidth]="false"
					[storageKey]="sidePanelStorageKey"
					[expanded]="true"
					[showEmptyOverlay]="!selectedForInfoPanel"
					(expandedChange)="sidePanelOpen=$event"
					hasDetail="true">
			<ng-container *ngIf="sidePanelOpen">
				<ng-container *ngIf="selectedForInfoPanel">
					<asset-preview [assetUid]="selectedForInfoPanel.AssetUid"
								   [assetType]="selectedForInfoPanel.Object"
								   [hasEditLink]="false"
								   [hasOpenLink]="true"></asset-preview>
				</ng-container>
			</ng-container>
		</side-panel>
	</as-split-area>
</as-split>




<d3s-modal [title]="editConnectorLabel"
		   additionalClasses="modal-dyn-editor medium-dialog"
		   (onClose)="isEditorVisible=false"
		   [isVisible]="isEditorVisible">
	<d3s-connector-label-form [label]="label"
							  [isSaving]="isSaving"
							  (onSave)="saveLabel($event)"
							  (onCancel)="isEditorVisible = false"
							  [isVisible]="isEditorVisible">

	</d3s-connector-label-form>
</d3s-modal>

<d3s-delete-form *ngIf="label" [callback]="theDeleteCallback"
				 [method]="'callback'"
				 [showAsModal]="true"
				 [modalCssClasses]="'large-dialog'"
				 [modalTitle]="deletePopupTitle"
				 [confirmationText]="deleteConfirmationText"
				 [isModalVisible]="isDeleteVisible"
				 (onCancel)="isDeleteVisible=false;"
				 [showDownloadWhereUsed]="label.UseCount > 0"
				 (onUsageExport)="exportUsage()"
				 [isUsageLoading]="false">
	<div prompt>
		<p i18n>
			Please confirm that you wish to delete the connector label '{{label.Value}}'.
		</p>

		<d3s-where-used [uid]="label.uid" [objectType]="'ConnectorLabel'"></d3s-where-used>

		<p i18n>
			Please note that this operation cannot be undone. Check the option below to confirm that you wish to continue.
		</p>
	</div>

</d3s-delete-form>
