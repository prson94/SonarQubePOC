<div *ngIf="isLoading">
    <div class="row">
        <div *ngIf="isLoading" style="text-align:center;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
    </div>
</div>
<div *ngIf="!isLoading" class="row">
    <div class="col s12">
        <div class="row">
            <div class="col s6">
                <div class="FieldName">
                    Name
                </div>
                <div>
                    <input pInputText type="text" [(ngModel)]="item.Name" />
                </div>
            </div>
            <div class="col s6">
                <div class="FieldName">
                    Responsibility Allocated To...
                </div>
                <div>
                    <p-multiSelect [options]="item.AllocationsList" [(ngModel)]="selectedAllocations"></p-multiSelect>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col s12">
                <div class="FieldName">
                    Description
                </div>
                <p-editor [(ngModel)]="item.Description"></p-editor>
            </div>
        </div>
        <div class="row">
            <div class="col s12">
                <div style="padding-top:10px;">
                    <button pButton label="Save" (click)="save()"></button><button pButton label="Cancel" (click)="cancel()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
