<div *ngIf="isLoading">
    <div style="text-align:center;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
</div>
<div *ngIf="!isLoading">
    <div class="row">
        <div class="col l6 m6 s12">
            <label id='ResponsibilityTypeTip' class="FieldNameRequired">Responsibility</label>
            <p-dropdown [options]="model.responsibilityTypes" [(ngModel)]="model.selectedResponsibilityType" [style]="{'width':'80%', 'display':'block'}" ></p-dropdown>
        </div>
        <div class="col l6 m6 s12">
            <label id='ResponsibleObjectTip' class="FieldNameRequired">Resource</label>
            <p-dropdown [options]="model.resources" [(ngModel)]="model.selectedResource" [style]="{'width':'80%', 'display':'block'}"></p-dropdown>
        </div>
    </div>
    <div class="row">
        <div class="col s12">
            <div id='ContextTip' class="FieldName">Contexts</div>
            <div id="Context" name="Context"></div>
            <p-multiSelect [options]="model.contexts" [(ngModel)]="model.selectedContexts"></p-multiSelect>
        </div>
    </div>
    <div *ngIf="item.ObjectType.endsWith('Type')" class="row">
        <div class="col s12">
            <p-checkbox [(ngModel)]="item.Visible" ></p-checkbox>
            <label id='IsVisibleTip' for="IsVisible">Visible?</label>
        </div>
    </div>
    <div class="row">
        <div class="col s12">
            <button pButton [disabled]="isSaving" (click)="save()" label="Save"></button> <button pButton (click)="cancel()" label="Cancel"></button> <span *ngIf="isSaving"><i class="fa fa-spinner fa-spin"></i></span> &nbsp; <form-message [message]="message" [inline]="true"></form-message>
        </div>
    </div>
</div>
