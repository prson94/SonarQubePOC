<d3s-modal #modal
		   [showTitle]="false"
		   [isVisible]="isModalVisible"
		   [additionalClasses]="'large-dialog assignment-modal-dialog'"
		   (onClose)="closeDialog()">
	<div class="modal-with-side-panel multi-assignment-selector">
		<div class="modal-dialog-main-panel">
			<div *ngIf="isLoading" style="width:100%; text-align:center;">
				<div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
			</div>

			<ng-container *ngIf="!isLoading">
				<ng-container *ngTemplateOutlet="assignmentsPicker;"></ng-container>
				<div class="action-bar">
					<button igButton class="ig-button-secondary" (click)="closeDialog()" i18n>Close</button>
					<span class="grow"></span>
					<button *ngIf="isAdmin" igButton class="ig-button-primary" style="margin-right:10px;"
							(click)="confirm(true)"
							[disabled]="selected.length === 0" tooltipPosition="top" tooltipStyleClass="ig-tooltip"
							i18n>
						Reassign >
					</button>
					<button *ngIf="isCurrentUser" igButton class="ig-button-primary" (click)="confirm(false)"
							[disabled]="selected.length === 0" i18n>
						Complete Assignments >
					</button>
				</div>
			</ng-container>
		</div>
		<div class="side-panel">
			<side-panel [(expanded)]="sidePanelOpen"
						[storageKey]="sidePanelStorageKey"
						[hasDetail]="false"
						[extraButtons]="sidePanelButtons"
						minWidth="368px"
						maxWidth="368px"
						height="calc(100vh - 220px)">
				<ng-container *ngIf="sidePanelOpen">
					<d3s-side-panel-switcher [outsideModal]="false" (panelHeaderLabel)="setPanelHeader($event)"
											 [hidden]="!sidePanelOpen" [showPanelHeader]="false"
											 #sidePanelSwitcherComponent></d3s-side-panel-switcher>
				</ng-container>
			</side-panel>
		</div>
	</div>
</d3s-modal>

<ng-template #assignmentsPicker>
	<div class="content condensed-table content-with-header">
		<div class="modal-edit-form">
			<div i18n class="title">Select Assignments</div>
			<div class="subtitle">{{workflowTypeName}}</div>
		</div>
		<div class="asset-detail content-without-header">
			<div class="asset-detail-tabs">
				<ig-property-group i18n-title title="Assignment Information" [showHeaderLine]="false"
								   [shouldBePadded]="false" [expanded]="false">
					<div readonly>
						<div class="row">

							<div class="category-column">
								<label class="ig-label" i18n>{{ formTitle }}</label>
								<div class="ig-value" [innnerHTML]="formDescription"></div>
							</div>

						</div>
					</div>
				</ig-property-group>

				<ig-property-group i18n-title title="Assignments" [showHeaderLine]="false" [shouldBePadded]="false">
					<div readonly>
						<div class="row">
							<div class="associated-type-name" *ngIf="assignmentAssetTypeName" i18n>
								<b>Associated Asset Type</b>: {{assignmentAssetTypeName}}
							</div>
							<div class="grid-actions-header column-layout">
								<div class="grid-actions-header-row">
									<div class="simple-search">
										<ig-search-field (onSearch)="dt.filterGlobal($event, 'contains');"
														 mode="Keypress">
										</ig-search-field>
									</div>
								</div>
							</div>
							<div class="table-wrapper">
								<p-table #dt
										 [tableStyle]="{'min-width': 'max-content'}"
										 loadingIcon="fa fa-spinner"
										 [value]="assignments"
										 [pageLinks]="3"
										 [paginator]="true"
										 paginatorDropdownAppendTo="body"
										 [rows]="rowsPerPage"
										 [totalRecords]="assignments.length"
										 [rowsPerPageOptions]="defaultPagingOptions"
										 (onPage)="setRowsPerPage($event)"
										 [metaKeySelection]="true"
										 [scrollable]="true"
										 [(selection)]="selected"
										 [sortOrder]="-1"
										 [globalFilterFields]="['Name','ObjectType','InitiatedBy']">
									<ng-template pTemplate="header">
										<tr>
											<th class="checkbox-column">
												<p-tableHeaderCheckbox></p-tableHeaderCheckbox>
											</th>
											<th [pSortableColumn]="'Name'" class="associated-with-column">
												<ng-container i18n>Associated With</ng-container>
												<d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
											</th>
											<th [pSortableColumn]="'ObjectType'" class="object-type-column">
												<ng-container i18n>Object Type</ng-container>
												<d3s-sortIcon [field]="'ObjectType'"></d3s-sortIcon>
											</th>
											<th [pSortableColumn]="'InitiatedBy'" class="initiated-by-column">
												<ng-container i18n>Initiated By</ng-container>
												<d3s-sortIcon [field]="'InitiatedBy'"></d3s-sortIcon>
											</th>
											<th [pSortableColumn]="'InitiatedOn'" class="initiated-on-column">
												<ng-container i18n>Initiated</ng-container>
												<d3s-sortIcon [field]="'InitiatedOn'"></d3s-sortIcon>
											</th>
											<th class="tools-column">

											</th>
										</tr>
									</ng-template>
									<ng-template pTemplate="body" let-item>
										<tr #el [pSelectableRow]="item" class="table-row">
											<td (click)="selectSingleItem($event,item,el);">
												<p-tableCheckbox [value]="item"></p-tableCheckbox>
											</td>
											<td (click)="selectSingleItem($event,item,el);">
												{{item.Name}}
											</td>
											<td (click)="selectSingleItem($event,item,el);">
												{{item.ObjectType}}
											</td>
											<td (click)="selectSingleItem($event,item,el);"> {{item.InitiatedBy}}</td>
											<td (click)="selectSingleItem($event,item,el);">{{item.InitiatedOn  | date:'shortDate'}}</td>
											<td class="info-panel-button">
												<button igButton
														icon="fa-info-circle"
														(click)="openAssignmentDetails($event, item)"></button>
											</td>
										</tr>
									</ng-template>
									<ng-template pTemplate="emptymessage">
										<tr class="table-row" style="height:32px">
											<td colspan="6" i18n>No matching assignments.</td>
										</tr>
									</ng-template>
									<ng-template pTemplate="summary">
										<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
															  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
										<d3s-grid-selection-info *ngIf="(dt.totalRecords>0)" [includeSelectLinks]="false"
																 [model]="assignments"
																 [selection]="selected">
										</d3s-grid-selection-info>
									</ng-template>
								</p-table>
							</div>
						</div>
					</div>
				</ig-property-group>
			</div>
		</div>
	</div>
</ng-template>
