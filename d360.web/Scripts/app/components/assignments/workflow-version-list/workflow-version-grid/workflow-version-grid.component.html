<div class="grid-actions-header column-layout">
	<div class="grid-actions-header-row">
		<div class="simple-search">
			<ig-search-field mode="Keypress"
							 [debounce]="600"
							 (onSearch)="onSimpleSearch($event)"
							 [(ngModel)]="simpleFilter">
			</ig-search-field>
		</div>
		<div class="grid-action-buttons">
			<div>
				<button igButton
						class="ig-button-secondary"
						[igDataCy]="'Assets_Export'"
						icon="fa-download"
						(click)="export()">
				</button>
			</div>
		</div>
	</div>
	<div class="grid-actions-header-row">
		<button igButton type="button" class="ig-button-primary" margin (click)="selectAll()" i18n-label
				label="Select All"
				[disabled]="workflowsWithStatus.length < 1"></button>
		<!--		<advanced-filtering [loadIdentifier]="'SemanticTypes'"-->
		<!--							[fieldsObserver]="filterFields$"-->
		<!--							(onLoad)="onFiltersLoaded()"-->
		<!--							(onChange)="advancedFiltersChanged($event)"></advanced-filtering>-->
	</div>
</div>
<div class="row asset-grid-wrapper">
	<div class="col s12">
		<p-table #dt
				 [loading]="isLoading"
				 loadingIcon="fa fa-spinner"
				 [value]="workflowsWithStatus"
				 selectionMode="multiple"
				 [metaKeySelection]="true"
				 [lazy]="true"
				 [totalRecords]="totalRecords"
				 [scrollable]="true"
				 [globalFilterFields]="['Name','Version','Status']"
				 [pageLinks]="3"
				 [paginator]="true"
				 [rows]="rowsPerPage || defaultInitialItemsPerPage"
				 [rowsPerPageOptions]="defaultPagingOptions"
				 (onLazyLoad)="loadWorkflowsByType($event)"
				 [selection]="selectedWorkflowsByType"
				 (selectionChange)="gridSelectionChange($event)"
				 (onPage)="numberOfRowsByCategoryService.onPage($event, title)">
			<ng-template pTemplate="header">
				<tr>
					<th pSortableColumn="Name">
						<ng-container i18n>Workflow Name</ng-container>
						<d3s-sortIcon field="Name"></d3s-sortIcon>
					</th>
					<th pSortableColumn="Version">
						<ng-container i18n>Version</ng-container>
						<d3s-sortIcon field="Version"></d3s-sortIcon>
					</th>
					<th pSortableColumn="Status">
						<ng-container i18n>Outstanding Assignments</ng-container>
						<d3s-sortIcon field="Status"></d3s-sortIcon>
					</th>
					<th class="asset-grid-tools" style="flex: 0 0 30px"></th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-item>
				<tr [pSelectableRow]="item" style="word-wrap: break-word">
					<td class="break-wrap">{{item.Name}}</td>
					<td>{{item.Version}}</td>
					<td>
						<span i18n *ngIf="item.awaiting > 0"><ig-badge
							[text]="item.awaiting"></ig-badge> Awaiting</span>
						<span i18n *ngIf="item.complete > 0"> <ig-badge
							[text]="item.complete"></ig-badge> Complete</span>
						<span i18n *ngIf="item.incomplete > 0"> <ig-badge [text]="item.incomplete"></ig-badge> Incomplete</span>
					</td>
					<td class="asset-grid-tools"
						style="flex: 0 0 30px"
						alignFrozen="right"
						pFrozenColumn>
						<div style="display:inline-block">
							<button igButton
									type="button"
									icon="fa-ellipsis-v"
									(click)="clickMenuIcon(item); menu.toggle($event)"></button>
							<ig-popup-menu (onSelect)="clickMenuItem($event, item)"
										   [items]="menuItems" #menu [tabIndex]="1"></ig-popup-menu>
						</div>
					</td>
				</tr>
			</ng-template>
			<ng-template pTemplate="summary">
				<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
									  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
			</ng-template>
		</p-table>
	</div>
</div>
