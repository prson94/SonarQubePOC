<div class="asset-detail-tabs">
	<ig-property-group title="Pending Assignments" [shouldBePadded]="false" [showHeaderLine]="false" [expanded]="true">
		<div readonly>
			<d3s-workflow-diagram [hasHeader]="false" [readonly]="true" [uid]="workflowTypeUid"
								  [version]="workflowTypeVersion"
								  [isSidePanel]="true" (onNodeClick)="onNodeClick($event)"
								  [hasMenu]="false" [hasZoomButtons]="true"></d3s-workflow-diagram>
		</div>
	</ig-property-group>
</div>
