<div class="asset-detail-tabs">
	<ig-property-group i18n-title title="Workflow Version Details" [shouldBePadded]="false" [showHeaderLine]="false"
					   [expanded]="true">
		<div readonly>
			<div class="row top-margin">
				<div class="col s4">
					<label class="ig-label" i18n>Name</label>
					<div class="ig-value"><a
						(click)="linkClick.emit({ objectType: 'workflow-information', objectUid: assignmentVersionItem?.WorkflowTypeUid })">{{ assignmentVersionItem?.WorkflowName }}</a>
					</div>
				</div>
				<div class="col s4">
					<label class="ig-label" i18n>Type</label>
					<div class="ig-value">{{ assignmentVersionItem?.ChangeType }}
						:{{ assignmentVersionItem?.InitiatingObjectType }}</div>
				</div>
				<div class="col s4">
					<label class="ig-label" i18n>Version</label>
					<div>{{ assignmentVersionItem?.Version }}</div>
				</div>
			</div>
			<div class="row top-margin">
				<div class="col s4">
					<label class="ig-label" i18n>Update On</label>
					<div class="ig-value">{{ assignmentVersionItem?.UpdatedOn | date: 'short' }}</div>
				</div>
				<div class="col s4">
					<label class="ig-label" i18n>Update By</label>
					<div class="ig-value"><a
						(click)="linkClick.emit({objectType: 'user-information', objectUid: assignmentVersionItem?.UpdatedByUid })">{{ assignmentVersionItem?.UpdatedBy }}</a>
					</div>
				</div>
			</div>
		</div>
	</ig-property-group>
</div>
<pre style="white-space: pre-wrap">{{ assignmentVersionItem | json }}</pre>
