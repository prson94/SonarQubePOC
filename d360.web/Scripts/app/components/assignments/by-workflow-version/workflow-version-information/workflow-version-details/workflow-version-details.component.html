<div class="asset-detail-tabs">
	<ig-property-group title="Workflow Version Details" [shouldBePadded]="false" [showHeaderLine]="false"
					   [expanded]="true">
		<div readonly>
			<div class="row top-margin">
				<div class="col s4">
					<label class="ig-label" i18n>Name</label>
					<div class="ig-value"><a
						(click)="linkClick.emit({ objectType: 'workflow-information', objectUid: assignmentByVersion?.WorkflowTypeUid })">{{ assignmentByVersion?.WorkflowName }}</a>
					</div>
				</div>
				<div class="col s4">
					<label class="ig-label" i18n>Type</label>
					<div class="ig-value">{{ assignmentByVersion?.ChangeType }}
						:{{ assignmentByVersion?.InitiatingObjectType }}</div>
				</div>
				<div class="col s4">
					<label class="ig-label" i18n>Version</label>
					<div>{{ assignmentByVersion?.Version }}</div>
				</div>
			</div>
			<div class="row top-margin">
				<div class="col s4">
					<label class="ig-label" i18n>Update On</label>
					<div class="ig-value">{{ assignmentByVersion?.UpdatedOn | date: 'short' }}</div>
				</div>
				<div class="col s4">
					<label class="ig-label" i18n>Update By</label>
					<div class="ig-value"><a
						(click)="linkClick.emit({objectType: 'user-information', objectUid: assignmentByVersion?.UpdatedByUid })">{{ assignmentByVersion?.UpdatedBy }}</a>
					</div>
				</div>
			</div>
		</div>
	</ig-property-group>
</div>
<pre style="white-space: pre-wrap">{{ assignmentByVersion | json }}</pre>
