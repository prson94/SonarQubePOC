<ng-container>
	<d3s-assignment-header></d3s-assignment-header>
</ng-container>
<div class="row">
	<as-split unit="pixel"
			  direction="horizontal"
			  [gutterSize]="sidePanelService.draggableAreaWidth"
			  class="col s12 split"
			  style="display: flex"
			  [class.side-panel-close]="!sidePanelOpen"
			  (dragEnd)="onSidePanelDragEnd(sidePanelStorageKey, $event)">
		<as-split-area class="tile tile-detail main-panel">
			<d3s-by-workflow-version-grid #assignmentGridComponent
										  (selectionChange)="selectedAssignmentByVersion = $event"
			></d3s-by-workflow-version-grid>
			<ng-container *ngIf="sidePanelOpen && secondarySidePanelOpen">
				<div class="secondary-side-panel">
					<side-panel [(expanded)]="secondarySidePanelOpen"
								[(selectedPanel)]="secondarySidePanelTab"
								[extraButtons]="secondarySidePanelButtons"
								closeIcon="fa-times"
								[setMinMaxWidth]="false"
								[hasDetail]="false">
						<ng-container *ngIf="secondarySidePanelTab === 'pendingAssignments'">
							<d3s-pending-assignments-step [versionStepId]=versionStepId>
							</d3s-pending-assignments-step>
						</ng-container>
						<ng-container *ngIf="secondarySidePanelTab === 'information'">
							<d3s-step-information [selectedNode]="selectedNode"></d3s-step-information>
						</ng-container>
					</side-panel>
				</div>
			</ng-container>
		</as-split-area>
		<as-split-area [size]="getSidePanelWidth()"
					   [minSize]="getSidePanelMinWidth()"
					   [maxSize]="getSidePanelMaxWidth()"
					   class="tile tile-detail side-panel"
					   *ngIf="showSidePanel">
			<side-panel [(expanded)]="sidePanelOpen"
						[storageKey]="sidePanelStorageKey"
						[selectedItem]="selectedAssignmentByVersion?.[0]"
						[selectedItemsCount]="selectedAssignmentByVersion?.length"
						[extraButtons]="sidePanelButtons"
						[setMinMaxWidth]="false"
						[hasDetail]="false">
				<ng-container *ngIf="sidePanelOpen">
					<d3s-workflow-version-information *ngIf="selectedAssignmentByVersion?.length === 1" (nodeSelection)="nodeSelection($event)"
						[assignmentByVersion]="selectedAssignmentByVersion?.[0]"></d3s-workflow-version-information>
				</ng-container>
			</side-panel>
		</as-split-area>
	</as-split>
</div>
