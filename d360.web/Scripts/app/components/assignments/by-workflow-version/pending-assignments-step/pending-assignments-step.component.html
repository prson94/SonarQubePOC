<d3s-loading [isLoading]="isLoading"></d3s-loading>
<ng-container *ngIf="!isLoading">
	<header>
		&nbsp;
		<d3s-tile-actions *ngIf="!isLoading" [hasExport]="true" (exportClick)="export()" [hasFilterMode]="true"
						  [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
	</header>
	<input type="text" [hidden]="!showSimpleFilter" pInputText size="100"
		   (input)="dt.filterGlobal($event.target.value, 'contains')" i18n-placeholder placeholder="Search..."
		   class="grid-simple-filter">
	<p-table #dt [value]="history" [scrollable]="true" selectionMode="single" [metaKeySelection]="true"
			 [tableStyle]="{'min-width': 'max-content'}"
			 [globalFilterFields]="['Name','Status']" [pageLinks]="3"
			 [paginator]="true" [rows]="5" [rowsPerPageOptions]="defaultPagingOptions">
		<ng-template pTemplate="header">
			<tr>
				<th [pSortableColumn]="'Name'" style="flex: 0 0 100px">
					<ng-container i18n>Associated Asset</ng-container>
					<d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
				</th>
				<th [pSortableColumn]="'Assignments'" style="flex: 0 0 100px">
					<ng-container i18n>Assignee</ng-container>
					<d3s-sortIcon [field]="'Assignments'"></d3s-sortIcon>
				</th>
				<th [pSortableColumn]="'Status'" style="flex: 0 0 80px">
					<ng-container i18n>Status</ng-container>
					<d3s-sortIcon [field]="'Status'"></d3s-sortIcon>
				</th>
				<th class="asset-grid-tools" style="flex: 0 0 30px"></th>
			</tr>
			<tr [hidden]="showSimpleFilter">
				<th>
					<d3s-column-filter [field]="'Name'" [datatype]="'text'"></d3s-column-filter>
				</th>
				<th>
					<d3s-column-filter [field]="'Assignments'" [datatype]="'text'"></d3s-column-filter>
				</th>
				<th>
					<d3s-column-filter [field]="'Status'" [datatype]="'text'"></d3s-column-filter>
				</th>
			</tr>
		</ng-template>
		<ng-template pTemplate="body" let-item>
			<tr [pSelectableRow]="item">
				<td style="flex: 0 0 80px">
					<a *ngIf="item.NgUrl != null">{{item.Name}}</a>
					<span *ngIf="item.NgUrl == null">{{item.Name}}</span>
				</td>
				<td style="flex: 0 0 100px">
					{{ item.Assignments }}
				</td>
				<td style="flex: 0 0 80px">{{item.Status}}</td>
			</tr>
		</ng-template>
		<ng-template pTemplate="summary">
			<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
								  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
		</ng-template>
	</p-table>
</ng-container>
