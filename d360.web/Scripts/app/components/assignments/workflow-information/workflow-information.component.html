<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div class="asset-detail" [hidden]="isLoading">
	<div class="asset-detail-header">
		<div class="asset-name">
			{{ workflowDiagramModel?.Type?.Name }}
		</div>
		<div i18n class="class-name">
			Workflow
		</div>
	</div>
	<d3s-workflow-version-details [workflowTypeUid]="uid" title="General"
								  [workflowTypeVersion]="version"></d3s-workflow-version-details>
	<d3s-workflow-pending-assignments [workflowTypeUid]="uid" title="Diagram" [showCountPanel]="false"
									  [workflowTypeVersion]="version"></d3s-workflow-pending-assignments>
</div>
