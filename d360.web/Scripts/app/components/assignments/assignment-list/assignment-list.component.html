<ng-container *ngIf="showPageHeader">
	<d3s-assignment-header [flowContext]="flowContext"></d3s-assignment-header>
</ng-container>
<div class="row">
	<as-split unit="pixel"
			  direction="horizontal"
			  [gutterSize]="sidePanelService.draggableAreaWidth"
			  class="col s12 split"
			  style="display: flex"
			  [class.side-panel-close]="!sidePanelOpen"
			  (dragEnd)="onSidePanelDragEnd(sidePanelStorageKey, $event)">
		<as-split-area class="tile tile-detail main-panel">
			<d3s-assignment-grid #assignmentGridComponent [isRequestsFlow]="isRequestsFlow" [assetUid]="assetUid"
								 [assetTypeUid]="assetTypeUid"
								 (selectionChange)="workflowSelectionChanged($event)"></d3s-assignment-grid>
			<div class="secondary-side-panel" [hidden]="!sidePanelOpen || !secondarySidePanelOpen"
				 (clickOutside)="closeSecondarySidePanel()">
				<d3s-side-panel-switcher (closeClick)="closeSecondarySidePanel()"
										 (completeAssignment)="onCompleteAssignmentClicked($event)"
										 #sidePanelSwitcherComponent></d3s-side-panel-switcher>
			</div>
		</as-split-area>
		<as-split-area [size]="getSidePanelWidth()"
					   [minSize]="getSidePanelMinWidth()"
					   [maxSize]="getSidePanelMaxWidth()"
					   class="tile tile-detail side-panel"
					   *ngIf="showSidePanel">
			<side-panel [(expanded)]="sidePanelOpen"
						[storageKey]="sidePanelStorageKey"
						[(selectedPanel)]="sidePanelTab"
						[multipleItemsSelected]="selectedWorkflowItems?.length > 1 && (isRequestsFlow || !isAdmin)"
						[selectedItem]="selectedWorkflowItems?.[0]"
						[selectedItemsCount]="selectedWorkflowItems?.length"
						[extraButtons]="selectedWorkflowItems?.length > 1 && isAdmin && !isRequestsFlow  ? sidePanelMultiSelectButtons : sidePanelButtons"
						[setMinMaxWidth]="false"
						[hasDetail]="false">
				<ng-container *ngIf="sidePanelOpen">
					<d3s-assignment-information [workflowItemUid]="selectedWorkflowItems?.[0]?.workflowItemUid"
												[workflowTypeVersion]="selectedWorkflowItems?.[0].Version"
												*ngIf="selectedWorkflowItems?.length === 1"
												[showCompleteAssignment]="!isRequestsFlow"
												(completeAssignment)="completeAssignmentComponent.openModal($event)"
												[hidden]="sidePanelTab !== 'information'"></d3s-assignment-information>
					<d3s-assignment-progress [workflowItemUid]="selectedWorkflowItems?.[0]?.workflowItemUid"
											 [workflowUid]="selectedWorkflowItems?.[0]?.workflowUid"
											 [workflowTypeVersion]="selectedWorkflowItems?.[0].Version"
											 *ngIf="selectedWorkflowItems?.length === 1"
											 [showCompleteAssignment]="!isRequestsFlow"
											 (stepClickChange)="stepClicked($event)"
											 (completeAssignment)="completeAssignmentComponent.openModal($event)"
											 [hidden]="sidePanelTab !== 'progress'"></d3s-assignment-progress>
					<d3s-assignment-multi-delete
						*ngIf="isAdmin && !isRequestsFlow && (selectedWorkflowItems?.length > 1)"
						(confirmDelete)="deleteAssignments($event)">
					</d3s-assignment-multi-delete>
				</ng-container>
			</side-panel>
		</as-split-area>
	</as-split>
</div>
<d3s-complete-assignment *ngIf="!isRequestsFlow" (onModalClose)="onCompleteAssignmentModalClose($event)"
						 #completeAssignmentComponent></d3s-complete-assignment>
