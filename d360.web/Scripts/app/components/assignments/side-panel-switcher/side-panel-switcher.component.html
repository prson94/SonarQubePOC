<div *ngIf="showPanelHeader" class="panel-header switcher-header">
	<span class="header-label" i18n>{{ panelHeader }}</span>
	<div class="button-container">
		<button igButton
				[attr.data-cy]="'Assignments_Secondary_Close'"
				icon="fa-times"
				(click)="closeClick.emit()"
				tooltip="Close"
				class="close-button"></button>
	</div>
</div>
<div class="details-container">
	<div>
		<ng-container *ngIf="sidePanelTab === 'dataprofile' && selection?.HasProfiling">
			<data-profile [dataProfile]="dataProfile" [assetData]="selection"></data-profile>
		</ng-container>
		<ng-container *ngIf="sidePanelTab === 'detail'">
			<ig-asset-detail *ngIf="!selectedReferenceItem && !selectedTag"
							 #assetDetail
							 [objectUID]="selectedAsset ? selectedAsset.uid : selection?.AssetUid"
							 [objectID]="selectedAsset && selectedAsset.id ? selectedAsset.id : null"
							 [objectType]="selectedAsset ? selectedAsset.type : 'Artifact'"
							 [useAccordion]="true"
							 [shouldBePadded]="false"
							 [showHeader]="true"
							 [showHeaderLine]="false"
							 [spacerHeight]="'16px'"
							 [tooltipAlign]="'left'"
							 [isSidePanel]="true"
							 [hasEditLink]="true"
							 [hasAddRelationshipsPermissions]="false"
							 [hasModifyRelationshipsPermissions]="false"
							 [hasDeleteRelationshipsPermissions]="false"
							 [interceptLinkClick]="true"
							 (onEditClick)="assetGrid.triggerEdit($event)"></ig-asset-detail>

			<ng-container *ngIf="selectedReferenceItem">
				<ig-asset-type-detail [uid]="selectedReferenceItem.uid"
									  [highlightUid]="selectedReferenceItem.assetUid"
									  [baseUrl]="selectedReferenceItem.url">
				</ig-asset-type-detail>
			</ng-container>
			<ng-container *ngIf="selectedTag">
				<ig-tagged-assets-detail [uid]="selectedTag.uid"></ig-tagged-assets-detail>
			</ng-container>
		</ng-container>
		<ng-container
			*ngIf="sidePanelTab === AssetDetailClickType.WorkflowStep && selectedAsset?.workflowItemUid && selectedAsset?.itemStepUid">
			<d3s-assignment-progress-step-details [showCompleteAssignment]="selectedAsset.showCompleteAssignment"
				[workflowItemUId]="selectedAsset.workflowItemUid" (completeAssignment)="completeAssignmentComponent.openModal($event)"
				[itemStepUid]="selectedAsset.itemStepUid"></d3s-assignment-progress-step-details>
			<d3s-complete-assignment #completeAssignmentComponent></d3s-complete-assignment>
		</ng-container>
		<ng-container
			*ngIf="sidePanelTab==AssetDetailClickType.WorkflowTypeInformation && selectedAsset?.workflowTypeUid && selectedAsset?.workflowTypeVersion">
			<d3s-workflow-information [shouldBePadded]="true"
									  [showHeaderLine]="false"
									  [isSidePanel]="true"
									  [interceptLinkClick]="true"
									  [workflowTypeUid]="selectedAsset.workflowTypeUid"
									  [workflowTypeVersion]="selectedAsset.workflowTypeVersion"></d3s-workflow-information>
		</ng-container>
		<ng-container
			*ngIf="sidePanelTab==AssetDetailClickType.WorkflowItemInformation && selectedAsset?.workflowItemUid && selectedAsset?.workflowTypeVersion">
			<d3s-assignment-information [workflowItemUid]="selectedAsset.workflowItemUid"
										[workflowTypeVersion]="selectedAsset.workflowTypeVersion"></d3s-assignment-information>
		</ng-container>
	</div>
</div>
