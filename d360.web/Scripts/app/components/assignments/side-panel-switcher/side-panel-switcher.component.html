<div *ngIf="showPanelHeader" class="panel-header switcher-header">
	<span class="header-label" i18n>{{ panelHeader }}</span>
	<div class="button-container">
		<button igButton
				[attr.data-cy]="'Assignments_Secondary_Close'"
				icon="fa-times"
				(click)="closeClick.emit()"
				tooltip="Close"
				class="close-button"></button>
	</div>
</div>
<div class="details-container">
	<div>
		<ng-container *ngIf="_sidePanelTab === 'dataprofile' && selection?.HasProfiling">
			<data-profile [dataProfile]="dataProfile" [assetData]="selection"></data-profile>
		</ng-container>
		<ng-container *ngIf="_sidePanelTab === 'detail'">
			<ig-asset-detail *ngIf="!selectedReferenceItem && !selectedTag"
							 #assetDetail
							 [objectUID]="_selectedAsset ? _selectedAsset.uid : selection?.AssetUid"
							 [objectID]="_selectedAsset && _selectedAsset.id ? _selectedAsset.id : null"
							 [objectType]="_selectedAsset ? _selectedAsset.type : 'Artifact'"
							 [useAccordion]="true"
							 [shouldBePadded]="false"
							 [showHeader]="true"
							 [showHeaderLine]="false"
							 [spacerHeight]="'16px'"
							 [tooltipAlign]="'left'"
							 [isSidePanel]="true"
							 [hasEditLink]="false"
							 [hasOpenLink]="outsideModal"
							 [hasAddRelationshipsPermissions]="false"
							 [hasModifyRelationshipsPermissions]="false"
							 [hasDeleteRelationshipsPermissions]="false"
							 [interceptLinkClick]="true"
							 (onEditClick)="assetGrid.triggerEdit($event)"></ig-asset-detail>

			<ng-container *ngIf="selectedReferenceItem">
				<ig-asset-type-detail [uid]="selectedReferenceItem.uid"
									  [highlightUid]="selectedReferenceItem.assetUid"
									  [baseUrl]="selectedReferenceItem.url">
				</ig-asset-type-detail>
			</ng-container>
			<ng-container *ngIf="selectedTag">
				<ig-tagged-assets-detail [uid]="selectedTag.uid"></ig-tagged-assets-detail>
			</ng-container>
		</ng-container>
		<ng-container
			*ngIf="_sidePanelTab === AssetDetailClickType.WorkflowStep && _selectedAsset?.workflowItemUid && _selectedAsset?.itemStepUid">
			<d3s-assignment-progress-step-details [showCompleteAssignment]="_selectedAsset.showCompleteAssignment"
												  [workflowItemUId]="_selectedAsset.workflowItemUid"
												  (completeAssignment)="completeAssignmentComponent.openModal($event)"
												  [itemStepUid]="_selectedAsset.itemStepUid"></d3s-assignment-progress-step-details>
			<d3s-complete-assignment #completeAssignmentComponent></d3s-complete-assignment>
		</ng-container>
		<ng-container
			*ngIf="_sidePanelTab === AssetDetailClickType.WorkflowRequestInformation && _selectedAsset && _selectedAsset.workflowItemUid
				&& _selectedAsset.itemStepUid && _selectedAsset.workflowActionUid">
			<d3s-assignment-information-request [showSubmittedByData]="true"
												[workflowActionUid]="_selectedAsset.workflowActionUid"
												[stepUid]="_selectedAsset.itemStepUid"
												[workflowItemUid]="_selectedAsset.workflowItemUid">
			</d3s-assignment-information-request>
		</ng-container>
		<ng-container
			*ngIf="_sidePanelTab==AssetDetailClickType.WorkflowTypeInformation && _selectedAsset?.workflowTypeUid && _selectedAsset?.workflowTypeVersion">
			<d3s-workflow-information [shouldBePadded]="true"
									  [showHeaderLine]="false"
									  [isSidePanel]="true"
									  [interceptLinkClick]="true"
									  [workflowTypeUid]="_selectedAsset.workflowTypeUid"
									  [workflowTypeVersion]="_selectedAsset.workflowTypeVersion"></d3s-workflow-information>
		</ng-container>
		<ng-container
			*ngIf="_sidePanelTab==AssetDetailClickType.WorkflowItemInformation && _selectedAsset?.workflowItemUid && _selectedAsset?.workflowTypeVersion">
			<d3s-assignment-information [workflowItemUid]="_selectedAsset.workflowItemUid"
										[workflowTypeVersion]="_selectedAsset.workflowTypeVersion"></d3s-assignment-information>
		</ng-container>
	</div>
</div>
