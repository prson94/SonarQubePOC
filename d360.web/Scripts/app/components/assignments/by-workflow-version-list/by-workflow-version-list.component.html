<ng-container>
	<d3s-assignment-header></d3s-assignment-header>
</ng-container>
<div class="row">
	<as-split unit="pixel"
			  direction="horizontal"
			  [gutterSize]="sidePanelService.draggableAreaWidth"
			  class="col s12 split"
			  style="display: flex"
			  [class.side-panel-close]="!sidePanelOpen"
			  (dragEnd)="onSidePanelDragEnd(sidePanelStorageKey, $event)">
		<as-split-area class="tile tile-detail main-panel">
			<d3s-by-workflow-version-grid #assignmentGridComponent
										  (selectionChange)="selectedAssignmentVersionItems = $event"
			></d3s-by-workflow-version-grid>
			<div class="secondary-side-panel" [hidden]="!sidePanelOpen || !secondarySidePanelOpen"
				 (clickOutside)="closeSecondarySidePanel()">
				<d3s-side-panel-switcher [hidden]="secondarySidePanelTab !== ''"
										 (closeClick)="closeSecondarySidePanel()"
										 #sidePanelSwitcherComponent></d3s-side-panel-switcher>
				<side-panel [hidden]="secondarySidePanelTab === ''" [(expanded)]="secondarySidePanelOpen"
							[(selectedPanel)]="secondarySidePanelTab"
							[extraButtons]="secondarySidePanelButtons"
							closeIcon="fa-times"
							[selectedItemsCount]="selectedAssignmentVersionItems?.length"
							[selectedItem]="selectedAssignmentVersionItems"
							[multipleItemsSelected]="selectedAssignmentVersionItems?.length > 1"
							[isSecondarySidePanel]="true"
							[setMinMaxWidth]="false"
							[hasDetail]="false">
					<ng-container *ngIf="secondarySidePanelTab === 'pendingAssignments'">
						<d3s-pending-assignments-step [versionStepId]="+selectedNodeModel?.key"
													  [workflowTypeVersion]="workflowTypeVersion"
													  [workflowTypeUid]="workflowTypeUid">
						</d3s-pending-assignments-step>
					</ng-container>
					<ng-container *ngIf="secondarySidePanelTab === 'information'">
						<d3s-step-information
							[selectedNode]="selectedNodeModel"
							[workflowTypeVersion]="workflowTypeVersion"
							[workflowTypeUid]="workflowTypeUid"></d3s-step-information>
					</ng-container>
				</side-panel>
			</div>
		</as-split-area>
		<as-split-area [size]="getSidePanelWidth()"
					   [minSize]="getSidePanelMinWidth()"
					   [maxSize]="getSidePanelMaxWidth()"
					   class="tile tile-detail side-panel"
					   *ngIf="showSidePanel">
			<side-panel [(expanded)]="sidePanelOpen"
						[storageKey]="sidePanelStorageKey"
						[selectedItem]="selectedAssignmentVersionItems?.[0]"
						[selectedItemsCount]="selectedAssignmentVersionItems?.length"
						[extraButtons]="sidePanelButtons"
						[setMinMaxWidth]="false"
						[hasDetail]="false">
				<ng-container *ngIf="sidePanelOpen">
					<d3s-workflow-version-information *ngIf="selectedAssignmentVersionItems?.length === 1"
													  [workflowTypeUid]="selectedAssignmentVersionItems?.[0].WorkflowTypeUid"
													  [workflowTypeVersion]="selectedAssignmentVersionItems?.[0].Version"></d3s-workflow-version-information>
				</ng-container>
			</side-panel>
		</as-split-area>
	</as-split>
</div>
