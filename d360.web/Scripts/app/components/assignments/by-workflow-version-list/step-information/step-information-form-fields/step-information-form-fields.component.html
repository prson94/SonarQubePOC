<ng-container
	*ngIf="selectedNode.fields?.form?.field?.length > 0; else none">
	<p-table #dt
			 [value]="selectedNode.fields.form.field"
			 selectionMode="single"
			 [metaKeySelection]="true">
		<ng-template pTemplate="header">
			<tr>
				<th i18n>Label</th>
				<th i18n>Type</th>
				<th i18n>Required?</th>
			</tr>
		</ng-template>
		<ng-template pTemplate="body"
					 let-item>
			<tr [pSelectableRow]="item">
				<td>{{item['@label']}}</td>
				<td>
					{{item['@type']}}
				</td>
				<td>
					<i *ngIf="(item['@required']=='true'|| item['@required']==true || (item['@type']=='boolean')); else elseBlock"
					   class="fa fa-check enabled" title="True"></i>
					<ng-template #elseBlock><i class="fa fa-times disabled" title="False"></i></ng-template>
				</td>
			</tr>
		</ng-template>
	</p-table>
</ng-container>
<ng-template #none>
	<div i18n>
		No form inputs defined
	</div>
</ng-template>
