<div class="row">
	<div class="col s12">
		<p-table #dt [value]="outputs" selectionMode="single" [metaKeySelection]="true" [pageLinks]="3"
				 [paginator]="true" [rows]="10">
			<ng-template pTemplate="header">
				<tr>
					<th [pSortableColumn]="'Name'">
						<ng-container i18n>Name</ng-container>
						<d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
					</th>
					<th [pSortableColumn]="'Path'">
						<ng-container i18n>Path</ng-container>
						<d3s-sortIcon [field]="'Path'"></d3s-sortIcon>
					</th>
					<th [pSortableColumn]="'Value'">
						<ng-container i18n>Value</ng-container>
						<d3s-sortIcon [field]="'Value'"></d3s-sortIcon>
					</th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-item>
				<tr [pSelectableRow]="item">
					<td>{{item.Name}}</td>
					<td>{{item.Path}}</td>
					<td>{{item.Value}}</td>
				</tr>
			</ng-template>
			<ng-template *ngIf="dt.totalRecords" pTemplate="summary">
				<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
									  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
			</ng-template>
		</p-table>
	</div>
</div>
