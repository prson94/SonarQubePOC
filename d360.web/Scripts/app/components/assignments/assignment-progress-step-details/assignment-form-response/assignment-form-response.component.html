<d3s-modal [title]="'Form Responses'"
		   [subtitle]="step?.Name"
		   [isVisible]="isModalVisible"
		   [showActionBar]="true"
		   [showConfirm]="false"
		   cancelButtonLabel="Close"
		   [additionalClasses]="'medium-dialog'"
		   (onClose)="isModalVisible = false">
	<div *ngIf="step" class="content">
		<ig-property-group i18n-title title="Information" [shouldBePadded]="false" [showHeaderLine]="false">
			<div class="information" *ngIf="step.Fields?.form" readonly>
				<label class="ig-label">{{ step.Fields.form["@title"] }}</label>
				<span class="ig-value ig-html ql-editor no-padding" [innerHTML]="step.Fields.form['@description']"></span>
			</div>
		</ig-property-group>
		<ng-container *ngFor="let response of step.ItemFields?.form;index as i">
			<ig-property-group i18n-title title="{{ 'Response ' + (i+1) + ' by ' + response.resourceName}}"
							   [shouldBePadded]="false"
							   [showHeaderLine]="false">
				<div class="fields" readonly *ngFor="let field of response?.field">
					<label class="ig-label">{{ field?.["@label"] }}</label>
					<ng-container [ngSwitch]="field?.['@fieldtype']">
						<ng-container *ngSwitchCase="'date'">
							<span class="ig-value"
								  *ngIf="field?.['@displayvalue'] || field?.['@value']; else valueUnavailable">{{(field?.['@displayvalue'] == null ? getDate(field?.['@value']) : getDate(field?.['@displayvalue']))}}</span>
						</ng-container>
						<ng-container *ngSwitchCase="'html'">
							<div class="ig-value" *ngIf="field?.['@value']; else valueUnavailable"
								 [innerHtml]="field?.['@value'] | safeHtml"></div>
						</ng-container>
						<ng-container *ngSwitchCase="'link'">
							<a class="ig-value" *ngIf="field?.['@value']; else valueUnavailable"
							   href="{{getUrl(field?.['@value'])}}" target="_blank">{{getName(field?.['@value'])}}</a>
						</ng-container>
						<ng-container *ngSwitchDefault>
							<span class="ig-value"
								  *ngIf="field?.['@displayvalue'] || field?.['@value']; else valueUnavailable">{{(field?.['@displayvalue'] == null ? field?.['@value'] : field?.['@displayvalue'])}}</span>
						</ng-container>
					</ng-container>
				</div>
			</ig-property-group>
		</ng-container>
	</div>
</d3s-modal>
<ng-template #valueUnavailable>
	<span class="ig-value">---</span>
</ng-template>
