<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading && step != null" class="asset-detail">
	<div class="asset-detail-header">
		<div i18n class="asset-name">
			{{ step.Name }}
		</div>
		<div i18n class="class-name">
			Step
		</div>
	</div>
	<div class="asset-detail-tabs">
		<ig-property-group title="General" [shouldBePadded]="false" [showHeaderLine]="false">
			<div readonly>
				<div class="row">
					<label class="ig-label" i18n>Activity Type</label>
					<div i18n class="ig-value">{{ activityType }}</div>
				</div>
				<div class="row">
					<label class="ig-label" i18n>Status</label>
					<div i18n class="ig-value">{{ step.CompletedOn ? 'Closed' : 'Pending' }}</div>
				</div>
				<div class="row">
					<label class="ig-label" i18n>Started</label>
					<div class="ig-value">{{ step.StartedOn | date: 'short' }}</div>
				</div>
				<div *ngIf="step.CompletedOn" class="row">
					<label class="ig-label" i18n>Finished</label>
					<div class="ig-value">{{ step.CompletedOn | date: 'short' }}</div>
				</div>
			</div>
		</ig-property-group>
	</div>
</div>
