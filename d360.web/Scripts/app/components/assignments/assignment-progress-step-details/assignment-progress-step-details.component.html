<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading && step != null" class="asset-detail">
	<div class="asset-detail-header">
		<div i18n class="asset-name">
			{{ step.Name }}
		</div>
		<div i18n class="class-name">
			Step
		</div>
	</div>
	<div class="asset-detail-tabs">
		<ig-property-group title="General" [shouldBePadded]="false" [showHeaderLine]="false">
			<div readonly>
				<div class="row">
					<label class="ig-label" i18n>Activity Type</label>
					<div i18n class="ig-value">{{ activityType }}</div>
				</div>
				<div class="row">
					<label class="ig-label" i18n>Status</label>
					<div i18n class="ig-value">{{ step.CompletedOn ? 'Closed' : 'Pending' }}</div>
				</div>
				<div class="row">
					<label class="ig-label" i18n>Started</label>
					<div class="ig-value">{{ step.StartedOn | date: 'short' }}</div>
				</div>
				<div *ngIf="step.CompletedOn" class="row">
					<label class="ig-label" i18n>Finished</label>
					<div class="ig-value">{{ step.CompletedOn | date: 'short' }}</div>
				</div>
			</div>
		</ig-property-group>
		<ig-property-group *ngIf="step.ActivityType !== 0" title="Details" [shouldBePadded]="false" [showHeaderLine]="false">
			<div readonly>
				<ng-container [ngSwitch]="step.ActivityType">
					<ng-container *ngSwitchCase="WorkflowActivityType.FieldChange">
						<d3s-assignment-step-field-change-details
							[fieldChanges]="step.FieldChanges"></d3s-assignment-step-field-change-details>
					</ng-container>
					<ng-container *ngSwitchCase="WorkflowActivityType.EmailNotification">
						<d3s-assignment-step-email-details [step]="step"></d3s-assignment-step-email-details>
					</ng-container>
					<ng-container *ngSwitchCase="WorkflowActivityType.HTTPRequest">
						<d3s-assignment-step-http-details [step]="step"></d3s-assignment-step-http-details>
					</ng-container>
					<ng-container *ngSwitchCase="WorkflowActivityType.HTTPResponse">
						<div class="row">
							<label class="ig-label" i18n>HTTP Request</label>
							<div class="ig-value"></div>
						</div>
					</ng-container>
					<ng-container *ngSwitchCase="WorkflowActivityType.RelationshipUpdate">
						<d3s-assignment-step-relationship-change-details [relationshipChange]="step.RelationshipChange">
						</d3s-assignment-step-relationship-change-details>
					</ng-container>
				</ng-container>
			</div>
		</ig-property-group>
		<ig-property-group *ngIf="step.ActivityType === WorkflowActivityType.HTTPResponse" title="Outputs"
						   [shouldBePadded]="false" [showHeaderLine]="false">
			<d3s-assignment-step-http-response-details [step]="step"></d3s-assignment-step-http-response-details>
		</ig-property-group>
	</div>
</div>
