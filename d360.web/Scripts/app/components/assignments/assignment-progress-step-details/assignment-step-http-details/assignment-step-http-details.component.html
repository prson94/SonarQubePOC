<div readonly>

		<label class="ig-label" i18n>Method</label>
		<div i18n class="ig-value">{{step?.Settings?.HTTPRequest?.Method}}</div>
	</div>
	<div class="row">
		<label class="ig-label" i18n>URL</label>
		<div i18n class="ig-value">{{step?.Settings?.HTTPRequest?.Url}}</div>
	</div>
	<div class="row">
		<label class="ig-label" i18n>Request Timeout</label>
		<div i18n class="ig-value">{{step?.Settings?.HTTPRequest?.Timeout}}</div>
