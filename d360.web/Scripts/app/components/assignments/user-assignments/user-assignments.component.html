<div class="user-assignments tile tile-detail">
	<div class="user-assignments-header">
		<h3 i18n><b>My Assignments</b></h3>		
	</div>
	<div class="table-wrapper">
		<p-table #dt
				 [loading]="isLoading"
				 [tableStyle]="{'min-width': 'max-content'}"
				 loadingIcon="fa fa-spinner"
				 [value]="assignments"
				 selectionMode="multiple"
				 [metaKeySelection]="true"
				 [first]="(currentPageNumber-1) * rowsPerPage"
				 [totalRecords]="totalRecords"
				 [scrollable]="true"
				 [pageLinks]="3"
				 [paginator]="true"
				 [loadingIcon]="'fa fa-spinner fa-spin'"
				 [scrollHeight]="'calc(100vh - 353px)'"
				 sortField="workflowName" [sortOrder]="1"
				 [rows]="rowsPerPage"
				 [rowsPerPageOptions]="defaultPagingOptions"
				 [lazy]="true"
				 (onPage)="setRowsPerPage($event)"
				 (onLazyLoad)="loadWorkflowAssignmentItems($event)">
			<ng-template pTemplate="header">
				<tr>
					<th [pSortableColumn]="'workflowName'" class="workflow-name-column">
						<ng-container i18n>Workflow Name</ng-container>
						<d3s-sortIcon [field]="'workflowName'"></d3s-sortIcon>
					</th>
					<th [pSortableColumn]="'stepName'" class="step-name-column">
						<ng-container i18n>Step</ng-container>
						<d3s-sortIcon [field]="'stepName'"></d3s-sortIcon>
					</th>
					<th [pSortableColumn]="'associatedWith'" class="associated-with-column">
						<ng-container i18n>Associated with</ng-container>
						<d3s-sortIcon [field]="'associatedWith'"></d3s-sortIcon>
					</th>
					<th [pSortableColumn]="'count'" class="count-column">
						<ng-container i18n>Count</ng-container>
						<d3s-sortIcon [field]="'count'"></d3s-sortIcon>
					</th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-item>
				<tr [pSelectableRow]="item" class="assignments-table-data">
					<td>
						<ng-container *ngIf="isMe || onlyAdminReassignMode">
							<a href="#" (click)="onItemClick($event, item)">
								{{item.WorkflowName}}
							</a>
						</ng-container>
						<ng-container *ngIf="!isMe && !onlyAdminReassignMode">
							{{item.WorkflowName}}
						</ng-container>
						<span *ngIf="item.Version > 1" class="light-text">version {{item.Version}}</span>
					</td>
					<td>{{item.StepName}}</td>
					<td>{{item.AssociatedWith ?? '---'}}</td>
					<td class="count-column">
						<ig-badge [text]="item.Count"></ig-badge>
					</td>
				</tr>
			</ng-template>
			<ng-template pTemplate="emptymessage">
				<p i18n>No assignments found</p>
			</ng-template>
			<ng-template pTemplate="summary">
				<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
									  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
			</ng-template>
		</p-table>
	</div>
</div>

<d3s-complete-assignment #completeAssignmentComponent (onModalClose)="onCompleteAssignmentModalClose($event)"
						 [workflowName]="workflowTypeName"
						 ></d3s-complete-assignment>

<d3s-assignments-multi-picker #multiAssignComponent (onModalClose)="onAssignmentMultiPickerClose()"							  
							  [isCurrentUser]="isMe"
							  (onAssignmentSelection)="onAssignmentSelection($event)"></d3s-assignments-multi-picker>

<d3s-modal [title]="errorModalTitle"
		   additionalClasses="modal-dyn-editor medium-dialog"
		   [subtitle]="errorSubTitle"
		   (onClose)="modalVisible=false"
		   [isVisible]="modalVisible">
	<div prompt>
		<div class="content">
			<div class="row">
				{{errorModalMessage}}
			</div>
		</div>
	</div>
	<div class="action-bar">
		<div class="grow"></div>
		<button igButton type="button" class="ig-button-secondary" i18n-label label="Close"
				(click)="modalVisible=false"></button>&nbsp;&nbsp;
	</div>
</d3s-modal>
