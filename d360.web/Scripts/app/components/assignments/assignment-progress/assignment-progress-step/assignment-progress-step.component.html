<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div class="assignment-progress-step" [class.selected]="selected" [hidden]="isLoading" role="button"
	 [class.assignment-progress-step-with-button]="isCompleteAssignmentVisible"
	 tabindex="0" (click)="toggleStepDetails($event)">
	<div class="row display-flex">
		<div class="col flex-grow-1">
			<div class="col no-padding">
				<i class="fa spacing-top" [ngClass]="icon"></i>
			</div>
			<div class="col">
				<div class="header-text" i18n>{{ header }}</div>
				<div class="row" *ngIf="!assignmentItemStep.CompletedOn && message">
					<div class="preserve-line-break ig-light-grey-text" i18n>{{message}}</div>
				</div>
			</div>
		</div>
		<div class="col right-align" [class.ig-light-grey-text]="assignmentItemStep.CompletedOn" i18n>
			{{ status }}
		</div>
	</div>
</div>
<button igButton type="button"
		*ngIf="isCompleteAssignmentVisible"
		class="ig-button-primary complete-assignment"
		(click)="completeAssignmentClick()"
>
	<span i18n>Awaiting your answer</span>
	<span>
		<b i18n>Complete the Assignment</b>&nbsp;&nbsp;<span class="fa fa-pencil"></span>
	</span>
</button>
<span class="fa fa-caret-down position-center" *ngIf="!isLastStep"></span>
