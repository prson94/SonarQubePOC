<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div class="asset-detail-tabs" [hidden]="isLoading">
	<ig-property-group title="Steps" [shouldBePadded]="false" [showHeaderLine]="false">
		<div readonly>
			<d3s-assignment-progress-step *ngFor="let assignmentItemStep of assignmentItemSteps" [workflowItemUid]="workflowItemUid"
										  [assignmentItemStep]="assignmentItemStep" [showCompleteAssignment]="showCompleteAssignment"
										  (stepClickChange)="stepSelectionChanged(assignmentItemStep)"
										  (completeAssignment)="completeAssignment.emit($event)"
										  [isLastStep]="assignmentItemSteps.indexOf(assignmentItemStep) === (assignmentItemSteps.length - 1)"
			></d3s-assignment-progress-step>
		</div>
	</ig-property-group>
</div>
<div class="space-around">
	<a (click)="linkClick.emit({ objectType: 'workflow-information', objectUid: workflowUid })"
	   i18n>Show Workflow Diagram and Details</a>
</div>
