<div *ngFor="let field of fields; let indx = index" class="row">
	<div [ngSwitch]="field.FieldType" class="col s12">
		<div class="FieldName" [innerHtml]="field.Label"></div>
		<input
			igInput
			[name]="'input_' + indx"
			*ngSwitchCase="fieldType.Text"
			style="width: 100%"
			type="text"
			[(ngModel)]="field.Value"
			required="{{field.Required}}"
		/>
		<span *ngSwitchCase="fieldType.Boolean">
			<p-radioButton
				igRadioButton
				[name]="'input_' + indx"
				[(ngModel)]="field.Value"
				value="true"
				label="Yes"
				required="{{field.Required}}"
			></p-radioButton>
			&nbsp;&nbsp;
			<p-radioButton
				igRadioButton
				[name]="'input_' + indx"
				[(ngModel)]="field.Value"
				value="false"
				label="No"
				required="{{field.Required}}"
			></p-radioButton>
		</span>

		<input
			igInput
			*ngSwitchCase="fieldType.Integer"
			[name]="'input_' + indx"
			style="width: 100%"
			type="number"
			[(ngModel)]="field.Value"
			required="{{field.Required}}"
		/>
		<textarea
			igTextArea
			*ngSwitchCase="fieldType.TextArea"
			[name]="'input_' + indx"
			style="width: 100%"
			[(ngModel)]="field.Value"
			required="{{field.Required}}"
		></textarea>
		<p-calendar
			*ngSwitchCase="fieldType.Date"
			[(ngModel)]="field.Value"
			[name]="'input_' + indx"
			appendTo="body"
			baseZIndex="20000"
			required="{{field.Required}}"
		></p-calendar>
		<div *ngSwitchCase="fieldType.List">
			<p-dropdown
				*ngIf="!field.AllowMultipleValues"
				[name]="'input_' + indx"
				[options]="field.Values"
				[style]="{'width':'100%'}"
				appendTo="body"
				baseZIndex="20000"
				[(ngModel)]="field.Value"
				required="{{ field.Required }}"
				[filter]="true"
				filterBy="Text"
				placeholder="Select {{field.Label}}"
			>
				<ng-template pTemplate="item" let-item>
					{{ item.Text }}
				</ng-template>
				<ng-template pTemplate="selectedItem" let-item>
					{{ item.Text }}
				</ng-template>
			</p-dropdown>
			<p-multiSelect
				*ngIf="field.AllowMultipleValues"
				[name]="'input_' + indx"
				appendTo="body"
				baseZIndex="20000"
				[options]="field.Values | dropdownItemToSelectItemPipe"
				[(ngModel)]="field.Value"
				[style]="{'width':'100%'}"
				[panelStyle]="{'width':'100%'}"
				required="{{ field.Required }}">
			</p-multiSelect>
		</div>
		<div *ngSwitchCase="fieldType.RelationshipType">
			<p-dropdown
				*ngIf="!field.AllowMultipleValues"
				[name]="'input_' + indx"
				[options]="field.Values"
				[style]="{'width':'100%'}"
				appendTo="body"
				baseZIndex="20000"
				[(ngModel)]="field.Value"
				required="{{ field.Required }}"
				[filter]="true"
				filterBy="Text"
				placeholder="Select {{field.Label}}"
			>
				<ng-template pTemplate="item" let-item>
					{{ item.Text }}
				</ng-template>
				<ng-template pTemplate="selectedItem" let-item>
					{{ item.Text }}
				</ng-template>
			</p-dropdown>
			<p-multiSelect
				*ngIf="field.AllowMultipleValues"
				[name]="'input_' + indx"
				appendTo="body"
				baseZIndex="20000"
				[options]="field.Values | dropdownItemToSelectItemPipe"
				[(ngModel)]="field.Value"
				[style]="{'width':'100%'}"
				[panelStyle]="{'width':'100%'}"
				required="{{ field.Required }}">
			</p-multiSelect>
		</div>
		<div *ngSwitchCase="fieldType.Link">
			<input
				igInput
				[name]="'inputName_' + indx"
				ngModel
				style="width: 100%"
				type="text"
				required="{{field.Required}}"
			/>
			<div i18n>(Link Name)</div>
			<input
				igInput
				[name]="'inputUrl_' + indx"
				ngModel
				style="width: 100%"
				type="text"
				required="{{field.Required}}"
			/>
			<div i18n>
				(Link Url: Your Url should start with a protocol prefix. For
				example 'http://' or 'https://')
			</div>
		</div>
		<div *ngSwitchCase="fieldType.HTML">
			<p-editor
				[name]="'input_' + indx"
				[(ngModel)]="field.Value"
				[style]="{ height: '150px' }"
				ngDefaultControl
				#ed
				required="{{field.Required}}"
			>
				<header style="padding-bottom: 0px !important">
					<span class="ql-formats">
						<select class="ql-header">
							<option value="1">Heading</option>
							<option value="2">Subheading</option>
							<option selected>Normal</option>
						</select>
						<select class="ql-font">
							<option selected>Sans Serif</option>
							<option value="serif">Serif</option>
							<option value="monospace">Monospace</option>
						</select>
					</span>
					<span class="ql-formats">
						<button class="ql-bold"></button>
						<button class="ql-italic"></button>
						<button class="ql-underline"></button>
					</span>
					<span class="ql-formats">
						<select class="ql-color"></select>
						<select class="ql-background"></select>
					</span>
					<span class="ql-formats">
						<button class="ql-list" value="ordered"></button>
						<button class="ql-list" value="bullet"></button>
						<select class="ql-align">
							<option selected></option>
							<option value="center"></option>
							<option value="right"></option>
							<option value="justify"></option>
						</select>
					</span>
					<span class="ql-formats">
						<button class="ql-link"></button>
						<button class="ql-code-block"></button>
					</span>
					<span class="ql-formats">
						<button class="ql-clean"></button>
					</span>
				</header>
			</p-editor>
		</div>
	</div>
</div>
