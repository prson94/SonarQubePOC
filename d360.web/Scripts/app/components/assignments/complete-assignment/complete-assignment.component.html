<d3s-modal [showTitle]="false" [isVisible]="isModalVisible" [showActionBar]="true" [confirmButtonLabel]="'Submit'"
		   [cancelButtonLabel]="discardForm ? 'Discard Form' : 'Close'" [secondaryButtonDisabled]="!workflowForm?.valid"
		   [discardForm]="discardForm" (onClose)="discardForm ? discardFormFunc() : closeModal()"
		   (onConfirm)="onFormSubmit()"
		   [additionalClasses]="'xlarge-dialog'">
	<d3s-loading [isLoading]="isLoading"></d3s-loading>
	<div *ngIf="!isLoading" class="modal-with-side-panel">
		<div class="modal-dialog-main-panel">
			<div class="content condensed-table">
				<div class="modal-edit-form">
					<div i18n class="title">
						{{ modalTitle }}
						<span class="modal-buttons">
							<button igButton [ngClass]="
									isAssignmentProgressSelected
										? ''
										: 'selected'
								" [icon]="'fa-file-text'" (click)="showAssignment()"
									class="ig-button-secondary side-panel-button"></button>
							<button igButton [icon]="'fa-list-ul'" [ngClass]="
									isAssignmentProgressSelected
										? 'selected'
										: ''
								" (click)="showAssignmentProgress()"
									class="ig-button-secondary side-panel-button"></button>
						</span>
					</div>
				</div>
				<div>{{workflowName}}<span i18n> on </span> <a
					(click)="onClickAsset($event, this.assetId)">{{ assetName }}</a></div>
				<div
					[hidden]="isAssignmentProgressSelected"
					class="scrollable-content details-container"
				>
					<div class="asset-detail">
						<div class="d-flex column" *ngIf="hasObjectReassign">
							<div i18n>What would you like to do?</div>
							<div class="radio-button">
								<p-radioButton igRadioButton value="completeForm" label="Complete the Form"
											   [(ngModel)]="radioSelectionValue">
								</p-radioButton>
							</div>
							<div class="radio-button">
								<p-radioButton igRadioButton value="reassignUser" label="Reassign"
											   [(ngModel)]="radioSelectionValue">
								</p-radioButton>
							</div>
							<div class="radio-button">
								<p-radioButton igRadioButton value="changeAsset" label="Change the Associated Asset"
											   [(ngModel)]="radioSelectionValue">
								</p-radioButton>
							</div>
						</div>
						<div class="asset-detail-tabs">
							<ig-property-group i18n-title title="Information" [showHeaderLine]="false"
											   [shouldBePadded]="false">
								<div readonly>
									<ng-container>
										<div class="row">
											<div class="category-column">
												<label class="ig-label" i18n>{{
													formTitle
													}}</label>
												<div class="ig-value" [innerHTML]="
														formDescription
													"></div>
											</div>
										</div>
									</ng-container>
								</div>
							</ig-property-group>
							<ig-property-group *ngIf="request && request.Action" i18n-title title="Request"
											   [shouldBePadded]="false" [customTemplate]="true" [showHeaderLine]="false"
											   [sideTemplate]="requestSidePanel">
								<ng-template #requestSidePanel>
									<a *ngIf="!sidePanelOpen" (click)="showRequestSidePanel($event)" i18n>Open in side
										panel</a>
									<a *ngIf="sidePanelOpen" (click)="sidePanelOpen = false" i18n>Close side panel</a>
								</ng-template>
								<div readonly>
									<ng-container>
										<d3s-assignment-information-request [showSubmittedByData]="true"
																			[workflowActionUid]="
												request.Action.Uid
											" [stepUid]="stepUid" [workflowItemUid]="workflowItemUid">
										</d3s-assignment-information-request>
									</ng-container>
								</div>
							</ig-property-group>
							<form (ngSubmit)="onFormSubmit()" #workflowForm="ngForm" #form>
								<ng-template #requiredFieldsTemplate>
									<ig-form-feedback-badges class="ig-form-feedback-badges"
															 [igformGroup]="workflowForm.form"
															 [inputContainer]="formElement">
									</ig-form-feedback-badges>
								</ng-template>
								<ig-property-group i18n-title title="Form fields" *ngIf="
										!hasObjectReassign ||
										radioSelectionValue === 'completeForm'
									" [showHeaderLine]="false" [sideTemplate]="requiredFieldsTemplate"
												   [customTemplate]="true"
												   [shouldBePadded]="false">
									<div readonly>
										<div class="row">
											<div class="l6 s12">
												<d3s-complete-assignment-form-fields [fields]="formFields"
																					 [form]="workflowForm"
																					 [formElement]="formElement"
																					 (discardForm)="
														onFormInput($event)
													">
												</d3s-complete-assignment-form-fields>
											</div>
										</div>
									</div>
								</ig-property-group>
							</form>
							<ng-container *ngIf="radioSelectionValue === 'reassignUser'">
								<div class="ig-value">Reassign:</div>
								<input type="text" pInputText size="100" (input)="
										dt.filterGlobal(
											$event.target.value,
											'contains'
										)
									" i18n-placeholder placeholder="Search" class="grid-simple-filter"/>
								<p-table #dt [value]="userData" [rows]="5" [paginator]="true"
										 [globalFilterFields]="['text']" [pageLinks]="3"
										 [(selection)]="tableRadioSelection">
									<ng-template pTemplate="header">
										<tr>
											<th style="width: 4rem"></th>
											<th [pSortableColumn]="'text'">
												<ng-container i18n>Name</ng-container>
												<d3s-sortIcon [field]="'text'"></d3s-sortIcon>
											</th>
										</tr>
									</ng-template>
									<ng-template pTemplate="body" let-item>
										<tr>
											<td>
												<p-tableRadioButton [value]="item"></p-tableRadioButton>
											</td>
											<td>
												<div class="row-data">
													{{ item.FullName }}
													<button igButton icon="fa-info-circle" class="ig-state-focus"
															(click)="
															onClickResource(
																$event,
																item.ResourceID
															)
														">
													</button>
												</div>
											</td>
										</tr>
									</ng-template>
									<ng-template pTemplate="summary">
										<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
															  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
									</ng-template>
								</p-table>
							</ng-container>
							<ng-container *ngIf="radioSelectionValue === 'changeAsset'">
								<div class="ig-value" i18n>
									Choose the new associated asset:
								</div>
								<input type="text" pInputText size="100" (input)="
										dt.filterGlobal(
											$event.target.value,
											'contains'
										)
									" i18n-placeholder placeholder="Search" class="grid-simple-filter"/>
								<p-table #dt [value]="assets" [rows]="5" [paginator]="true"
										 [globalFilterFields]="['Name']" [pageLinks]="3"
										 [(selection)]="tableRadioSelection">
									<ng-template pTemplate="header">
										<tr>
											<th style="width: 4rem"></th>
											<th [pSortableColumn]="'Name'">
												<ng-container i18n>Name</ng-container>
												<d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
											</th>
										</tr>
									</ng-template>
									<ng-template pTemplate="body" let-item>
										<tr>
											<td>
												<p-tableRadioButton [value]="item"></p-tableRadioButton>
											</td>
											<td>
												<div
													class="row-data"
												>
													{{ item.Name }}
													<button igButton icon="fa-info-circle"
															class="ig-state-focus"
															(click)="onClickAsset($event, Number(item.ObjectID))
														"
													></button>
												</div>
											</td>
										</tr>
									</ng-template>
									<ng-template pTemplate="summary">
										<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
															  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
									</ng-template>
								</p-table>
							</ng-container>
						</div>
					</div>
				</div>
				<div [hidden]="!isAssignmentProgressSelected" class="scrollable-content progress-container">
					<d3s-assignment-progress [workflowItemUid]="workflowItemUid" [workflowUid]="workflowTypeUid"
											 [showCompleteAssignment]="false"
											 [workflowTypeVersion]="workflowTypeVersion"
											 (stepClickChange)="stepClickChanged($event)"></d3s-assignment-progress>
					<d3s-assignment-information [showCompleteAssignment]="false" [workflowItemUid]="workflowItemUid">
					</d3s-assignment-information>
				</div>
			</div>
		</div>
		<div class="side-panel">
			<side-panel [(expanded)]="sidePanelOpen" [storageKey]="sidePanelStorageKey" hasDetail="true"
						height="calc(100vh - 220px)">
				<ng-container>
					<d3s-side-panel-switcher [hidden]="!sidePanelOpen" [showPanelHeader]="false"
											 #sidePanelSwitcherComponent></d3s-side-panel-switcher>
				</ng-container>
			</side-panel>
		</div>
	</div>
</d3s-modal>
