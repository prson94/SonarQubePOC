<d3s-modal [showTitle]="false"
		   [isVisible]="isModalVisible"
		   [showActionBar]="true"
		   [additionalClasses]="'xlarge-dialog'"
		   (onClose)="isModalVisible = false"
		   (onConfirm)="onFormSubmit()"
>
	<div class="modal-with-side-panel">
		<div class="modal-dialog-main-panel">
			<div class="content condensed-table">
				<div class="modal-edit-form">
					<div i18n class="title">
						{{ modalTitle }}
						<span class="modal-buttons">
							<button
								igButton
								[ngClass]="isAssignmentProgressSelected ? '' : 'selected'"
								[icon]="'fa-file-text'"
								(click)="showAssignment()"
								class="ig-button-secondary side-panel-button">
							</button>
							<button
								igButton
								[icon]="'fa-list-ul'"
								[ngClass]="isAssignmentProgressSelected ? 'selected' : ''"
								(click)="showAssignmentProgress()"
								class="ig-button-secondary side-panel-button">
							</button>
						</span>
					</div>
				</div>
				<d3s-loading [isLoading]="isLoading"></d3s-loading>
				<ng-container *ngIf="!isLoading">
					<div>subtitle</div>
					<div [hidden]="isAssignmentProgressSelected" class="scrollable-content details-container">
						<div class="asset-detail">
							<div class="asset-detail-tabs">
								<ig-property-group i18n-title title="Information" [showHeaderLine]="false">
									<div readonly>
										<ng-container>
											<div class="row">
												<div class="category-column">
													<label class="ig-label" i18n>{{ formTitle }}</label>
													<div class="ig-value">{{ formDescription }}</div>
												</div>
											</div>
										</ng-container>
									</div>
								</ig-property-group>
								<ig-property-group i18n-title title="Request" [showHeaderLine]="false">
									<div readonly>
										<ng-container>
											Lorem ipsum dolor sit amet, consectetur adipisicing elit. Deserunt nostrum,
											temporibus.
											Culpa
											debitis
											error maxime mollitia nostrum officia quam? Atque cumque deleniti eaque
											incidunt
											iusto mollitia
											nesciunt omnis, porro repellendus.
										</ng-container>
									</div>
								</ig-property-group>
								<ig-property-group i18n-title title="Form fields" [showHeaderLine]="false">
									<div readonly>
										<ng-container>
											<form (ngSubmit)="onFormSubmit()"
												  #workflowForm="ngForm">
												<div class="row">
													<div class="l6 s12">
														<d3s-workflow-form-fields [fields]="formFields"
																				  [form]="workflowForm"
																				  #fieldsComponent></d3s-workflow-form-fields>
													</div>
												</div>
											</form>
										</ng-container>
									</div>
								</ig-property-group>
							</div>
						</div>
					</div>
					<div [hidden]="!isAssignmentProgressSelected" class="scrollable-content">
						<d3s-assignment-progress [workflowItemUid]="workflowItemUid" [showCompleteAssignment]="false"
												 (stepClickChange)="stepClickChanged($event)"></d3s-assignment-progress>
						<d3s-assignment-information [showCompleteAssignment]="false"
													[workflowItemUid]="workflowItemUid"></d3s-assignment-information>
					</div>
				</ng-container>
			</div>
		</div>
		<div class="side-panel">
			<side-panel [(expanded)]="sidePanelOpen"
						[storageKey]="sidePanelStorageKey"
						hasDetail="true"
						height="calc(100vh - 220px)">
				<ng-container *ngIf="sidePanelOpen">
					<ig-asset-detail
						*ngIf="sidePanel === 'asset-details'"
						[objectID]="assetId"
						objectType="Artifact"
						[useAccordion]="true"
						[shouldBePadded]="false"
						[showHeader]="true"
						[showHeaderLine]="false"
						[spacerHeight]="'16px'"
						[tooltipAlign]="'left'"
						[isSidePanel]="false"
						[hideLinks]="true"
						[hasAddRelationshipsPermissions]="false"
						[hasModifyRelationshipsPermissions]="false"
						[hasDeleteRelationshipsPermissions]="false"
						[interceptLinkClick]="true"></ig-asset-detail>
					<d3s-assignment-progress-step-details *ngIf="sidePanel === 'step-details'"
														  [workflowItemUId]="workflowItemUid"
														  [showCompleteAssignment]="false"
														  [itemStepUid]="assignmentItemStep?.Uid"></d3s-assignment-progress-step-details>
				</ng-container>
			</side-panel>
		</div>
	</div>
</d3s-modal>
