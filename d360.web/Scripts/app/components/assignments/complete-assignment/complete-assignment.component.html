<d3s-modal #modal
		   [showTitle]="false"
		   [isVisible]="isModalAvailable"
		   [showActionBar]="false"
		   [hidden]="hideDialog"
		   [zIndex]="'20001 !important'"
		   [additionalClasses]="'large-dialog modal-form'">
	<d3s-loading [isLoading]="isLoading"></d3s-loading>
	<div *ngIf="!isLoading" class="modal-with-side-panel">
		<div class="modal-dialog-main-panel">
			<div class="content condensed-table">
				<div class="modal-edit-form">
					<div class="title">
						<ng-container *ngIf="onlyAdminReassignMode"><span i18n>Reassign</span></ng-container>
						<ng-container *ngIf="!onlyAdminReassignMode">{{ modalTitle }}</ng-container>

						<span class="title-emp"
							  *ngIf="isBulkRespond && !onlyAdminReassignMode && multiSubmitionItems.length > 1" i18n>Bulk Respond</span>
						<span class="modal-buttons" *ngIf="!isBulkRespond && !onlyAdminReassignMode">
							<button igButton
									[ngClass]="
									isAssignmentProgressSelected
										? ''
										: 'selected'
								" [icon]="'fa-file-text'" (click)="showAssignment()"
									class="ig-button-secondary side-panel-button"></button>
							<button igButton [icon]="'fa-list-ul'" [ngClass]="
									isAssignmentProgressSelected
										? 'selected'
										: ''
								" (click)="showAssignmentProgress()"
									class="ig-button-secondary side-panel-button"></button>
						</span>
					</div>
				</div>
				<div class="subtitle">
					{{workflowName}}
					<ng-container *ngIf="!isBulkRespond && multiSubmitionItems.length <= 1">
						<span i18n> on </span> <a (click)="onClickAsset($event, this.assetId)">{{ assetName }}</a>
					</ng-container>
				</div>
				<div [hidden]="isAssignmentProgressSelected"
					 class="scrollable-content details-container">
					<div class="asset-detail">
						<div class="d-flex column"
							 *ngIf="(allowReassignObject || allowReassignResource) && !onlyAdminReassignMode">
							<div i18n>What would you like to do?</div>
							<div class="radio-button">
								<p-radioButton igRadioButton value="completeForm" label="Complete the Form"
											   [(ngModel)]="radioSelectionValue"
											   (ngModelChange)="tableRadioSelection = undefined">
								</p-radioButton>
							</div>
							<div class="radio-button" *ngIf="allowReassignResource">
								<p-radioButton igRadioButton value="reassignUser" label="Reassign"
											   [(ngModel)]="radioSelectionValue"
											   (ngModelChange)="tableRadioSelection = undefined">
								</p-radioButton>
							</div>
							<div class="radio-button" *ngIf="allowReassignObject">
								<p-radioButton igRadioButton value="changeAsset" label="Change the Associated Asset"
											   [(ngModel)]="radioSelectionValue"
											   (ngModelChange)="tableRadioSelection = undefined">
								</p-radioButton>
							</div>
							<div class="govern-hr"></div>
						</div>
						<div class="asset-detail-tabs">
							<ig-property-group *ngIf="radioSelectionValue === 'completeForm'" i18n-title
											   title="Information" [showHeaderLine]="false"
											   [shouldBePadded]="false">
								<div readonly>
									<ng-container>
										<div class="row" *ngIf="!isBulkRespond && multiSubmitionItems.length <= 1; else elseBlock">
											<div class="category-column">
												<label class="ig-label" i18n>
													{{
													formTitle
													}}
												</label>
												<div class="ig-value" [innerHTML]="
														formDescription
													"></div>
											</div>
										</div>
										<ng-template #elseBlock>
											<div class="row">
												<div class="category-column">
													<label class="ig-label" i18n>
														{{
													formTitle
														}}
													</label>
													<div class="ig-value" [innerHTML]="
														formDescriptionRaw
													"></div>
												</div>
											</div>
										</ng-template>

									</ng-container>
								</div>
							</ig-property-group>
							<ig-property-group *ngIf="request && request.Action && radioSelectionValue === 'completeForm' && (!isBulkRespond && multiSubmitionItems.length <= 1)" i18n-title
											   title="Request"
											   [shouldBePadded]="false" [customTemplate]="true" [showHeaderLine]="false"
											   [sideTemplate]="requestSidePanel">
								<ng-template #requestSidePanel>
									<a *ngIf="!sidePanelOpen" (click)="showRequestSidePanel($event)" i18n>
										Open in side
										panel
									</a>
									<a *ngIf="sidePanelOpen" (click)="sidePanelOpen = false" i18n>Close side panel</a>
								</ng-template>
								<div readonly>
									<ng-container>
										<d3s-assignment-information-request [showSubmittedByData]="true"
																			[workflowActionUid]="
												request.Action.Uid
											" [stepUid]="stepUid" [workflowItemUid]="workflowItemUid">
										</d3s-assignment-information-request>
									</ng-container>
								</div>
							</ig-property-group>

							<d3s-assignment-asset-list *ngIf="isBulkRespond && radioSelectionValue === 'completeForm'"
													   [items]="multiSubmitionItems"></d3s-assignment-asset-list>

							<form *ngIf="radioSelectionValue === 'completeForm'"
								  (ngSubmit)="onFormSubmit()"
								  #workflowForm="ngForm"
								  #form>
								<ng-template #requiredFieldsTemplate>
									<ig-form-feedback-badges class="ig-form-feedback-badges"
															 [igformGroup]="workflowForm.form"
															 [inputContainer]="formElement">
									</ig-form-feedback-badges>
								</ng-template>
								<ig-property-group i18n-title title="Form fields"
												   *ngIf="!(allowReassignObject || allowReassignResource) || radioSelectionValue === 'completeForm'"
												   [showHeaderLine]="false" [sideTemplate]="requiredFieldsTemplate"
												   [customTemplate]="true"
												   [shouldBePadded]="false">
									<div readonly>
										<div class="row">
											<div class="l6 s12">
												<d3s-complete-assignment-form-fields [fields]="formFields"
																					 [form]="workflowForm"
																					 [formElement]="formElement"
																					 (discardForm)="
														onFormInput($event)
													">
												</d3s-complete-assignment-form-fields>
											</div>
										</div>
									</div>
								</ig-property-group>
							</form>

							<ng-container *ngIf="radioSelectionValue === 'reassignUser'">
								<div class="ig-value" i18n>Choose the new assignee:</div>
								<div class="search-field">
									<ig-search-field mode="Keypress"
													 [debounce]="600"
													 (onSearch)="dt.filterGlobal($event,'contains')">
									</ig-search-field>
								</div>

								<p-table #dt [value]="userData" [rows]="rowsPerPage" [paginator]="true"
										 [loadingIcon]="'fa fa-spinner fa-spin'"
										 [loading]="isUserDataLoading"
										 [globalFilterFields]="['FullName']" [pageLinks]="3"
										 [rowsPerPageOptions]="defaultPagingOptions" (onPage)="setRowsPerPage($event)"
										 [(selection)]="tableRadioSelection" paginatorDropdownAppendTo="body">
								<ng-template pTemplate="header">
										<tr>
											<th style="width: 40px"></th>
											<th [pSortableColumn]="'FullName'">
												<ng-container i18n>Name</ng-container>
												<d3s-sortIcon [field]="'FullName'"></d3s-sortIcon>
											</th>
											<th style="width: 50px"></th>
										</tr>
									</ng-template>
									<ng-template pTemplate="body" let-item>
										<tr>
											<td>
												<p-tableRadioButton [value]="item"></p-tableRadioButton>
											</td>
											<td>
												{{ item.FullName }}
											</td>
											<td>
												<button igButton icon="fa-info-circle" class="ig-state i-button"
														(click)="onClickResource($event,item.ResourceID)">
												</button>
											</td>
										</tr>
									</ng-template>
									<ng-template pTemplate="summary">
										<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
															  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
									</ng-template>
								</p-table>

								<div *ngIf="onlyAdminReassignMode" class="checkbox-selector">
									<p-checkbox igCheckbox
												[(ngModel)]="sendFormEmails"
												label="Send form e-mails"
												i18n-label
												binary="true">
									</p-checkbox>
								</div>

								<div class="checkbox-selector">
									<p-checkbox igCheckbox
												[(ngModel)]="clearOtherAssignments"
												label="Clear other assignments"
												i18n-label
												binary="true">
									</p-checkbox>

									<span class="field-tooltip fa fa-question-circle"
										  i18n-pTooltip
										  pTooltip="This removes all other assignees of this form. Selected user will become the only assignee."
										  tooltipPosition="top"
										  tooltipStyleClass="ig-tooltip"></span>
								</div>

							</ng-container>
							<ng-container *ngIf="radioSelectionValue === 'changeAsset'">
								<div class="ig-value" i18n>
									Choose the new associated asset:
								</div>
								<div class="search-field">
									<ig-search-field mode="Keypress"
													 [debounce]="600"
													 (onSearch)="dt.filterGlobal($event,'contains')">
									</ig-search-field>
								</div>
								<p-table #dt [value]="assets" [rows]="rowsPerPage" [paginator]="true"
										 [loading]="isReassignmentAssetsLoading"
										 [loadingIcon]="'fa fa-spinner fa-spin'"
										 [globalFilterFields]="['Name']" [pageLinks]="3"
										 [rowsPerPageOptions]="defaultPagingOptions" (onPage)="setRowsPerPage($event)"
										 [(selection)]="tableRadioSelection" paginatorDropdownAppendTo="body">
								<ng-template pTemplate="header">
										<tr>
											<th style="width: 4rem"></th>
											<th [pSortableColumn]="'Name'">
												<ng-container i18n>Name</ng-container>
												<d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
											</th>
										</tr>
									</ng-template>
									<ng-template pTemplate="body" let-item>
										<tr>
											<td>
												<p-tableRadioButton [value]="item"></p-tableRadioButton>
											</td>
											<td>
												<div class="row-data">
													{{ item.Name }}
													<button igButton icon="fa-info-circle"
															class="ig-state i-button"
															(click)="onClickAsset($event, Number(item.ObjectID))"></button>
												</div>
											</td>
										</tr>
									</ng-template>
									<ng-template pTemplate="summary">
										<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
															  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
									</ng-template>
								</p-table>
							</ng-container>
						</div>
					</div>
				</div>
				<div [hidden]="!isAssignmentProgressSelected" class="scrollable-content progress-container">
					<d3s-assignment-progress [workflowItemUid]="workflowItemUid" [workflowUid]="workflowTypeUid"
											 [showCompleteAssignment]="false"
											 [workflowTypeVersion]="workflowTypeVersion"
											 (stepClickChange)="stepClickChanged($event)"></d3s-assignment-progress>
					<d3s-assignment-information [showCompleteAssignment]="false" [workflowItemUid]="workflowItemUid"
												[workflowTypeVersion]="workflowTypeVersion">
					</d3s-assignment-information>
				</div>
			</div>
			<div class="action-bar">
				<button class="left ig-button-secondary"
						igButton
						type="button"
						(click)="discardForm ? discardFormFunc() : onCloseClick()"
						[attr.data-cy]="'CompleteAssignment_Button_Cancel'"
						i18n-label
						label="{{discardForm ? 'Discard Form' : 'Close'}}">
				</button>
				<span class="grow"></span>
				<button *ngIf="showBackButton" class="right ig-button-secondary"
						igButton style="margin-right:8px"
						(click)="onBack()"
						[attr.data-cy]="'CompleteAssignment_Button_Back'"
						tooltip="Information in the form will be saved"
						i18n-label
						i18n-tooltip
						label="Back to Assignment Selection">
				</button>
				<button class="right ig-button-primary"
						igButton
						(click)="onFormSubmit()"
						[attr.data-cy]="'CompleteAssignment_Button_Submit'"
						[disabled]="(radioSelectionValue === 'completeForm' && !workflowForm?.valid) || (radioSelectionValue !== 'completeForm' && !tableRadioSelection || !hasForm)"
						i18n-label
						label="Submit">
				</button>
			</div>
		</div>
		<div class="side-panel height-auto">
			<side-panel [(expanded)]="sidePanelOpen" [storageKey]="sidePanelStorageKey" [hasDetail]="false"
						height="calc(100vh - 220px)" [extraButtons]="sidePanelButtons" [sidePanelButtonClass]="'assignment-side-panel-button-container'">
				<ng-container>
					<d3s-side-panel-switcher (panelHeaderLabel)="setPanelHeader($event)" [outsideModal]="false"
											 [hidden]="!sidePanelOpen" [showPanelHeader]="false"
											 #sidePanelSwitcherComponent></d3s-side-panel-switcher>
				</ng-container>
			</side-panel>
		</div>
	</div>
</d3s-modal>
