<div>
    <div [ngSwitch]="formMode">
        <div *ngSwitchDefault>
            <div class="row">
                <div class="col l8 m6 s12">
                    <div class="tile tile-detail">
                        <!-- debugging 2 way bindings -->
                        <!--
                            rule: {{selectedFusionRule?.Description}}<br /> step: {{selectedFusionRuleStep?.Description}}<br />
                            mapping: {{selectedFusionRuleStepMapping?.SourceFieldName}} {{selectedFusionRuleStepMapping?.TargetFieldName}}<br />
                            item: {{selectedFusionRuleItem?.FusionAttributeName}}<br />
                        -->
                        <d3s-fusion-rule-list [fusionID]="fusionID"
                                              [selection]="selectedFusionRule"
                                              (selectionChange)="selectedFusionRule = $event; showRulePromotionHistory = false;"
                                              (onEditClick)="formMode = FormMode.EditRule"
                                              (onAddClick)="formMode = FormMode.AddRule"
                                              (onDeleteClick)="formMode = FormMode.DeleteRule"></d3s-fusion-rule-list>
                    </div>
                </div>
                <div class="col l4 m6 s12">
                    <div class="tile tile-detail">
                        <d3s-fusion-rule-item-list [fusionRule]="selectedFusionRule"
                                                   [(selection)]="selectedFusionRuleItem"
                                                   (onAddClick)="addItem()"
                                                   (onDeleteClick)="deleteItem()"></d3s-fusion-rule-item-list>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <div class="tile tile-detail">
                        <!--need to use [hidden] here instead of ngIf to keep bindings up to date-->
                        <div [hidden]="showRulePromotionHistory">
                            <d3s-fusion-rule-step-list [fusionRule]="selectedFusionRule"
                                                       [(selection)]="selectedFusionRuleStep"
                                                       (onEditClick)="editStep()"
                                                       (onAddClick)="addStep()"
                                                       (onDeleteClick)="formMode = FormMode.DeleteStep"
                                                       (onHistoryClick)="showRulePromotionHistory = true;"></d3s-fusion-rule-step-list>
                        </div>
                        <d3s-fusion-rule-step-history *ngIf="showRulePromotionHistory"
                                                      [fusionRuleStepID]="selectedFusionRuleStep?.ID"
                                                      (onClose)="showRulePromotionHistory = false"></d3s-fusion-rule-step-history>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <div class="tile tile-detail">
                        <d3s-fusion-rule-step-mapping-list [fusionRuleStep]="selectedFusionRuleStep"
                                                           [(selection)]="selectedFusionRuleStepMapping"
                                                           (onAddClick)="addMapping()"
                                                           (onEditClick)="editMapping()"
                                                           (onDeleteClick)="formMode = FormMode.DeleteMapping"></d3s-fusion-rule-step-mapping-list>
                    </div>
                </div>
            </div>
        </div>



        <div *ngSwitchCase="FormMode.AddRule" class="tile tile-detail">
            <d3s-fusion-rule-editor [fusionRule]="selectedFusionRule"
                                    [fusionTypeID]="fusionTypeID"
                                    [fusionID]="fusionID"
                                    (onClose)="formMode = FormMode.Default"
                                    (onSave)="formMode = FormMode.Default"></d3s-fusion-rule-editor>
        </div>
        <div *ngSwitchCase="FormMode.EditRule" class="tile tile-detail">
            <d3s-fusion-rule-editor [fusionRule]="selectedFusionRule"
                                    (onClose)="formMode = FormMode.Default"
                                    (onSave)="formMode = FormMode.Default"></d3s-fusion-rule-editor>
        </div>
        <div *ngSwitchCase="FormMode.DeleteRule" class="tile tile-detail">
            <header>Delete Fusion Rule</header>
            <d3s-delete-form [uri]="'form/DeleteFusionRuleById?id=' + selectedFusionRule?.ID"
                             [method]="'delete'"
                             [prompt]="'Are you sure you want to delete this fusion rule?'"
                             (onCancel)="formMode = FormMode.Default;"
                             (onDeleteComplete)="deleteRule(); showMessage($event.result);"></d3s-delete-form>
        </div>


        <div *ngSwitchCase="FormMode.AddItem">
            <div class="tile tile-detail">
                <d3s-fusion-rule-item-editor [fusionRule]="selectedFusionRule"
                                             [fusionID]="fusionID"
                                             (onClose)="formMode = FormMode.Default"
                                             (onSave)="formMode = FormMode.Default"></d3s-fusion-rule-item-editor>
            </div>
        </div>
        <div *ngSwitchCase="FormMode.DeleteItem" class="tile tile-detail">
            <header>Delete Fusion Rule Item</header>
            <d3s-delete-form [uri]="'form/DeleteFusionRuleItemByID?id=' + selectedFusionRuleItem?.ID"
                             [method]="'delete'"
                             [prompt]="'Are you sure you want to delete this fusion rule item?'"
                             (onCancel)="formMode = FormMode.Default;"
                             (onDeleteComplete)="selectedFusionRuleItem = null; showMessage($event.result);"></d3s-delete-form>
        </div>


        <div *ngSwitchCase="FormMode.AddMapping" class="tile tile-detail">
            <d3s-fusion-rule-step-mapping-editor [fusionRuleStep]="selectedFusionRuleStep"
                                                 (onClose)="formMode = FormMode.Default"
                                                 (onSave)="formMode = FormMode.Default"></d3s-fusion-rule-step-mapping-editor>
        </div>
        <div *ngSwitchCase="FormMode.EditMapping" class="tile tile-detail">
            <d3s-fusion-rule-step-mapping-editor [fusionRuleStep]="selectedFusionRuleStep"
                                                 [fusionRuleStepMapping]="selectedFusionRuleStepMapping"
                                                 (onClose)="formMode = FormMode.Default"
                                                 (onSave)="formMode = FormMode.Default"></d3s-fusion-rule-step-mapping-editor>
        </div>
        <div *ngSwitchCase="FormMode.DeleteMapping" class="tile tile-detail">
                <header>Delete Fusion Rule Step Mapping</header>
                <d3s-delete-form [uri]="'form/DeleteFusionRuleStepMappingByID?id=' + selectedFusionRuleStepMapping?.ID"
                                 [method]="'delete'"
                                 [prompt]="'Are you sure you want to delete this fusion rule step mapping?'"
                                 (onCancel)="formMode = FormMode.Default;"
                                 (onDeleteComplete)="selectedFusionRuleStepMapping = null; showMessage($event.result);"></d3s-delete-form>
        </div>


        <div *ngSwitchCase="FormMode.AddStep">
            <d3s-fusion-rule-step [ruleID]="selectedFusionRule.ID"
                                  (onClose)="formMode = FormMode.Default;"
                                  (onSave)="showMessage($event)"></d3s-fusion-rule-step>
        </div>
        <div *ngSwitchCase="FormMode.EditStep">
            <d3s-fusion-rule-step [ruleID]="selectedFusionRuleStep.RuleID"
                                  [ruleStepID]="selectedFusionRuleStep.ID"
                                  (onClose)="formMode = FormMode.Default"
                                  (onSave)="showMessage($event);"></d3s-fusion-rule-step>
        </div>
        <div *ngSwitchCase="FormMode.DeleteStep" class="tile tile-detail">
            <header>Delete Fusion Rule Step</header>
            <d3s-delete-form [uri]="'form/DeleteFusionRuleStepByID?ruleID=' + selectedFusionRuleStep?.RuleID + '&ruleStepID=' + selectedFusionRuleStep?.ID"
                             [method]="'delete'"
                             [prompt]="'Are you sure you want to delete this fusion rule step?'"
                             (onCancel)="formMode = FormMode.Default;"
                             (onDeleteComplete)="deleteStep(); showMessage($event.result);"></d3s-delete-form>
        </div>
    </div>
</div>
