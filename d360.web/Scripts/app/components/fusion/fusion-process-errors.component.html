<d3s-loading [isLoading]="isLoading"></d3s-loading>
<span *ngIf="!isLoading">
    <header>Fusion Processing Error History</header>
    <input type="text" [hidden]="!showSimpleFilter"
           pInputText
           size="100"
           (input)="dt.filterGlobal($event.target.value, 'contains')"
           placeholder="Search..."
           class="grid-simple-filter">
    <p-table #dt
             [value]="errors"
             selectionMode="single"
             [scrollable]="true"
             [metaKeySelection]="true"
             [globalFilterFields]="['Error','FusionType','Fusion','Date']"
             [pageLinks]="3"
             [paginator]="true"
             [rows]="5"
             [rowsPerPageOptions]="[5,10,20]"
             [(selection)]="selected">
        <ng-template pTemplate="colgroup">
            <colgroup>
                <col style="width:300px">
                <col style="width:150px">
                <col style="width:150px">
                <col style="width:150px">
            </colgroup>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th [pSortableColumn]="'Error'"
                    style="width: 300px">Error<d3s-sortIcon [field]="'Error'"></d3s-sortIcon></th>
                <th [pSortableColumn]="'FusionType'"
                    style="width: 150px">Type<d3s-sortIcon [field]="'FusionType'"></d3s-sortIcon></th>
                <th [pSortableColumn]="'Fusion'"
                    style="width: 150px">Configuration<d3s-sortIcon [field]="'Fusion'"></d3s-sortIcon></th>
                <th [pSortableColumn]="'Date'"
                    style="width: 150px">Date<d3s-sortIcon [field]="'Date'"></d3s-sortIcon></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body"
                     let-item>
            <tr (dblclick)="selected=item"
                [pSelectableRow]="item">
                <td>
                    <div style="max-height:300px;overflow:auto;"
                         [title]="item.Error">{{item.Error}}</div>
                </td>
                <td>{{item.FusionType}}</td>
                <td>{{item.Fusion}}</td>
                <td><span>{{item.Date | date: 'short'}}</span></td>
            </tr>
        </ng-template>
        <ng-template *ngIf="dt.totalRecords"
                     pTemplate="summary">
            <d3s-grid-paging-info [first]="dt.first"
                                  [rows]="dt.rows"
                                  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
        </ng-template>
    </p-table>
</span>
