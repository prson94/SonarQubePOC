<div class="tile tile-detail">
    <header>Agent History<span *ngIf="fusion"> - {{fusion.Name}}</span>
        <d3s-tile-actions (exportClick)="export()"
                          (refreshClick)="load()"
                          [(filterMode)]="showSimpleFilter"
                          [hasAdd]="false"
                          [hasExport]="true"
                          [hasFilterMode]="true"
                          [hasRefresh]="true"></d3s-tile-actions>
    </header>
    <d3s-loading [isLoading]="isLoading"></d3s-loading>
    <span *ngIf="!isLoading">
        <input (input)="dt.filterGlobal($event.target.value, 'contains')"
               [hidden]="!showSimpleFilter"
               class="grid-simple-filter"
               pInputText
               placeholder="Search..."
               size="100"
               type="text">
        <p-table #dt
                 [(selection)]="selected"
                 [globalFilterFields]="['FusionType','Fusion','DateStarted','DateCompleted','Success']"
                 [metaKeySelection]="true"
                 [pageLinks]="3"
                 [paginator]="true"
                 [rowsPerPageOptions]="[5,10,20]"
                 [rows]="5"
                 [value]="executions"
                 selectionMode="single">
            <ng-template pTemplate="header">
                <tr>
                    <th [pSortableColumn]="'FusionType'"
                        style="width: 20%">Type<d3s-sortIcon [field]="'FusionType'"></d3s-sortIcon></th>
                    <th [pSortableColumn]="'Fusion'"
                        style="width: 20%">Configuration<d3s-sortIcon [field]="'Fusion'"></d3s-sortIcon></th>
                    <th [pSortableColumn]="'DateStarted'"
                        style="width: 20%">Started<d3s-sortIcon [field]="'DateStarted'"></d3s-sortIcon></th>
                    <th style="width: 20%">Completed</th>
                    <th [pSortableColumn]="'Success'"
                        style="width: 20%">Success<d3s-sortIcon [field]="'Success'"></d3s-sortIcon></th>
                </tr>
                <tr [hidden]="showSimpleFilter">
                    <th><d3s-column-filter [datatype]="'text'"
                                           [field]="'FusionType'"></d3s-column-filter></th>
                    <th><d3s-column-filter [datatype]="'text'"
                                           [field]="'Fusion'"></d3s-column-filter></th>
                    <th><d3s-column-filter [datatype]="'text'"
                                           [field]="'DateStarted'"></d3s-column-filter></th>
                    <th><d3s-column-filter [datatype]="'text'"
                                           [field]="'DateCompleted'"></d3s-column-filter></th>
                    <th><d3s-column-filter [datatype]="'text'"
                                           [field]="'Success'"></d3s-column-filter></th>
                </tr>
            </ng-template>
            <ng-template let-item
                         pTemplate="body">
                <tr (dblclick)="selected=item"
                    [pSelectableRow]="item">
                    <td>{{item.FusionType}}</td>
                    <td><a (click)="showFusion(item)">{{item.Fusion}}</a></td>
                    <td><span>{{item.DateStarted | date: 'short'}}</span></td>
                    <td><span>{{item.DateCompleted | date: 'short'}}</span></td>
                    <td>
                        <i *ngIf="item.Success"
                           class="fa fa-check enabled"
                           title="Success"></i>
                        <i *ngIf="!item.Success && item.DateCompleted"
                           class="fa fa-times disabled"
                           title="Failure"></i>
                    </td>
                </tr>
            </ng-template>
            <ng-template *ngIf="dt.totalRecords"
                         pTemplate="summary">
                <d3s-grid-paging-info [first]="dt.first"
                                      [rows]="dt.rows"
                                      [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
            </ng-template>
        </p-table>
    </span>
</div>
