<div class="row">
    <div class="col s12 m12">
        <div class="tile tile-detail">
            <p-tabView (onChange)="tabClick($event)" [activeIndex]="activeIndex">
                <p-tabPanel header="Assets">
                    <ng-template pTemplate="content">
                        <div class="row">
                            <div *ngIf="!isLoading">
                                <d3s-fusion-attribute-summary [hideHeader]="true" [showExportOnFilter]="true" [initialFusionAttributeId]="initialFusionAttributeId" [fusionId]="fusionId" [fusionAttributeTypeId]="selectedFusionAttributeTypeId" [fusionAttribute]="selectedFusionAttribute" (fusionAttributeChange)="selectedFusionAttribute=$event;"></d3s-fusion-attribute-summary>
                            </div>
                        </div>
                    </ng-template>
                </p-tabPanel>
            </p-tabView>
        </div>
    </div>
    <div class="col s12 m12" *ngIf="tabIsActive('ASSETS')">
        <div class="tile tile-detail" *ngIf="selectedFusionAttribute">
            <d3s-object-definition-tile [objectPermissions]="[]" [objectID]="selectedFusionAttribute?.ID" [objectType]="'FusionAttribute'"  [nymTypes]="selectedFusionAttribute?.NymTypes"></d3s-object-definition-tile>
        </div>
        <div class="tile tile-detail" *ngIf="selectedFusionAttribute">
            <d3s-object-relationships [objectPermissions]="permissions" [objectType]="'FusionAttribute'" [objectID]="selectedFusionAttribute?.ID" objectName=""></d3s-object-relationships>
        </div>
    </div>
</div>
