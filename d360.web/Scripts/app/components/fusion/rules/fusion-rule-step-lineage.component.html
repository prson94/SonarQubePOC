<form #ruleStepLineage="ngForm">
    <div class="row">
        <div class="col s12">
            <div class="FieldName" style="display:block">Role</div>
            <select [(ngModel)]="settings.Role" style="width:100%" name="role" #role="ngModel" required (ngModelChange)="validate()">
                <option></option>
                <option *ngFor="let i of roles" [value]="i.ID">{{i.Name}}</option>
            </select>
            <div class="errorMessage" [hidden]="!showErrors || role.valid">Role is required</div>
        </div>
    </div>
    <div class="row">
        <div class="col l6 m6 s12">
            <div class="FieldName" style="display:block">Source From Step (Business Relation)</div>
            <select [(ngModel)]="settings.SubjectID" style="width:100%" name="source" #source="ngModel" required (ngModelChange)="validate()">
                <option></option>
                <option *ngFor="let i of steps" [value]="i.ID">{{i.Description}}</option>
            </select>
            <div class="errorMessage" [hidden]="!showErrors || source.valid">Source is required</div>
        </div>
        <div class="col l6 m6 s12">
            <div class="FieldName" style="display:block">Target From Step (Business Relation)</div>
            <select [(ngModel)]="settings.ObjectID" style="width:100%" name="target" #target="ngModel" required (ngModelChange)="validate()">
                <option></option>
                <option *ngFor="let i of steps" [value]="i.ID">{{i.Description}}</option>
            </select>
            <div class="errorMessage" [hidden]="!showErrors || target.valid">Target is required</div>
        </div>
    </div>
    <div class="row">
        <div class="col l6 m6 s12">
            <div class="FieldName" style="display:block">Source From Step (Technical Relation)</div>
            <select [(ngModel)]="settings.TechnicalSubjectID" style="width:100%" name="sourceTech">
                <option></option>
                <option *ngFor="let i of technicalsteps" [value]="i.ID">{{i.Description}}</option>
            </select>
        </div>
        <div class="col l6 m6 s12">
            <div class="FieldName" style="display:block">Target From Step (Technical Relation)</div>
            <select [(ngModel)]="settings.TechnicalObjectID" style="width:100%" name="targetTech">
                <option></option>
                <option *ngFor="let i of technicalsteps" [value]="i.ID">{{i.Description}}</option>
            </select>
        </div>
    </div>
</form>
