<div class="row">
    <div class="col l4 m12 s12">
        <div class="FieldName" style="display:block">From Step</div>
        <select [(ngModel)]="settings.SubjectID" style="width:100%" name="subjectstep" #subjectstep="ngModel" required (ngModelChange)="validate()">
            <option></option>
            <option *ngFor="let i of steps" [value]="i.ID">{{i.Description}}</option>
        </select>
    </div>
</div>
