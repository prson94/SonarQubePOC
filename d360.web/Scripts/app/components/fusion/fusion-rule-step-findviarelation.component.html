<div class="row">
    <div class="col s12">
        <div class="FieldName" style="display:block">Intersect Type</div>
        <select [(ngModel)]="settings.IntersectType" style="width:100%">
            <option *ngFor="let i of relations" [value]="i.ID">{{i.Name}}</option>
        </select>
    </div>
</div>
<div class="row">
    <div class="col s12">
        <div class="FieldName" style="display: block">Search Type</div>
        <select [(ngModel)]="settings.Search" style="width:100%">
            <option *ngFor="let i of searchTypes" [value]="i.value">{{i.text}}</option>
        </select>
    </div>
    <div class="col s12">
        <div *ngIf="settings.Search == 'ResultFromStep'">
            <div class="FieldName" style="display: block">Result From Step</div>
            <select [(ngModel)]="settings.ID" style="width:100%">
                <option *ngFor="let i of steps" [value]="i.ID">{{i.Description}}</option>
            </select>
        </div>
    </div>
</div>
