<div class="row">
    <div class="col s12" style="display: flex">
        <d3s-loading [isLoading]="isLoading"></d3s-loading>
        <div class="tile tile-detail main-panel"
             *ngIf="!isLoading">
            <d3s-asset-grid #grid
                            [gridObject]="gridObject"
                            (selectedChange)="selectAsset($event)"
                            (hasProfilingChange)="hasProfiling=$event"
                            (showEditorChange)="showEditor=$event"
                            (isLoadingChange)="gridLoading=$event"
                            (isDefinitionLoadedChange)="definitionLoaded=$event"></d3s-asset-grid>
        </div>
        <div class="tile tile-detail side-panel" *ngIf="!gridLoading && !isLoading && definitionLoaded && (!showEditor || (showEditor && selection != null))">
            <side-panel (expandedChange)="sidePanelOpen=$event"
                        (selectedPanelChange)="sidePanelTab=$event"
                        [selectedItem]="selection"
                        [panelApplies]="panelApplies"
                        [hasProfiling]="hasProfiling"
                        hasDetail="true"
                        [storageKey]="sidePanelStorageKey">
                <ng-container *ngIf="sidePanelOpen && selection != null && sidePanelLoading">
                    <d3s-loading [isLoading]="true"></d3s-loading>
                </ng-container>
                <ng-container *ngIf="sidePanelOpen && selection != null && !sidePanelLoading">
                    <ng-container *ngIf="sidePanelTab === 'dataprofile' && selection?.HasProfiling">
                        <data-profile [dataProfile]="dataProfile" (secondaryPanelLinkClicked)="secondaryPanelOpen($event)"></data-profile>
                    </ng-container>
                    <ng-container *ngIf="sidePanelTab === 'detail'">
                        <ig-asset-detail *ngIf="!selectedReferenceItem && !selectedTag"
                                         [objectUID]="selectedAsset ? selectedAsset.uid : selection.AssetUid"
                                         [objectType]="selectedAsset ? selectedAsset.type : 'artifact'"
                                         [useAccordion]="true"
                                         [shouldBePadded]="false"
                                         [showHeader]="true"
                                         [showHeaderLine]="false"
                                         [spacerHeight]="'16px'"
                                         [tooltipAlign]="'left'"
                                         [isSidePanel]="true"
                                         [hasEditLink]="true"
                                         [hasAddRelationshipsPermissions]="false"
                                         [hasModifyRelationshipsPermissions]="false"
                                         [hasDeleteRelationshipsPermissions]="false"
                                         [interceptLinkClick]="true"
                                         (onEditClick)="assetGrid.triggerEdit()"></ig-asset-detail>

                        <ng-container *ngIf="selectedReferenceItem">
                            <ig-asset-type-detail [uid]="selectedReferenceItem.uid"
                                                  [highlightUid]="selectedReferenceItem.assetUid"
                                                  [baseUrl]="selectedReferenceItem.url">
                            </ig-asset-type-detail>
                        </ng-container>
                        <ng-container *ngIf="selectedTag">
                            <ig-tagged-assets-detail [uid]="selectedTag.uid"></ig-tagged-assets-detail>
                        </ng-container>
                    </ng-container>
                </ng-container>
                <ng-container *ngIf="secondarySidePanelOpen && semanticType">
                    <div #semanticTile class="secondary-side-panel">
                        <div class="panel-header">
                            <span class="header-label">Information</span>
                            <div class="button-container">
                                <button igButton [attr.data-cy]="'Semantic_Secondary_Close'" icon="fa-times" (click)="secondarySidePanelOpen=false;" [tooltip]="Close" class="close-button"></button>
                            </div>
                        </div>
                        <div class="details-container">
                            <ng-container *ngIf="semanticType">
                                <semantic-detail [qualifier]="semanticType.qualifier"
                                                 [isSidePanel]="true"
                                                 [showHeader]="true"
                                                 [semanticType]="semanticType"
                                                 (close)="secondarySidePanelOpen=false;"></semantic-detail>
                            </ng-container>
                        </div>
                    </div>
                </ng-container>
            </side-panel>
        </div>
    </div>
</div>
