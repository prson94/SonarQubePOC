<as-split [gutterSize]="sidePanelService.draggableAreaWidth"
		  [class.side-panel-close]="!sidePanelOpen"
		  (dragEnd)="onSidePanelDragEnd(sidePanelStorageKey, $event)"
		  unit="pixel"
		  direction="horizontal"
		  class="col s12 split"
		  style="display: flex">
	<as-split-area class="tile tile-detail main-panel">
		<ng-content></ng-content>
	</as-split-area>
	<as-split-area [size]="getSidePanelWidth()"
				   [minSize]="getSidePanelMinWidth()"
				   [maxSize]="getSidePanelMaxWidth()"
				   class="tile tile-detail side-panel">
		<side-panel [selectedItem]="anySelectedItem"
					[setMinMaxWidth]="false"
					[storageKey]="sidePanelStorageKey"
					[expanded]="true"
					[showEmptyOverlay]="!anySelectedItem"
					(expandedChange)="sidePanelOpen=$event"
					hasDetail="true">
			<ng-container *ngIf="sidePanelOpen">
				<ig-asset-detail *ngIf="selectedAsset"
								 [objectUID]="selectedAsset.uid"
								 [objectType]="selectedAsset.type"
								 [useAccordion]="true"
								 [shouldBePadded]="false"
								 [showHeader]="true"
								 [showHeaderLine]="false"
								 [spacerHeight]="'16px'"
								 [tooltipAlign]="'left'"
								 [isSidePanel]="true"
								 [hasEditLink]="hasEditLink"
								 [hasOpenLink]="hasOpenLink"
								 [hasAddRelationshipsPermissions]="false"
								 [hasModifyRelationshipsPermissions]="false"
								 [hasDeleteRelationshipsPermissions]="false"
								 [interceptLinkClick]="true"
								 (onEditClick)="assetGrid.triggerEdit()"></ig-asset-detail>

				<ng-container *ngIf="selectedReferenceItem">
					<ig-asset-type-detail [uid]="selectedReferenceItem.uid"
										  [highlightUid]="selectedReferenceItem.assetUid"
										  [baseUrl]="selectedReferenceItem.url">
					</ig-asset-type-detail>
				</ng-container>
				<ng-container *ngIf="selectedTag">
					<ig-tagged-assets-detail [uid]="selectedTag.uid"></ig-tagged-assets-detail>
				</ng-container>
				<div class="empty-overlay" *ngIf="!selectedAsset && !selectedReferenceItem && !selectedTag">
					<div class="content" style="max-width:unset;">
						<div class="icon-holder">
							<i class="fa fa-info-circle"></i>
						</div>
						<span>{{emptyMessage}}</span>
					</div>
				</div>
			</ng-container>
		</side-panel>
	</as-split-area>
</as-split>
