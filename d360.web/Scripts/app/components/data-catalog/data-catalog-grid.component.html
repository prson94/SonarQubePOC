<div class="grid-actions-header column-layout">
	<div class="grid-actions-header-row">
		<div class="simple-search">
			<ig-search-field mode="Keypress"
							 [debounce]="600"
							 (onSearch)="subjectLoadGrid.next(0);"
							 [(ngModel)]="simpleSearchText"
							 [infoTooltip]="isContainsSearchDefault ? null : simpleSearchTooltipHTML">
			</ig-search-field>
		</div>
	</div>
	<div class="grid-actions-header-row">
		<advanced-filtering #advancedFilter
							[loadIdentifier]="'DataCatalog'"
							[fieldsObserver]="filterFields$"
							(onChange)="advancedFiltersChanged($event)"></advanced-filtering>
	</div>
</div>
<div class="grid-wrapper">

	<p-table #dt [value]="data"
			 [loading]="isLoading"
			 [loadingIcon]="'fa fa-spinner fa-spin'"
			 [pageLinks]="3"
			 [paginator]="true"
			 paginatorDropdownAppendTo="body"
			 [rows]="rowsPerPage"
			 [rowsPerPageOptions]="defaultPagingOptions"
			 [lazy]="true"
			 (sortFunction)="subjectLoadGrid.next(0);" 
			 [customSort]="true" 
			 (onLazyLoad)="subjectLoadGrid.next(0);"
			 [totalRecords]="totalRecords">
		<ng-template pTemplate="header">
			<tr>
				<th *ngFor="let col of columns" [pSortableColumn]="col.apiProperty">
					<ng-container>{{col.columnName}}</ng-container>
					<d3s-sortIcon [field]="col.apiProperty"></d3s-sortIcon>
				</th>
			</tr>
		</ng-template>
		<ng-template pTemplate="body" let-item>
			<tr>
				<td *ngFor="let col of columns">
					{{item[col.apiProperty] ?? '---'}}
				</td>
			</tr>
		</ng-template>
		<ng-template pTemplate="summary">
			<d3s-grid-paging-info [first]="dt.first"
								  [rows]="dt.rows"
								  [totalRecords]="totalRecords"></d3s-grid-paging-info>
		</ng-template>
	</p-table>
</div>
