
<div *ngFor="let field of fields;let indx=index"
     class="row">
    <div [ngSwitch]="field.FieldType"
         class="col s12">
        <div class="FieldName"
             [innerHtml]="field.Label"></div>
        <input *ngSwitchCase="fieldType.Text"
               [name]="'input_'+indx"
               style="width: 100%;"
               type="string"
               [(ngModel)]="field.Value">
        <span *ngSwitchCase="fieldType.Boolean">
            &nbsp;&nbsp;
            <label>
                <input [name]="'input_'+indx"
                       type="radio"
                       [value]="true"
                       required
                       [(ngModel)]="field.Value"
                       #f="ngModel">&nbsp;Yes
            </label>&nbsp;
            <label>
                <input [name]="'input_'+indx"
                       type="radio"
                       [value]="false"
                       required
                       [(ngModel)]="field.Value"
                       #f="ngModel">&nbsp;No
            </label>
            <span *ngIf="f.errors">
                <span *ngIf="f.errors.required"
                      class="error">&nbsp;&nbsp;&nbsp;* This field is required</span>
            </span>
        </span>
        <input *ngSwitchCase="fieldType.Integer"
               [name]="'input_'+indx"
               style="width: 100%;"
               type="number"
               [(ngModel)]="field.Value">
        <textarea *ngSwitchCase="fieldType.TextArea"
                  [name]="'input_'+indx"
                  style="width: 100%;"
                  [(ngModel)]="field.Value"></textarea>
        <p-calendar *ngSwitchCase="fieldType.Date"
                    [(ngModel)]="field.Value"
                    [name]="'input_'+indx"></p-calendar>
        <div *ngSwitchCase="fieldType.List">
            <select *ngIf="!field.AllowMultipleValues"
                    [name]="'input_'+indx"
                    style="height:auto;width:100%;"
                    [(ngModel)]="field.Value">
                <option></option>
                <option *ngFor="let opt of field.Values"
                        [value]="opt.Value">
                    {{opt.Text}}
                </option>
            </select>
            <p-multiSelect *ngIf="field.AllowMultipleValues"
                           [name]="'input_'+indx"
                           [(ngModel)]="field.Value"
                           [options]="field.Values | dropdownItemToSelectItemPipe"
                           [style]="{width:'100%'}"
                           selectedItemsLabel="{0} items selected"
                           ngDefaultControl></p-multiSelect>
        </div>
        <div *ngSwitchCase="fieldType.RelationshipType">
            <select *ngIf="!field.AllowMultipleValues"
                    [name]="'input_'+indx"
                    style="height:auto;width:100%;"
                    [(ngModel)]="field.Value">
                <option></option>
                <option *ngFor="let opt of field.Values"
                        [value]="opt.Value">
                    {{opt.Text}}
                </option>
            </select>
            <p-multiSelect *ngIf="field.AllowMultipleValues"
                           [name]="'input_'+indx"
                           [(ngModel)]="field.Value"
                           [options]="field.Values | dropdownItemToSelectItemPipe"
                           [style]="{width:'100%'}"
                           selectedItemsLabel="{0} items selected"
                           ngDefaultControl></p-multiSelect>
        </div>
        <div *ngSwitchCase="fieldType.Link">
            <input [name]="'inputName_' + indx" ngModel style="width: 100%;" type="text">
            <div>(Link Name)</div>
            <input [name]="'inputUrl_' + indx" ngModel style="width: 100%;" type="text">
            <div>(Link Url: Your Url should start with a protocol prefix.  For example 'http://' or 'https://')</div>
            <div class="col s12" *ngIf="field.FieldType == fieldType.Link && form && form.controls['inputUrl_'+indx ]">
                <span *ngIf="!form.controls['inputUrl_'+indx ].valid" class="error">&nbsp;&nbsp;&nbsp;* This field is required</span>
            </div>
        </div>
        <div *ngSwitchCase="fieldType.HTML">
            <p-editor [name]="'input_'+indx" [(ngModel)]="field.Value" [style]="{'height':'150px'}" ngDefaultControl #ed>
                <header style="padding-bottom:0px !important">
                    <span class="ql-formats">
                        <select class="ql-header">
                            <option value="1">Heading</option>
                            <option value="2">Subheading</option>
                            <option selected>Normal</option>
                        </select>
                        <select class="ql-font">
                            <option selected>Sans Serif</option>
                            <option value="serif">Serif</option>
                            <option value="monospace">Monospace</option>
                        </select>
                    </span>
                    <span class="ql-formats">
                        <button class="ql-bold"></button>
                        <button class="ql-italic"></button>
                        <button class="ql-underline"></button>
                    </span>
                    <span class="ql-formats">
                        <select class="ql-color"></select>
                        <select class="ql-background"></select>
                    </span>
                    <span class="ql-formats">
                        <button class="ql-list" value="ordered"></button>
                        <button class="ql-list" value="bullet"></button>
                        <select class="ql-align">
                            <option selected></option>
                            <option value="center"></option>
                            <option value="right"></option>
                            <option value="justify"></option>
                        </select>
                    </span>
                    <span class="ql-formats">
                        <button class="ql-link"></button>
                        <button class="ql-code-block"></button>
                    </span>
                    <span class="ql-formats">
                        <button class="ql-clean"></button>
                    </span>
                </header>
            </p-editor>
        </div>
    </div>
    <div class="col s12" *ngIf="field.FieldType != fieldType.Boolean && form && form.controls['input_'+indx ]">
        <span *ngIf="!form.controls['input_'+indx ].valid" class="error">&nbsp;&nbsp;&nbsp;* This field is required</span>
    </div>
    <div class="col s12">&nbsp;</div>
</div>
