<div class="row">
    <div class="col l4 m6 s12">
        <div *ngIf="isLoading">
            <div style="padding:10px;text-align:center;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
        </div>
        <div class="tile tile-detail" *ngIf="!isLoading">
            <header><d3s-tile-actions [hasAdd]="true" (addClick)="selectedRow=newRow;formMode=FormMode.Adding;"></d3s-tile-actions></header>
            <p-dataTable [value]="domainTypes" selectionMode="single" (onRowSelect)="selectedRow=$event.data;" [rows]="20" [paginator]="true">
                <p-column field="Name" header="Name" sortable="true" [filter]="true" filterMatchMode="contains" [style]="{ 'width': '70%' }"></p-column>
                <p-column [style]="{ 'width': '30%' }">
                    <template let-col let-item="rowData">
                        <div class="RowTools">
                            <a (click)="selectedRow=item;formMode=FormMode.Editing;" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                            <a (click)="selectedRow=item;formMode=FormMode.Deleting;" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </template>
                </p-column>
            </p-dataTable>
        </div>
    </div>
    <div class="col l8 m6 s12" [ngSwitch]="formMode">
        <div class="row" *ngSwitchDefault>
            <div class="col s12">
                <div id="DetailTile" class="tile tile-detail">
                    <object-detail [objectType]="objectType" [objectID]="selectedRow?.ID"></object-detail>
                </div>
            </div>
            <div class="col s12">
                <div id="FieldsTile" class="tile tile-detail">
                    <d3s-field-definition-tile [objectType]="objectType" [objectID]="selectedRow?.ID" [title]="'Field Definition'"></d3s-field-definition-tile>
                </div>
            </div>
            <div class="col s12">
                <div id="GovernanceTile" class="tile tile-detail">
                    <d3s-people-responsibilities-tile [objectType]="objectType" [objectID]="selectedRow?.ID" [title]="'Default Responsibilities'" [showHidden]="true"></d3s-people-responsibilities-tile>
                </div>
            </div>
        </div>
        <div class="row" *ngSwitchCase="FormMode.Editing">
            <div class="tile tile-detail">
                <d3s-dynamic-editor [selection]="selectedRow"
                                    [objectID]="selectedRow.ID"
                                    [objectType]="'DomainType'"
                                    [title]="'Domain'"
                                    [createUri]="'form/dynamicedit/create/domaintype/'"
                                    [editUri]="'form/dynamicedit/edit/domaintype/'"
                                    (closeClick)="formMode = FormMode.Default;"
                                    (saveClick)="formMode = FormMode.Default; load();"></d3s-dynamic-editor>
            </div>
        </div>
        <div class="row" *ngSwitchCase="FormMode.Deleting">
            <div class="tile tile-detail">
                <delete-form [uri]="'/form/DeleteDomainTypeByID?id=' + selectedRow.ID"
                             [method]="'delete'"
                             [prompt]="'Are you sure you want to delete this domain type?'"
                             (onDeleteSuccess)="formMode = FormMode.Default; load();"
                             (onCancel)="formMode = FormMode.Default;">
                </delete-form>
            </div>
        </div>
        <div class="row" *ngSwitchCase="FormMode.Adding">
            <div class="tile tile-detail">
                <d3s-dynamic-editor [selection]="null"
                                    [objectID]="0"
                                    [objectType]="'DomainType'"
                                    [title]="'Domain'"
                                    [createUri]="'form/dynamicedit/create/domaintype/'"
                                    [editUri]="'form/dynamicedit/edit/domaintype/'"
                                    (closeClick)="formMode = FormMode.Default;"
                                    (saveClick)="formMode = FormMode.Default; load();"></d3s-dynamic-editor>
            </div>
        </div>
    </div>
</div>
