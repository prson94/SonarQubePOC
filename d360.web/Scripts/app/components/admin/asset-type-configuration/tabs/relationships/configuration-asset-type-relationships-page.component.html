<d3s-configuration-asset-type-header [assetTypeClass]="assetTypeClass"
	[uid]="uid">
</d3s-configuration-asset-type-header>
<d3s-configuration-asset-type-tabs [assetTypeClass]="assetTypeClass"
	[uid]="uid">
</d3s-configuration-asset-type-tabs>
<div class="tile tile-detail main-panel">
	<d3s-loading [isLoading]="loadingCount != 0"></d3s-loading>
	<d3s-admin-relationships-list *ngIf="loadingCount == 0"
		[showTitle]="false" 
		[filterToName]="undefined"
		[objectType]="assetType.Object"
		[objectID]="assetType.ObjectID"></d3s-admin-relationships-list>
</div>
