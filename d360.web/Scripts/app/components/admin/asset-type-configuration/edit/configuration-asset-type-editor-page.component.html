<d3s-asset-type-list-header [assetTypeClass]="assetTypeClass"></d3s-asset-type-list-header>
<div class="row">
	<div class="tile tile-detail">
		<d3s-loading [isLoading]="loadingCounter !== 0"></d3s-loading>
		<d3s-asset-type-editor 
			*ngIf="loadingCounter === 0"
			[assetTypeClass]="assetTypeClass"
			[id]="id"
			[parentID]="parentObjectId"
			[title]="formTitle"
			(onCancel)="cancel()"
			(onComplete)="actionComplete()">
		</d3s-asset-type-editor>
	</div>
</div>
