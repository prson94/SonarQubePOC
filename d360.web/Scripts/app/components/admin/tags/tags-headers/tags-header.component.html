<d3s-page-header [icon]="icon" [iconPath]="iconPath" [header]="header"></d3s-page-header>


<div class="tabs-container">
   <d3s-tabs [items]="tabs"></d3s-tabs>
   <button class="p-element tab btn-tags-types-toggler" *ngIf="isTagTypesFeatureEnabled">
      {{ btnTagsText }}
      <span 
      [class]="isTagTypesOpen ? 'fa fa-chevron-up' : 'fa fa-chevron-down'" 
      (click)="toggleTagTypesPanel()">
      </span>
   </button>

</div>

<ng-container *ngIf="showTagTypes">
   <d3s-tag-types (onTagTypeSelected)="tagTypeSelectedHandler($event)" />
</ng-container>
