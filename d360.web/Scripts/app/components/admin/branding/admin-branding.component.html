<div class="row admin-branding">

    <div class="col s12 overflow-container" style="display: flex">
        <div class="tile tile-detail">

            <div class="actions-header">
                <h2>Themes</h2>
                <div class="grid-action-buttons">
                    <button igButton
                            pTooltip="Create New Group"
                            tooltipPosition="top"
                            tooltipStyleClass="ig-tooltip"
                            class="ig-button-primary"
                            icon="fa-plus">
                    </button>
                    <button igButton
                            pTooltip="Create New Group"
                            tooltipPosition="top"
                            tooltipStyleClass="ig-tooltip"
                            class="ig-button-primary"
                            icon="fa-plus">
                    </button>
                    <button igButton
                            pTooltip="Create New Group"
                            tooltipPosition="top"
                            tooltipStyleClass="ig-tooltip"
                            class="ig-button-primary"
                            icon="fa-plus">
                    </button>
                </div>
            </div>


            <div class="theme-wrapper" *ngFor="let theme of themes">
                <svg width="158" height="80">
                    <image xlink:href="/api/v2/environment/themes/ace6795f-460a-42ca-baef-f5feeab977de.svg?width=158" src="yourfallback.png" width="158" height="80" />
                </svg>
            </div>

        </div>
        <div class="tile tile-detail side-panel">
            <side-panel (expandedChange)="sidePanelOpen=$event"
                        (selectedPanelChange)="sidePanelTab=$event"
                        [selectedItem]="selectedRow"
                        [panelApplies]="true"
                        [hasProfiling]="false"
                        hasDetail="true"
                        [storageKey]="sidePanelStorageKey"
                        [selectedPanel]="sidePanelTab">
                <ng-container *ngIf="sidePanelOpen && selectedRow != null">
                    <ng-container *ngIf="sidePanelTab === 'detail'">
                        details
                    </ng-container>
                </ng-container>
            </side-panel>
        </div>
    </div>
</div>
