<div class="tile tile-detail">
    <header *ngIf="!showEditor && !showDelete && !showDelete">
        <ng-container i18n>Fields for </ng-container>v{{version?.MajorVersion}}.{{version?.MinorVersion}}
        <d3s-tile-actions (addClick)="selected=null;showEditor=true;"
                          [(filterMode)]="showSimpleFilter"
                          [hasAdd]="true"
                          [hasFilterMode]="true"></d3s-tile-actions>
    </header>
    <d3s-loading [isLoading]="isLoading"></d3s-loading>
    <span *ngIf="!isLoading && !showDelete && !showEditor">
        <input (input)="dt.filterGlobal($event.target.value, 'contains')"
               [hidden]="!showSimpleFilter"
               class="grid-simple-filter"
               pInputText
               placeholder="{{searchText}}"
               size="100"
               type="text" />
        <p-table #dt
                 [(selection)]="selected"
                 [globalFilterFields]="['Name','Type','AllowFilter','AllowSelect','AllowSort']"
                 [pageLinks]="3"
                 [paginator]="true"
                 [rows]="10"
                 [value]="fields"
                 selectionMode="single">
            <ng-template pTemplate="header">
                <tr>
                    <th [pSortableColumn]="'Name'">
                        <ng-container i18n>Name</ng-container>
                        <d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'Type'">
                        <ng-container i18n>Data Type</ng-container>
                        <d3s-sortIcon [field]="'Type'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'AllowFilter'">
                        <ng-container i18n>Filter</ng-container>?
                        <d3s-sortIcon [field]="'AllowFilter'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'AllowSelect'">
                        <ng-container i18n>Select</ng-container>?
                        <d3s-sortIcon [field]="'AllowSelect'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'AllowSort'">
                        <ng-container i18n>Sort</ng-container>?
                        <d3s-sortIcon [field]="'AllowSort'"></d3s-sortIcon>
                    </th>
                    <th style="width: 35px"></th>
                    <th style="width: 35px"></th>
                </tr>
                <tr [hidden]="showSimpleFilter">
                    <th>
                        <d3s-column-filter [datatype]="'text'"
                                           [field]="'Name'"></d3s-column-filter>
                    </th>
                    <th>
                        <d3s-column-filter [datatype]="'text'"
                                           [field]="'Type'"></d3s-column-filter>
                    </th>
                    <th>
                        <d3s-column-filter [datatype]="'text'"
                                           [field]="'AllowFilter'"></d3s-column-filter>
                    </th>
                    <th>
                        <d3s-column-filter [datatype]="'text'"
                                           [field]="'AllowSelect'"></d3s-column-filter>
                    </th>
                    <th>
                        <d3s-column-filter [datatype]="'text'"
                                           [field]="'AllowSort'"></d3s-column-filter>
                    </th>
                    <th></th>
                    <th></th>
                </tr>
            </ng-template>
            <ng-template let-item pTemplate="body">
                <tr (dblclick)="selected=item;showEditor=true"
                    [pSelectableRow]="item">
                    <td>{{item.Name}}</td>
                    <td>{{item.Type}}</td>
                    <td>
                        <i *ngIf="item.AllowFilter"
                           class="fa fa-check enabled"
                           title="True"></i>
                        <i *ngIf="!item.AllowFilter"
                           class="fa fa-times disabled"
                           title="False"></i>
                    </td>
                    <td>
                        <i *ngIf="item.AllowSelect"
                           class="fa fa-check enabled"
                           title="True"></i>
                        <i *ngIf="!item.AllowSelect"
                           class="fa fa-times disabled"
                           title="False"></i>
                    </td>
                    <td>
                        <i *ngIf="item.AllowSort"
                           class="fa fa-check enabled"
                           title="True"></i>
                        <i *ngIf="!item.AllowSort"
                           class="fa fa-times disabled"
                           title="False"></i>
                    </td>
                    <td>
                        <div class="RowTools">
                            <a (click)="selected=item;showEditor=true;"
                               style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                        </div>
                    </td>
                    <td>
                        <div class="RowTools">
                            <a (click)="selected=item;showDelete=true;"
                               style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template *ngIf="dt.totalRecords"
                         pTemplate="summary">
                <d3s-grid-paging-info [first]="dt.first"
                                      [rows]="dt.rows"
                                      [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
            </ng-template>
        </p-table>
    </span>
    <d3s-admin-api-endpoint-version-fields-editor (onCloseClick)="showEditor = false;"
                                                  (onSaveClick)="showEditor = false; load()"
                                                  *ngIf="showEditor"
                                                  [entityId]="version?.EntityID"
                                                  [model]="selected"
                                                  [versionId]="version?.ID">
    </d3s-admin-api-endpoint-version-fields-editor>
    <d3s-delete-form (onCancel)="showDelete=false;"
                     *ngIf="showDelete"
                     [callback]="theDeleteCallback"
                     [itemId]="selected?.ID"
                     [prompt]="deleteModalTitle"
                     method="callback"></d3s-delete-form>
</div>
