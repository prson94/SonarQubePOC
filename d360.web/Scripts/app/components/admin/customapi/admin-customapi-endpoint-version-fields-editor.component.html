<header>{{headerTitle}}</header>
<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading">
    <div class="row"
         style="padding-top: 10px">
        <div class="col s6">
            <div class="FieldName">
                <ng-container i18n>Field</ng-container>
            </div>
            <div>
                <select [ngModel]="model.FieldTypeID"
                        (ngModelChange)="changeFieldType($event)"
                        style="width: 95%">
                    <option></option>
                    <option *ngFor="let f of fieldTypes"
                            [value]="f.ID">
                        {{f.FriendlyName}}
                    </option>
                </select>
            </div>
        </div>
    </div>
    <div class="row"
         style="padding-top: 10px">
        <div class="col s6">
            <div class="FieldName">
                <ng-container i18n>Xml Field Override Name</ng-container>
            </div>
            <div>
                <input [(ngModel)]="model.XmlFieldNameOverride"
                       type="text"
                       style="width: 95%" />
            </div>
        </div>
        <div class="col s6">
            <div class="FieldName">
                <ng-container i18n>Json Field Override Name</ng-container>
            </div>
            <div>
                <input [(ngModel)]="model.JsonFieldNameOverride"
                       type="text"
                       style="width: 95%" />
            </div>
        </div>
    </div>
    <div class="row"
         style="padding-top: 10px">
        <div class="col s4">
            <input [(ngModel)]="model.AllowSelect"
                   type="checkbox" /> <ng-container i18n>Allow Select</ng-container>
        </div>
        <div class="col s4">
            <input [(ngModel)]="model.AllowFilter"
                   type="checkbox" /> <ng-container i18n>Allow Filter</ng-container>
        </div>
        <div class="col s4">
            <input [(ngModel)]="model.AllowSort"
                   type="checkbox" /> <ng-container i18n>Allow Sort</ng-container>
        </div>
    </div>
    <div *ngIf="showMultiselectOptions"
         class="row"
         style="padding-top: 10px">
        <div class="col s6">
            <div class="FieldName"><ng-container i18n>Item Name Override</ng-container></div>
            <div>
                <input [(ngModel)]="model.ItemNameOverride"
                       type="text"
                       style="width:95%" />
            </div>
        </div>
        <div *ngIf="multiSelectFieldTypes != null && multiSelectFieldTypes.length > 0"
             class="col s6">
            <div class="FieldName"><ng-container i18n>Multiselect Fields</ng-container></div>
            <div>
                <p-multiSelect [options]="multiSelectFieldTypes"
                               [(ngModel)]="selectedFields"
                               optionLabel="Text"
                               dataKey="Value"
                               selectedItemsLabel="{0} items selected">
                </p-multiSelect>
            </div>
        </div>
    </div>
    <div class="row"
         style="padding-top: 10px">
        <div class="col s12">
            <button pButton
                    label="{{labelSave}}"
                    type="button"
                    (click)="save()"
                    [disabled]="!valid()"></button>
            <button pButton
                    label="{{labelClose}}"
                    type="button"
                    (click)="close()"></button>
        </div>
    </div>
</div>
