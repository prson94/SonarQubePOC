<div class="tile tile-detail">
    <header *ngIf="!showEditor && !showDelete">
        <ng-container i18n>URI Types for v{{version?.MajorVersion}}.{{version?.MinorVersion}}</ng-container>
        <d3s-tile-actions (addClick)="selected=null;showEditor=true;"
                          [(filterMode)]="showSimpleFilter"
                          [hasAdd]="true"
                          [hasFilterMode]="true"></d3s-tile-actions>
    </header>
    <d3s-loading [isLoading]="isLoading"></d3s-loading>
    <span *ngIf="!isLoading && !showDelete && !showEditor">
        <input (input)="dt.filterGlobal($event.target.value, 'contains')"
               [hidden]="!showSimpleFilter"
               class="grid-simple-filter"
               pInputText
               placeholder="{{searchText}}"
               size="100"
               type="text">
        <p-table #dt [(selection)]="selected"
                 [globalFilterFields]="['Format','UriType']"
                 [pageLinks]="3"
                 [paginator]="true"
                 [rows]="10"
                 [sortOrder]="1"
                 [value]="uris"
                 selectionMode="single"
                 sortField="Name">
            <ng-template pTemplate="header">
                <tr>
                    <th [pSortableColumn]="'Format'">
                        <ng-container i18n>Segment</ng-container>
                        <d3s-sortIcon [field]="'Format'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'UriType'">
                        <ng-container i18n>Type</ng-container>
                        <d3s-sortIcon [field]="'UriType'"></d3s-sortIcon>
                    </th>
                    <th style="width:40px"></th>
                    <th style="width:40px"></th>
                </tr>
                <tr [hidden]="showSimpleFilter">
                    <th>
                        <d3s-column-filter [datatype]="'text'"
                                           [field]="'Format'"></d3s-column-filter>
                    </th>
                    <th>
                        <d3s-column-filter [datatype]="'text'"
                                           [field]="'UriType'"></d3s-column-filter>
                    </th>
                    <th></th>
                    <th></th>
                </tr>
            </ng-template>
            <ng-template let-item
                         pTemplate="body">
                <tr (dblclick)="selected=item;showEditor=true"
                    [pSelectableRow]="item">
                    <td>{{item.Format}}</td>
                    <td>
                        <span *ngIf="item.UriType == 1">Collection</span>
                        <span *ngIf="item.UriType == 2">Singleton</span>
                    </td>
                    <td>
                        <div class="RowTools">
                            <a (click)="selected=item;showEditor=true"
                               style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                        </div>
                    </td>
                    <td>
                        <div class="RowTools">
                            <a (click)="selected=item;showDelete=true;"
                               style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template *ngIf="dt.totalRecords"
                         pTemplate="summary">
                <d3s-grid-paging-info [first]="dt.first"
                                      [rows]="dt.rows"
                                      [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
            </ng-template>
        </p-table>
    </span>
    <d3s-dynamic-editor (closeClick)="showEditor=false"
                        (saveClick)="saveUri($event)"
                        *ngIf="showEditor"
                        [objectID]="selected?.ID"
                        [objectType]="'Uri'"
                        [parentID]="version?.ID"
                        [selection]="selected"
                        [title]="'Uri'"></d3s-dynamic-editor>
    <d3s-delete-form (onCancel)="showDelete=false;"
                     *ngIf="showDelete"
                     [callback]="theDeleteCallback"
                     [itemId]="selected?.ID"
                     [method]="'callback'"
                     [prompt]="deleteModalTitle">
    </d3s-delete-form>
</div>
