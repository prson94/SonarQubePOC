<div class="row">
    <div class="col l5 m5">
        <div *ngIf="isLoading">
            <div style="padding:10px;text-align:center;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
        </div>
        <div *ngIf="!isLoading">
            <p-dataTable [value]="workflowItems" selectionMode="single" [(selection)]="selectedRow"  (onRowSelect)="selectRow()" [rows]="20" [paginator]="true" >
                <p-column field="WorkflowTypeDisplayName" header="Workflow" sortable="true" [filter]="true" filterMatchMode="contains"></p-column>
                <p-column field="ObjectName" header="Type" sortable="true" [filter]="true" filterMatchMode="contains"></p-column>
                <p-column field="ParentName" header="Subject Area" sortable="true" [filter]="true" filterMatchMode="contains"></p-column>
                <p-column>
                    <template let-col let-item="rowData">
                        <div class="RowTools">
                            <a (click)="isEditing = true;" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                            <a (click)="isDeleting = true;" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </template>
                </p-column>
            </p-dataTable>
        </div>
    </div>
    <div class="col l7 m7">
        <div id="DetailTile" class="tile tile-detail" *ngIf="!isEditing && !isDeleting">
            <object-detail [objectType]="'WorkflowTypeRelation'" [objectID]="selectedRow?.ID"></object-detail>
        </div>
    </div>
    <div class="col l7 m7" *ngIf="isEditing">
        <div class="tile tile-detail">
            <workflow-item-form [item]="selectedRow" (onCancel)="isEditing = false;"></workflow-item-form>
        </div>
    </div>
    <div  class="col l7 m7" *ngIf="isDeleting">
        <div class="title title-detail">
            <delete-form [uri]="'/form/DeleteWorkflowAllocationByID?id=' + selectedRow.ID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to de-allocate this workflow?'"
                         (onDeleteSuccess)="deleteRow(selectedRow.ID)"
                         (onCancel)="isDeleting=false;">
            </delete-form>
        </div>
    </div>
</div>
<p-growl [value]="messages"></p-growl>
