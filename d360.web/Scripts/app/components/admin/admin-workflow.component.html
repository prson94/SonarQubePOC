<div class="row">
    <div class="col l5 m5">
        <div class="tile tile-detail">
            <d3s-loading [isLoading]="isLoading"></d3s-loading>
            <div *ngIf="!isLoading">
                <header>
                    Workflows
                    <d3s-tile-actions [hasAdd]="true" (addClick)="add()" [hasFilterMode]="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
                </header>
                <input #gb [hidden]="!showSimpleFilter" type="text" pInputText size="100" placeholder="Search..." style="margin-bottom:10px;width:100%;">                                              
                <p-dataTable [globalFilter]="gb" [value]="workflowItems" selectionMode="single" (onRowDblclick)="selectedRow=$event.data;isEditing=true" [(selection)]="selectedRow" (onRowClick)="isAdding=false;" [rows]="20" [paginator]="true">
                    <p-column field="WorkflowTypeDisplayName" header="Workflow" sortable="true" [style]="{ 'width': '28%' }"  [filter]="!showSimpleFilter"></p-column>
                    <p-column field="ObjectName" header="Type" sortable="true" [style]="{ 'width': '28%' }" [filter]="!showSimpleFilter"></p-column>
                    <p-column field="ParentName" header="Subject Area" sortable="true" [style]="{ 'width': '28%' }" [filter]="!showSimpleFilter"></p-column>
                    <p-column [style]="{ 'width': '16%' }">
                        <template let-workflow="rowData" pTemplate type="body">
                            <div class="RowTools">
                                <a (click)="editRow(workflow)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                                <a (click)="selectedRow=workflow;isDeleting=true;" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                            </div>
                        </template>
                    </p-column>
                </p-dataTable>
            </div>
        </div>
    </div>
    <div class="col l7 m7">
        <div id="DetailTile" class="tile tile-detail" *ngIf="!isEditing && !isDeleting && !isAdding">
            <object-detail [objectType]="'WorkflowTypeRelation'" [objectID]="selectedRow?.ID"></object-detail>
        </div>
    </div>
    <div class="col l7 m7" *ngIf="isEditing && selectedRow">
        <div class="tile tile-detail">
            <workflow-item-form [item]="selectedRow" (onCancel)="isEditing = false;" (onSaveComplete)="confirmEdit($event);"></workflow-item-form>
        </div>
    </div>
    <div class="col l7 m7" *ngIf="isAdding">
        <div class="tile tile-detail">
            <workflow-item-form [item]="addingRow" (onCancel)="isAdding = false;" (onSaveComplete)="confirm($event);"></workflow-item-form>
        </div>
    </div>
    <div class="col l7 m7" *ngIf="isDeleting">
        <div class="title title-detail">
            <delete-form [uri]="'/form/DeleteWorkflowAllocationByID?id=' + selectedRow.ID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to de-allocate this workflow?'"
                         (onDeleteSuccess)="deleteRow(selectedRow.ID)"
                         (onCancel)="isDeleting=false;">
            </delete-form>
        </div>
    </div>
</div>
<p-growl [value]="messages"></p-growl>
