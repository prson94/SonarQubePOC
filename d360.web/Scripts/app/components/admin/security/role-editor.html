<d3s-modal additionalClasses="modal-dyn-editor asset-editor large-dialog modal-form"
		   [showTitle]="false"
		   (onClose)="cancel();"
		   [isVisible]="isModalVisible">
	<div class="editor-container">
		<div class="form-editor-container">
			<div class="form-header-wrapper">
				<div class="form-header">
					{{title}}
					<h2 i18n>Relationships</h2>
				</div>
				<ig-form-feedback-badges class="ig-form-feedback-badges"
										 [igformGroup]="roleForm"
										 [inputContainer]="formElement">
				</ig-form-feedback-badges>
			</div>
			<ig-message-box>
				<span i18n>
					Create a role that you can assign to users and groups.
				</span>
			</ig-message-box>
			<d3s-loading [isLoading]="isLoading"></d3s-loading>
			<div class="form-wrapper">
				<form #form (ngSubmit)="onSubmit()" [formGroup]="roleForm" *ngIf="!isLoading">
					<ig-property-group [igformGroup]="roleForm"
									   title="General"
									   [showHeaderLine]="false"
									   i18n-title>
						<div inputs>
							<div class="form-group">
								<div class="row">
									<div class="field-col">
										<label for="name" class="ig-label" i18n>Name</label>
										<input igInput
											   igSize="full"
											   [igDataCy]="'Role_Text_Name'"
											   type="text"
											   name="name"
											   formControlName="name"
											   required />
									</div>
								</div>

								<div class="row">
									<div class="field-col">
										<label for="description" class="ig-label" i18n>Description</label>
										<textarea igTextArea
											   igSize="full"
											   [igDataCy]="'Role_Text_Description'"
											   type="text"
											   name="description"
											   formControlName="description"
											   required></textarea>
									</div>
								</div>
							</div>
						</div>
					</ig-property-group>
				</form>
			</div>
		</div>
	</div>
	<div class="action-bar">
		<button igButton [disabled]="isSaving" class="ig-button-secondary" type="button" (click)="cancel()" label="{{cancelLabel}}"></button>
		<span class="grow"></span>
		<button [disabled]="isSubmitDisabled || isSaving || isSaveDisabled" [loading]="isSaving" igButton igAutoFocus class="ig-button-primary" margin (click)="onSubmit()" type="submit" i18n-label label="{{saveLabel}}"></button>
	</div>
</d3s-modal>
