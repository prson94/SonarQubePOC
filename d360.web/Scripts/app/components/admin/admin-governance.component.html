<div class="row">
    <div class="col s4">
        <div class="root-tile">
            <header><div id="AdminResponsibilityTypeGridTools"></div></header>
            <div id="AdminResponsibilityTypeGrid"></div>
            <table class="table" [mfData]="governanceItems" #mf="mfDataTable" [mfRowsOnPage]="50">
                <thead>
                    <tr>
                        <th style="width: 90%">
                            <mfDefaultSorter by="Name">Name</mfDefaultSorter>
                        </th>
                        <th style="width: 10%">
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of mf.data; let i=index;" (click)="selectRow(item.ID);" [class.selected]="selectedRow?.ID == item.ID">
                        <td> {{item.Name}}</td>
                        <td class="RowTools">
                           
                        </td>
                    </tr>
                    <tr></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="col s8">
        <div class="tile tile-detail">
            <object-detail [objectType]="'ResponsibilityType'" [objectID]="selectedRow?.ID"></object-detail>
        </div>
    </div>
</div>
