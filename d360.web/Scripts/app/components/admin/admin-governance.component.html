<div class="row">
    <div class="col s4">
        <div class="tile tile-detail">
            <header>                
                <d3s-tile-actions [hasAdd]="true" (addClick)="add()"></d3s-tile-actions>
            </header>
            <div id="AdminResponsibilityTypeGrid"></div>            
            <p-dataTable [value]="responsibilityTypeItems" selectionMode="single" [(selection)]="selectedRow" [rows]="20" [paginator]="true">
                <p-column field="Name" header="Name" sortable="true" [filter]="true" filterMatchMode="contains" [style]="{ 'width': '70%' }"></p-column>
                <p-column [style]="{ 'width': '30%' }">
                    <template let-col let-item="rowData">
                        <div class="RowTools">
                            <a (click)="edit(item.ID)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                            <a (click)="delete(item.ID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </template>
                </p-column>
            </p-dataTable>
        </div>
    </div>
    <div class="col s8" [ngSwitch]="formMode">
        <div *ngSwitchDefault class="tile tile-detail">
            <object-detail [objectType]="'ResponsibilityType'" [objectID]="selectedRow?.ID"></object-detail>
        </div>
        <div *ngSwitchCase="FormMode.Editing" class="tile tile-detail">
            <d3s-responsibility-type-form [id]="selectedRow.ID" (onSaveComplete)="save()" (onCancel)="cancel()"></d3s-responsibility-type-form>
        </div>
        <div *ngSwitchCase="FormMode.Adding" class="tile tile-detail">
            <d3s-responsibility-type-form [id]="0" (onSaveComplete)="save()" (onCancel)="cancel()"></d3s-responsibility-type-form>
        </div>
        <div *ngSwitchCase="FormMode.Deleting" class="tile tile-detail">
            <delete-form [uri]="'/form/DeleteResponsibilityTypeByID?id=' + selectedRow.ID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to delete this responsibility type?'"
                         (onDeleteSuccess)="confirmDelete()"
                         (onCancel)="cancel()">
            </delete-form>
        </div>
    </div>
</div>
