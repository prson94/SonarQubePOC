<d3s-modal additionalClasses="modal-dyn-editor asset-editor"
		   title="Delete Relationship Type"
		   (onClose)="cancel()"
		   i18n-title
		   [isVisible]="isModalVisible">
	<div class="content" *ngIf="relationshipType?.TotalRelationshipCount === 0">
		<span i18n>Are you sure you want to delete this relationship type?</span><br />
		<span i18n>Please note that this operation cannot be undone.</span>
	</div>
	<div class="content" *ngIf="relationshipType?.TotalRelationshipCount > 0">
		<span i18n>You cannot delete this relationship type. This relationship type is being used for {{relationshipType?.TotalRelationshipCount}} relationships</span>
	</div>
	<div class="action-bar">
		<button igButton igAutoFocus i18n-label label="Cancel" (click)="cancel()"></button>
		<span class="grow"></span>
		<button igButton class="ig-button-danger" i18n-label label="Delete" [disabled]="relationshipType?.TotalRelationshipCount > 0" [loading]="deleteInProgress" (click)="delete()"></button>
	</div>
</d3s-modal>
