<div class="grid-actions-header column-layout">
	<div class="grid-actions-header-row">
		<div class="simple-search">
			<ig-search-field [debounce]="600"
							 [(ngModel)]="simpleFilterValue"
							 (onSearch)="dt.filterGlobal($event, 'contains')"
							 mode="Keypress">
			</ig-search-field>
		</div>
		<div class="grid-action-buttons">
			<button [igDataCy]="'RelationshipTypeAdd_Add'"
					(click)="add()"
					igButton
					pTooltip="Add new relationship type"
					i18n-pTooltip
					tooltipPosition="top"
					tooltipStyleClass="ig-tooltip"
					class="ig-button-primary"
					icon="fa-plus">
			</button>
		</div>
	</div>
</div>

<div class="row">
	<div class="col s12">
		<p-table #dt [value]="relationships"
				 selectionMode="single"
				 [metaKeySelection]="true"
				 [globalFilterFields]="['RelationshipTypeName']"
				 [pageLinks]="3"
				 [paginator]="true"
				 [rows]="20"
				 [selection]="selected"
				 [stateStorage]="gridStateStorage"
				 stateKey="{{gridStorageKey}}"
				 [loading]="isLoading"
				 [loadingIcon]="'fa fa-spinner fa-spin'">
			<ng-template pTemplate="header">
				<tr>
					<th [pSortableColumn]="'RelationshipTypeName'">
						<ng-container i18n>Relationship Type</ng-container>
						<d3s-sortIcon [field]="'RelationshipTypeName'"></d3s-sortIcon>
					</th>
					<th style="width: 200px">Relationships Exist</th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-item>
				<tr (click)="selected=item;selectedChange.emit(selected);" (dblclick)="selected=item;selectedChange.emit(selected);showEditor=true;" [pSelectableRow]="item">
					<td>{{item.RelationshipTypeName}}</td>
					<td>
						<div class="ig-value">
							<ng-container *ngIf="item.HasRelationships; else falseTemplate">
								<i class="fa fa-check-circle enabled ig-bool" title="True"></i>
								<ng-container i18n>True</ng-container>
							</ng-container>
							<ng-template #falseTemplate>
								<i class="fa fa-times-circle disabled ig-bool" title="False"></i>
								<ng-container i18n>False</ng-container>
							</ng-template>
						</div>
					</td>
					<!--<td>
						<div class="RowTools">
							<d3s-preview-tooltip objectType="IntersectType" [objectId]="item.Id" icon="info"></d3s-preview-tooltip>
						</div>
					</td>
					<td>

						<div *ngIf="item?.Predicate.Type != 'Diagram' && item?.Predicate.Type != 'DiagramUse' && item?.Predicate.Type != 'DiagramReference'" class="RowTools">
							<a style="cursor:pointer;" title="Download all relationships in this type" (click)="downloadRel(item)"><i class="fa fa-download"></i></a>
						</div>
					</td>
					<td>
						<div *ngIf="!item.IsSystem" class="RowTools">
							<a style="cursor:pointer;" (click)="selected=item;selectedChange.emit(selected);showEditor=true"><i class="fa fa-pencil"></i></a>
						</div>
					</td>
					<td>
						<div *ngIf="!item.IsSystem" class="RowTools">
							<a style="cursor:pointer;" (click)="selected=item;selectedChange.emit(selected);showDelete=true"><i class="fa fa-trash-o"></i></a>
						</div>
					</td>-->
				</tr>
			</ng-template>
			<ng-template pTemplate="summary">
				<d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
			</ng-template>
		</p-table>
	</div>
</div>
<d3s-delete-form *ngIf="showDelete"
				 [callback]="theDeleteCallback"
				 [itemId]="selected?.Uid"
				 [method]="'callback'"
				 [prompt]="deletePromptText"
				 (onCancel)="showDelete=false;"></d3s-delete-form>
<d3s-admin-relationships-editor *ngIf="showEditor" [relationshipType]="selected" (saveClick)="saveRelationship($event)" (closeClick)="closeEditor()"></d3s-admin-relationships-editor>
