<div class="row">
    <div class="col s12 m5 l4" *ngIf="!isEditingFieldType">
        <div class="tile tile-detail">
            <header>Artifact Types                
                <d3s-tile-actions [hasAdd]="true" (addClick)="add(0)"></d3s-tile-actions>
            </header>
            <input type="text" pInputText [(ngModel)]="searchValue" placeholder="Search..." style="width: 100%;margin-bottom:10px;">                      
            <p-treeTable [value]="ArtifactTypes | treeSearch: searchValue:'Name'" selectionMode="single" [(selection)]="selectedRow">
                <p-column field="Name" header="Name" [style]="{ 'width': '60%' }"></p-column>
                <p-column>
                    <ng-template let-col let-item="rowData" pTemplate type="body">
                        <div class="RowTools">
                            <a style="cursor:pointer;" (click)="add(item.data.ID)"><i class="fa fa-plus"></i></a>
                            <a style="cursor:pointer;" (click)="edit(item.data.ID)"><i class="fa fa-pencil"></i></a>
                            <a style="cursor:pointer;" (click)="delete(item.data.ID)"><i class="fa fa-trash-o"></i></a>
                            <d3s-tooltip objectType="ArtifactType" [objectId]="item.data.ID" tooltipType="preview"><a (click)="navigate(item.data)" style="cursor:pointer;"><i class="fa fa-info"></i></a></d3s-tooltip>
                        </div>
                    </ng-template>
                </p-column>
            </p-treeTable>
        </div>        
    </div>
    <div *ngIf="isEditing" class="col s12 m7 l8">
        <div class="tile tile-detail">
            <d3s-artifact-type-form [id]="selectedRow?.data?.ID" [title]="'Edit Artifact Type'" (onCancel)="cancel()" (onComplete)="actionComplete($event)"></d3s-artifact-type-form>
        </div>
    </div>
    <div *ngIf="isAdding" class="col s12 m7 l8">
        <div class="tile tile-detail">
            <d3s-artifact-type-form [parentID]="selectedRow?.data?.ID" [title]="'Add Artifact Type'" (onCancel)="cancel()"  (onComplete)="actionComplete($event)"></d3s-artifact-type-form>
        </div>
    </div>    
    <div *ngIf="isDeleting" class="col s12 m7 l8">
        <div class="tile tile-detail">
            <d3s-delete-form [uri]="'/form/ArtifactType?id=' + selectedRow.data.ID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to delete this artifact type?'"
                         (onDeleteSuccess)="actionComplete($event,'success')"
                         (onDeleteFail)="actionComplete($event,'error')"
                         (onCancel)="cancel()">
            </d3s-delete-form>
        </div>
    </div>
    <div *ngIf="!isEditing && !isAdding && !isDeleting" class="col s12 m7 l8">
        <div class="tile tile-detail">
            <d3s-field-definition-tile [objectType]="objectType" [objectID]="selectedRow?.data?.ID"></d3s-field-definition-tile>
        </div>
        <div class="tile tile-detail" *ngIf="!isEditingFieldType && !isAddingFieldType">
            <d3s-people-responsibilities-tile [objectType]="objectType" [objectID]="selectedRow?.data?.ID" [title]="'Default Responsibilities'" [showHidden]="true"></d3s-people-responsibilities-tile>
        </div>
        <div class="tile tile-detail" *ngIf="!isEditingFieldType && !isAddingFieldType">
            <d3s-claims-tile [objectType]="objectType" [objectID]="selectedRow?.data?.ID" [readonly]="false"></d3s-claims-tile>
        </div>
        <div class="tile tile-detail" *ngIf="!isEditingFieldType && !isAddingFieldType">
            <d3s-admin-allocation [objectType]="objectType" [objectID]="selectedRow?.data?.ID"></d3s-admin-allocation>
        </div>
        <div class="tile tile-detail" *ngIf="!isEditingFieldType && !isAddingFieldType">
            <d3s-admin-relationships-list [filterToName]="selectedRow?.data?.Name"></d3s-admin-relationships-list>
        </div>        
    </div>
</div>
