<div class="row">
    <div class="col s12 m5 l4" *ngIf="!isEditingFieldType">
        <div class="tile tile-detail">
            <header>
                {{tabTitle}}
                <d3s-tile-actions [hasAdd]="true" (addClick)="add(0)"></d3s-tile-actions>
            </header>

            <p-treeTable [value]="ArtifactTypes" #assetTypeTree selectionMode="single" [(selection)]="selectedRow" [globalFilterFields]="filterFields" metaKeySelection="true" [paginator]="true" [rows]="defaultInitialItemsPerPage">
                <ng-template pTemplate="caption">
                    <input type="text" pInputText (input)="assetTypeTree.filterGlobal($event.target.value, 'contains')" placeholder="Search..." style="width: 100%;margin-bottom:10px;margin-right:0px;margin-left:0px">
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 60%">Name</th>
                        <th style="width: 30px; overflow:visible"></th>
                        <th style="width: 30px"></th>
                        <th style="width: 30px"></th>
                        <th style="width: 30px"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowNode let-item="rowData">
                    <tr [ttSelectableRow]="rowNode" #treetableRows>
                        <td>
                            <d3s-treeTableToggler [rowNode]="rowNode"></d3s-treeTableToggler>
                            {{item.Name}}
                        </td>
                        <td>
                            <d3s-preview-tooltip objectType="ArtifactType" [objectId]="item.ID" icon="info"></d3s-preview-tooltip>
                        </td>
                        <td>
                            <div class="RowTools">
                                <a style="cursor:pointer;" (click)="add(item.ID)"><i class="fa fa-plus"></i></a>
                            </div>
                        </td>
                        <td>
                            <div class="RowTools">
                                <a style="cursor:pointer;" (click)="edit(item.ID)"><i class="fa fa-pencil"></i></a>
                            </div>
                        </td>
                        <td>
                            <div class="RowTools">
                                <a style="cursor:pointer;" (click)="delete(item.ID)"><i class="fa fa-trash-o"></i></a>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-treeTable>
        </div>
    </div>
    <div *ngIf="isEditing" class="col s12 m7 l8">
        <div class="tile tile-detail">
            <d3s-asset-type-editor [assetTypeClass]="assetTypeClass" [id]="editorModel?.data?.AssetTypeID" [parentID]="editorModel?.data?.ParentID" [title]="formTitle" (onCancel)="cancel()" (onComplete)="actionComplete($event)"></d3s-asset-type-editor>
        </div>
    </div>
    <div *ngIf="isAdding" class="col s12 m7 l8">
        <div class="tile tile-detail">
            <d3s-asset-type-editor [assetTypeClass]="assetTypeClass" [parentID]="selectedRow?.data?.ID" [title]="'Add Business Asset'" (onCancel)="cancel()" (onComplete)="actionComplete($event)"></d3s-asset-type-editor>
        </div>
    </div>
    <div *ngIf="isDeleting" class="col s12 m7 l8">
        <div class="tile tile-detail">
            <d3s-artifact-type-delete (onCancel)="cancel()" [callback]="theDeleteCallback" [artifactTypeId]="selectedRow.data.ID" [assetTypeId]="selectedRow.data.AssetTypeID"></d3s-artifact-type-delete>
        </div>
    </div>
    <div *ngIf="!isEditing && !isAdding && !isDeleting" class="col s12 m7 l8">
        <div class="tile tile-detail">
            <d3s-field-definition-tile [objectType]="objectType" [objectID]="selectedRow?.data?.ID"></d3s-field-definition-tile>
        </div>
        <div class="tile tile-detail" *ngIf="!isEditingFieldType && !isAddingFieldType">
            <d3s-responsibility-relations queryType="A" [id]="selectedRow?.data?.AssetTypeID" [showAddButton]="false"></d3s-responsibility-relations>
        </div>
        <div class="tile tile-detail" *ngIf="!isEditingFieldType && !isAddingFieldType">
            <d3s-admin-allocation [objectType]="objectType" [objectID]="selectedRow?.data?.ID"></d3s-admin-allocation>
        </div>
        <div class="tile tile-detail" *ngIf="!isEditingFieldType && !isAddingFieldType">
            <d3s-admin-relationships-list [filterToName]="selectedRow?.data?.Name" [objectType]="objectType" [objectID]="selectedRow?.data?.ID"></d3s-admin-relationships-list>
        </div>
    </div>
</div>
