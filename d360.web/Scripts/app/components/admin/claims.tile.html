<div *ngIf="objectType && objectID">
    <header>
        {{title}}
    </header>
    <div *ngIf="isLoading" style="width:100%; text-align:center;">
        <div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
    </div>
    <div *ngIf="!isLoading">
        <p-dataTable #dt [value]="claimItems" selectionMode="single" [rows]="20" [paginator]="true" expandableRows="true">                        
            <template let-item pTemplate="rowexpansion">
                <d3s-claims-matrix [objectType]="item.ObjectType" [objectID]="item.ObjectID" [responsibilityTypeID]="item.ResponsibilityTypeID" [readonly]="readonly"></d3s-claims-matrix>
            </template>
            <p-column expander="true" [style]="{ 'width':'25px', 'padding-left': '2px', 'padding-right': '2px', 'text-align' : 'center' }"></p-column>
            <p-column field="Name" header="Name" sortable="true"></p-column>
            <p-column header="Description" sortable="true">
                <template let-col let-item="rowData" pTemplate type="body">
                    <div [innerHtml]="item?.Description"></div>
                </template>
            </p-column>
        </p-dataTable>
    </div>
</div>
