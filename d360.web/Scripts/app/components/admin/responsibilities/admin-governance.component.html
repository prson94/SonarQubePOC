<div class="row">
    <div class="col s4">
        <div class="tile tile-detail">
            <header>
                Responsibility Types
                <d3s-tile-actions [hasAdd]="true" (addClick)="add()"></d3s-tile-actions>
            </header>
            <div id="AdminResponsibilityTypeGrid"></div>
            <input #gb type="text" pInputText size="100" placeholder="Search..." class="grid-simple-filter">
            <p-dataTable #dt [globalFilter]="gb" [value]="responsibilityTypeItems" selectionMode="single" [(selection)]="selectedRow" [rows]="20" [paginator]="true">
                <p-footer *ngIf="dt.totalRecords"><d3s-grid-paging-info [totalRecords]="dt.totalRecords" [first]="dt.first" [rows]="dt.rows"></d3s-grid-paging-info></p-footer>
                <p-column field="Name" header="Name" sortable="true" [style]="{ 'width': '70%' }"></p-column>
                <p-column [style]="{ 'width': '30%' }">
                    <ng-template let-col let-item="rowData" pTemplate type="body">
                        <div class="RowTools">
                            <a (click)="edit(item.ID)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                            <a (click)="delete(item.ID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </ng-template>
                </p-column>
            </p-dataTable>
        </div>
    </div>
    <div class="col s8" [ngSwitch]="formMode">
        <div *ngSwitchDefault class="tile tile-detail">
            <object-detail [objectType]="'ResponsibilityType'" [objectID]="selectedRow?.ID"></object-detail>
        </div>
        <div *ngSwitchDefault class="tile tile-detail">
            <d3s-responsibility-rules [id]="selectedRow?.ID"></d3s-responsibility-rules>
        </div>
        <div *ngSwitchCase="FormMode.Editing" class="tile tile-detail" style="padding:10px;">
            <header>Edit Role</header>
            <d3s-responsibility-type-form [id]="selectedRow.ID" (onSaveComplete)="save($event)" (onCancel)="cancel()"></d3s-responsibility-type-form>
        </div>
        <div *ngSwitchCase="FormMode.Adding" class="tile tile-detail" style="padding:10px;">
            <header>Add Role</header>
            <d3s-responsibility-type-form [id]="0" (onSaveComplete)="save($event)" (onCancel)="cancel()"></d3s-responsibility-type-form>
        </div>
        <div *ngSwitchCase="FormMode.Deleting" class="tile tile-detail">
            <d3s-delete-form [uri]="'/form/DeleteResponsibilityTypeByID?id=' + selectedRow.ID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to delete this responsibility type?'"
                         (onDeleteSuccess)="confirmDelete('success')"
                         (onDeleteFail)="confirmDelete('error')"
                         (onCancel)="cancel()">
            </d3s-delete-form>
        </div>
    </div>
</div>
