<div *ngIf="isLoading" style="text-align:center;">
    <i class="fa fa-spinner fa-spin fa-2x"></i>
</div>
<div *ngIf="!isLoading">
    <header>{{actionName}} Rule</header>
    <form (ngSubmit)="onSubmit()" #ruleEditor="ngForm">
        <div class="row">
            <div class="col s12 form-instructions">
                Modify your rule using the form below.
                <div class="form-instructions-error" data-bind="visible: FormInvalid, text: FormValidationMessage">
                </div>
            </div>
            <div class="col l7 m7 s12">
                <div id='NameTip' class="FieldNameRequired">Name</div>
                <input [ngModelOptions]="{standalone: true}" required name="name" pInputText type="text" [(ngModel)]="model.Name" style="width: 98%; display: block;" #Name="ngModel" />
                <div [hidden]="Name.valid || Name.pristine">Friendly name is required</div>
            </div>
            <div class="col l5 m5 s12">
                <div id='TypeTip' class="FieldNameRequired">Selected Type</div>
                <p-dropdown [ngModelOptions]="{standalone: true}" required name="objecttype" [options]="objectTypes" [ngModel]="model.ObjectString" [style]="{'width':'98%', 'display' : 'block'}" (onChange)="loadObjectType($event.value)" #objectType="ngModel"></p-dropdown>
                <div [hidden]="objectType.valid || objectType.pristine">Object type is required</div>
            </div>
        </div>
        <div class="row" *ngIf="model.Object">
            <div class="col l7 m7 s12">
                <div>WHEN</div>
                <table class="highlight, striped" cellpadding="5">
                    <thead>
                        <tr>
                            <th>Check Type</th>
                            <th>Field/Relation</th>
                            <th>Value</th>
                            <th style="width: 50px; text-align: right">
                                <a style="text-decoration:none; color:#000; cursor: pointer; font-size:1.5em; padding:5px" (click)="addWhen()"><i class='fa fa-plus' title='Add check'></i></a>
                            </th>
                        </tr>
                    </thead>
                    <tbody *ngFor="let item of model.Definition.When; let i=index;">
                        <tr>
                            <td>
                                <p-dropdown [ngModelOptions]="{standalone: true}" [options]="whenCheckTypes" [(ngModel)]="item.CheckType" [style]="{ 'width' : '95%' }"></p-dropdown>
                            </td>
                            <td>
                                <p-dropdown *ngIf="item.CheckType == 'F'" [ngModelOptions]="{standalone: true}" [options]="whenFieldTypes" [(ngModel)]="item.FieldTypeID" [style]="{ 'width' : '95%' }" (onChange)="loadWhenValuesForFieldType(item)"></p-dropdown>
                                <p-dropdown *ngIf="item.CheckType == 'R'" [ngModelOptions]="{standalone: true}" [options]="whenIntersectTypes" [(ngModel)]="item.IntersectTypeID" [style]="{ 'width' : '95%' }" (onChange)="loadValuesForIntersectType(item)"></p-dropdown>
                            </td>
                            <td>
                                <p-dropdown *ngIf="item.CheckType == 'F' && item.IsLookup" [ngModelOptions]="{standalone: true}" [options]="item.ValueOptions" [(ngModel)]="item.Value" [style]="{ 'width' : '95%' }"></p-dropdown>
                                <input *ngIf="item.CheckType == 'F' && !item.IsLookup" [ngModelOptions]="{standalone: true}" required name="name" pInputText type="text" [(ngModel)]="item.Value" style="width: 98%; display: block;" />
                                
                                <p-dropdown *ngIf="item.CheckType == 'R'" [ngModelOptions]="{standalone: true}" [options]="item.ValueOptions" [(ngModel)]="item.Value" [style]="{ 'width' : '95%' }"></p-dropdown>
                            </td>
                            <td><a style="text-decoration:none; color:#000; cursor: pointer; font-size:1.5em; padding:5px" (click)="removeFusion(i)"><i class='fa fa-trash' title='Remove'></i></a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="col l5 m5 s12">
                <div class="form-instructions">Test your WHEN query.</div>
                <button pButton type="button" label="Test" (click)="testWhen()"></button>
                <p-dataTable #dt [value]="WhenTestRows" selectionMode="single" scrollable="true" scrollHeight="150px">
                    <p-column field="Name" header="Name" sortable="true"></p-column>
                </p-dataTable>
            </div>
        </div>

        <div class="row" *ngIf="model.Object">
            <div class="col l7 m7 s12">
                <div>THEN</div>
                <p-dropdown [ngModelOptions]="{standalone: true}" [options]="thenObjectTypes" [(ngModel)]="model.Definition.Then.Object" [style]="{ 'width' : '95%' }" (onChange)="loadThenFilterOptions($event.value)"></p-dropdown>

                <div>Conditions:</div>
                <table class="highlight, striped" cellpadding="5">
                    <thead>
                        <tr>
                            <th>Field</th>
                            <th>Value</th>
                            <th style="width: 50px; text-align: right">
                                <a style="text-decoration:none; color:#000; cursor: pointer; font-size:1.5em; padding:5px" (click)="addThenCondition()"><i class='fa fa-plus' title='Add condition'></i></a>
                            </th>
                        </tr>
                    </thead>
                    <tbody *ngFor="let item of model.Definition.Then.Conditions; let i=index;">
                        <tr>
                            <td>
                                <p-dropdown [ngModelOptions]="{standalone: true}" [options]="thenFieldTypes" [(ngModel)]="item.FieldTypeID" [style]="{ 'width' : '95%' }" (onChange)="loadThenValuesForFieldType(item)"></p-dropdown>
                            </td>
                            <td>
                                <p-dropdown *ngIf="item.IsLookup" [ngModelOptions]="{standalone: true}" [options]="item.ValueOptions" [(ngModel)]="item.Value" [style]="{ 'width' : '95%' }"></p-dropdown>
                                <input *ngIf="!item.IsLookup" [ngModelOptions]="{standalone: true}" required name="name" pInputText type="text" [(ngModel)]="item.Value" style="width: 98%; display: block;" #Name="ngModel" />
                            </td>
                            <td><a style="text-decoration:none; color:#000; cursor: pointer; font-size:1.5em; padding:5px" (click)="removeThenCondition(i)"><i class='fa fa-trash' title='Remove'></i></a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="col l5 m5 s12">
                <div class="form-instructions">Test your THEN query.</div>
                <button pButton type="button" label="Test" (click)="testThen()"></button>
                <p-dataTable #dt [value]="ThenTestRows" selectionMode="single" scrollable="true" scrollHeight="150px">
                    <p-column field="ResourceName" header="User" sortable="true"></p-column>
                    <p-column field="GroupName" header="Via Group" sortable="true"></p-column>
                </p-dataTable>
            </div>
        </div>

        <div class="row" *ngIf="errorMessage != ''">
            <div class="col s12">
                <div style="color:red">{{errorMessage}}</div>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <div style="padding-top:10px">
                    <button pButton type="submit" [disabled]="!ruleEditor.form.valid" label="Save"></button>
                    <button pButton type="button" label="Cancel" (click)="cancel()"></button>
                </div>
            </div>
        </div>
    </form>
</div>
