<div class="row">
    <div class="col s12 m7">
        <div class="tile tile-detail">
            <div [ngSwitch]="mapFormMode">
                <div *ngSwitchCase="FormMode.Default">
                    <d3s-admin-maps-list (onAddClick)="addMap()"
                                         (onEditClick)="editMap($event)"
                                         (onDeleteClick)="deleteMap($event)"
                                         (onSelectionChange)="mapType = $event">
                    </d3s-admin-maps-list>
                </div>
                <div *ngSwitchCase="FormMode.Adding">
                    <d3s-admin-maps-editor (onCancel)="mapFormMode = FormMode.Default;"
                                           (onSave)="mapFormMode = FormMode.Default">
                    </d3s-admin-maps-editor>
                </div>
                <div *ngSwitchCase="FormMode.Editing">
                    <d3s-admin-maps-editor [mapTypeId]="mapType.ID"
                                           (onCancel)="mapFormMode = FormMode.Default;"
                                           (onSave)="mapFormMode = FormMode.Default">
                    </d3s-admin-maps-editor>
                </div>
                <div *ngSwitchCase="FormMode.Deleting">
                    <div class="row">
                        <div class="col s12">
                            Are you sure you want to delete this map type?
                        </div>
                        <div class="col s12">
                            <button pButton label="Delete" (click)="deleteMapConfirm()"></button>
                            <button pButton label="Cancel" (click)="mapFormMode = FormMode.Default"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col s12 m5">
        <div class="tile tile-detail">
            <div [ngSwitch]="templateFormMode">
                <div *ngSwitchCase="FormMode.Default">
                    <d3s-admin-maps-template-list 
                                                  [mapTypeId]="mapType?.ID"
                                                  (onAddClick)="addTemplate()"
                                                  (onEditClick)="editTemplate($event)"
                                                  (onDeleteClick)="deleteTemplate($event)">
                    </d3s-admin-maps-template-list>
                </div>
                <div *ngSwitchCase="FormMode.Adding">
                    <d3s-admin-maps-template-editor 
                                                    [mapTypeId]="mapType?.ID"
                                                    (onCancel)="templateFormMode = FormMode.Default"
                                                    (onSave)="templateFormMode = FormMode.Default">
                    </d3s-admin-maps-template-editor>
                </div>
                <div *ngSwitchCase="FormMode.Editing">
                    <d3s-admin-maps-template-editor 
                                                    [mapTypeId]="mapType?.ID"
                                                    [mapTypeTemplateId]="mapTypeTemplate.ID"
                                                    (onCancel)="templateFormMode = FormMode.Default"
                                                    (onSave)="templateFormMode = FormMode.Default">
                    </d3s-admin-maps-template-editor>
                </div>
                <div *ngSwitchCase="FormMode.Deleting">
                    <div class="row">
                        <div class="col s12">
                            Are you sure you want to delete this map type template?
                        </div>
                        <div class="col s12">
                            <button pButton label="Delete" (click)="deleteTemplateConfirm()"></button>
                            <button pButton label="Cancel" (click)="templateFormMode = FormMode.Default"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
