<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading">
    <header>
        {{title}}
        <d3s-tile-actions [hasRefresh]="true"
                          (refreshClick)="refresh()"
                          [hasExportErrors]="true"
                          (exportErrorsClick)="exportErrors()"
                          [hasExportOriginal]="true"
                          (exportOriginalClick)="exportOriginal()"></d3s-tile-actions>
    </header>
    <div>
        <ig-search-field mode="Keypress"
                         [debounce]="300"
                         (onSearch)="onSimpleSearch($event)"
                         [(ngModel)]="simpleTextFilter"
                         style="width:100%; padding-bottom:5px">
        </ig-search-field>
    </div>
    <p-table #dt
             [value]="items"
             [scrollable]="true"
             scrollWidth="100%"
             selectionMode="single"
             [metaKeySelection]="true"
             [globalFilterFields]="globalFilterFields"
             [lazy]="true"
             (onLazyLoad)="loadItemsLazy($event)"
             [totalRecords]="totalRecords"
             [paginator]="true"
             [rows]="rowsPerPage"
             [rowsPerPageOptions]="defaultPagingOptions"
             [loading]="isLoading"
             [loadingIcon]="'fa fa-spinner fa-spin'">
        <ng-template pTemplate="colgroup">
            <colgroup>
                <col style="width:125px">
                <col *ngFor="let column of columns"
                     style="width:250px">
                <col style="width:100px">
                <col style="width:250px">
            </colgroup>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th [pSortableColumn]="'Status'"
                    style="width: 125px">
                    Status
                    <d3s-sortIcon [field]="'Status'"></d3s-sortIcon>
                </th>
                <th *ngFor="let column of columns"
                    [pSortableColumn]="column.datafield"
                    style="width: 250px">
                    {{column.text}}
                    <d3s-sortIcon [field]="column.datafield"></d3s-sortIcon>

                </th>
                <th [pSortableColumn]="'RowIndex'"
                    style="width: 100px">
                    Row
                    <d3s-sortIcon [field]="'RowIndex'"></d3s-sortIcon>
                </th>
                <th [pSortableColumn]="'StatusMessage'"
                    style="width: 250px">
                    Message
                    <d3s-sortIcon [field]="'StatusMessage'"></d3s-sortIcon>
                </th>
            </tr>
            <tr [hidden]="showSimpleFilter">
                <th>
                    <d3s-column-filter [field]="'Status'"
                                       [datatype]="'text'"></d3s-column-filter>
                </th>
                <th *ngFor="let column of columns">
                    <d3s-column-filter [field]="column.datafield"></d3s-column-filter>
                </th>
                <th>
                    <d3s-column-filter [field]="'RowIndex'"
                                       [datatype]="'text'"></d3s-column-filter>
                </th>
                <th>
                    <d3s-column-filter [field]="'StatusMessage'"
                                       [datatype]="'text'"></d3s-column-filter>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body"
                     let-item>
            <tr [pSelectableRow]="item">
                <td>{{item.Status}}</td>
                <td *ngFor="let column of columns">
                    <span [ngSwitch]="column.type">
                        <span *ngSwitchCase="'date'"><span *ngIf="item[column.datafield]">{{item[column.datafield] | date:'shortDate'}}</span></span>
                        <span *ngSwitchCase="'datetime'"><span *ngIf="item[column.datafield]">{{item[column.datafield] | utcDate | date:'medium'}}</span></span>
                        <span *ngSwitchDefault><span *ngIf="item[column.datafield]">{{item[column.datafield]}}</span></span>
                    </span>
                </td>
                <td>{{item.RowIndex}}</td>
                <td>
                    <span *ngIf="item.StatusMessage"
                          [innerHtml]="item.StatusMessage"></span>
                </td>
            </tr>
        </ng-template>
        <ng-template *ngIf="dt.totalRecords"
                     pTemplate="summary">
            <d3s-grid-paging-info [first]="dt.first"
                                  [rows]="dt.rows"
                                  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
        </ng-template>
    </p-table>
</div>
