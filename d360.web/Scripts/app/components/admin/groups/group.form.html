<header>{{title}}</header>
<div class="clear"></div>
<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading">
    <form #groupForm="ngForm" (ngSubmit)="save()">
        <div class="row">
            <div class="col s6">
                <label class="FieldName" style="display:block;" for="name">Name</label>
                <input pInputText [(ngModel)]="model.group.Name" type="text" style="width:98%" name="name" required />
            </div>
            <div class="col s6">
                <label class="FieldName" style="display:block;" for="isActiveDirectoryGroup">Is Active Directory Group</label>
                <input pCheckbox [(ngModel)]="model.group.IsActiveDirectoryGroup" type="checkbox" name="isActiveDirectoryGroup" />
            </div>
        </div>
        <div class="row">
            <div class="col s6" style="margin-bottom:10px">
                <label class="FieldName" style="display:block;" for="primary">Primary Owner &nbsp;&nbsp;<a *ngIf="!primaryOwnerGrid" style="cursor:pointer;" (click)="showPrimaryOwnerResourceGrid()"><i class="fa fa-pencil"></i></a></label>
                <div *ngIf="!primaryOwnerGrid"><span *ngIf="model.group">{{model.group.PrimaryOwnerName}}</span></div>
               <div *ngIf="primaryOwnerGrid">
                    <d3s-resource-multiselect-grid [multiple]="false" [(ngModel)]="primaryFieldValue" [showSelectedSummary]="false" [showToolTip]="true" [showResourceType]="true" ngDefaultControl [field]="primaryOwnerField" [ngModelOptions]="{standalone: true}"></d3s-resource-multiselect-grid>
                </div>
            </div>
            <div class="col s6">
                <label class="FieldName" style="display:block;" for="secondary">
                    Secondary Owner &nbsp;&nbsp;<a *ngIf="!secondaryOwnerGrid" style="cursor:pointer;" (click)="showSecondaryOwnerResourceGrid()"><i class="fa fa-pencil"></i></a>
                </label>
                <div *ngIf="!secondaryOwnerGrid"><span *ngIf="model.group">{{model.group.SecondaryOwnerName}}</span></div>
                 <div *ngIf="secondaryOwnerGrid">
                    <d3s-resource-multiselect-grid [multiple]="false" [(ngModel)]="secondaryFieldValue" [showSelectedSummary]="false" [showToolTip]="true" [showResourceType]="true" ngDefaultControl [field]="secondaryOwnerField" [ngModelOptions]="{standalone: true}"></d3s-resource-multiselect-grid>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col s12">
                <label class="FieldName" style="display:block;" for="description">Description</label>
                <p-editor [(ngModel)]="model.group.Description" name="description"></p-editor>
            </div>
        </div>
        <div class="row">
            <div class="col s12">
                <div style="padding-top:10px">
                    <button pButton type="submit" label="Save" [disabled]="!groupForm.form.valid"></button><button pButton type="button" label="Cancel" (click)="cancel()"></button>
                </div>
            </div>
        </div>
    </form>
</div>
