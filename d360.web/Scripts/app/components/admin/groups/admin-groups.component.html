<div class="row">
    <div class="col l3 m4 s12">
        <div class="tile tile-detail">
            <header>Groups<d3s-tile-actions [hasAdd]="true" (addClick)="add()"></d3s-tile-actions></header>
            <div id="List">


                <input type="text" [hidden]="!showSimpleFilter" pInputText size="100" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search..." class="grid-simple-filter">
                <p-table #dt [value]="groupItems" selectionMode="single" [metaKeySelection]="true" [globalFilterFields]="['Name']" [paginator]="true" [rows]="20" [style]="{'width':'100%'}" (onRowSelect)="select($event)">
                    <ng-template pTemplate="header">
                        <tr>
                            <th [pSortableColumn]="'Name'" style="width: 100px">
                                Name
                                <d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
                            </th>
                            <th style="width: 20px"></th>
                            <th style="width: 20px"></th>
                            <th style="width: 20px"></th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-item>
                        <tr [pSelectableRow]="item">
                            <td>{{item.Name}}</td>
                            <td>
                                <div class="RowTools">
                                    <a (click)="groupUrl(item.ID)" style="cursor:pointer;"><i class="fa fa-info"></i></a>
                                </div>
                            </td>
                            <td>
                                <div class="RowTools">
                                    <a (click)="edit(item.ID)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                                </div>
                            </td>
                            <td>
                                <div class="RowTools">
                                    <a (click)="delete(item.ID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                                </div>
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template *ngIf="dt.totalRecords" pTemplate="summary">
                        <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
                    </ng-template>
                </p-table>


                <!--
                <input #gb type="text" pInputText size="100" placeholder="Search..." class="grid-simple-filter">
                <p-dataTable #dt [globalFilter]="gb" scrollable="true" scrollWidth="100%" [value]="groupItems" selectionMode="single" [rows]="20" [paginator]="true" [style]="{'width':'100%'}" (onRowSelect)="select($event)">
                    <p-footer *ngIf="dt.totalRecords"><d3s-grid-paging-info [totalRecords]="dt.totalRecords" [first]="dt.first" [rows]="dt.rows"></d3s-grid-paging-info></p-footer>

                                <a (click)="groupUrl(item.ID)" style="cursor:pointer;"><i class="fa fa-info"></i></a>
                            </div>
                        </ng-template>
                    </p-column>
                    <p-column [style]="{ 'width': '20px' }">

                                <a (click)="edit(item.ID)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                            </div>
                        </ng-template>
                    </p-column>
                    <p-column [style]="{ 'width': '20px' }">

                            </div>
                        </ng-template>
                    </p-column>
                </p-dataTable>-->
            </div>
        </div>
    </div>
    <div class="col l9 m8 s12" [ngSwitch]="formMode">
        <div *ngSwitchDefault class="tile tile-detail">
            <d3s-group-members [groupId]="selectedRow?.ID" [groupName]="selectedRow?.Name"></d3s-group-members>
        </div>
        <div *ngSwitchCase="FormMode.Adding" class="tile tile-detail">
            <d3s-group-form [id]="0" [title]="'Add Group'" (onCancel)="cancel()" (onSuccess)="success($event)" (onError)="error($event)"></d3s-group-form>
        </div>
        <div *ngSwitchCase="FormMode.Editing" class="tile tile-detail">
            <d3s-group-form [id]="selectedRow.ID" [title]="'Edit ' + selectedRow.Name" (onCancel)="cancel()" (onSuccess)="success($event)" (onError)="error($event)"></d3s-group-form>
        </div>
        <div *ngSwitchCase="FormMode.Deleting" class="tile tile-detail">
            <d3s-delete-form [uri]="'/form/DeleteGroupByID?id=' + selectedRow.ID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to remove ' + selectedRow.Name + '?'"
                         (onDeleteSuccess)="confirmDelete($event);"
                         (onDeleteFail)="errorDelete($event)"
                         (onCancel)="cancel();">
            </d3s-delete-form>
        </div>
    </div>
</div>
