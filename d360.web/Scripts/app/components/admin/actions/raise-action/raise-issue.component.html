<ng-container *ngIf="(assetUid || assetTypeUid) && issueTypes && issueTypes.length > 0">
	<button type="button" igButton class="ig-button-accent" (click)="menu.toggle($event)" i18n>Take Action</button>
	<ig-popup-menu [items]="popupMenu" #menu [tabIndex]="10"></ig-popup-menu>
</ng-container>

<action-modal-form [isModalVisible]="isModalVisible"
				   [issueType]="selected"
				   [hasSidePanel]="hasSidePanel"
				   [breadCrumbs]="breadCrumbs"
				   (onSave)="onSave($event)"
				   (onClose)="close()"></action-modal-form>
