<ng-container *ngIf="assetUid || assetTypeUid">
	<button type="button" igButton class="ig-button-accent" (click)="menu.toggle($event)" i18n>Take Action</button>
	<ig-popup-menu [items]="popupMenu" #menu [tabIndex]="10"></ig-popup-menu>
</ng-container>

<action-modal-form [isModalVisible]="isModalVisible" [uid]="selectedUid" (onClose)="selectedUid=null; isModalVisible=false;"></action-modal-form>
