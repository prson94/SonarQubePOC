<div>
    <header i18n>Home Page Customization</header>
    <div class="row">
        <div class="col s6">
            <div class="FieldName" i18n>
                Tile Options
            </div>
            <div>
                <p-checkbox igCheckbox
                            [(ngModel)]="companySettings.ShowHomeAssignmentTile"
                            (ngModelChange)="companySettings.ShowHomeAssignmentTile = $event; companySettingsChange.emit(companySettings)"
                            label="Show assignment tile"
                            i18n-label
                            binary="true">
                </p-checkbox>
            </div>
            <div>
                <p-checkbox igCheckbox
                            [(ngModel)]="companySettings.ShowHomeBoardTile"
                            (ngModelChange)="companySettings.ShowHomeBoardTile = $event; companySettingsChange.emit(companySettings)"
                            label="Show board tile"
                            i18n-label
                            binary="true">
                </p-checkbox>
            </div>
            <div>
                <p-checkbox igCheckbox
                            [(ngModel)]="companySettings.ShowHomeActivityTile"
                            (ngModelChange)="companySettings.ShowHomeActivityTile = $event; companySettingsChange.emit(companySettings)"
                            label="Show activity tile"
                            i18n-label
                            binary="true">
                </p-checkbox>
            </div>
        </div>
        <div class="col s6">
            <div class="row">
                <div class="col s12">
                    <p-checkbox igCheckbox
                                [(ngModel)]="companySettings.ShowHomePageTitle"
                                (ngModelChange)="companySettings.ShowHomePageTitle = $event; companySettingsChange.emit(companySettings)"
                                label="Show site title on homepage"
                                i18n-label
                                binary="true">
                    </p-checkbox>
                </div>
            </div>
            <div class="row">
                <div class="FieldName" i18n>Title color</div>
                <div class="row">
                    <div class="col s12">
                        <p-colorPicker [ngModel]="companySettings.HomePageTitleColor" (ngModelChange)="companySettings.HomePageTitleColor = $event; companySettingsChange.emit(companySettings)" [disabled]="!companySettings.ShowHomePageTitle"></p-colorPicker>
                        <input type="text" style="padding:2px;width:65px" [(ngModel)]="companySettings.HomePageTitleColor" name="titlebackcolortext" [disabled]="!companySettings.ShowHomePageTitle" />
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <div class="FieldName" i18n>Title</div>
                    <div>
                        <input type="text" [(ngModel)]="companySettings.BrowserTitlePrefix" name="titletext" style="width:93%" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row" style="padding-top: 12px;">
        <div class="col s12">
            <d3s-shortcut-list></d3s-shortcut-list>
        </div>
    </div>
</div>
