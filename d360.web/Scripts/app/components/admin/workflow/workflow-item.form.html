<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading">
    <form #workflowForm="ngForm" (ngSubmit)="save()">
        <div class="row tile">
            <div class="col s6">
                <div class="FieldNameRequired">Type</div>
                <select style="width:80%;display:block;" [(ngModel)]="ObjectType" name="objecttype" (ngModelChange)="objectTypeChange()" required>
                    <option></option>
                    <option *ngFor="let o of ObjectTypes" [value]="o.value">{{o.label}}</option>
                </select>
            </div>
            <div class="col s6">
                <div class="FieldNameRequired">{{taxonomyName}}</div>
                <select style="width:80%;display:block;" [(ngModel)]="ParentType" name="parenttype">
                    <option></option>
                    <option *ngFor="let p of ParentTypes" [value]="p.value">{{p.label}}</option>
                </select>
                <span *ngIf="isLoadingResponsibility"><i class="fa fa-spinner fa-spin"></i></span>
            </div>
        </div>
        <div class="row tile">
            <div class="col s6">
                <div class="FieldNameRequired">Responsibility</div>
                <select style="width:80%;display:block;" [(ngModel)]="item.ResponsibilityTypeID" name="responsibility" required>
                    <option></option>
                    <option *ngFor="let r of ResponsibilityTypes" [value]="r.value">{{r.label}}</option>
                </select>
                <span *ngIf="isLoadingResponsibility"><i class="fa fa-spinner fa-spin"></i></span>
            </div>
            <div class="col s6 input-field">
                <input type="checkbox" name="Enabled" [(ngModel)]="item.Enabled" />
                <label for="Enabled">Enabled?</label>
            </div>
        </div>
        <div class="row tile Workflow-2" *ngIf="item.WorkflowType == workflowType.SuggestNewArtifactMulti">
            <div class="col s6">
                <div class="FieldName">Final Approval Responsibility</div>
                <select style="width:80%;display:block;" [(ngModel)]="responsibilityFinalApproval" name="responsibility2" required>
                    <option></option>
                    <option *ngFor="let r of ResponsibilityTypes" [value]="r.value">{{r.label}}</option>
                </select>
            </div>
        </div>
        <div class="row tile Workflow-2" *ngIf="item.WorkflowType == workflowType.CertifyArtifact">
            <div class="col s6">
                <div class="FieldName">Date For Schedule Calculation</div>
                <div name="DateForScheduleCalculation"></div>
                <p-calendar [(ngModel)]="dateScheduleCalculation" name="scheduleDate" required></p-calendar>

            </div>
            <div class="col s6">
                <div class="FieldName"># Months Until Certification</div>
                <div name="MonthsUntilCertification" value=""></div>
                <input type="number" [(ngModel)]="numMonths" name="months" style="width:80%" required />
            </div>
        </div>
        <div class="row tile Workflow-2" *ngIf="item.WorkflowType == workflowType.CertifyArtifact">
            <div class="col s6 offset-s6">
                <div class="FieldName"># Days Given To Complete Certification</div>
                <div name="DaysGivenToCompleteCertification"></div>
                <input type="number" [(ngModel)]="numDays" name="days" style="width:80%" required />
            </div>
        </div>

        <div class="row">
            <button pButton type="submit" label="Save" [disabled]="!workflowForm.form.valid"></button>
            <button pButton type="button" (click)="cancel()" label="Cancel"></button><span *ngIf="isSaving"><i class="fa fa-spinner fa-spin"></i></span>
        </div>
    </form>
</div>
