<div class="tile tile-detail">
    <header *ngIf="model?.Type?.Name != null && !isLoading">
        {{model.Type.Name}}
    </header>
    <header *ngIf="model?.Type?.Name == null  && !isLoading">
        New Workflow Type
    </header>
    <d3s-loading [isLoading]="isLoading"></d3s-loading>
    <div class="row"
        *ngIf="!isLoading">
        <div class="col s12 m4">
            <div class="FieldName">
                Name
            </div>
            <div>
                <input type="text"
                    [ngModel]="model.Type.Name"
                    (ngModelChange)="isClone=false;onWorkflowNameChange.emit(isClone);model.Type.Name = $event; validate();"
                    style="width: 95%"
                    [d3s-text-highlight]="isClone" />
            </div>
            <div class="FieldName">
                Change Type
            </div>
            <div>
                <select style="width:95%;"
                    placeholder="Choose a value"
                    [ngModel]="model.Event.ChangeType"
                    (ngModelChange)="model.Event.ChangeType = $event; validate(); loadObjects();">
                    <option></option>
                    <option *ngFor="let i of changesTypes"
                        [value]="i.ID">{{i.Description}}</option>
                </select>
            </div>
            <div class="FieldName">
                Object Type
            </div>
            <div>
                <p-dropdown [options]="workflowObjectTypes"
                    [ngModel]="selectedObjectType"
                    (ngModelChange)="selectObjectType($event)"
                    [disabled]="model.Event.ChangeType == null || +model.Event.ChangeType == 0"
                    [style]="{'width': '95%'}"
                    filterPlaceholder="Choose a value"
                    [filter]="true">
                </p-dropdown>
            </div>
            <div *ngIf="objectType == 'IssueType'">
                <div class="FieldName">
                    Issue Object Type
                </div>
                <div>
                    <p-dropdown [options]="issueObjectTypes"
                        [(ngModel)]="selectedIssueObjectType"
                        [style]="{'width': '95%'}"
                        filterPlaceholder="Choose a value"
                        [filter]="true">
                    </p-dropdown>
                </div>
            </div>
            <div *ngIf="model.Event.ChangeType == WorkflowChangeType.Schedule">
                <div class="FieldName">
                    Run Frequency (Days)
                </div>
                <div>
                    <input type="number"
                        [ngModel]="model.Event.SettingsObject.Settings.ScheduleInterval"
                        (ngModelChange)="model.Event.SettingsObject.Settings.ScheduleInterval = $event;  validate();"
                        style="width: 95%" />
                </div>
            </div>
        </div>
        <div class="col s12 m8">
            <div *ngIf="selectedObjectType != null && selectedObjectType != ''">
                <div class="FieldName">
                    Conditions
                </div>
                <div>
                    <d3s-workflow-condition-list (removeClick)="remove($event)"
                                                 (addClick)="showCondition()"
                                                 [conditions]="conditions"></d3s-workflow-condition-list>

                    <div *ngIf="showAddCondition">
                        <d3s-workflow-condition-editor [objectId]="objectID"
                                                       [objectType]="objectType"
                                                       [changeType]="model.Event.ChangeType"
                                                       (onSave)="addCondition($event)"
                                                       (onClose)="showAddCondition = false;">
                        </d3s-workflow-condition-editor>
                    </div>

                    <div class="FieldName">
                        Satisfy all
                    </div>
                    <div>
                        <input type="radio" name="isAll"
                               [ngModel]="model.Type.SatisfyAll"
                               (ngModelChange)="onSatisfyConditionChange($event)"
                               value="true"
                               style="width: 10%" />
                    </div>
                    <div class="FieldName">
                        Satisfy any
                    </div>
                    <div>
                        <input type="radio" name="isAll"
                               [ngModel]="model.Type.SatisfyAll"
                               (ngModelChange)="onSatisfyConditionChange($event)"
                               value="false"
                               style="width: 10%" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row"
        *ngIf="!isLoading">
        <div class="col s12 m4">
            <div class="FieldName">
                Description
            </div>
            <div style="width: 95%">
                <p-editor [(ngModel)]="model.Type.Description"
                    [style]="{'height':'150px'}">
                    <d3s-editor-header></d3s-editor-header>
                </p-editor>
            </div>
        </div>
    </div>
    <div class="row"
        *ngIf="!isLoading">
        <div class="col s12">

            <input type="checkbox"
                [disabled]="!(model.Type.State==1 || model.Type.State==4)"
                [ngModel]="model.Type.State==1? true : false"
                (ngModelChange)="onStateChange($event)" />
            <div class="FieldName">
                &nbsp;Active
            </div>
        </div>
    </div>
    <div class="row"
        *ngIf="!isLoading && model.Event.ChangeType == WorkflowChangeType.Schedule"
        style="padding-top: 8px;">
        <div class="col s12">
            <div>
                <input type="checkbox"
                    [ngModel]="model.Event.SettingsObject.Settings.SendAggregateEmail"
                    (ngModelChange)="model.Event.SettingsObject.Settings.SendAggregateEmail = $event; validate();" />
                Send aggregated email?
            </div>
        </div>
    </div>
    <div class="row"
        *ngIf="!isLoading && model.Event.ChangeType == WorkflowChangeType.Schedule && model.Event.SettingsObject.Settings.SendAggregateEmail == true">
        <div class="col s12 m4 offset-m2">
            <div class="FieldName">
                Subject
            </div>
            <div>
                <input type="text"
                    style="width:100%"
                    [ngModel]="model.Event.SettingsObject.Settings.MessageSubjectTemplate"
                    (ngModelChange)="model.Event.SettingsObject.Settings.MessageSubjectTemplate = $event; validate();" />
            </div>
        </div>
        <div class="col s12 m4">
            <div class="FieldName">
                Recipient Type
            </div>
            <div>
                <select style="width: 100%"
                    disabled>
                    <option value="SpecificUser">Specific User</option>
                </select>
            </div>
            <div>
                <div class="FieldName">
                    Recipient
                </div>
                <div>
                    <input type="text"
                        [ngModel]="model.Event.SettingsObject.Settings.MessageToUser"
                        (ngModelChange)="model.Event.SettingsObject.Settings.MessageToUser = $event; validate();"
                        style="width: 100%" />
                </div>
            </div>
        </div>
    </div>
    <div class="row"
        *ngIf="!isLoading && model.Event.ChangeType == WorkflowChangeType.Schedule && model.Event.SettingsObject.Settings.SendAggregateEmail == true">
        <div class="col s12 m8 offset-m2">
            <div class="FieldName">
                Body
            </div>
            <div style="width: 100%">
                <p-editor [ngModel]="model.Event.SettingsObject.Settings.MessageBodyTemplate"
                    (ngModelChange)="model.Event.SettingsObject.Settings.MessageBodyTemplate = $event; validate();"
                    [style]="{'height':'150px'}"
                    #ed2>
                </p-editor>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col s12">&nbsp;</div>
    </div>
    <div class="row">
        <div class="col s12">
            <div class="errorMessage">{{errorMessage}}</div>
        </div>
    </div>
    <div class="row">
        <div class="col s12">
            <div class="governance-value-warning">{{warningMessage}}</div>
        </div>
    </div>
    <div *ngIf="!isLoading"
        class="row"
        style="padding-top: 8px;">
        <div class="col s12">
            <div>
                <button type="button"
                    pButton
                    label="Cancel"
                    (click)="onClose.emit()"></button>
                <button type="button"
                    pButton
                    label="Next"
                    (click)="save()"
                    [disabled]="!isValid || isLoading"></button>
            </div>
        </div>
    </div>
</div>
