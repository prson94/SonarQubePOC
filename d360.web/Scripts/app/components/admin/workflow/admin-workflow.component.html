<div class="row">
    <div class="col s12">
        <d3s-loading [isLoading]="isLoading"></d3s-loading>
        <div *ngIf="!isLoading" [ngSwitch]="mode">
            <div *ngSwitchCase="PageMode.Default" class="tile tile-detail">
                <header>
                    Workflow Types
                    <d3s-tile-actions hasAdd="true" (addClick)="add()"></d3s-tile-actions>
                </header>
                <d3s-admin-workflow-list 
                                             (onViewClick)="viewReadOnlyDiagram($event)" 
                                             (onDeleteClick)="currentID = $event; workflow = null; mode = PageMode.Delete;" 
                                             (onEditClick)="currentID = $event; workflow = null; mode = PageMode.Editor"></d3s-admin-workflow-list>
            </div>
            <div *ngSwitchCase="PageMode.ReadOnlyDiagram">
                <d3s-workflow-diagram [id]="currentID" readonly="true" hasClose="true" (onCloseClick)="closeEditor()"></d3s-workflow-diagram>
            </div>
            <div *ngSwitchCase="PageMode.Editor">
                <d3s-admin-workflow-editor [id]="currentID" (onClose)="mode = PageMode.Default" (onSave)="save($event);" [model]="workflow"></d3s-admin-workflow-editor>
            </div>
            <div *ngSwitchCase="PageMode.DiagramEditor">
                <d3s-workflow-diagram 
                                      [id]="workflow.Type.ID" 
                                      [model]="workflow"
                                      readonly="false" 
                                      hasClose="true" 
                                      hasBack="true"
                                      (onBackClick)="workflow = $event; mode = PageMode.Editor"
                                      (onCloseClick)="mode = PageMode.Default;">
                </d3s-workflow-diagram>
            </div>
            <div *ngSwitchCase="PageMode.Delete" class="tile tile-detail">
                <d3s-admin-workflow-delete [id]="currentID" (onSuccess)="mode = PageMode.Default" (onCancel)="mode = PageMode.Default"></d3s-admin-workflow-delete>
            </div>
        </div>
    </div>
</div>
