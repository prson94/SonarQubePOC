<div class="row">
    <div class="col s12">
        <d3s-loading [isLoading]="isLoading"></d3s-loading>
        <div *ngIf="!isLoading" [ngSwitch]="mode">
            <div *ngSwitchCase="PageMode.Default" class="tile tile-detail">
                <header>
                    Workflow Types
                    <d3s-tile-actions hasAdd="true" (addClick)="add()"></d3s-tile-actions>
                </header>
                <d3s-admin-workflow-new-list (onViewClick)="viewReadOnlyDiagram($event)"></d3s-admin-workflow-new-list>
            </div>
            <div *ngSwitchCase="PageMode.ReadOnlyDiagram">
                <d3s-workflow-diagram [id]="currentID" readonly="true" hasClose="true" (onCloseClick)="closeEditor()"></d3s-workflow-diagram>
            </div>
            <div *ngSwitchCase="PageMode.Editor">
                <d3s-admin-workflow-new-editor (onClose)="mode = PageMode.Default" (onSave)="save($event);"></d3s-admin-workflow-new-editor>
            </div>
            <div *ngSwitchCase="PageMode.DiagramEditor">
                <d3s-workflow-diagram [id]="workflow.Type.ID" readonly="false" (onCloseClick)="mode = PageMode.Default;"></d3s-workflow-diagram>
            </div>
        </div>
    </div>
</div>
