<div class="modal-measure-editor">
    <d3s-loading [isLoading]="isLoading"></d3s-loading>
    <div *ngIf="!isLoading" class="measure-form" [style.maxHeight.px]="maxHeight">
        <ig-portal-content-provider *ngIf="formFeedbackPortalName" [name]="formFeedbackPortalName" [template]="formFeedback">
            <ng-template #formFeedback>
                <ig-form-feedback-badges [igformGroup]="metricForm" [inputContainer]="formElement">
                </ig-form-feedback-badges>
            </ng-template>
        </ig-portal-content-provider>
        
        <form [formGroup]="metricForm" *ngIf="model" #form>
            <ig-property-group [igformGroup]="metricForm" [title]="'Details'">
                <div inputs>
                    <div class="row">
                        <label for="name" class="ig-label" i18n>Name</label>
                        <input igInput tabindex="1" igSize="medium" [ngClass]="{'invalid': metricForm.get('name')?.errors?.empty}" type="text" [(ngModel)]="model.Name" formControlName="name" maxlength="250" required />
                        <div *ngIf="metricForm.get('name').invalid && (metricForm.get('name').dirty || metricForm.get('name').touched)">
                            <div *ngIf="metricForm.get('name').errors.empty" class="ig-text-required" i18n>
                                Please enter a valid name
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <label for="description" class="ig-label" i18n>Description</label>
                        <textarea igTextArea
                                  [(ngModel)]="model.Description"
                                  tabindex="2"
                                  rows="3"
                                  maxlength="4000"
                                  formControlName="description"></textarea>
                    </div>

                    <div class="flex-row">
                        <div class="flex-col">
                            <div class="row">
                                <label for="effectiveDate" class="ig-label" i18n>Effective Date</label>
                                <ig-date [tabindex]="3"
                                         [(ngModel)]="displayEffectiveDate"
                                         [required]="true"
                                         [appendTo]="'body'"
                                         [minDate]="currentEffectiveDate | utcDate"
                                         [dateFormat]="getLocaleDateString()"
                                         formControlName="effectiveDate">
                                </ig-date>
                            </div>
                        </div>
                        <div class="flex-col effective-date-msg">
                            <label></label>
                            <div *ngIf="verb == 'Edit'">
                                <ig-message-box>
                                    <span i18n>
                                        As scoring data has been collected against this measure (effective from {{currentEffectiveDate | utcDate | date:'shortDate' }}),
                                        any changes you make to this measure will result in a  new version being created, with a new effective date.
                                    </span>
                                </ig-message-box>
                            </div>
                        </div>
                    </div>
                </div><br />
            </ig-property-group>
        </form>
    </div>
    <div class="row" *ngIf="!isLoading">
        <div class="action-bar" style="padding-top: 15px">
            <button igButton class="left" type="button" label="{{closeLabel}}" (click)="cancel()"></button>
            <span class="grow"></span>
            <button igButton [loading]="isSaving" class="ig-button-primary" type="button" label="{{saveLabel}}" [disabled]="!hasModelChanged || !metricForm.valid || isSaving" (click)="save()"></button>
        </div>
    </div>
</div>
