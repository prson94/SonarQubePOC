<header i18n>Fields</header>
<div class="row">
    <div class="col s12">
        <p-table #dt
                 [scrollable]="true"
                 sortField="ExtOrder"
                 [sortOrder]="1"
                 scrollHeight="400px"
                 [loading]="isLoading"
                 loadingIcon="fa fa-spinner"
                 [value]="availableFields"
                 selectionMode="multiple"
                 [globalFilterFields]="['Name']"
                 [paginator]="false"
                 [(selection)]="selectedFields">
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 30px">
                        <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                    </th>
                    <th i18n>Name</th>
                    <th style="width: 30px"></th>
                    <th style="width: 30px"></th>
                    <th style="width: 30px"></th>
                    <th style="width: 30px"></th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body"
                         let-item>
                <tr [pSelectableRow]="item">
                    <td style="width: 30px">
                        <p-tableCheckbox [value]="item"></p-tableCheckbox>
                    </td>
                    <td>{{item.FriendlyName}}</td>
                    <td style="width: 30px">
                        <div class="RowTools">
                            <a (click)="top($event,item)"
                               style="cursor:pointer;"><i class="fa fa-angle-double-up"></i></a>
                        </div>
                    </td>
                    <td style="width: 30px">
                        <div class="RowTools">
                            <a (click)="up($event,item)"
                               style="cursor:pointer;"><i class="fa fa-caret-up"></i></a>
                        </div>
                    </td>
                    <td style="width: 30px">
                        <div class="RowTools">
                            <a (click)="down($event,item)"
                               style="cursor:pointer;"><i class="fa fa-caret-down"></i></a>
                        </div>
                    </td>
                    <td style="width: 30px">
                        <div class="RowTools">
                            <a (click)="bottom($event,item)"
                               style="cursor:pointer;"><i class="fa fa-angle-double-down"></i></a>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
    <div>
        <div class="row">
            <div class="col s12">
                <button igButton
                        class="ig-button-primary"
                        label="{{labelSave}}"
                        margin
                        (click)="save()"></button>
                <button igButton
                        class="ig-button-secondary"
                        type="button"
                        (click)="reset()"
                        label="{{labelRevert}}"></button>
            </div>
        </div>
    </div>
</div>
