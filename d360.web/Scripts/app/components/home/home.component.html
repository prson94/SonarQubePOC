<d3s-dashboard-tab *ngIf="isDashboardVisible" [objectID]="'0'" [objectName]="'Home'" [objectType]="'Home'"></d3s-dashboard-tab>
<div class="row home-tiles" *ngIf="!showActivityDetails && !showBoardDetails && !showAssignmentDetails && !isDashboardVisible">
    <div class="col l4 s12">
        <d3s-assignments-tile (showItemDetail)="onShowAssignmentDetails($event);"></d3s-assignments-tile>
    </div>
    <div class="col l4 s12">
        <d3s-board-tile (showItemDetail)="onShowBoardDetails($event);" [(daysToLookBack)]="boardDaysToLookBack"></d3s-board-tile>
    </div>
    <div class="col l4 s12">
        <d3s-activity-tile (showItemDetail)="onShowActivityDetails($event);" [(daysToLookBack)]="activityDaysToLookBack"></d3s-activity-tile>
    </div>
</div>

<div class="row" *ngIf="showActivityDetails && !isDashboardVisible">
    <div class="col s12">
        <d3s-activity-details-tile [objectId]="selectedArtifactTypeId" [objectName]="selectedArtifactTypeName" (close)="showActivityDetails = false;" [daysToLookBack]="activityDaysToLookBack"></d3s-activity-details-tile>
    </div>
</div>

<div class="row" *ngIf="showBoardDetails && !isDashboardVisible">
    <div class="col s12">
        <div class="tile tile-detail">
            <d3s-social-board [limitToType]="selectedSocialType" [daysToLookBack]="boardDaysToLookBack" [hasNewInput]="false" [hasCloseButton]="true" (close)="showBoardDetails=false"></d3s-social-board>
        </div>
    </div>
</div>

<div class="row" *ngIf="showAssignmentDetails && !isDashboardVisible">
    <div class="col s12">
        <div class="tile tile-detail">
            <d3s-workflow-detail [workflowType]="selectedWorkflowType" (close)="showAssignmentDetails=false"></d3s-workflow-detail>
        </div>
    </div>
</div>

<d3s-home-search *ngIf="!showActivityDetails && !showBoardDetails && !showAssignmentDetails && !isDashboardVisible"></d3s-home-search>
