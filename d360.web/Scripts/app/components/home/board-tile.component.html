<div class="tile tile-detail">
    <header>
        <ng-container i18n>Board</ng-container>
        <span style="color:#999;font-size:60%;vertical-align:middle;">{{timeFrameMessage()}}</span>
        <d3s-tile-actions [hasAdd]="false" [hasDate]="true" (dateClick)="changeDates($event);"></d3s-tile-actions>
    </header>
    <d3s-loading [isLoading]="isLoading"></d3s-loading>
    <p-table #dt *ngIf="!isLoading && counts.length > 0" [value]="counts" selectionMode="single"
             [metaKeySelection]="true" [globalFilterFields]="['Name','Total']" sortField="Name" [sortOrder]="1"
             [rows]="10" [(selection)]="selected">
        <ng-template pTemplate="header">
            <tr>
                <th [pSortableColumn]="'Name'">
                    <ng-container i18n>Name</ng-container>
                    <d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
                </th>
                <th [pSortableColumn]="'Total'" style="text-align:center">
                    <ng-container i18n>Total</ng-container>
                    <d3s-sortIcon [field]="'Total'"></d3s-sortIcon>
                </th>
            </tr>
            <tr [hidden]="showSimpleFilter">
                <th></th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr (dblclick)="selected=item;doSelect(selected)" [pSelectableRow]="item">
                <td>
                    <a (click)="doSelect(item)">{{item.Name}}</a>
                </td>
                <td>{{item.Total}}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="summary">
            <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
                                  [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
        </ng-template>
    </p-table>

    <div *ngIf="counts.length == 0 && !isLoading" style="padding:10px" i18n>No board activity for this timeframe</div>
</div>
