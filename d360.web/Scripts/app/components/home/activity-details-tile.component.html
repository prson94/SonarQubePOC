<div class="tile tile-detail">
    <header>
        <ng-container i18n>Activity for {{objectName}}</ng-container>
        <d3s-tile-actions [hasAdd]="false"
                          [hasFilterMode]="true"
                          [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
    </header>
    <d3s-loading [isLoading]="isLoading"></d3s-loading>
    <span *ngIf="!isLoading">
        <input type="text"
               [hidden]="!showSimpleFilter"
               pInputText
               size="100"
               (input)="dt.filterGlobal($event.target.value, 'contains')"
               placeholder="Search..."
               i18n-placeholder
               class="grid-simple-filter">
        <p-table #dt
                 [value]="items"
                 selectionMode="single"
                 [metaKeySelection]="true"
                 [globalFilterFields]="['DisplayValue','CreatedOn','UpdatedOn']"
                 [pageLinks]="3"
                 [paginator]="true"
                 [rows]="defaultInitialItemsPerPage"
                 [rowsPerPageOptions]="defaultPagingOptions"
                 [(selection)]="selected">
            <ng-template pTemplate="header">
                <tr>
                    <th [pSortableColumn]="'DisplayValue'">
                        <ng-container i18n>Name</ng-container>
                        <d3s-sortIcon [field]="'DisplayValue'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'CreatedOn'"
                        style="width: 150px">
                        <ng-container i18n>Created</ng-container>
                        <d3s-sortIcon [field]="'CreatedOn'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'UpdatedOn'"
                        style="width: 150px">
                        <ng-container i18n>Updated</ng-container>
                        <d3s-sortIcon [field]="'UpdatedOn'"></d3s-sortIcon>
                    </th>
                    <th style="width: 40px"></th>
                </tr>
                <tr [hidden]="showSimpleFilter">
                    <th>
                        <d3s-column-filter [field]="'DisplayValue'"
                                           [datatype]="'text'"></d3s-column-filter>
                    </th>
                    <th>
                        <d3s-column-filter [field]="'CreatedOn'"
                                           [datatype]="'text'"></d3s-column-filter>
                    </th>
                    <th>
                        <d3s-column-filter [field]="'UpdatedOn'"
                                           [datatype]="'text'"></d3s-column-filter>
                    </th>
                    <th></th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body"
                         let-item>
                <tr (dblclick)="selected=item;navigateToArtifact();"
                    [pSelectableRow]="item">
                    <td>
                        <a (click)="artifactLink(item.TypeID, item.ObjectID)">{{item.DisplayValue}}</a>
                    </td>
                    <td>
                        <span>{{item.CreatedOn | date: 'shortDate'}}</span>
                    </td>
                    <td>
                        <span>{{item.UpdatedOn | date: 'shortDate'}}</span>
                    </td>
                    <td>
                        <div class="RowTools">
                            <d3s-preview-tooltip objectType="Artifact"
                                                 [objectId]="item.ObjectID"
                                                 (click)="selectArtifact(item)"
                                                 icon="info"></d3s-preview-tooltip>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template *ngIf="dt.totalRecords"
                         pTemplate="summary">
                <d3s-grid-paging-info [first]="dt.first"
                                      [rows]="dt.rows"
                                      [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
            </ng-template>
        </p-table>

    </span>
    <button pButton
            type="button"
            (click)="close.emit();"
            label="Close"
            i18n-label
            style="width:150px;margin-top:10px"></button>
</div>
