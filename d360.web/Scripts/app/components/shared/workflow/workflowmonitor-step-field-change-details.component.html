<div class="row">
    <div class="col s12">
        <p-table #dt [value]="fieldChanges" selectionMode="single" [metaKeySelection]="true" [pageLinks]="3"
                 [paginator]="true" [rows]="10">
            <ng-template pTemplate="header">
                <tr>
                    <th [pSortableColumn]="'FieldName'">
                        <ng-container i18n>Name</ng-container>
                        <d3s-sortIcon [field]="'FieldName'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'Value'">
                        <ng-container i18n>Value</ng-container>
                        <d3s-sortIcon [field]="'Value'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'FormValue'">
                        <ng-container i18n>Form</ng-container>
                        <d3s-sortIcon [field]="'FormValue'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'OutputValue'">
                        <ng-container i18n>Output</ng-container>
                        <d3s-sortIcon [field]="'OutputValue'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'AppendValue'">
                        <ng-container i18n>Appended</ng-container>
                        <d3s-sortIcon [field]="'AppendValue'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'ClearValue'">
                        <ng-container i18n>Cleared</ng-container>
                        <d3s-sortIcon [field]="'ClearValue'"></d3s-sortIcon>
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item>
                <tr [pSelectableRow]="item">
                    <td>{{getFieldName(item)}}</td>
                    <td>
                        <div [ngSwitch]="item.Type" style="overflow-x: auto">
                            <span *ngSwitchCase="'Html'" style="display:block; word-wrap:break-word !important"
                                  [innerHtml]="getHtmlFieldValue(item)"></span>
                            <span *ngSwitchCase="'Link'" style="display:block; word-wrap:break-word !important"><a
                                    href="{{getUrl(item.Value)}}" target="_blank"
                                    style="font-weight:bold">{{getName(item.Value)}}</a></span>
                            <span *ngSwitchDefault
                                  style="display:block; word-wrap:break-word !important">{{item.Value}}</span>
                        </div>
                    </td>
                    <td>{{item.FormValue}}</td>
                    <td>{{item.UseOutputValue}}</td>
                    <td>{{item.AppendValue}}</td>
                    <td>{{item.ClearValue}}</td>
                </tr>
            </ng-template>
            <ng-template *ngIf="dt.totalRecords" pTemplate="summary">
                <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows"
                                      [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
            </ng-template>
        </p-table>
    </div>
</div>
