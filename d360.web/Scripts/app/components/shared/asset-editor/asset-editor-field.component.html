<div class="field-wrapper {{(!isValid ? 'invalid' : '')}} {{(isRequired() ? 'required-field' : '')}} {{(!field.Value || field.Value.length == 0) ? 'empty-field' : '' }}">
    <div [formGroup]="form">
        <input *ngIf="field.FieldType=='Hidden'" [formControlName]="field.FieldName" type="hidden" />
        <div [ngSwitch]="getFieldTypeForSwitch(field.FieldType)" class="col s12" *ngIf="field.FieldType!='Hidden'">
            <div class="FieldName">
                <span *ngIf="fieldTooltip" [pTooltip]="fieldTooltip">{{currentFieldName}}</span>
                <span *ngIf="!fieldTooltip">{{currentFieldName}}&nbsp;</span>
            </div>
            <div class="input-wrapper">
                <d3s-similar-items *ngIf="field.SimilarItemsUri != null" [uri]="field.SimilarItemsUri" [query]="field.Value"></d3s-similar-items>
                <div *ngSwitchCase="'Text'" style="width:100%;">
                    <input igInput igSize="full" [formControlName]="field.FieldName" name="{{field.FieldName}}" (blur)="OnBlurTrim()" type="text" [required]="isRequired()">
                </div>
                <div *ngSwitchCase="'Link'">
                    <div class="flex-grid-link">
                        <div class="label">Name</div>
                        <div class="link-input">
                            <input igInput igSize="full" name="{{field.FieldName + '_Name'}}" [formControlName]="field.FieldName + '_Name'" type="text">
                        </div>
                    </div>
                    <div class="flex-grid-link">
                        <div class="label">URL</div>
                        <div class="link-input">
                            <input igInput igSize="full" name="{{field.FieldName + '_Url'}}" [formControlName]="field.FieldName + '_Url'" type="text" placeholder="{{(isRequired() ? linkFieldRequiredPlaceholder : linkFieldOptionalPlaceholder)}}" [required]="isRequired()">
                        </div>
                    </div>
                </div>

                <d3s-similar-items *ngIf="field.SimilarItemsUri != null" [uri]="field.SimilarItemsUri" [query]="field.Value"></d3s-similar-items>
                <p-editor *ngSwitchCase="'Html'"
                          [formControlName]="field.FieldName"
                          [attr.name]="field.FieldName"
                          [style]="{'height':'150px'}"
                          placeholder="{{(isRequired() ? 'Value required' : '')}}"
                          ngDefaultControl #ed>
                    <p-header *ngIf="diagramNodeKey">
                        <span class="ql-formats with-border">
                            <select class="ql-header">
                                <option value="1">Heading</option>
                                <option value="2">Subheading</option>
                                <option selected>Normal</option>
                            </select>
                        </span>
                        <span class="ql-formats with-border">
                            <button class="ql-bold"></button>
                            <button class="ql-italic"></button>
                            <button class="ql-underline"></button>
                        </span>
                    </p-header>
                </p-editor>
                <ig-switch *ngSwitchCase="'Boolean'" [attr.name]="field.FieldName" [trueLabel]="'True'" [falseLabel]="'False'" [attr.name]="field.FieldName" [formControlName]="field.FieldName" [optional]="!isRequired()"></ig-switch>
                <ig-number-input *ngSwitchCase="'Number'" [attr.name]="field.FieldName" [formControlName]="field.FieldName" [min]="Min" [max]="Max" [step]="Increment" [required]="isRequired()"></ig-number-input>
                <ig-number-input *ngSwitchCase="'Decimal'" [attr.name]="field.FieldName" [formControlName]="field.FieldName" [min]="Min" [max]="Max" [step]="Increment" (keyup)="toDecimalPlaces($event,Precision)" [required]="isRequired()"></ig-number-input>
                <div *ngSwitchCase="'Date'">
                    <ig-date [formControlName]="field.FieldName" [attr.name]="field.FieldName" [dateFormat]="getLocaleDateString()" [appendTo]="'body'" [required]="isRequired()"></ig-date>
                </div>
                <div *ngSwitchCase="'DateTime'">
                    <ig-date [formControlName]="field.FieldName" [attr.name]="field.FieldName" [showTime]="true" [dateFormat]="getLocaleDateString()" [appendTo]="'body'" [required]="isRequired()"></ig-date>
                </div>

                <div *ngSwitchCase="'LazyLookup'">
                    <div class="{{field?.MultiSelect ? 'd3s-color-picker multi multi-select-lazy-load' : ''}}">
                        <div *ngIf="field?.MultiSelect" class="overlay-trigger" (click)="overlayPanel.toggle($event)">
                            <p-multiSelect #dropdown
                                           [maxSelectedLabels]="5"
                                           igSize="full"
                                           styleClass="{{field.Required ? 'value-required' : ''}}"
                                           [inputId]="field.FieldName + '_input_' + component_uid"
                                           [formControlName]="field.FieldName"
                                           [attr.name]="field.FieldName"
                                           [options]="field.Items"
                                           (onChange)="onChangeMultiselect($event)"
                                           [required]="field.Required"
                                           [readonly]="true"
                                           placeholder="{{field.Required ? 'Value Required' : 'Optional'}}"
                                           display="chip">
                            </p-multiSelect>
                        </div>

                        <p-dropdown *ngIf="!field?.MultiSelect"
                                    #dropdown
                                    igDropdown
                                    styleClass="dropdown-lazy-load"
                                    igSize="full"
                                    [inputId]="field.FieldName + '_input_' + component_uid"
                                    [formControlName]="field.FieldName"
                                    [attr.name]="field.FieldName"
                                    [options]="field.Items"
                                    (onSelect)="onSelect($event)"
                                    [required]="field.Required"
                                    (click)="overlayPanel.toggle($event)">
                            <ng-template let-item pTemplate="selectedItem">
                                <div *ngIf="field.UseColorControl" class="ig-colorfield-item item-value dropdown-selected-value">
                                    <span class="ig-colorfield-swatch" [style.background-color]="hexToRgb(item.color)"></span>
                                    <span class="ig-colorfield-item-label">{{item.label}}</span>
                                </div>

                                <span *ngIf="!field.UseColorControl" class="item-value" [innerHTML]="item.label ?? item.Text"></span>

                            </ng-template>
                        </p-dropdown>

                        <p-overlayPanel #overlayPanel [styleClass]="'dropdown-overlay'" [dismissable]="true" [baseZIndex]="20000" [appendTo]="'body'">
                            <ng-template pTemplate>
                                <p-table #dataTable
                                         tableStyleClass="ig-filter-table"
                                         [metaKeySelection]="true"
                                         [value]="lookupValues"
                                         [(selection)]="lookupSelectedValue"
                                         [globalFilterFields]="['label']"
                                         dataKey="value"
                                         [scrollable]="true"
                                         [scrollHeight]="selectionScrollHeight"
                                         [virtualRowHeight]="32"
                                         [rows]="20"
                                         [virtualScroll]="true"
                                         [lazy]="true"
                                         (onLazyLoad)="loadListLazy($event)"
                                         [loading]="isLookupValuesLoading"
                                         [loadingIcon]="'fa fa-spinner fa-spin'">
                                    <ng-template pTemplate="header">
                                        <tr>
                                            <th colspan="2">
                                                <ig-search-field mode="Keypress" [debounce]="200" (onSearch)="dataTable.filterGlobal($event, 'contains');"></ig-search-field>
                                            </th>
                                        </tr>
                                    </ng-template>
                                    <ng-template pTemplate="body" let-item>
                                        <tr [pSelectableRow]="item">
                                            <td class="first-col" *ngIf="field?.MultiSelect">
                                                <p-tableCheckbox [value]="item"></p-tableCheckbox>
                                            </td>
                                            <td (click)="selectSingleItem($event,item);">
                                                <div *ngIf="field.UseColorControl" class="ig-colorfield-item item-value">
                                                    <span class="ig-colorfield-swatch" [style.background-color]="hexToRgb(item.color)"></span>
                                                    <span class="ig-colorfield-item-label">{{item.label}}</span>
                                                </div>

                                                <span *ngIf="!field.UseColorControl" class="item-value" [innerHTML]="item.label"></span>
                                            </td>
                                        </tr>
                                    </ng-template>
                                </p-table>
                            </ng-template>
                        </p-overlayPanel>
                    </div>
                </div>
            </div>
            <div class="error-message" *ngIf="!isValid && isDirty && errorMessage">{{errorMessage}}</div>
            <div class="error-message" *ngIf="keyFieldError">{{keyFieldError}}</div>
        </div>
    </div>
</div>
