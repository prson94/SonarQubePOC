<div class="field-wrapper field-wrapper-type-{{field.FieldType}} {{(!isValid ? 'invalid' : '')}} {{(isRequired() ? 'required-field' : '')}} {{(!field.Value || field.Value.length == 0) ? 'empty-field' : '' }} {{hasKeyFieldError ? 'has-key-field-error' : ''}}">
    <div [formGroup]="form">
        <input *ngIf="field.FieldType=='Hidden'" [formControlName]="field.FieldName" type="hidden" />
        <div [ngSwitch]="getFieldTypeForSwitch(field.FieldType)" class="col s12" *ngIf="field.FieldType!='Hidden'">
            <div class="FieldName">
                <d3s-dynamic-field-name [field]="field"></d3s-dynamic-field-name>
            </div>
            <div class="input-wrapper">
                <d3s-similar-items *ngIf="field.SimilarItemsUri != null" [uri]="field.SimilarItemsUri" [query]="field.Value"></d3s-similar-items>
                <div *ngSwitchCase="'Text'" style="width:100%;">
                    <input igInput
                           igSize="full"
                           [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                           [formControlName]="field.FieldName"
                           name="{{field.FieldName}}"
                           (blur)="OnBlurTrim()"
                           type="text"
                           [required]="isRequired()">
                </div>
                <div *ngSwitchCase="'Link'">
                    <div class="flex-grid-link">
                        <div class="label" i18n>Name</div>
                        <div class="link-input">
                            <input igInput
                                   igSize="full"
                                   name="{{field.FieldName + '_Name'}}"
                                   [formControlName]="field.FieldName + '_Name'"
                                   [igDataCy]="'Asset_Modal_Field_' + field.FieldName + '_Name'"
                                   type="text">
                        </div>
                    </div>
                    <div class="flex-grid-link">
                        <div class="label">URL</div>
                        <div class="link-input">
                            <input igInput
                                   igSize="full"
                                   name="{{field.FieldName + '_Url'}}"
                                   [formControlName]="field.FieldName + '_Url'"
                                   [igDataCy]="'Asset_Modal_Field_' + field.FieldName + '_Url'"
                                   type="text"
                                   placeholder="{{(isRequired() ? linkFieldRequiredPlaceholder : linkFieldOptionalPlaceholder)}}"
                                   [required]="isRequired()">
                        </div>
                    </div>
                </div>

                <d3s-similar-items *ngIf="field.SimilarItemsUri != null" [uri]="field.SimilarItemsUri" [query]="field.Value"></d3s-similar-items>
                <p-editor *ngSwitchCase="'Html'"
                          [formControlName]="field.FieldName"
                          [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                          [attr.name]="field.FieldName"
                          [style]="{'height':'150px'}"
                          placeholder="{{(isRequired() ? 'Value required' : '')}}"
                          ngDefaultControl #ed>
                    <p-header *ngIf="diagramNodeKey">
                        <span class="ql-formats with-border">
                            <select class="ql-header">
                                <option value="1">Heading</option>
                                <option value="2">Subheading</option>
                                <option selected>Normal</option>
                            </select>
                        </span>
                        <span class="ql-formats with-border">
                            <button class="ql-bold"></button>
                            <button class="ql-italic"></button>
                            <button class="ql-underline"></button>
                        </span>
                    </p-header>
                </p-editor>
                <ig-switch *ngSwitchCase="'Boolean'"
                           [attr.name]="field.FieldName"
                           [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                           [trueLabel]="'True'"
                           [falseLabel]="'False'"
                           [formControlName]="field.FieldName"
                           [optional]="!isRequired()">
                </ig-switch>
                <ig-number-input *ngSwitchCase="'Number'"
                                 [attr.name]="field.FieldName"
                                 [formControlName]="field.FieldName"
                                 [min]="Min"
                                 [max]="Max"
                                 [step]="Increment"
                                 [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                                 [required]="isRequired()">
                </ig-number-input>
                <ig-number-input *ngSwitchCase="'Decimal'"
                                 [attr.name]="field.FieldName"
                                 [formControlName]="field.FieldName"
                                 [min]="Min"
                                 [max]="Max"
                                 [step]="Increment"
                                 (keyup)="toDecimalPlaces($event,Precision)"
                                 [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                                 [required]="isRequired()">
                </ig-number-input>
                <div *ngSwitchCase="'Date'">
                    <ig-date [formControlName]="field.FieldName"
                             [attr.name]="field.FieldName"
                             [dateFormat]="getLocaleDateString()"
                             [appendTo]="'body'"
                             [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                             [required]="isRequired()">
                    </ig-date>
                </div>
                <div *ngSwitchCase="'DateTime'">
                    <ig-date [formControlName]="field.FieldName"
                             [attr.name]="field.FieldName"
                             [showTime]="true"
                             [dateFormat]="getLocaleDateString()"
                             [appendTo]="'body'"
                             [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                             [required]="isRequired()">
                    </ig-date>
                </div>
                <div *ngSwitchCase="'Color'">
                    <ig-color-picker igSize="full" [colors]="defaultColorOptions" [formControlName]="field.FieldName" [invalidOptions]="['Custom']"></ig-color-picker>
                </div>

                <div *ngSwitchCase="'LazyLookup'">
                    <div class="{{field?.MultiSelect ? 'd3s-color-picker multi multi-select-lazy-load' : ''}}">

                        <ng-template #selectedItemFragment let-item="item">
                            <ng-container *ngIf="item.value !== null; else placeholder">
                                <div *ngIf="field.UseColorControl" class="ig-colorfield-item item-value dropdown-selected-value">
                                    <span class="ig-colorfield-swatch" [style.background-color]="hexToRgb(item.color)"></span>
                                    <span class="ig-colorfield-item-label">{{item.label}}</span>
                                </div>

                                <span *ngIf="!field.UseColorControl && item?.hasAssetReadAccess" class="item-value" [innerHTML]="item.label ?? item.Text"></span>
                                <span *ngIf="!field.UseColorControl && !item?.hasAssetReadAccess" class="item-value" [innerHTML]="item.label ?? item.Text"
                                      i18n-pTooltip pTooltip="You do not have permission to view the details of this item."
                                      tooltipStyleClass="ig-tooltip"
                                      tooltipPosition="top"></span>

                                <div class="info-button"
                                     *ngIf="useSidePanel && item.value && item?.hasAssetReadAccess"
                                     [class.info-button--required]="field.Required">
                                    <asset-editor-field-info (click)="onItemInfoClick($event, item.value)" size="m"
                                                             [object]="{objectID: item.value.toLowerCase(), fieldName: field.FieldName}"
                                                             [selected]="sidePanelSelection">
                                    </asset-editor-field-info>
                                </div>
                            </ng-container>
                            <ng-template #placeholder>
                                {{ lookupSelectPlaceholder }}
                            </ng-template>
                        </ng-template>

                        <ng-template #itemFragment let-item="item">
                            <div *ngIf="field.UseColorControl" class="ig-colorfield-item item-value dropdown-selected-value">
                                <div class="ig-colorfield-swatch" [style.background-color]="hexToRgb(item.color)"></div>
                                <div class="ig-colorfield-item-label">{{item.label}}</div>
                            </div>

                            <span *ngIf="!field.UseColorControl && item?.hasAssetReadAccess" class="item-value" [innerHTML]="item.label ?? item.Text"></span>
                            <span *ngIf="!field.UseColorControl && !item?.hasAssetReadAccess" class="item-value" [innerHTML]="item.label ?? item.Text"
                                  i18n-pTooltip pTooltip="You do not have permission to view the details of this item."
                                  tooltipStyleClass="ig-tooltip"
                                  tooltipPosition="top"></span>
                            <div class="info-button"
                                 *ngIf="useSidePanel && item.value && item?.hasAssetReadAccess"
                                 [class.info-button--required]="field.Required">
                                <asset-editor-field-info (click)="onItemInfoClick($event, item.value)" size="m"
                                                         [object]="{objectID: item.value.toLowerCase(), fieldName: field.FieldName}"
                                                         [selected]="sidePanelSelection">
                                </asset-editor-field-info>
                            </div>
                        </ng-template>

                        <ig-lazydropdown #dropdown
                                         *ngIf="!field?.MultiSelect"
                                         igSize="full"
                                         [inputId]="field.FieldName + '_input_' + componentUid"
                                         [formControlName]="field.FieldName"
                                         [attr.name]="field.FieldName"
                                         [attr.data-cy]="'Asset_Modal_Field_' + field.FieldName"
                                         optionValue="value"
                                         [options]="lazyLookupValues"
                                         optionLabel="label"
                                         [filter]="showLookupSearchField"
                                         (onLazyLoad)="lazyLoadValues($event)"
                                         filterBy="label"
                                         [lazy]="true"
                                         [loading]="lazyLoading"
                                         [lazyLoadSize]="lazyLoadSize"
                                         [resetFilterOnHide]="true"
                                         [initialItems]="fieldItems"
                                         [showClear]="true"
                                         [required]="isRequired()"
                                         [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                                         [emptyMessage]="emptyMessage"
                                         [placeholder]="lookupSelectPlaceholder"
                                         [appendTo]="'body'"
                                         [virtualScroll]="true"
                                         [virtualScrollItemSize]="32"
                                         [virtualScrollOptions]="virtualScrollOptions">

                            <ng-template let-item pTemplate="selectedItem">
                                <ng-container [ngTemplateOutlet]="selectedItemFragment"
                                              [ngTemplateOutletContext]="{item: item}" />
                            </ng-template>
                            <ng-template let-item pTemplate="item">
                                <ng-container [ngTemplateOutlet]="itemFragment"
                                              [ngTemplateOutletContext]="{item: item}" />
                            </ng-template>
                        </ig-lazydropdown>

                        <ig-lazymultiselect #dropdown
                                            *ngIf="field?.MultiSelect"
                                            igSize="full"
                                            [inputId]="field.FieldName + '_input_' + componentUid"
                                            [formControlName]="field.FieldName"
                                            [attr.name]="field.FieldName"
                                            [attr.data-cy]="'Asset_Modal_Field_' + field.FieldName"
                                            [maxSelectedLabels]="5"
                                            dataKey="value"
                                            optionValue="value"
                                            [options]="lazyLookupValues"
                                            optionLabel="label"
                                            [filter]="showLookupSearchField"
                                            (onLazyLoad)="lazyLoadValues($event)"
                                            (onChange)="onChangeMultiselect($event)"
                                            [lazy]="true"
                                            [loading]="lazyLoading"
                                            [lazyLoadSize]="lazyLoadSize"
                                            [resetFilterOnHide]="true"
                                            [initialItems]="fieldItems"
                                            [required]="isRequired()"
                                            [igDataCy]="'Asset_Modal_Field_' + field.FieldName"
                                            [placeholder]="lookupSelectPlaceholder"
                                            [appendTo]="'body'"
                                            display="chip"
                                            [virtualScroll]="true"
                                            [virtualScrollItemSize]="32"
                                            [virtualScrollOptions]="virtualScrollOptions">

                            <ng-template pTemplate="removetokenicon">
                                <span class="p-multiselect-token-icon pi pi-times"></span>
                            </ng-template>

                            <ng-template let-item pTemplate="item">
                                <ng-container [ngTemplateOutlet]="itemFragment"
                                              [ngTemplateOutletContext]="{item: item}" />
                            </ng-template>
                        </ig-lazymultiselect>
                    </div>
                </div>
            </div>
            <!--Show error message when form input contains error and is dirty (was changed)
            or there is a key field error and this field is partOfKey. In multikey field type, it may happen this field was not dirty-->
            <div class="error-message" *ngIf="(!isValid && isDirty && errorMessage) || (hasKeyFieldError && field.IsPartOfKey)">{{errorMessage}}</div>
        </div>
    </div>
</div>
