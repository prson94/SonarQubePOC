<ig-portal-content-provider [template]="template"
	name="page-header">
	<ng-template #template>
		<div class="title">
			<span class="d3s-icon asset-icon">
				<i *ngIf="!iconPath" class="fa {{icon}}"></i>
				<img *ngIf="iconPath" [src]="iconPath" alt="icon">
			</span>
			<h1 title="{{header}}">{{header}}</h1>
		</div>
	</ng-template>
</ig-portal-content-provider>
