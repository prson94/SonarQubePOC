<ng-container *ngIf="relationshipType">
    <div class="multiselect-grid-header">
        <div class="simple-search">
            <ig-search-field mode="Keypress"
                             [debounce]="600"
                             (onSearch)="onSimpleSearch($event)"
                             [(ngModel)]="simpleTextFilter"
                             [infoTooltip]="simpleSearchTooltipHTML">
            </ig-search-field>
        </div>
        <advanced-filtering *ngIf="!isReferenceListType(targetAssetTypeUid)"
                            [loadIdentifier]="targetAssetTypeUid"
                            (onChange)="advancedFiltersChanged($event)">
        </advanced-filtering>
        <div *ngIf="selectedItems && selectedItems.length > 0" class="multiselect-grid-sel">
            <span *ngIf="selectedItems && selectedItems.length === 1">1 item selected</span>
            <span *ngIf="selectedItems && selectedItems.length > 1">{{selectedItems.length}} items selected</span>
        </div>
    </div>

    <p-table #dt
             [columns]="cols"
             [value]="items"
             [lazy]="isLazyLoad"
             (onLazyLoad)="loadAssetsLazy($event)"
             [paginator]="true"
             [pageLinks]="3"
             [totalRecords]="lazyLoadTotalCount"
             [loading]="isLoading"
             [selection]="selectedItems"
             [selectionMode]="multiple ? 'multiple' : 'single'"
             (selectionChange)="handleItemSelection($event);"
             [globalFilterFields]="['Text']"
             [rows]="defaultInitialItemsPerPage"
             [rowsPerPageOptions]="defaultPagingOptions"
             [scrollable]="true"
             [scrollHeight]="selectionScrollHeight">
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 38px;">
                    <p-tableHeaderCheckbox *ngIf="multiple"></p-tableHeaderCheckbox>
                </th>
                <th>Available Assets</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
            <tr [pSelectableRow]="item">
                <td style="width: 38px;padding-left:10px;" class="disable-pointer-events">
                    <p-tableRadioButton *ngIf="!multiple" [value]="item"></p-tableRadioButton>
                    <p-tableCheckbox *ngIf="multiple" [value]="item"></p-tableCheckbox>
                </td>
                <td>
                    <div class="asset-selection">
                        <div class="front-elide">
                            <bdi>{{item.Text}}</bdi>
                        </div>
                        <div class="flex-grow"></div>
                        <button *ngIf="!isReferenceListType(targetAssetTypeUid)" (click)="onInfoClick.emit(item);higlightedItem = item" class="{{(higlightedItem === item ? 'highlighted' : '')}}" igButton icon="fa-info-circle" pTooltip="View Information" tooltipPosition="top" tooltipStyleClass="ig-tooltip"></button>

                    </div>

                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage" let-columns>
            <tr>
                <td colspan="2">
                    No assets found
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="summary">
            <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
        </ng-template>
    </p-table>
</ng-container>
