<d3s-dynamic-editor 
                    [objectID]="editorObjectID"
                    [objectType]="editorObjectType"
                    [parentID]="parentId"
                    [objectTypeUid]="assetTypeID"
                    [title]="editorTitle"
                    [selection]="editorSelection"
                    (saveClick)="saveAsset($event);"
                    (closeClick)="close()"
                    [isV2API]="true"></d3s-dynamic-editor>
