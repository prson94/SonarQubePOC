<div *ngIf="(objectType && objectID) || (objectType && objectUID)" [style.padding-left]="paddingLeft" class="asset-detail">
    <div *ngIf="isLoading" style="width:100%; text-align:center;">
        <div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
    </div>
    <div *ngIf="!isLoading">
        <ng-container *ngIf="showHeader">
            <div class="asset-detail-header">
                <div class="right d3s-score-container" style="display: block">
                    <d3s-score-badge *ngFor="let score of model?.Scores" [score]="score" [precision]="1" [useMiniBadge]="true"></d3s-score-badge>
                </div>
                <div class="asset-name">
                    {{model?.AssetName}}
                </div>
                <div class="class-name">
                    {{model?.AssetTypeName}}
                </div>
                <div>
                    <a (click)="open();">Open</a> | <a (click)="open(true);">Open in New Tab</a>
                </div>
            </div>
        </ng-container>
        <ng-container *ngIf="isSidePanel">
            <div class="windowtabs">
                <button [class]="(tab == 'detail') ? 'tab-selected' : 'tab'" (click)="clickTab('detail')">Details</button>
                <button [class]="(tab == 'ownership') ? 'tab-selected' : 'tab'" (click)="clickTab('ownership')" [disabled]="model.HasOwnership || isLoading">Ownership</button>
            </div>
        </ng-container>
        <ng-container [ngSwitch]="tab">
            <ng-container *ngSwitchCase="'detail'">
                <div *ngFor="let category of categories; let first=first">
                    <ng-container *ngIf="useAccordion; else noAccordion">
                        <ig-property-group *ngIf="category.loaded && category.hasData"
                                           [expanded]="category.active"
                                           (expandedChange)="category.active = $event; saveState()"
                                           [title]="category.name"
                                           [showHeaderLine]="!first && showHeaderLine"
                                           [shouldBePadded]="shouldBePadded">
                            <div readonly>
                                <ig-asset-detail-category [category]="category" [assetUID]="assetUID" [tooltipAlign]="tooltipAlign" [spacerHeight]="spacerHeight" [isSidePanel]="isSidePanel"></ig-asset-detail-category>
                            </div>
                        </ig-property-group>
                    </ng-container>
                    <ng-template #noAccordion>
                        <div style="line-height: 10px">&nbsp;</div>
                        <ig-asset-detail-category [category]="category"
                                                  [assetUID]="assetUID"
                                                  [tooltipAlign]="tooltipAlign"
                                                  [isSidePanel]="isSidePanel"
                                                  [spacerHeight]="spacerHeight"></ig-asset-detail-category>
                    </ng-template>
                </div>
                <div>
                    <ig-property-group *ngFor="let nym of nymTypes"
                                       [expanded]="false"
                                       title="{{ nym.Name }} ({{ synonyms.itemCount }})"
                                       [showHeaderLine]="!first && showHeaderLine"
                                       [shouldBePadded]="shouldBePadded">
                        <div readonly>
                            <d3s-synonyms-tile #synonyms
                                               [predicateId]="nym.ID"
                                               [predicateName]="nym.Name"
                                               [objectID]="objectID"
                                               [objectType]="objectType"
                                               [assetUid]="objectUID"
                                               [readonly]="false"
                                               [hasAdd]="hasAddRelationshipsPermissions"
                                               [hasDelete]="hasDeleteRelationshipsPermissions"
                                               [synonymPermission]="synonymPermission"></d3s-synonyms-tile>
                            <div style="height: 32px">
                                &nbsp;
                            </div>
                        </div>
                    </ig-property-group>
                    <ig-property-group *ngIf="systemPropertiesCategory.loaded && systemPropertiesCategory.hasData"
                                       [title]="systemPropertiesCategory.name"
                                       [showHeaderLine]="!first && showHeaderLine"
                                       [expanded]="systemPropertiesCategory.active"
                                       (expandedChange)="systemPropertiesCategory.active = $event; saveState()"
                                       [shouldBePadded]="shouldBePadded">
                        <div readonly>
                            <ig-asset-detail-category [category]="systemPropertiesCategory" [assetUID]="assetUID" [tooltipAlign]="tooltipAlign" [spacerHeight]="spacerHeight" [isSidePanel]="isSidePanel"></ig-asset-detail-category>
                        </div>
                    </ig-property-group>
                </div>
            </ng-container>
            <ng-container *ngSwitchCase="'ownership'">
                <ng-container *ngIf="model?.HasResponsibilityReadAccess === true">
                    <div *ngIf="model?.AssetUid">
                        <d3s-people-responsibilities-tile [assetUid]="model.AssetUid"
                                          [assetID]="model.AssetID"
                                          [showTitle]="false"
                                          [showRowTools]="false">
                        </d3s-people-responsibilities-tile>
                    </div>
                </ng-container>
                <ng-container *ngIf="model?.HasResponsibilityReadAccess === false">
                    <div class="empty-overlay">
                        <div class="content">
                            <div class="icon-holder">
                                <i class="fa fa-ban"></i>
                            </div>
                            <span>You do not have permission to view ownership information for the selected item</span>
                        </div>
                    </div>
                </ng-container>
            </ng-container>
        </ng-container>

    </div>
</div>
