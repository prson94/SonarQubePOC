<div *ngIf="!category.loaded" style="width:100%; text-align:center;">
    <div style="padding:10px;"><i class="fa fa-spinner fa-spin"></i></div>
</div>
<div *ngIf="category.loaded">
    <div *ngFor="let row of category.rows; let last=last">
        <div class="row" attr.data-category="{{row.Category}}">
            <div *ngFor="let field of row.FirstColumnFields" class="{{getRowClass(row.FirstColumnFields)}}"
                 [style.width.px]="getColumnWidth(row.FirstColumnFields)">
                <div class="row-header">
                    <label class="ig-label">
                        <d3s-dynamic-field-name [field]="field"></d3s-dynamic-field-name>
                    </label>
                    <ig-portal-renderer [name]="'field/' + field.Name + '-' + objectIdService.getObjectId(field) + '/asset-detail-category/label-right'">
                    </ig-portal-renderer>
                </div>
                <ig-asset-detail-field [field]="field" [assetUid]="assetUID" [tooltipAlign]="tooltipAlign"
                                       [isSidePanel]="isSidePanel"
                                       [interceptLinkClick]="true"></ig-asset-detail-field>
            </div>
            <div *ngIf="last" [style.height]="spacerHeight">
                &nbsp;
            </div>
        </div>
    </div>
</div>
