<div #item class="{{additionalCssClasses}} header-search header-table" (keyup)="checkKey($event,ac)">
    <div class="header-search-input">
        <p-autoComplete #ac size="300"
                        styleClass="global-search-typeahead"
                        scrollHeight="400px"
                        [(ngModel)]="result"
                        [suggestions]="results"
                        field="Name"
                        (completeMethod)="search($event)"
                        [placeholder]="autocompletePlaceholder"
                        [minLength]="1"
                        (onBlur)="clearValue()"
                        (onSelect)="selectItem(ac)">
            <ng-template let-result pTemplate="item">
                <div>
                    <div *ngIf="result?.Type == endSearchAllTypeToken;else suggestion" class="search-typeahead-suggestion">
                        <i class="folder-icon searchall fa fa-search"></i><span>Show All Results</span>
                        <span class="category">Choose this option or hit Enter to see all matches</span>
                    </div>
                    <ng-template #suggestion>
                        <div class="search-typeahead-suggestion">
                            <i *ngIf="result?.Icon" class="folder-icon fa {{result.Icon}}"></i><span *ngIf="result?.ImageUrl" class="folder-icon"><img [src]="result.ImageUrl" /></span><span>{{result.DisplayName}}</span>
                            <span *ngIf="result?.Tags" class="tag-list-container">
                                <button *ngFor="let tag of result?.Tags" class="button">
                                    <span class="tag-item-wrapper" [innerHtml]="tag.Value"></span>
                                </button>
                            </span>
                            <span class="category">
                                {{result?.Group}}<span *ngIf="result?.Type"><i class="fa fa-angle-right"></i><span [innerHtml]="result?.Type"></span></span>
                            </span>
                        </div>
                    </ng-template>
                </div>
            </ng-template>
        </p-autoComplete>
        <span class="search-button {{showBigButton ? 'big' : ''}}">
            <i *ngIf="isSearchInProgress" class="fa fa-spinner fa-spin"></i>
            <i *ngIf="!isSearchInProgress" class="fa fa-search" (click)="openSearch()"></i>
        </span>
    </div>
</div>
