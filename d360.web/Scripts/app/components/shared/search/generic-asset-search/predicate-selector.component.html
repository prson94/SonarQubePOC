<div class="predicate-selector" (click)="openSelection()">
    <span class="selected-value {{noPredicates ? 'greyed-out' : ''}}">{{selected ? renderPredicateTitle(selected) : noPredicates ? 'No defined predicates' : '-select predicate-'}}</span>
    
    <ng-container *ngIf="predicates && !noPredicates">
        <i class="fa fa-caret-down"></i>
        <div class="selector" *ngIf="isSelectionVisible">
            <ul class="options stripped-list">
                <li *ngFor="let item of predicates" (click)="selectPredicate(item);">
                    {{renderPredicateTitle(item)}}
                </li>
            </ul>
        </div>
    </ng-container>
</div>
