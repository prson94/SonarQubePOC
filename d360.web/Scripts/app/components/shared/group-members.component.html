<div *ngIf="groupId">
    <div>
        <header>
            {{title}}
            <d3s-tile-actions [hasAdd]="true" (addClick)="add()"  [hasFilterMode]="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
        </header>
    </div>
    <div [ngSwitch]="formMode">
        <div *ngSwitchDefault>
            <input [hidden]="!showSimpleFilter" #gb type="text" pInputText size="100" placeholder="Search..." class="grid-simple-filter">                                              
            <p-dataTable #dt [globalFilter]="gb" [value]="groupItems" selectionMode="single" [rows]="20" [paginator]="true" [(selection)]="selectedRow">
                <p-footer *ngIf="dt.totalRecords"><d3s-grid-paging-info [totalRecords]="dt.totalRecords" [first]="dt.first" [rows]="dt.rows"></d3s-grid-paging-info></p-footer>
                <p-column field="LastName" header="Last Name" sortable="true" [style]="{ 'width': '30%' }" [filter]="!showSimpleFilter"></p-column>
                <p-column field="FirstName" header="First Name" sortable="true" [style]="{ 'width': '30%' }" [filter]="!showSimpleFilter"></p-column>
                <p-column field="Owner" header="Owner" sortable="true" [style]="{ 'width': '25%' }" [filter]="!showSimpleFilter"></p-column>
                <p-column [style]="{ 'width': '2%' }">
                    <ng-template let-col let-item="rowData" pTemplate type="body">
                        <div class="RowTools">
                            <d3s-preview-tooltip objectType="Resource" [objectId]="item.ResourceID" icon="info"></d3s-preview-tooltip>
                         </div>
                    </ng-template>
                </p-column>
                <p-column [style]="{ 'width': '3%' }">
                    <ng-template let-col let-item="rowData" pTemplate type="body">
                        <div class="RowTools">
                            <a (click)="delete(item.ResourceID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </ng-template>
                </p-column>
            </p-dataTable>
        </div>
        <div *ngSwitchCase="FormMode.Adding">
            <div class="row">
                <div class="col s12">
                    Add a user to {{groupName}}
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <d3s-resource-multiselect-grid [multiple]="field.MultiSelect" [(ngModel)]="field.Value" [showToolTip]="true" [showResourceType]="true" ngDefaultControl [field]="field"></d3s-resource-multiselect-grid>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <button pButton label="Add" (click)="save();"></button><button pButton label="Cancel" (click)="cancel();"></button>
                </div>
            </div>
        </div>
        <div *ngSwitchCase="FormMode.Deleting">
            <d3s-delete-form [uri]="'/form/ResourceGroup?groupID=' + selectedRow.GroupID + '&resourceID=' + selectedRow.ResourceID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to remove ' + selectedRow.FirstName + ' ' + selectedRow.LastName + ' from ' + groupName + '?'"
                         (onDeleteSuccess)="confirmDelete()"
                         (onCancel)="cancel();">
            </d3s-delete-form>
        </div>
    </div>
</div>
