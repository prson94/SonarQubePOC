<div *ngIf="groupUid">
    <div>
        <header>
            {{title}}
            <d3s-tile-actions [hasAdd]="!groupIsActiveDirectory" (addClick)="add()"  [hasFilterMode]="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
        </header>
    </div>
    <div [ngSwitch]="formMode">
        <div *ngSwitchDefault>
            <input type="text" [hidden]="!showSimpleFilter" pInputText size="100" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search..." class="grid-simple-filter">
            <p-table #dt [value]="groupItems" selectionMode="single" [metaKeySelection]="true" [globalFilterFields]="['LastName','FirstName','Owner']" [paginator]="true" [rows]="20" [(selection)]="selectedRow">
                <ng-template pTemplate="header">
                    <tr>
                        <th [pSortableColumn]="'LastName'" style="width: 30%">
                            Last Name
                            <d3s-sortIcon [field]="'LastName'"></d3s-sortIcon>
                        </th>
                        <th [pSortableColumn]="'FirstName'" style="width: 30%">
                            First Name
                            <d3s-sortIcon [field]="'FirstName'"></d3s-sortIcon>
                        </th>
                        <th [pSortableColumn]="'Owner'" style="width: 25%">
                            Owner
                            <d3s-sortIcon [field]="'Owner'"></d3s-sortIcon>
                        </th>
                        <th style="width: 2%"></th>
                        <th style="width: 3%"></th>
                    </tr>
                    <tr [hidden]="showSimpleFilter">
                        <th><d3s-column-filter [field]="'LastName'" [datatype]="'text'"></d3s-column-filter></th>
                        <th><d3s-column-filter [field]="'FirstName'" [datatype]="'text'"></d3s-column-filter></th>
                        <th><d3s-column-filter [field]="'Owner'" [datatype]="'text'"></d3s-column-filter></th>
                        <th></th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-item>
                    <tr [pSelectableRow]="item">
                        <td>{{item.LastName}}</td>
                        <td>{{item.FirstName}}</td>
                        <td>{{item.Owner}}</td>
                        <td>
                            <div class="RowTools">
                                <d3s-preview-tooltip objectType="Resource" [objectId]="item.ResourceID" icon="info"></d3s-preview-tooltip>
                            </div>
                        </td>
                        <td>
                            <div class="RowTools">
                                <a (click)="delete(item.ResourceID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="summary">
                    <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
                </ng-template>
            </p-table>
        </div>
        <div *ngSwitchCase="FormMode.Adding">
            <div class="row">
                <div class="col s12">
                    Add a user to {{groupName}}
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <d3s-resource-multiselect-grid [multiple]="field.MultiSelect" [(ngModel)]="field.Value" [showToolTip]="true" [showResourceType]="true" ngDefaultControl [field]="field"></d3s-resource-multiselect-grid>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <button pButton label="Add" (click)="save();"></button><button pButton label="Cancel" (click)="cancel();"></button>
                </div>
            </div>
        </div>
        <div *ngSwitchCase="FormMode.Deleting">
            <d3s-delete-form
                             [callback]="theDeleteCallback"
                             [method]="'callback'"
                             [prompt]="'Are you sure you want to remove ' + selectedRow.FirstName + ' ' + selectedRow.LastName + ' from ' + groupName + '?'"
                             (onDeleteSuccess)="confirmDelete()"
                             (onCancel)="cancel();">
            </d3s-delete-form>
        </div>
    </div>
</div>
