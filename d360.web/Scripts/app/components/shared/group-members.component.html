<div *ngIf="groupId">
    <div>
        <header>
            {{title}}
            <d3s-tile-actions [hasAdd]="true" (addClick)="add()"  [hasFilterMode]="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
        </header>
    </div>
    <div [ngSwitch]="formMode">
        <div *ngSwitchDefault>
            <input [hidden]="!showSimpleFilter" #gb type="text" pInputText size="100" placeholder="Search..." class="grid-simple-filter">                                              
            <p-dataTable #dt [globalFilter]="gb" [value]="groupItems" selectionMode="single" [rows]="20" [paginator]="true" [(selection)]="selectedRow">
                <footer *ngIf="dt.totalRecords"><d3s-grid-paging-info [totalRecords]="dt.totalRecords" [first]="dt.first" [rows]="dt.rows"></d3s-grid-paging-info></footer>
                <p-column field="LastName" header="Last Name" sortable="true" [style]="{ 'width': '30%' }" [filter]="!showSimpleFilter"></p-column>
                <p-column field="FirstName" header="First Name" sortable="true" [style]="{ 'width': '30%' }" [filter]="!showSimpleFilter"></p-column>
                <p-column field="Owner" header="Owner" sortable="true" [style]="{ 'width': '20%' }" [filter]="!showSimpleFilter"></p-column>
                <p-column [style]="{ 'width': '20%' }">
                    <template let-col let-item="rowData" pTemplate type="body">
                        <div class="RowTools">
                            <d3s-tooltip [objectType]="'Resource'" [objectId]="item.ResourceID" tooltipType="preview"><i class="fa fa-info"></i></d3s-tooltip>
                            <a (click)="delete(item.ResourceID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </template>
                </p-column>
            </p-dataTable>
        </div>
        <div *ngSwitchCase="FormMode.Adding">
            <div class="row">
                <div class="col s12">
                    Add a user to {{groupName}}
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <div class="FieldName" style="display:block;"></div>
                    <p-dropdown [options]="resourceList" [(ngModel)]="selectedResource" [style]="{'width' : '98%'}"></p-dropdown>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <button pButton label="Add" (click)="save();"></button><button pButton label="Cancel" (click)="cancel();"></button>
                </div>
            </div>
        </div>
        <div *ngSwitchCase="FormMode.Deleting">
            <delete-form [uri]="'/form/ResourceGroup?groupID=' + selectedRow.GroupID + '&resourceID=' + selectedRow.ResourceID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to remove ' + selectedRow.FirstName + ' ' + selectedRow.LastName + ' from ' + item.Name + '?'"
                         (onDeleteSuccess)="confirmDelete()"
                         (onCancel)="cancel();">
            </delete-form>
        </div>
    </div>
</div>
