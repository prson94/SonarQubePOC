<d3s-loading [isLoading]="isGridLoading"></d3s-loading>
<div *ngIf="!isGridLoading">
    <div *ngIf="!shouldShowEditor() && !showDelete && count > 0">

        <input type="text" igInput igSize="full" [hidden]="!simpleFilter" pInputText (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search..." class="grid-simple-filter">
        <p-table #dt
                 [value]="relations"
                 selectionMode="single"
                 [metaKeySelection]="true"
                 [globalFilterFields]="globalFilterFields"
                 [pageLinks]="3"
                 [paginator]="true"
                 [rows]="defaultInitialItemsPerPage"
                 [rowsPerPageOptions]="defaultPagingOptions"
                 [(selection)]="selected"
                 [scrollable]="true"
                 [lazy]="true"
                 [totalRecords]="totalRecords"
                 [loading]="isDataLoading"
                 [loadingIcon]="'fa fa-spinner fa-spin'"
                 (onLazyLoad)="loadRelationshipLazy($event)"
                 scrollWidth="100%">
            <ng-template pTemplate="colgroup">
                <colgroup>
                    <col style="width: 30px">
                    <col style="width: 30px">
                    <col style="width: 30px">
                    <col *ngFor="let col of columns">
                </colgroup>
            </ng-template>
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 30px"></th>
                    <th style="width: 30px"></th>
                    <th style="width: 30px"></th>
                    <th *ngFor="let column of columns" [pSortableColumn]="column.sortable ? column.datafield : null ">
                        {{column.text}}
                        <d3s-sortIcon [field]="column.datafield"></d3s-sortIcon>
                    </th>
                </tr>
                <tr [hidden]="simpleFilter">
                    <th style="width: 30px"></th>
                    <th style="width: 30px"></th>
                    <th style="width: 30px"></th>
                    <th *ngFor="let column of columns">
                        <d3s-column-filter *ngIf="column.filterable" [field]="column.datafield" [datatype]="'text'"></d3s-column-filter>
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item>
                <tr (dblclick)="selected=item;showEditor=true;" [pSelectableRow]="item">
                    <td>
                        <div class="RowTools">
                            <a style="cursor:pointer;"><i [copy-clipboard]="item.Uid" [pTooltip]="'UID: \n' + item.Uid + '\n\n (click to copy)\n'" tooltipPosition="top" class="fa fa-info"></i></a>
                        </div>
                    </td>
                    <td>
                        <div class="RowTools" *ngIf="hasEdit && showEditPencil">
                            <a style="cursor:pointer;" (click)="selected=item;showEditor=true;" title="Edit"><i class="fa fa-pencil"></i></a>
                        </div>
                    </td>
                    <td>
                        <div class="RowTools" *ngIf="hasDelete && !readOnly">
                            <a style="cursor:pointer;" (click)="selected=item;doDelete();" title="Remove"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </td>
                    <td *ngFor="let column of columns">
                        <d3s-preview-tooltip [uid]="getAssetUid(item)" (click)="selectObject(item)" [align]="'right'">
                            <d3s-dynamic-field-value [column]="column" [fields]="fields" [item]="item" [useApiName]="true"></d3s-dynamic-field-value>
                        </d3s-preview-tooltip>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="summary">
                <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
            </ng-template>
        </p-table>
    </div>
    <d3s-dynamic-editor *ngIf="shouldShowEditor()"
                        [objectTypeUid]="intersectTypeUid"
                        [objectType]="'IntersectType'"
                        [targetUid]="assetUid"
                        [useTypeUidForDefinition]="true"
                        [title]="relationshipName"
                        [directions]="'You will only be able to relate to assets that you have Modify Relationships permission to.'"
                        [selection]="addRelationship ? null : selected"
                        [rowID]="'ID'"
                        [isSaveDisabled]="isSaveDisabled"
                        (saveClick)="saveRelationship($event)"
                        (closeClick)="closeEditor()"
                        [useV2ApiLink]="true"></d3s-dynamic-editor>
    <div *ngIf="count === 0 && !shouldShowEditor()">
        <h5 class="center-align" style="font-weight:bold;">No relationships exist from this object to this object type.</h5>
    </div>
    <d3s-delete-form *ngIf="showDelete"
                     [callback]="theDeleteCallback"
                     [itemId]="selected?.Uid"
                     [method]="'callback'"
                     [prompt]="'Are you sure you want to delete the relationship [' + [selected?.Name] + ']?'"
                     (onCancel)="cancelDelete();"></d3s-delete-form>
</div>
