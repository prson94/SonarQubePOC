<d3s-modal [subtitle]="subtitle"
           [showTitle]="false"
           additionalClasses="full-window-dialog relationship-dialog"
           [showConfirm]="false"
           (onClose)="cancel()"
           [isVisible]="isModalVisible">
    <div class="modal-with-side-panel">
        <gov-relationship-grid (onClose)="cancel()" [assetUid]="assetUid" [assetTypeUid]="assetTypeUid" [isInModal]="true"></gov-relationship-grid>
    </div>
</d3s-modal>
