
<div #container class="tag-list-container">
    <ng-container *ngFor="let tag of tags;">

        <a (click)="getTagUrl(tag,$event)" [attr.target]="'_blank'" class="link-button">
            <div #el (mouseenter)="enter($event.target)" (mouseleave)="leave($event.target)" class="tag-item-wrapper">
                {{tag.Value}}
            </div>
            <div class="RowTools">
                <d3s-preview-tooltip *ngIf="tag"
                                     [objectType]="'Tag'"
                                     [objectId]="tag.uid">
                </d3s-preview-tooltip>
            </div>
        </a>
    </ng-container>
    <ng-container *ngIf="tags.length > 10">
        <a (click)="showAllToggle($event);" style="display:block;margin-left:6px;">
            <ng-container *ngIf="isShowAll">Hide all</ng-container>
            <ng-container *ngIf="!isShowAll">Show all {{tags.length}} tags</ng-container>
        </a>
    </ng-container>
</div>
