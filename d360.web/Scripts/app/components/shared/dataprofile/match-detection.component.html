<d3s-modal #popupBox
           additionalClasses="about large-dialog"
           [showTitle]="false"
           (onClose)="onClose.emit();"
           [isVisible]="isVisible"
           tabindex=-1>
    <div class="content">
        <div class="modal-edit-form">
            <div class="title">
                Match Detection
            </div>
        </div>
        <ig-property-group [title]="'Duplicate Fields (Same Type and Matching Data)'">
            <div readonly>
                <p-table #dtDupli [metaKeySelection]="true"
                         [value]="duplicatesData"
                         [(selection)]="duplicatesSelection"
                         [globalFilterFields]="['Path']"
                         dataKey="uid"
                         [rows]="10"
                         [lazy]="true"
                         (onLazyLoad)="lazyLoad($event,'Data')"
                         [loading]="duplicatesDataLoading"
                         [loadingIcon]="'fa fa-spinner fa-spin'">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>
                                Asset Path
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-item>
                        <tr [pSelectableRow]="item">
                            <td>
                                <span class="item-value" [innerHTML]="item.path"></span>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
                <d3s-grid-paging-info [first]="dtDupli.first"
                                      [rows]="dtDupli.rows"
                                      [totalRecords]="duplicatesDataTotalCount"></d3s-grid-paging-info>
            </div>
        </ig-property-group>

        <ig-property-group [title]="'Similiar Fields (Same Type)'">
            <div readonly>
                <p-table #dtSimi [metaKeySelection]="true"
                         [value]="similiarData"
                         [(selection)]="similiarSelection"
                         [globalFilterFields]="['Path']"
                         dataKey="uid"
                         [rows]="10"
                         [lazy]="true"
                         (onLazyLoad)="lazyLoad($event,'Structure')"
                         [loading]="similiarDataLoading"
                         [loadingIcon]="'fa fa-spinner fa-spin'">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>
                                Asset Path
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-item>
                        <tr [pSelectableRow]="item">
                            <td>
                                <span class="item-value" [innerHTML]="item.path"></span>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
                <d3s-grid-paging-info [first]="dtSimi.first"
                                      [rows]="dtSimi.rows"
                                      [totalRecords]="similiarDataTotalCount"></d3s-grid-paging-info>
            </div>
        </ig-property-group>

    </div>
    <div class="action-bar">
        <span class="grow"></span>
        <button igButton (click)="onClose.emit()" class="ig-button-primary" label="Close"></button>
    </div>
</d3s-modal>
