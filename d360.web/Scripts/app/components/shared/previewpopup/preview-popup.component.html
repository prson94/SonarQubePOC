<p-dialog [(visible)]="displaydialog" [showHeader]="false" [resizable]="false" (onHide)="closeDialog()" styleClass="previewpopup" [positionTop]="getTop()" [positionLeft]="getLeft()">
    <div class="popuppanel">
        <div class="type">{{ data?.TypeName }}</div>
        <div class="title">
            <a *ngIf="data && data.Url" [routerLink]="data?.Url">{{data?.DisplayName}}</a>
            <span *ngIf="data==undefined || data.Url == undefined ">{{data?.DisplayName}}</span>
        </div>
        <d3s-loading [isLoading]="loading"></d3s-loading>
        <table>
            <tr class="panel-row" *ngIf="data?.Levels">
                <td class="panel-row-label" i18n>Path:</td>
                <td class="panel-row-control">
                    <div *ngFor="let field of data?.Levels; let ii = index">
                        <span *ngIf="ii == 0"></span>
                        <div>
                            <span *ngIf="field.Level">{{ field.Level }}&nbsp;{{ field.LevelName }}</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="float:center;">{{ field?.Path }}</span>
                        </div>
                    </div>
                </td>
            </tr>
            <tr class="panel-row" *ngIf="data?.AssetID && data?.AssetID > 0">
                <td class="panel-row-label" i18n>Asset ID</td>
                <td class="panel-row-control">
                    {{data.AssetID}}
                </td>
            </tr>
            <tr class="panel-row" *ngIf="data?.UID">
                <td class="panel-row-label">UID</td>
                <td class="panel-row-control">
                    {{data.UID}} <a style="cursor:pointer;"><i [copy-clipboard]="data.UID" class="fa fa-files-o"></i></a>
                </td>
            </tr>
            <tr class="panel-row" *ngIf="data?.WorkflowTypeUID">
                <td class="panel-row-label" i18n>Workflow Type UID</td>
                <td class="panel-row-control" [innerHtml]="data.WorkflowTypeUID"></td>
            </tr>

            <ng-container *ngFor="let field of data?.FieldValues">

                <tr class="panel-row" *ngIf="field.Value">
                    <td class="panel-row-label">{{ field.Name }}</td>
                    <td class="panel-row-control">
                        <ng-container>
                            <span *ngIf="field.Type == 'Html' || field.Type == 'Link'" [innerHtml]="field.Value"></span>
                            <ng-container *ngIf="field.Type == 'JSON'">
                                <span (click)="$event.stopPropagation()">
                                    <ngx-json-view [data]="GetJSON(field.Value)"></ngx-json-view>
                                </span>
                            </ng-container>
                            <ng-container *ngIf="field.Type == 'Tag' && field.Value.length > 2">
                                <ng-container *ngFor="let tag of GetJSON(field.Value); let i = index">
                                    <span>{{i != 0 ? ',' : ''}}<a style="margin:0px;" href="tag/{{tag.uid}}">{{tag.Value}}</a></span>
                                </ng-container>
                            </ng-container>
                            <ng-container *ngIf="field.Type == 'Color'">
                                <d3s-color-display [colorsJSON]="field.Value"></d3s-color-display>
                            </ng-container>
                            <span *ngIf="field.Type != 'Html' && field.Type !='Link' && field.Type != 'JSON' && field.Type != 'Tag' && field.Type != 'Color'" [innerText]="field.Value"></span>
                        </ng-container>
                    </td>
                </tr>
            </ng-container>
        </table>
    </div>
    <p-footer>
        <button igButton type="button" (click)="closeDialog()" i18n-label label="Close"></button>
    </p-footer>
</p-dialog>
