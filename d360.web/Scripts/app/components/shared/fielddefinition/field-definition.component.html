<div *ngIf="objectType && objectID">
    <div>
        <header>
            {{title}}            
            <d3s-tile-actions *ngIf="!isEditing && !isDeleting" [hasAdd]="showAddButton" (addClick)="add()" [hasFilterMode]="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>                            
        </header>
    </div>    
    <div *ngIf="isEditing">
        <d3s-field-type-form
            [id]="selectedRow != null? selectedRow.ID : 0"
            [objectType]="objectType"
            [objectID]="objectID"
            [showIsListable]="showIsListable"
            [showIsPartOfKey]="showIsPartOfKey"
            (onCancel)="isEditing = false; onCancel.emit()"
            (onComplete)="editComplete($event)"></d3s-field-type-form>
    </div>    
    <d3s-delete-form *ngIf="isDeleting"
                     [callback]="theDeleteCallback"
                     [itemId]="selectedRow?.ID"
                     [method]="'callback'"
                     [prompt]="'Are you sure you want to delete the field type [' + [selectedRow?.Name] + ']?'"
                     (onCancel)="isDeleting=false; onCancel.emit();"></d3s-delete-form>            
    <div *ngIf="!isEditing && !isDeleting">
        <div *ngIf="!isLoading && !hasKeyFields && (objectType == 'ArtifactType' || objectType == 'TaxonomyType' || objectType == 'PolicyType' || objectType == 'RuleType' || objectType == 'LookupType')" class="error">Warning: No key fields are defined. Please consider adding one or more key fields to uniquely identify your data.</div>
        <input type="text" [hidden]="!showSimpleFilter" pInputText size="100" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search..." class="grid-simple-filter">
        <p-table #dt [value]="fieldDefinitions" selectionMode="single" [loading]="isLoading" loadingIcon="fa fa-spinner" [metaKeySelection]="true" [globalFilterFields]="['FriendlyName','Type','Category','IsListable','IsRequired','IsPartOfKey','SortOrder','ColumnWidth']"
                 [(selection)]="selectedRow" [scrollable]="true" scrollHeight="200px">
            <ng-template pTemplate="colgroup" let-columns>
                <colgroup>
                    <col style="width: 20%">
                    <col style="width: 15%">
                    <col style="width: 15%">
                    <col style="width: 12%" *ngIf="showIsListable">
                    <col style="width: 12%">
                    <col style="width: 12%" *ngIf="showIsPartOfKey">
                    <col style="width: 12%">
                    <col style="width: 12%">
                    <col style="width: 30px">
                    <col style="width: 30px">
                    <col style="width: 30px" *ngIf="showEditButton">
                    <col style="width: 30px" *ngIf="showDeleteButton">
                </colgroup>
            </ng-template>
            <ng-template pTemplate="header">
                <tr>
                    <th [pSortableColumn]="'FriendlyName'" style="width: 20%">
                        Field
                        <d3s-sortIcon [field]="'FriendlyName'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'Type'" style="width: 15%">
                        Type
                        <d3s-sortIcon [field]="'Type'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'Category'" style="width: 15%">
                        Category
                        <d3s-sortIcon [field]="'Category'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'IsListable'" style="width: 12%" *ngIf="showIsListable">
                        Listable?
                        <d3s-sortIcon [field]="'IsListable'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'IsRequired'" style="width: 12%">
                        Required?
                        <d3s-sortIcon [field]="'IsRequired'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'IsPartOfKey'" style="width: 12%" *ngIf="showIsPartOfKey">
                        Key?
                        <d3s-sortIcon [field]="'IsPartOfKey'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'ShowIfEmpty'" style="width: 12%">
                        Show if Empty?
                        <d3s-sortIcon [field]="'ShowIfEmpty'"></d3s-sortIcon>
                    </th>
                    <th [pSortableColumn]="'SortOrder'" style="width: 12%">
                        Sort
                        <d3s-sortIcon [field]="'SortOrder'"></d3s-sortIcon>
                    </th>
                    <th style="width: 30px"></th>
                    <th style="width: 30px"></th>
                    <th style="width: 30px" *ngIf="showEditButton"></th>
                    <th style="width: 30px" *ngIf="showDeleteButton"></th>
                </tr>
                <tr [hidden]="showSimpleFilter">
                    <th><d3s-column-filter [field]="'FriendlyName'" [datatype]="'text'"></d3s-column-filter></th>
                    <th><d3s-column-filter [field]="'Type'" [datatype]="'text'"></d3s-column-filter></th>
                    <th><d3s-column-filter [field]="'Category'" [datatype]="'text'"></d3s-column-filter></th>
                    <th *ngIf="showIsListable"></th>
                    <th></th>
                    <th *ngIf="showIsPartOfKey"></th>
                    <th></th>
                    <th><d3s-column-filter [field]="'SortOrder'" [datatype]="'text'"></d3s-column-filter></th>
                    <th></th>
                    <th></th>
                    <th *ngIf="showEditButton"></th>
                    <th *ngIf="showDeleteButton"></th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item>
                <tr (dblclick)="isEditing=showEditButton;" [pSelectableRow]="item">
                    <td>{{item.FriendlyName}}</td>
                    <td>{{item.Type}}</td>
                    <td>{{item.Category}}</td>
                    <td *ngIf="showIsListable">
                        <span><i *ngIf="item.IsListable" class="fa fa-check enabled" title="True"></i></span>
                        <span><i *ngIf="!item.IsListable" class="fa fa-times disabled" title="False"></i></span>
                    </td>
                    <td>
                        <span><i *ngIf="item.IsRequired" class="fa fa-check enabled" title="True"></i></span>
                        <span><i *ngIf="!item.IsRequired" class="fa fa-times disabled" title="False"></i></span>
                    </td>
                    <td *ngIf="showIsPartOfKey">
                        <span><i *ngIf="item.IsPartOfKey" class="fa fa-check enabled" title="True"></i></span>
                        <span><i *ngIf="!item.IsPartOfKey" class="fa fa-times disabled" title="False"></i></span>
                    </td>
                    <td>
                        <span><i *ngIf="item.ShowIfEmpty" class="fa fa-check enabled" title="True"></i></span>
                        <span><i *ngIf="!item.ShowIfEmpty" class="fa fa-times disabled" title="False"></i></span>
                    </td>
                    <td>{{item.SortOrder}}</td>
                    <td>
                        <div class="RowTools">
                            <a (click)="moveUp(item)" style="cursor:pointer;margin:0px;"><i class="fa fa-caret-up"></i></a>
                        </div>
                    </td>
                    <td>
                        <div class="RowTools">
                            <a (click)="moveDown(item)" style="cursor:pointer;margin:0px;"><i class="fa fa-caret-down"></i></a>
                        </div>
                    </td>
                    <td>
                        <div class="RowTools" *ngIf="showEditButton">
                            <a (click)="edit(item.ID)" style="cursor:pointer;margin:0px;"><i class="fa fa-pencil"></i></a>
                        </div>
                    </td>
                    <td>
                        <div class="RowTools" *ngIf="showDeleteButton">
                            <a (click)="delete(item.ID)" style="cursor:pointer;margin:0px;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
