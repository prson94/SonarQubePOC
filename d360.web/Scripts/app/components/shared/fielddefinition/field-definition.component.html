<div *ngIf="objectType && objectID">
    <div>
        <header>
            {{title}}            
            <d3s-tile-actions *ngIf="!isLoading && !isEditing && !isDeleting" [hasAdd]="showAddButton" (addClick)="add()" [hasFilterMode]="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>                            
        </header>
    </div>
    <div *ngIf="isLoading" style="width:100%; text-align:center;">
        <div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
    </div>
    <div *ngIf="isEditing">
        <d3s-field-type-form [id]="selectedRow != null? selectedRow.ID : 0" [objectType]="objectType" [objectID]="objectID" (onCancel)="isEditing = false; onCancel.emit()" (onComplete)="editComplete($event)"></d3s-field-type-form>
    </div>    
    <d3s-delete-form *ngIf="isDeleting"
                     [callback]="theDeleteCallback"
                     [itemId]="selectedRow?.ID"
                     [method]="'callback'"
                     [prompt]="'Are you sure you want to delete the field type [' + [selectedRow?.Name] + ']?'"
                     (onCancel)="isDeleting=false; onCancel.emit();"></d3s-delete-form>            
    <div *ngIf="!isLoading && !isEditing && !isDeleting">
        <input [hidden]="!showSimpleFilter" #gb type="text" pInputText size="100" placeholder="Search..." class="grid-simple-filter">                                                             
        <p-dataTable #dt [globalFilter]="gb" [value]="fieldDefinitions" selectionMode="single" [(selection)]="selectedRow" (onRowDblclick)="isEditing=showEditButton;" scrollable="true"  scrollHeight="200px" sortField="SortOrder" [sortOrder]="1">
            <footer *ngIf="dt.totalRecords"><d3s-grid-paging-info [totalRecords]="dt.totalRecords" [first]="dt.first" [rows]="dt.rows"></d3s-grid-paging-info></footer>
            <p-column field="FriendlyName" header="Field" sortable="true" [style]="{ 'width': '20%' }" [filter]="!showSimpleFilter"></p-column>
            <p-column field="Type" header="Type" sortable="true" [style]="{ 'width': '20%' }" [filter]="!showSimpleFilter"></p-column>
            <p-column field="Category" header="Category" sortable="true" [style]="{ 'width': '20%' }" [filter]="!showSimpleFilter"></p-column>
            <p-column field="IsRequired" header="Required?" sortable="true" [style]="{ 'width': '12%' }">
                <template let-item="rowData" pTemplate type="body">
                    <input type="checkbox" [(ngModel)]="item.IsRequired" disabled />
                </template>
            </p-column>
            <p-column field="IsListable" header="Listable?" sortable="true" [style]="{ 'width': '12%' }">
                <template let-item="rowData" pTemplate type="body">
                    <input type="checkbox" [(ngModel)]="item.IsListable" disabled />
                </template>
            </p-column>
            <p-column [style]="{ 'width': '30px' }">
                <template let-col let-item="rowData" pTemplate type="body">
                    <div class="RowTools">
                        <a (click)="moveUp(item)" style="cursor:pointer;"><i class="fa fa-caret-up"></i></a>    
                    </div>
                </template>
            </p-column>
            <p-column [style]="{ 'width': '30px' }">
                <template let-col let-item="rowData" pTemplate type="body">
                    <div class="RowTools">
                        <a (click)="moveDown(item)" style="cursor:pointer;"><i class="fa fa-caret-down"></i></a>
                    </div>
                </template>
            </p-column>
            <p-column [style]="{ 'width': '30px' }" *ngIf="showEditButton">
                <template let-col let-item="rowData" pTemplate type="body">
                    <div class="RowTools">
                        <a (click)="edit(item.ID)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>                        
                    </div>
                </template>
            </p-column>
            <p-column [style]="{ 'width': '30px' }" *ngIf="showDeleteButton">
                <template let-col let-item="rowData" pTemplate type="body">
                    <div class="RowTools">                        
                        <a (click)="delete(item.ID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                    </div>
                </template>
            </p-column>
        </p-dataTable>
    </div>
</div>
