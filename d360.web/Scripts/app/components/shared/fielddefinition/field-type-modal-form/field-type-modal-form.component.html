<d3s-modal #modal
		   additionalClasses="modal-dyn-editor asset-editor large-dialog modal-form"
		   [showTitle]="false"
		   (onClose)="close()"
		   [isVisible]="isModalVisible">
	<div class="editor-container">
		<d3s-loading [isLoading]="isLoading || !areFieldTypesLoaded"></d3s-loading>

		<div *ngIf="!isLoading && areFieldTypesLoaded" class="form-editor-container {{savingInProgress ? 'saving-in-progress' : ''}}">
			<div class="form-header-wrapper">
				<div class="form-header">
					{{title}}
					<h2 *ngIf="subTitle" [innerHTML]="subTitle"></h2>
				</div>
				<ig-form-feedback-badges class="ig-form-feedback-badges"
										 [igformGroup]="fieldTypeForm"
										 [inputContainer]="formElement">
				</ig-form-feedback-badges>
			</div>
			<div class="form-container">

				<form #form
					  [formGroup]="fieldTypeForm"
					  [style.overflow]="'auto'">
					<ng-container *ngIf="formState === 'FieldTypeSelection'">
						<div class="simple-search">
							<span class="light-text" i18n>Select a field type from table below to continue.</span> <br />
							<ig-search-field mode="Keypress"
											 (onSearch)="dt.filterGlobal($event, 'contains')">
							</ig-search-field>
						</div>
						<p-table #dt
								 [value]="fieldTypes"
								 selectionMode="single"
								 [globalFilterFields]="['label']"
								 (selectionChange)="selectedFieldType = $event.value"
								 [(selection)]="fieldTypeSelection"
								 responsiveLayout="scroll"
								 [tableStyle]="{'min-width': 'max-content'}"
								 [loading]="areFieldTypesLoading"
								 [loadingIcon]="'fa fa-spinner fa-spin'">
							<ng-template pTemplate="header">
								<tr>
									<th i18n>
										Field Type
									</th>
								</tr>
							</ng-template>
							<ng-template pTemplate="body"
										 let-item>
								<tr [pSelectableRow]="item">
									<td class="rel-name">
										<p-tableRadioButton [pSelectableRow]="item" [value]="item"></p-tableRadioButton>

										<span class="rel-text">
											{{item.label}}
										</span>
									</td>
								</tr>
							</ng-template>
						</p-table>
					</ng-container>

					<div class="form-div" *ngIf="formState === 'Form'">
						<ig-property-group [showHeaderLine]="false" [igformGroup]="fieldTypeForm" title="General" i18n-title>
							<div inputs>
								<div class="form-group">
									<div class="row">
										<div class="field-col">
											<label for="FriendlyName" class="ig-label" i18n>Field Name</label>
											<input igInput
												   igSize="full"
												   name="FriendlyName"
												   tabindex="10"
												   formControlName="FriendlyName"
												   [igDataCy]="'Field_Type_Modal_Field_FriendlyName'"
												   (keyup)="updateApiName($event)"
												   type="text"
												   required />
										</div>
									</div>
									<div class="row">
										<div class="field-col">
											<label for="Name" class="ig-label" i18n>API Name</label>
											<input igInput
												   igSize="full"
												   name="Name"
												   tabindex="10"
												   formControlName="Name"
												   [igDataCy]="'Field_Type_Modal_Field_Name'"
												   type="text"
												   required />

											<div *ngIf="fieldTypeForm.get('Name')?.errors?.notUnique" class="ig-text-required" i18n>
												Please enter a unique value!
											</div>
											<div *ngIf="fieldTypeForm.get('Name')?.errors?.restricted" class="ig-text-required" i18n>
												Please enter a different value. The API Name entered contains a restricted value.
											</div>
										</div>
									</div>

									<div class="row">
										<div class="field-col">
											<label for="Category" class="ig-label" i18n>Category</label>
											<div class="category-picker">
												<input igInput
													   igSize="full"
													   name="Category"
													   tabindex="20"
													   formControlName="Category"
													   [igDataCy]="'Field_Type_Modal_Field_Category'"
													   type="text" />
												<div class="token-popup-menu">
													<button igButton type="button" icon="fa-ellipsis-v" (click)="tokenMenu.toggle($event);"></button>
													<ig-popup-menu (onSelect)="updateCategoryName($event)"
																   [items]="categoryTokens"
																   [forceOpenBottom]="true"
																   #tokenMenu
																   [tabIndex]="1"></ig-popup-menu>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</ig-property-group>

						<ig-property-group *ngIf="selectedFieldType === 'Path'" [showHeaderLine]="false" [igformGroup]="fieldTypeForm" title="Asset Path" i18n-title>
							<div inputs>
								<div class="form-group">
									<div class="row">
										<label for="AssetPathListSegment" class="ig-label" i18n>
											List Single Segment
											<span class="field-tooltip fa fa-question-circle"
												  i18n-pTooltip
												  pTooltip="List Single Segment enables you to limit the asset path segment displayed to a specific asset type"
												  tooltipPosition="top"
												  tooltipStyleClass="ig-tooltip"></span>
										</label>

										<p-dropdown [ngModelOptions]="{standalone: true}"
													(onChange)="onAssetPathListSegmentChange($event)"
													[(ngModel)]="selectedAssetPathListSegment"
													igDropdown
													[options]="assetTypeAncestries"
													appendTo="body"
													optionLabel="Name"
													optionValue="Uid"></p-dropdown>
									</div>
								</div>
							</div>
						</ig-property-group>

						<ig-property-group *ngIf="selectedFieldType === 'ComplexRelationLookup'" [showHeaderLine]="false" [igformGroup]="fieldTypeForm" title="Relation Lookup" i18n-title>
							<div inputs>
								<div class="form-group">
									<div class="row">
										<d3s-relation-lookup-field-type-editor [uid]="uid"
																			   [assetTypeUid]="assetTypeUid"></d3s-relation-lookup-field-type-editor>
									</div>
								</div>
							</div>
						</ig-property-group>

						<ig-property-group [showHeaderLine]="false" [igformGroup]="fieldTypeForm" title="Descriptions" i18n-title>
							<div inputs>
								<div class="form-group">
									<div class="row">
										<div class="field-col">
											<label for="DisplayDescription" class="ig-label" i18n>
												Display Description
												<span class="field-tooltip fa fa-question-circle"
													  i18n-pTooltip
													  pTooltip="Enter a description to be displayed in a tooltip when hovering over the field on the asset detail page"
													  tooltipPosition="top"
													  tooltipStyleClass="ig-tooltip"></span>
											</label>

											<p-editor formControlName="DisplayDescription"
													  [igDataCy]="'FieldType_Modal_Field_DisplayDescription'"
													  name="DisplayDescription"
													  tabindex="80"
													  [style]="{'height':'150px'}"
													  ngDefaultControl #ed>
											</p-editor>
										</div>
									</div>
								</div>
							</div>
						</ig-property-group>

						<ig-property-group [showHeaderLine]="false" [igformGroup]="fieldTypeForm" title="Settings" i18n-title>
							<div inputs>
								<div class="form-group">
									<div class="row">
										<div class="field-col">
											<div *ngIf="showAddToSearch">
												<p-checkbox binary="true"
															formControlName="AddToResult"
															[igDataCy]="'FieldType_Modal_Field_AddToResult'"
															label="Add To Search Results"
															i18n-label
															[disabled]="isSettingDisabled('SearchAddToResult')"></p-checkbox>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="field-col">
											<p-checkbox *ngIf="showShowInDetailTile"
														binary="true"
														formControlName="IsDisplayable"
														[igDataCy]="'FieldType_Field_IsDisplayable'"
														label="Show In Details Tab"
														i18n-label
														(ngModelChange)="onShowDetailChange($event);"
														[disabled]="isSettingDisabled('IsDisplayable')">
											</p-checkbox>
										</div>
									</div>
									<div class="row">
										<div class="field-col">
											<div *ngIf="fieldTypeForm.get('IsDisplayable').value && hasDisplayInColumn" style="margin-left: 16px;">
												<p-checkbox [escape]="false"
															pTooltip="Check to diplay the field in a column on the Definition panel.<br/> Multiple, adjacent columns will be displayed on a single line.<br/> Otherwise, the field will be displayed using the full width of the panel."
															tooltipPosition="left"
															tooltipStyleClass="ig-tooltip"
															binary="true"
															i18n-label
															i18n-pTooltip
															formControlName="DisplayInColumn"
															label="Display In Column"
															[disabled]="isSettingDisabled('DisplayInColumn')">
												</p-checkbox>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="field-col">
											<p-checkbox binary="true"
														formControlName="ShowIfEmpty"
														[igDataCy]="'FieldType_Field_ShowIfEmpty'"
														label="Show if Empty?"
														i18n-label
														[disabled]="isSettingDisabled('ShowIfEmpty')"></p-checkbox>
										</div>
									</div>

								</div>
								<!--<div>


								</div>-->
								<!--<div *ngIf="showIsEditable">
									<p-checkbox binary="true"
												[(ngModel)]="model.FieldType.Type[currentType].IsEditable"
												[igDataCy]="'FieldType_Field_IsEditable'"
												label="Is Editable?"
												i18n-label
												[ngModelOptions]="{standalone: true}"
												(ngModelChange)="model.FieldType.Type[currentType].IsEditable=$event;onShowEditableChange($event);"
												[disabled]="isSettingDisabled('IsEditable')"></p-checkbox>
								</div>

												i18n-label

												i18n-label
												[ngModelOptions]="{standalone: true}"
												[disabled]="isSettingDisabled('AllowMultipleValues')"></p-checkbox>
								</div>
								<div>
									<p-checkbox binary="true"
												[(ngModel)]="model.FieldType.Type[currentType].ShowIfEmpty"
												[igDataCy]="'FieldType_Field_ShowIfEmpty'"
												label="Show if Empty?"

												[ngModelOptions]="{standalone: true}"

							</div>

						</ig-property-group>
					</div>
				</form>

			</div>
		</div>
	</div>
	<div class="action-bar">
		<button igButton igAutoFocus i18n-label label="{{closeButtonLabel}}" (click)="close()"></button>
		<span class="grow"></span>
		<button *ngIf="formState === 'Form'" igButton class="ig-button-primary" label="{{saveButtonLabel}}" (click)="save()" [disabled]="isFormDisabled" [loading]="savingInProgress"></button>&nbsp;&nbsp;&nbsp;&nbsp;
		<button *ngIf="formState === 'FieldTypeSelection'" igButton class="ig-button-primary" label="Define Field >" (click)="confirmTypSelection()" [disabled]="!selectedFieldType"></button>&nbsp;&nbsp;&nbsp;&nbsp;
	</div>
</d3s-modal>
