<!--workaround template for new lineage to replace cshtml -->
<div class="tile tile-detail">
    <header>
        <span id="LineageHeaderText">Lineage</span>
        <div class="TileTools" style="right: 5px; top: 5px; z-index: 1003">
            <div id="LineageTools" style="border: none !important; background-color: transparent !important">
                <ul>
                    <li>
                        <div id="LineageZoomSlider"></div>

                    </li>
                    <li data-action="reset"><i class="fa fa-2x fa-refresh" title="Refresh"></i></li>
                    <li id="ToolView">
                        <i class="fa fa-2x fa-eye" title="Views"></i>
                        <i class="fa fa-chevron-down" style="color: #999;line-height: 1.3;vertical-align: super;"></i>
                        <ul style="width:150px">
                            <li data-action="view1">Business System Flow</li>
                            <li data-action="view2">Business Data Flow</li>
                            <li data-action="view3">Technical Lineage</li>
                        </ul>
                    </li>
                    <li id="ToolWindows">
                        <i class="fa fa-2x fa-universal-access" title="Toolbars"></i>
                        <i class="fa fa-chevron-down" style="color: #999;line-height: 1.3;vertical-align: super;"></i>
                        <ul style="width:200px">
                            <li id="w_info" data-action="w_info"><i class="fa fa-info" title="Node Info"></i> Node Info</li>
                            <li id="w_sourcerules" data-action="w_sourcerules"><i class="fa fa-code-fork" title="Source Rules"></i> Source Rules</li>
                            <li id="w_mappings" data-action="w_mappings"><i class="fa fa-exchange" title="Mapping Rules"></i> Mapping Rules</li>
                            <li id="w_roles" data-action="w_roles"><i class="fa fa-user" title="Roles"></i> Roles</li>
                            <li id="w_fusion" data-action="w_fusion"><i class="fa fa-database" title="Fusion"></i> Fusion</li>
                        </ul>
                    </li>

                    <!--<li data-action="close"><i class="fa fa-2x fa-close" title="Close Lineage"></i></li>-->
                </ul>
            </div>
            <div id="ManageLineageTools" style="border: none !important; background-color: transparent !important">
                <ul>
                    <li data-action="cancel"><i class="fa fa-2x fa-close red-text" title="Cancel"></i></li>
                    <li data-action="add"><i class="fa fa-2x fa-plus-square blue-text" title="Add Item"></i></li>
                    <li data-action="save"><i class="fa fa-2x fa-save green-text" title="Save"></i></li>
                </ul>
            </div>
            <div id="ManageSourceTools" style="border: none !important; background-color: transparent !important">
                <ul>
                    <li data-action="cancel"><i class="fa fa-2x fa-close red-text" title="Cancel"></i></li>
                    <li data-action="save"><i class="fa fa-2x fa-save green-text" title="Save"></i></li>
                </ul>
            </div>
            <div id="ManageMappingTools" style="border: none !important; background-color: transparent !important">
                <ul>
                    <li data-action="cancel"><i class="fa fa-2x fa-close red-text" title="Cancel"></i></li>
                    <li data-action="add"><i class="fa fa-2x fa-plus-square blue-text" title="Add Item"></i></li>
                    <li data-action="save"><i class="fa fa-2x fa-save green-text" title="Save"></i></li>
                </ul>
            </div>
        </div>
    </header>


    <div id="LineageManager"
         data-bind="template: {name: 'lineageEditTmpl' }"
         style="margin-top: 25px; display: none">
    </div>

    <div id="LineageMapRuleManager"
         data-bind="template: {name: 'MapRulesEditTmpl' }"
         style="margin-top: 25px; display: none"></div>

    <div id="LineageMultiMapRuleManager"
         data-bind="template: {name: 'MultiMapRulesEditTmpl' }"
         style="margin-top: 25px; display: none"></div>

    <div id="LineageSourceRuleManager"
         data-bind="template: {name: 'lineageEditTmpl' }"
         style="margin-top: 25px; display: none"></div>

    <div id="LineageDiagram" style="overflow: hidden" class="diagram"></div>

    <div id="LineageWindow0">
        <div><i class="fa fa-info-circle"></i>&#160;Info</div>
        <div id="Lineage_info_detail"></div>
    </div>

    <div id="LineageWindow1">
        <div><i class="fa fa-code-fork"></i>&#160;Source Rules</div>
        <div id="Lineage_sourcerules_content"></div>
    </div>

    <div id="LineageWindow2">
        <div><i class="fa fa-exchange"></i>&#160;Mapping Rules</div>
        <div id="Lineage_mappingrules_content"></div>
    </div>

    <div id="LineageWindow3">
        <div><i class="fa fa-user"></i>&#160;Responsibilities</div>
        <div id="Lineage_responsibilities_content"></div>
    </div>

    <div id="LineageWindow4">
        <div><i class="fa fa-database"></i>&#160;Fusion Relationships</div>
        <div id="Lineage_fusion_content"></div>
    </div>

    <div id="LineageWindow5">
        <div><i class="fa fa-random"></i>&#160;Business Transformations</div>
        <div id="Lineage_transformations_content"></div>
    </div>

    <input id="objectType_Value" type="hidden" [value]="objectType" />
    <input id="objectID_Value" type="hidden" [value]="objectID" />
</div>
