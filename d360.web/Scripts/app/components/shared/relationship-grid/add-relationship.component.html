<d3s-modal additionalClasses="modal-dyn-editor large-dialog asset-editor"
           (onClose)="close();"
           [title]="'Add Relationships'"
           [subtitle]="assetDetail.DisplayValue"
           [isVisible]="isVisible">
    <div class="add-relationship-editor">
        <div *ngIf="currentStep === 'SetRelationshipType'">
            <h2>Select a Relationship Type to see a list of Available Assets for creating relationships.</h2>
            <div class="simple-search">
                <ig-search-field mode="Keypress"
                                 [debounce]="600"
                                 (onSearch)="dt.filterGlobal($event, 'contains')"
                                 [infoTooltip]="simpleSearchTooltipHTML">
                </ig-search-field>
            </div>
            <p-table #dt
                     [value]="relationshipTypesResolvedNames"
                     selectionMode="single"
                     [globalFilterFields]="['name']"
                     [(selection)]="selectedRelationshipType"
                     [rows]="10"
                     [paginator]="true"
                     [pageLinks]="3">
                <ng-template pTemplate="header">
                    <tr>
                        <th>
                            Relationship Type
                        </th>
                        <th width="200"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body"
                             let-item>
                    <tr class="{{item.disabledClass}}" [pSelectableRow]="item.disabledClass ? null : item">
                        <td class="rel-name">
                            <p-tableRadioButton [value]="item"></p-tableRadioButton>
                            {{item.name}}
                        </td>
                        <td class="flex-grid">
                            <div class="flex-grow"></div>
                            <i *ngIf="item.disabledClass === 'disabled-predicate'" class="fa fa-question-circle" pTooltip="Parent-child relationship type cannot be manually created" tooltipPosition="top" tooltipStyleClass="ig-tooltip"></i>
                            <i *ngIf="item.disabledClass === 'disabled-cardinality'" class="fa fa-question-circle" pTooltip="Many-To-One relationship type cannot be related to more than one asset" tooltipPosition="top" tooltipStyleClass="ig-tooltip"></i>
                            <ig-badge *ngIf="item.count !== 0" [text]="item.count"></ig-badge>
                        </td>
                    </tr>
                </ng-template>
                <ng-template *ngIf="dt.totalRecords"
                             pTemplate="summary">
                    <d3s-grid-paging-info [first]="dt.first"
                                          [rows]="dt.rows"
                                          [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
                </ng-template>
            </p-table>

            <div class="action-bar no-padding">
                <button igButton igAutoFocus label="Cancel" (click)="close()"></button>
                <span class="grow"></span>
                <button igButton class="ig-button-primary" label="Select Assets > " (click)="currentStep = 'SetAssets'" [disabled]="!selectedRelationshipType?.uid"></button>
            </div>
        </div>

        <div *ngIf="currentStep === 'SetAssets'">
            <d3s-multiselect-grid *ngIf="selectedType"
                                  [(ngModel)]="selectedAssets"
                                  [multiple]="true"
                                  [intersectTypeUid]="selectedType.Uid"
                                  [assetUid]="assetUid"
                                  [targetAssetTypeUid]="targetTypeUid"
                                  [objectCardinality]="2"></d3s-multiselect-grid>
            <div class="action-bar no-padding">
                <button igButton igAutoFocus label="Cancel" (click)="currentStep = 'SetRelationshipType'"></button>
                <span class="grow"></span>
                <button *ngIf="selectedRelationshipHasCustomFields" igButton class="ig-button-primary" label="Set Relationship Properties > " (click)="confirmAssets();" [disabled]="!selectedAssets || selectedAssets.length === 0"></button>
                <button *ngIf="!selectedRelationshipHasCustomFields" igButton class="ig-button-primary" label="Add Relationships" (click)="saveRelationships();" [disabled]="!selectedAssets || selectedAssets.length === 0"></button>
            </div>
        </div>


        <div *ngIf="currentStep === 'SetCustomFields'">
            <div class="action-bar no-padding">
                <button igButton igAutoFocus label="Cancel" (click)="currentStep = 'SetAssets'"></button>
                <span class="grow"></span>
                <button igButton class="ig-button-primary" label="Add Relationships" (click)="saveRelationships();"></button>
            </div>
        </div>
    </div>
</d3s-modal>
