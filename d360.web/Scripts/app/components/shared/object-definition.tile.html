<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading" style="padding: 16px 11px 6px 11px">
    <div style="height: 0">
        &nbsp;<button class="ig-button-primary" igButton *ngIf="hasModifyAssetPermissions()" icon="fa-pencil" label="Edit" (click)="editClick()" style="float:right;z-index:1000"></button>
    </div>
    <ig-asset-detail [useAccordion]="true"
                     [objectID]="objectID"
                     [objectType]="objectType"
                     [objectUID]="object?.UID"
                     [nymTypes]="nymTypes"
                     [hasAddRelationshipsPermissions]="hasAddRelationshipsPermissions"
                     [hasModifyRelationshipsPermissions]="hasModifyRelationshipsPermissions"
                     [hasDeleteRelationshipsPermissions]="hasDeleteRelationshipsPermissions"
                     [useAssetDetailColumnDefinition]="true"
                     [synonymPermission]="synonymPermission">
    </ig-asset-detail>
</div>
<d3s-dynamic-editor *ngIf="formMode == FormMode.Editing && !useV2Api"
                    [objectID]="objectID"
                    [parentID]="object?.ParentID"
                    [objectType]="objectType"
                    [selection]="object"
                    [editUri]="'form/dynamicedit/edit/' + objectType"
                    [title]="object?.Name"
                    (saveClick)="save($event)"
                    (closeClick)="formMode = FormMode.Default; formModeChange.emit(formMode)">
</d3s-dynamic-editor>

<ng-container *ngIf="useV2Api">
    <d3s-modal #modal additionalClasses="modal-dyn-editor large-dialog asset-editor"
               (onClose)="closeEditor()"
               [showTitle]="false"
               [isVisible]="modalEditorVisible">
        <asset-editor #dynamicEditor
                               *ngIf="formMode == FormMode.Editing"
                               [objectID]="objectID"
                               [parentID]="object?.ParentID"
                               [objectType]="objectType"
                               [objectTypeUid]="object?.AssetTypeUid"
                               [selection]="object"
                               [isV2API]="true"
                               (saveClick)="saveV2($event)"
                               (closeClick)="closeEditor()"
                               [title]="'Edit Asset'"
                               [rowID]="rowID"
                               [assetTypePath]="gridObject?.AssetTypePath"
                               [showAsModal]="true"></asset-editor>
    </d3s-modal>
</ng-container>
