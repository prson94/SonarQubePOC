<div *ngIf="uid" class="asset-detail {{isDetailsPage ? 'config-details-page' : ''}}">
	<div *ngIf="isDetailsPage" class="header-edit-button">
		<button igButton class="ig-button-primary" icon="fa-pencil" label="Edit" i18n-label (click)="isModalVisible = true"></button>
	</div>
	<ng-template #loading>
		<div style="width:100%; text-align:center;">
			<div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
		</div>
	</ng-template>
	<div *ngIf="!isLoading; else loading">
		<div class="asset-detail-header" *ngIf="!isDetailsPage">
			<div class="asset-name">
				{{ assetTypeModel.Name }}
			</div>
			<div class="class-name">
				{{ assetTypeModel.Class.Name | assetTypeClassDisplay }}
			</div>
			<div>
				<a (click)="onAssetTypeOpen(false)" i18n>
					Open
				</a>
				<span *ngIf="controlsOptions.showOpen > 0" class="grey-delimiter">|</span>
				<a *ngIf="controlsOptions.showOpen > 0" (click)="onAssetTypeOpen(true)" i18n>
					Open in New Tab
				</a>
				<ng-container *ngIf="isAdmin && controlsOptions.showEdit">
					<span class="grey-delimiter">|</span>
					<a (click)="onEditClick.emit(uid)" i18n>Edit</a>
				</ng-container>
			</div>
		</div>
		<div class="asset-detail-tabs" *ngIf="categories">
			<div *ngFor="let category of categories;">
				<ig-property-group [expanded]="category.active"
								   (expandedChange)="category.active = $event; onStateSave()"
								   [title]="category.name"
								   [shouldBePadded]="isDetailsPage ? true : false"
								   [showHeaderLine]="false">
					<div readonly>
						<ig-asset-type-detail-category [category]="category"></ig-asset-type-detail-category>
					</div>
				</ig-property-group>
			</div>
		</div>
	</div>
</div>

<asset-type-modal-form *ngIf="assetTypeModel && isDetailsPage"
					   [assetTypeClass]="assetTypeModel.Class.Value"
					   [uid]="assetTypeModel.uid"
					   [parentTypeName]="assetTypeModel.Path"
					   [parentUid]="assetTypeModel.ParentUid"
					   [isModalVisible]="isModalVisible"
					   (onClose)="onEditFormClose()"
					   (onUpdated)="onEditSaveFinished()"></asset-type-modal-form>
