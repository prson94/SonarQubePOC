<ul #menu [class.left-side-nav-open]="menuOpen"
    [class.left-side-nav]='!menuOpen'>
    <d3s-site-menu-category [expanded]="menuOpen"
                            [title]="'Home'"
                            [url]="'home'"
                            (clearSearchesEvent)="clearSearches($event)"
                            [rootIconName]="'fa-home'"></d3s-site-menu-category>
    <d3s-site-menu-category *ngIf="favorites"
                            [expanded]="menuOpen"
                            [title]="'Favorites'"
                            showClearButton="true"
                            (clearClick)="clearFavorites()"
                            (clearSearchesEvent)="clearSearches($event)"
                            [menu]="favorites"
                            rootIconName="fa-star"></d3s-site-menu-category>
    <ng-template ngFor
                 let-menu
                 [ngForOf]="siteMenu">
        <d3s-site-menu-category *ngIf="menu.ShouldDisplay"
                                [expanded]="menuOpen"
                                [url]="menu.ngUrl"
                                [title]="menu.Title"
                                [rootIconName]="menu.Icon"
                                (clearSearchesEvent)="clearSearches($event)"
                                [imageUrl]="menu.FullURL"
                                [menu]="menu"></d3s-site-menu-category>
    </ng-template>
    <d3s-site-menu-category *ngIf="isAdmin"
                            [expanded]="menuOpen"
                            [title]="'Configuration'"
                            rootIconName="fa-sliders"
                            (clearSearchesEvent)="clearSearches($event)"
                            [menu]="configMenu"></d3s-site-menu-category>
    <d3s-site-menu-category *ngIf="isAdmin"
                            [expanded]="menuOpen"
                            [title]="'Administration'"
                            (clearSearchesEvent)="clearSearches($event)"
                            rootIconName="fa-cog"
                            [menu]="adminMenu"></d3s-site-menu-category>
</ul>
<div [ngClass]="{'menu-toggle':!menuOpen, 'menu-toggle-open':menuOpen}"
     title="Toggle full width navigation"
     (click)="toggleMenu();"><i class="fa fa-arrow-circle-left"
                                [class.rotate-right]="!menuOpen"
                                [class.rotate-left]="menuOpen"></i></div>
