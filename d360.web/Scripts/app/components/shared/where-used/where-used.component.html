<div #tableHolder *ngIf="showAsTable && !isUsageLoading && usage.length > 0 && !showAsModal">
    <p i18n>
        The {{getFriendlyObjectType()}} is used in the following diagrams. All occurences will be removed.
    </p>
    <p-table #usageTable
             [value]="usage"
             [pageLinks]="3"
             [paginator]="true"
             [rows]="10"
             class="ig-table"
             [loading]="isUsageLoading"
             [loadingIcon]="'fa fa-spinner fa-spin'">
        <ng-template pTemplate="header">
            <tr>
                <th [pSortableColumn]="'Diagram'" style="width: 60%">
                    <ng-container i18n>Diagram</ng-container>
                    <d3s-sortIcon [field]="'Diagram'"></d3s-sortIcon>
                </th>
                <th [pSortableColumn]="'Occurrences'" style="width: 15%">
                    <ng-container i18n>Label Occurences</ng-container>
                    <d3s-sortIcon [field]="'Occurrences'"></d3s-sortIcon>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>
                    {{item.Diagram}}
                </td>
                <td>{{item.Occurrences}}</td>
            </tr>
        </ng-template>
        <ng-template *ngIf="usageTable.totalRecords" pTemplate="summary">
            <d3s-grid-paging-info [first]="usageTable.first" [rows]="usageTable.rows" [totalRecords]="usageTable.totalRecords"></d3s-grid-paging-info>
        </ng-template>
    </p-table>
</div>

<ng-container *ngIf="showAsModal">
    <span class="{{hasUsage ? 'open-usage-dialog-link' : ''}}" (click)="openUsage()">
        <ng-content></ng-content>
    </span>
    <d3s-modal [appendToBody]="true" i18n-title title="Where Used Report" [additionalClasses]="'large-dialog'" (onClose)="isModalVisible = false" [isVisible]="isModalVisible">
        <div class="content">
            <div class="row">
                <p-table #usageTable
                         [value]="usage"
                         [pageLinks]="3"
                         [paginator]="true"
                         [rows]="10"
                         class="ig-table"
                         [loading]="isUsageLoading"
                         [loadingIcon]="'fa fa-spinner fa-spin'">
                    <ng-template pTemplate="header">
                        <tr>
                            <th [pSortableColumn]="'Diagram'" style="width: 60%">
                                <ng-container i18n>Diagram</ng-container>
                                <d3s-sortIcon [field]="'Diagram'"></d3s-sortIcon>
                            </th>
                            <th [pSortableColumn]="'Occurrences'" style="width: 15%">
                                <ng-container i18n>Label Occurences</ng-container>
                                <d3s-sortIcon [field]="'Occurrences'"></d3s-sortIcon>
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-item>
                        <tr>
                            <td>
                                {{item.Diagram}}
                            </td>
                            <td>{{item.Occurrences}}</td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="summary">
                        <d3s-grid-paging-info [first]="usageTable.first" [rows]="usageTable.rows" [totalRecords]="usage.length"></d3s-grid-paging-info>
                    </ng-template>
                </p-table>

            </div>
        </div>
        <div class="action-bar">
            <button igButton i18n-label label="Download" (click)="export()"></button>
            <span class="grow"></span>
            <button igButton class="ig-button-primary" (click)="isModalVisible=false" i18n-label label="Close"></button>
        </div>

    </d3s-modal>
</ng-container>
