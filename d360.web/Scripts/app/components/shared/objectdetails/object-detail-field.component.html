<div *ngIf="isArrayValue || fieldDataType == 'tag'">
    <div *ngIf="fieldDataType != 'tag'">
        <div *ngFor="let item of field.Values">
            <d3s-preview-tooltip [objectType]="item.TooltipType" [objectId]="item.TooltipID">
                <a *ngIf="item.TooltipUrl && field.DataType != 'color'" (click)="navigate(item.TooltipUrl)" [innerHtml]="item.Value"></a>
                <span *ngIf="!item.TooltipUrl && field.DataType != 'color'" [innerHtml]="item.Value"></span>
                <d3s-color-display *ngIf="field.DataType =='color' && item.TooltipUrl" (click)="navigate(item.TooltipUrl)" [colorsJSON]="item.Value"></d3s-color-display>
                <d3s-color-display *ngIf="field.DataType =='color' && !item.TooltipUrl" [colorsJSON]="item.Value"></d3s-color-display>
            </d3s-preview-tooltip>
        </div>
    </div>
    <div *ngIf="fieldDataType == 'tag'">
        <ng-container>
            <d3s-tag-view [data]="field.Values" [assetUID]="assetUID" [isEditable]="true" [allowAddTag]="true"></d3s-tag-view>
        </ng-container>
    </div>
</div>
<ng-template [ngIf]="!isArrayValue">
    <div *ngIf="field.Value">
        <ng-container *ngIf="field.Type == DetailFieldType.Field">
            <ng-container [ngSwitch]="fieldDataType">
                <ng-container *ngSwitchCase="'text'">
                    <div *ngIf="isEmail" class="FieldDisplayContent"><a [href]="'mailto:' + field.Value">{{field.Value}}</a></div>
                    <div *ngIf="!isEmail" title="{{field.Value}}" class="FieldDisplayContent" [ngStyle]="{'font-weight':(isName ? 'bold':'')}">{{field.Value}}</div>
                </ng-container>
                <ng-container *ngSwitchCase="'date'">
                    <div class="FieldDisplayContent">
                        <div>{{(field.Value | date:'shortDate')}}</div>
                    </div>
                </ng-container>
                <ng-container *ngSwitchCase="'datetime'">
                    <div class="FieldDisplayContent">
                        <div *ngIf="!isAlreadyUTC">{{(field.Value | utcDate | date:'medium')}}</div>
                        <div *ngIf="isAlreadyUTC">{{(field.Value | date:'medium')}}</div>
                    </div>
                </ng-container>
                <ng-container *ngSwitchCase="'bool'">
                    <div class="FieldDisplayContent">
                        <i *ngIf="(field.Value || '').toUpperCase() == 'TRUE'" class="fa fa-check enabled" title="True"></i>
                        <i *ngIf="(field.Value || '').toUpperCase() == 'FALSE'" class="fa fa-times disabled" title="False"></i>
                    </div>
                </ng-container>
                <ng-container *ngSwitchCase="'json'">
                    <div class="FieldDisplayContent">
                        <div *ngIf="GetJSON(field.Value) == 'Error'; else showJSON">{{field.Value}}</div>
                        <ng-template #showJSON>
                            <ngx-json-view [data]="GetJSON(field.Value)"></ngx-json-view>
                        </ng-template>
                    </div>
                </ng-container>
                <ng-container *ngSwitchCase="'number'">
                    <div class="FieldDisplayContent" [ngStyle]="{'font-weight':(isName ? 'bold':'')}">{{formatAsNumber(field.Value)}}</div>
                </ng-container>
                <ng-container *ngSwitchCase="'html'">
                    <div class="FieldDisplayContent ql-editor small-indent" [innerHtml]="field.Value  | safeHtml" [ngStyle]="{'font-weight':(isName ? 'bold':'')}"></div>
                </ng-container>
                <ng-container *ngSwitchCase="'link'">
                    <div class="FieldDisplayContent" [ngStyle]="{'font-weight':(isName ? 'bold':'')}">
                        <div class="ig-value" *ngIf="linkData">
                            <a [href]="linkData.url" target="_blank">
                                {{linkData.title}}
                                <span>
                                    &nbsp;&nbsp;
                                    <i class="fa fa-external-link" pTooltip="This link will open in a new tab" tooltipStyleClass="ig-tooltip" tooltipPosition="top"></i>
                                </span>
                            </a>
                        </div>
                    </div>
                </ng-container>
                <ng-container *ngSwitchCase="'path'">
                    <div class="FieldDisplayContent" [innerHtml]="field.Value  | safeHtml" [ngStyle]="{'font-weight':(isName ? 'bold':'')}"></div>
                </ng-container>
                <d3s-color-display *ngSwitchCase="'color'" [colorsJSON]="item.Value"></d3s-color-display>
                <ng-container *ngSwitchDefault>
                    <div class="FieldDisplayContent" title="{{field.Value}}" [ngStyle]="{'font-weight':(isName ? 'bold':'')}">{{field.Value}}</div>
                </ng-container>
            </ng-container>
        </ng-container>
        <ng-container *ngIf="field.Type == DetailFieldType.Tooltip">
            <div *ngIf="field.Type == DetailFieldType.Tooltip" class="FieldDisplayContent">
                <d3s-preview-tooltip *ngIf="field.TooltipContext == 'Preview';else listTooltip" [objectType]="field.TooltipType" [objectId]="field.TooltipID">
                    <a (click)="navigate(field.TooltipUrl)">{{field.Value}}</a>
                </d3s-preview-tooltip>
                <ng-template #listTooltip>
                    <d3s-lookup-tooltip *ngIf="field.TooltipUrl;else noLinkTooltip" [objectType]="field.TooltipType" [objectId]="field.TooltipID">
                        <a *ngIf="fieldDataType != 'color'" (click)="navigate(field.TooltipUrl)" [innerText]="field.Value"></a>
                        <d3s-color-display *ngIf="fieldDataType == 'color'" (click)="navigate(field.TooltipUrl)" [colorsJSON]="field.Value"></d3s-color-display>
                    </d3s-lookup-tooltip>
                    <ng-template #noLinkTooltip>
                        <d3s-lookup-tooltip [objectType]="field.TooltipType" [objectId]="field.TooltipID">
                            <span *ngIf="fieldDataType != 'color'" [innerText]="field.Value"></span>
                            <d3s-color-display *ngIf="fieldDataType == 'color'" [colorsJSON]="field.Value"></d3s-color-display>
                        </d3s-lookup-tooltip>
                    </ng-template>
                </ng-template>

            </div>
        </ng-container>
    </div>
    <div *ngIf="field.Type == DetailFieldType.LookupGrid">
        <d3s-dynamic-lookup-grid [data]="field.Data"
                                 [hideHeader]="field.HideHeader"
                                 [hideFooter]="field.HideFooter"
                                 [hideFilter]="field.HideFilter"
                                 [field]="field"
                                 [assetUid]="assetUID">
        </d3s-dynamic-lookup-grid>
    </div>
</ng-template>
