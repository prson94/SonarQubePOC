<div *ngIf="objectType && objectID">
    <div *ngIf="isLoading" style="width:100%; text-align:center;">
        <div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
    </div>
    <div *ngIf="!isLoading">
        <div style="line-height:10px">&nbsp;</div>
        <div *ngFor="let row of rows">
            <div class="row" style="margin-bottom: 10px" attr.data-category="{{row.Category}}">
                <div *ngIf="row.columns == 1">
                    <div class="col l2 m3 s12">
                        <div *ngFor="let field of row.FirstColumnFields">
                            <div *ngIf="field.FieldDescription && field.FieldDescription != ''" class="FieldName FieldDisplayName" [pTooltip]="field.FieldDescription" tooltipPosition="top">{{field.Name}}</div>
                            <div *ngIf="!field.FieldDescription || field.FieldDescription == ''" class="FieldName FieldDisplayName">{{field.Name}}</div>
                        </div>
                    </div>
                    <div class="col l10 m9 s12">
                        <div *ngFor="let field of row.FirstColumnFields">
                            <object-detail-field [field]="field" [assetUID]="assetUID"></object-detail-field>
                        </div>
                    </div>
                </div>
                <div *ngIf="row.columns != 1">
                    <div class="col l2 m3 s12">
                        <div *ngFor="let field of row.FirstColumnFields">
                            <div *ngIf="field.FieldDescription && field.FieldDescription != ''" class="FieldName FieldDisplayName" [pTooltip]="field.FieldDescription" tooltipPosition="top">{{field.Name}}</div>
                            <div *ngIf="!field.FieldDescription || field.FieldDescription == ''" class="FieldName FieldDisplayName">{{field.Name}}</div>
                        </div>
                    </div>
                    <div class="col l4 m3 s12">
                        <div *ngFor="let field of row.FirstColumnFields">
                            <object-detail-field [field]="field" [assetUID]="assetUID"></object-detail-field>
                        </div>
                    </div>
                    <div class="col l2 m3 s12">
                        <div *ngFor="let field of row.SecondColumnFields">
                            <div *ngIf="field.FieldDescription && field.FieldDescription != ''" class="FieldName FieldDisplayName" [pTooltip]="field.FieldDescription" tooltipPosition="top">{{field.Name}}</div>
                            <div *ngIf="!field.FieldDescription || field.FieldDescription == ''" class="FieldName FieldDisplayName">{{field.Name}}</div>
                        </div>
                    </div>
                    <div class="col l4 m3 s12">
                        <div *ngFor="let field of row.SecondColumnFields">
                            <object-detail-field [field]="field" [assetUID]="assetUID"></object-detail-field>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div *ngFor="let c of categories">
            <simple-accordion *ngIf="c.loaded && c.hasData" [header]="c.name">
                <div *ngIf="!c.loaded" style="width:100%; text-align:center;">
                    <div style="padding:10px;"><i class="fa fa-spinner fa-spin"></i></div>
                </div>
                <div *ngIf="c.loaded">
                    <div *ngFor="let row of c.rows">
                        <div class="row" style="margin-bottom: 10px" attr.data-category="{{row.Category}}">
                            <div *ngIf="row.columns == 1">
                                <div class="col l2 m3 s12">
                                    <div *ngFor="let field of row.FirstColumnFields">
                                        <div *ngIf="field.FieldDescription && field.FieldDescription != ''" class="FieldName FieldDisplayName" [pTooltip]="field.FieldDescription" tooltipPosition="top">{{field.Name}}</div>
                                        <div *ngIf="!field.FieldDescription || field.FieldDescription == ''" class="FieldName FieldDisplayName">{{field.Name}}</div>
                                    </div>
                                </div>
                                <div class="col l10 m9 s12">
                                    <div *ngFor="let field of row.FirstColumnFields">
                                        <object-detail-field [field]="field" [assetUID]="assetUID"></object-detail-field>
                                    </div>
                                </div>
                            </div>
                            <div *ngIf="row.columns != 1">
                                <div class="col l2 m3 s12">
                                    <div *ngFor="let field of row.FirstColumnFields">
                                        <div *ngIf="field.FieldDescription && field.FieldDescription != ''" class="FieldName FieldDisplayName" [pTooltip]="field.FieldDescription" tooltipPosition="top">{{field.Name}}</div>
                                        <div *ngIf="!field.FieldDescription || field.FieldDescription == ''" class="FieldName FieldDisplayName">{{field.Name}}</div>
                                    </div>
                                </div>
                                <div class="col l4 m3 s12">
                                    <div *ngFor="let field of row.FirstColumnFields">
                                        <object-detail-field [field]="field" [assetUID]="assetUID"></object-detail-field>
                                    </div>
                                </div>
                                <div class="col l2 m3 s12">
                                    <div *ngFor="let field of row.SecondColumnFields">
                                        <div *ngIf="field.FieldDescription && field.FieldDescription != ''" class="FieldName FieldDisplayName" [pTooltip]="field.FieldDescription" tooltipPosition="top">{{field.Name}}</div>
                                        <div *ngIf="!field.FieldDescription || field.FieldDescription == ''" class="FieldName FieldDisplayName">{{field.Name}}</div>
                                    </div>
                                </div>
                                <div class="col l4 m3 s12">
                                    <div *ngFor="let field of row.SecondColumnFields">
                                        <object-detail-field [field]="field" [assetUID]="assetUID"></object-detail-field>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </simple-accordion>
        </div>
    </div>
</div>
