<div class="row">
    <div>
        <as-split unit="pixel"
                  direction="horizontal"
                  [gutterSize]="16"
                  class="col s12 split"
                  style="display: flex"
                  [class.side-panel-close]="!sidePanelOpen"
                  (dragEnd)="onSidePanelDragEnd(sidePanelStorageKey, $event)">
            <as-split-area class="tile tile-detail main-panel no-padding">
                <div class="diagram-top-header">
                    <div class="flex-row">
                        <div class="title">
                            <ng-container i18n>Hierarchy</ng-container>
                            <span *ngIf="isLoading"
                                  id="LoadingProgress"
                                  style="color: #e2792a"><i class="fa fa-refresh fa-spin fa-lg fa-fw"></i>
                                <ng-container i18n>Loading</ng-container>...
                            </span>
                        </div>
                        <div class="flex-grow"></div>
                        <div class="button-wrapper">
                            <button igButton
                                    icon="fa-refresh"
                                    (click)="populateDiagram()"
                                    i18n-tooltip
                                    tooltip="Refresh"></button>
                        </div>
                    </div>
                </div>

                <div #diagram
                     class="diagram"
                     id="HierarchyDiagram"
                     style="overflow: hidden;"></div>
            </as-split-area>
            <as-split-area [size]="getSidePanelWidth()"
                           [minSize]="getSidePanelMinWidth()"
                           [maxSize]="getSidePanelMaxWidth()"
                           class="tile tile-detail side-panel">
                <side-panel (expandedChange)="sidePanelOpen=$event"
                            [setMinMaxWidth]="false"
                            hasDetail="true"
                            [storageKey]="sidePanelStorageKey"
                            [showEmptyOverlay]="!selectedNode?.uid">
                    <ng-container *ngIf="sidePanelOpen">
                        <ng-container *ngIf="selectedNode?.uid">
                            <ig-asset-detail [objectUID]="selectedNode?.uid"
                                             [objectType]="selectedNode?.object"
                                             [useAccordion]="true"
                                             [shouldBePadded]="false"
                                             [showHeaderLine]="false"
                                             [showHeader]="true"
                                             [spacerHeight]="'16px'"
                                             [paddingLeft]="'11px'"
                                             [tooltipAlign]="'left'"
                                             [isSidePanel]="true"
                                             [hasAddRelationshipsPermissions]="false"
                                             [hasModifyRelationshipsPermissions]="false"
                                             [hasDeleteRelationshipsPermissions]="false"></ig-asset-detail>
                        </ng-container>
                    </ng-container>
                </side-panel>
            </as-split-area>
        </as-split>
    </div>
</div>
