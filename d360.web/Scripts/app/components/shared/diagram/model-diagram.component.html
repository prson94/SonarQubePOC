<div class="tile tile-detail">
    <header>
        <span>Hierarchy</span>
        <span *ngIf="isLoading"
              id="LoadingProgress"
              style="color: #e2792a"><i class="fa fa-refresh fa-spin fa-lg fa-fw"></i>Loading...</span>
        <d3s-tile-actions (menuClick)="menuAction($event)"
                          [menuItems]="menuItems"
                          hasMenu="true"></d3s-tile-actions>
    </header>
    <div style="position:relative;left: 100%; display: inline; width: 1px; top: 5px">
        <d3s-overlay-window [(visible)]="isWindowVisible"
                            [headerText]="(selectedNode != null) ? headerText : ''"
                            maxHeight="400"
                            padding="15"
                            width="500">
            <div *ngIf="selectedNode == null">Nothing selected</div>
            <ul *ngIf="selectedNode != null" class="tab-menu">
                <li (click)="selectTab('info')"
                    *ngIf="selectedNode != null"
                    [class.selected]="tab == 'info'"
                    class="tab-item"><i class="fa fa-info-circle fa-2x"></i></li>
                <li (click)="selectTab('user')"
                    *ngIf="selectedNode != null"
                    [class.selected]="tab == 'user'"
                    class="tab-item"><i class="fa fa-user fa-2x"></i></li>
                <li (click)="selectTab('relations')"
                    *ngIf="selectedNode != null"
                    [class.selected]="tab == 'relations'"
                    class="tab-item"><i class="fa fa-retweet fa-2x"></i></li>
            </ul>
            <div [ngSwitch]="tab">
                <div *ngSwitchCase="'info'">
                    <d3s-lineage-object-detail *ngIf="selectedNode != null"
                                               [objectId]="(selectedNode.key == 0) ? id : selectedNode.key"
                                               [objectType]="(selectedNode.key == 0) ? 'TaxonomyType' : 'Taxonomy'"></d3s-lineage-object-detail>
                </div>
                <div *ngSwitchCase="'user'">
                    <d3s-lineage-responsibilities *ngIf="selectedNode != null"
                                                  [assetId]="selectedNode.assetId"></d3s-lineage-responsibilities>
                </div>
                <div *ngSwitchCase="'relations'">
                    <d3s-lineage-relations *ngIf="selectedNode != null" [objectId]="selectedNode.key"
                                           objectType="Taxonomy"></d3s-lineage-relations>
                </div>
            </div>
        </d3s-overlay-window>
    </div>

    <div #diagram
         class="diagram"
         id="HierarchyDiagram"
         style="overflow: hidden;"></div>
</div>
