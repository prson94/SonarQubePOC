<div class="row">
    <div>
        <div class="col s12" style="display:flex;">
            <div class="tile tile-detail main-panel no-padding">
                <div class="diagram-top-header">
                    <div class="flex-row">
                        <div class="title">
                            Hierarchy
                            <span *ngIf="isLoading"
                                  id="LoadingProgress"
                                  style="color: #e2792a"><i class="fa fa-refresh fa-spin fa-lg fa-fw"></i>Loading...</span>
                        </div>
                        <div class="flex-grow"></div>
                        <div class="button-wrapper">
                            <button igButton icon="fa-refresh" (click)="populateDiagram()" tooltip="Refresh"></button>
                        </div>
                    </div>
                </div>

                <div #diagram
                     class="diagram"
                     id="HierarchyDiagram"
                     style="overflow: hidden;"></div>
            </div>
            <div class="tile tile-detail side-panel">
                <side-panel (expandedChange)="sidePanelOpen=$event"
                            hasDetail="true"
                            [storageKey]="sidePanelStorageKey"
                            [showEmptyOverlay]="!selectedNode?.uid">
                    <ng-container *ngIf="sidePanelOpen">
                        <ng-container *ngIf="selectedNode?.uid">
                            <ig-asset-detail [objectUID]="selectedNode?.uid"
                                             [objectType]="selectedNode?.object"
                                             [useAccordion]="true"
                                             [shouldBePadded]="false"
                                             [showHeaderLine]="false"
                                             [showHeader]="true"
                                             [spacerHeight]="'16px'"
                                             [paddingLeft]="'11px'"
                                             [tooltipAlign]="'left'"
                                             [isSidePanel]="true"
                                             [hasAddRelationshipsPermissions]="false"
                                             [hasModifyRelationshipsPermissions]="false"
                                             [hasDeleteRelationshipsPermissions]="false"></ig-asset-detail>
                        </ng-container>
                    </ng-container>
                </side-panel>
            </div>
        </div>
    </div>
</div>
