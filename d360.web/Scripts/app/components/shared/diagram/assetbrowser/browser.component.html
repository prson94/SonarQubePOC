<div *ngIf="isFullScreen" class="modal-background"></div>
<div class="row asset-browser" [ngClass]="{'full-screen-ab': isFullScreen}">
    <div class="asset-browser-body col s12">
        <div class="tile tile-detail" style="padding: 0">
            <div [hidden]="isLoading" class="asset-browser-header">
                <div class="controls-left">
                    <d3s-assetbrowser-viewchange [current]="displayConfiguration.DiagramType" (apply)="viewchange_Apply($event)"></d3s-assetbrowser-viewchange>
                    <d3s-assetbrowser-search (next)="search_GoToResult($event)" [numberOfResults]="searchResults.length" (previous)="search_GoToResult($event)" (search)="search_Execute($event)"></d3s-assetbrowser-search>
                </div>
                <div class="controls-right">
                    <d3s-assetbrowser-panels (click)="panels_Click($event)" [commandToResetTo]="panelModel.commandToResetTo" [enableAdd]="helper_LineageDiagramApplies()" [enableInformation]="!this.panel_InformationDisabled" [isFullScreen]="isFullScreen" [totalAlertCount]="totalAlertCount"></d3s-assetbrowser-panels>
                </div>
            </div>
            <div class="row" *ngIf="isLoading">
                <div class="col s12" style="position: absolute;z-index: 0;">
                    <d3s-loading isLoading="true">{{loadingText}}</d3s-loading>
                </div>
            </div>
            <div class="row" style="position: relative">
                <div class="col s12" style="padding: 0">

                    <div #diagram id="LineageDiagram" style="overflow: hidden;" class="diagram"></div>

                    <div *ngIf="isWindowVisible()" class="asset-browser-window">
                        <div class="asset-browser-window-header">
                            <div class="info">
                                <div class="class-name">
                                    <span *ngIf="panel_InformationVisible">{{selectedDiagramAsset?.AssetTypeClassDisplayName}}</span>
                                </div>
                                <div class="asset-name">
                                    <span *ngIf="panel_InformationVisible"><a [routerLink]="selectedDiagramAsset?.Url">{{selectedDiagramAsset?.DisplayValue}}</a></span>
                                    <span *ngIf="panel_FiltersVisible">Apply Filters</span>
                                    <span *ngIf="panel_AlertVisible">Active Alerts</span>
                                    <span *ngIf="panel_AddVisible">Add Lineage</span>
                                    <span *ngIf="panel_SettingsVisible">Settings</span>
                                </div>
                            </div>
                            <div class="scores">
                                <span class="d3s-score-container" *ngIf="panel_InformationVisible && displayConfiguration.DisplayScores && selectedDiagramAsset?.Scores">
                                    <d3s-score-badge *ngFor="let score of selectedDiagramAsset?.Scores" [score]="score" [showSparkline]="false"></d3s-score-badge>
                                </span>
                            </div>
                            <div class="clearfix"></div>
                            <div class="windowtabs">
                                <button *ngIf="panel_InformationVisible" [class]="(panel_TabIndex == 0) ? 'tab-selected' : 'tab'" (click)="event_Information_DetailTabClick()">Details</button>
                                <button *ngIf="panel_InformationVisible" [class]="(panel_TabIndex == 1) ? 'tab-selected' : 'tab'" (click)="event_Information_OwnerTabClick()" [disabled]="!ownershipTabEnabled()">Ownership</button>

                                <!--button *ngIf="panel_FiltersVisible" class="tab-selected">Filters</button-->
                                <d3s-assetbrowser-savedfilter *ngIf="panel_FiltersVisible" [diagramType]="displayConfiguration.DiagramType" [options]="filter_AvailableOptions" [filterModel]="displayConfiguration" (applySavedFilter)="savedfilter_Apply($event)"></d3s-assetbrowser-savedfilter>

                                <button *ngIf="panel_AlertVisible" class="tab-selected">Alerts</button>

                                <button *ngIf="panel_AddVisible" class="tab-selected">Lineage</button>

                                <button *ngIf="panel_SettingsVisible" class="tab-selected">General</button>
                            </div>
                        </div>
                        <div class="asset-browser-window-content">
                            <section *ngIf="panel_AddVisible">
                                <div #addLineagePanel class="scroll-panel">
                                    <d3s-loading [(isLoading)]="panel_Loading"></d3s-loading>
                                    <d3s-assetbrowser-addpanel [assetBrowserData]="responseModel" (refreshDiagram)="helper_RefreshDiagram($event)"></d3s-assetbrowser-addpanel>
                                </div>
                            </section>

                            <section *ngIf="panel_AlertVisible">
                                <div #alertPanel class="scroll-panel">
                                    <d3s-loading [(isLoading)]="panel_Loading"></d3s-loading>
                                    <d3s-assetbrowser-alertpanel [assets]="selectedAssetsWithAlerts" (openDetail)="alert_OpenDetail($event)"></d3s-assetbrowser-alertpanel>
                                </div>
                            </section>

                            <section *ngIf="panel_FiltersVisible">
                                <div #filterDetailPanel class="scroll-panel">
                                    <d3s-loading [(isLoading)]="panel_Loading"></d3s-loading>
                                    <d3s-assetbrowser-filterpanel [allowAncestry]="helper_LineageDiagramApplies()" [options]="filter_AvailableOptions" [current]="displayConfiguration" (apply)="filterpanel_Apply($event)"></d3s-assetbrowser-filterpanel>
                                </div>
                            </section>

                            <section *ngIf="panel_InformationVisible">
                                <div #infoDetailPanel *ngIf="panel_TabIndex == 0" class="scroll-panel">
                                    <d3s-loading [(isLoading)]="panel_Loading"></d3s-loading>
                                    <d3s-assetbrowser-infopanel [asset]="selectedDiagramAsset"></d3s-assetbrowser-infopanel>
                                </div>

                                <div #ownerDetailPanel class="fields" *ngIf="panel_TabIndex == 1">
                                    <d3s-loading [(isLoading)]="panel_Loading"></d3s-loading>
                                    <d3s-assetbrowser-ownerpanel [asset]="selectedDiagramAsset"></d3s-assetbrowser-ownerpanel>
                                </div>
                            </section>

                            <section *ngIf="panel_SettingsVisible">
                                <d3s-loading [(isLoading)]="panel_Loading"></d3s-loading>
                                <d3s-assetbrowser-settingspanel [allowAncestry]="helper_LineageDiagramApplies()" [current]="displayConfiguration" (apply)="settingspanel_Apply($event)"></d3s-assetbrowser-settingspanel>
                            </section>
                        </div>
                    </div>

                    <div class="asset-browser-controls-bottom">
                        <d3s-assetbrowser-zoom [scale]="helper_DiagramScale()" (change)="zoom_Change($event)"></d3s-assetbrowser-zoom>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
