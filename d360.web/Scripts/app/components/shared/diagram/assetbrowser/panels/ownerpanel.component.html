<p-table #dt [value]="asset?.Owners" [metaKeySelection]="true" [style]="{'width':'450px'}" [paginator]="true" [rows]="10">
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 50%">Responsibility</th>
            <th style="width: 45%">Resource</th>
            <th style="width: 5%"></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr (dblclick)="onDoubleClick(item)" [pSelectableRow]="item">
            <td>
                <d3s-preview-tooltip objectType="ResponsibilityType" [uid]="item.ResponsibilityTypeUid">{{item.ResponsibilityTypeName}}</d3s-preview-tooltip>
            </td>
            <td>
                <d3s-preview-tooltip objectType="Resource" [uid]="item.ResourceUid">{{item.ResourceName}}</d3s-preview-tooltip>
            </td>
        </tr>
    </ng-template>
</p-table>
