<d3s-loading [(isLoading)]="loading"></d3s-loading>
<div [(hidden)]="loading" *ngIf="alerts.length == 0" class="error-msg">
    No alerts displayed.
</div>
<div [(hidden)]="loading" class="asset-browser-window-tabs-content-alert" *ngFor="let alert of alerts" [ngClass]="alert.selected ? 'alert-selected' : ''">
    <div class="asset">
        <span [className]="'icon fa ' + alert.asset.icon"></span>
        <span>{{alert.asset.displayValue}}</span>
        <div class="settings-menu">
            <i style="opacity: 1" class="fa fa-ellipsis-v"></i>
            <div class="popup-menu place-right">
                <ul>
                    <li (click)="openAssetDetail(alert)"><span style="font-weight: 700;">Show Asset Detail</span></li>
                    <li (click)="openInNewTab(alert)"><span>Open in New Tab</span></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="action" *ngIf="alert.action">
        <div>
            <span class="label">Action Alert:</span>
            <span class="type">{{alert.action.name}}</span>
        </div>
        <div class="content" [innerHTML]="alert.action.description"></div>
    </div>
    <div class="score" *ngIf="alert.score">
        <div>
            <span class="label">Quality Alert:</span>
            <span class="type">{{alert.score.name}}</span>
        </div>
    </div>
</div>
