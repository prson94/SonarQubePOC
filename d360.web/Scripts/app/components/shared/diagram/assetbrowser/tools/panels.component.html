<div class="asset-browser-button-group">
    <!--<button *ngIf="diagramType != 3" type="button" pTooltip="Add Lineage" tooltipPosition="top" tooltipStyleClass="ig-tooltip" aria-label="Add Lineage" (click)="execute_Add()" [class]="'icon mr8' + (addSelected ? ' selected' : '') + (enableAdd ? '' : ' disabled')" [disabled]="!enableAdd"><i class="fa fa-plus"></i></button>-->
    <button *ngIf="diagramType != 3" type="button" pTooltip="Refresh Diagram" tooltipPosition="top" tooltipStyleClass="ig-tooltip" aria-label="Refresh Diagram" class="dark icon mr8" (click)="execute(7)"><i class="fa fa-refresh"></i></button>
    <button *ngIf="diagramType != 3" type="button" pTooltip="Download as PNG" tooltipPosition="top" tooltipStyleClass="ig-tooltip" aria-label="Download as PNG" (click)="execute(3)" [class]="'icon mr8' + (enableDownload ? '' : ' disabled')" [disabled]="!enableDownload"><i class="fa fa-download"></i></button>
    <div *ngIf="diagramType != 3" class="button-spacer"></div>
    <button *ngIf="diagramType != 3" type="button" pTooltip="Information Panel" tooltipPosition="top" tooltipStyleClass="ig-tooltip" aria-label="Information Panel" (click)="execute_Information()" [class]="'icon mr8' + (informationSelected ? ' selected' : '') + (enableInformation ? '' : ' disabled')" [disabled]="!enableInformation"><i class="fa fa-info-circle"></i></button>
    <button *ngIf="diagramType != 3" type="button" pTooltip="Filters Panel" tooltipPosition="top" tooltipStyleClass="ig-tooltip" aria-label="Filters Panel" (click)="execute_Filter()" [class]="'icon mr8' + (filtersSelected ? ' selected' : '')"><i class="fa fa-filter"></i></button>
    <button *ngIf="diagramType != 3" type="button" pTooltip="Alerts Panel" tooltipPosition="top" tooltipStyleClass="ig-tooltip" aria-label="Alerts Panel" (click)="execute_Alert()" [class]="'icon mr8' + (alertsSelected ? ' selected' : '') + (totalAlertCount == 0 ? ' disabled' : '')" [ngStyle]="{'width': alert_ButtonWidth()}" [disabled]="totalAlertCount == 0">
        <i [class]="alert_CountClass()"></i>
        <div [class]="alert_CountNumberClass()" [innerText]="alert_CountNumber()"></div>
    </button>
    <button *ngIf="diagramType != 3" type="button" pTooltip="Settings Panel" tooltipPosition="top" tooltipStyleClass="ig-tooltip" aria-label="Settings Panel" (click)="execute_Settings()" [class]="'icon mr8' + (settingsSelected ? ' selected' : '')"><i class="fa fa-gear"></i></button>
    <div *ngIf="diagramType != 3" class="button-spacer"></div>
    <button type="button" pTooltip="{{isFullScreen ? 'Shrink View':'Expand View'}}" tooltipPosition="left" tooltipStyleClass="ig-tooltip" [attr.aria-label]="isFullScreen ? 'Shrink View':'Expand View'" class="dark icon mr8" (click)="execute(6)">
        <i class="fa" [ngClass]="{'fa-compress' : isFullScreen, 'fa-expand' : !isFullScreen}"></i>
    </button>
</div>
