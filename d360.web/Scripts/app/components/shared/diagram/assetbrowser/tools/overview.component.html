<button *ngIf="!enabled" type="button" title="Show Navigator Panel" aria-label="Show Navigator Panel" class="overview-button" (click)="setOverviewState(true)"><img alt="Show Navigator Panel" src="/Content/images/diagram-show-overview.svg" align="middle" /></button>
<button *ngIf="enabled" type="button" title="Close Navigator Panel" aria-label="Close Navigator Panel" class="overview-close-button" (click)="setOverviewState(false)"><i class="fa fa-close" aria-hidden="true"></i></button>
<div [hidden]="!enabled" id="assetBrowserOverview" class="overview"></div>
