<button *ngIf="!enabled" type="button" title="Show Overview" aria-label="Close" class="overview-button" (click)="openOverview($event)"><i class="fa fa-window-restore" aria-hidden="true"></i></button>
<button *ngIf="enabled" type="button" title="Close" aria-label="Close" class="overview-close-button" (click)="closeOverview($event)"><i class="fa fa-close" aria-hidden="true"></i></button>
<div [hidden]="!enabled" id="assetBrowserOverview" class="overview"></div>
