<div class="asset-browser-button-group width-medium">
    <p-dropdown igDropdown igSize="medium" [required]="true" [disabled]="disabled" [options]="items" (onChange)="diagramTypeChange($event)" [ngModel]="current">
        <ng-template let-item pTemplate="selectedItem">
            <span>{{item.label}}</span>
        </ng-template>
    </p-dropdown>
</div>
