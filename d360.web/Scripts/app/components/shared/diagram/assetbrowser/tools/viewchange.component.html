<div class="asset-browser-button-group">
    <p-dropdown [disabled]="disabled" [options]="items" (onChange)="diagramTypeChange($event)" [ngModel]="current" [style]="{'width':'70%'}">
        <ng-template let-item pTemplate="selectedItem">
            <span>{{item.label}}</span>
        </ng-template>
    </p-dropdown>
</div>
