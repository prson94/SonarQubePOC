<div *ngIf="diagramMode == DiagramMode.Diagram" style="position:relative;left: 100%; display: inline; width: 1px; top: 30px; z-index: 999">
    <d3s-overlay-window width="500" maxHeight="400" padding="0" [(visible)]="isWindowVisible" [headerText]="(showNodeTabs || showLinkTabs) ? headerText : ''" [overflowScroll]="'visible'">
        <div *ngIf="!showNodeTabs && !showLinkTabs" style="padding:10px;">Nothing selected</div>
        <ul class="tab-menu" *ngIf="showNodeTabs || showLinkTabs">
            <li (click)="selectTab('info')" class="tab-item" [class.selected]="tab == 'info'" *ngIf="showInfoTab">
                <i class="fa fa-info-circle fa-2x"></i>
            </li>
            <li (click)="selectTab('edit')" class="tab-item" [class.selected]="tab == 'edit'" *ngIf="!readonly && showEditTab">
                <i class="fa fa-pencil fa-2x"></i>
            </li>
        </ul>
        <div *ngIf="showNodeTabs || showLinkTabs" [ngSwitch]="tab" style="background-color: #fff; padding: 10px;">
            <div *ngSwitchCase="'info'">
                <d3s-lineage-info [node]="selectedData" [diagram]="myDiagram" (selectionChange)="ChangedSelection()"></d3s-lineage-info>
            </div>
            <div *ngSwitchCase="'edit'">
                <d3s-lineage-editor [node]="selectedData" (nodeChange)="changeNode($event)"></d3s-lineage-editor>
            </div>
        </div>
    </d3s-overlay-window>
</div>


<div class="tile tile-detail" [hidden]="isLoading">
    <header>
        &nbsp;
        <d3s-tile-actions hasMenu="true" [menuItems]="menuItems" (menuClick)="menuClick($event)"></d3s-tile-actions>
    </header>
    <div class="row">
        <div class="col s12" style="padding: 0">
            <table>
                <tbody>
                    <tr>
                        <td style="vertical-align: top; background-color: #e8eaee; padding: 0; width: 210px;" [style.display]="(readonly) ? 'none' : 'table-cell'">
                            <div id="LineagePalette" #palette style="overflow: hidden;" class="diagram"></div>
                        </td>
                        <td style="vertical-align: top;">
                            <div #diagram id="LineageDiagram" style="overflow: hidden;" class="diagram"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
