<div *ngIf="diagramMode == DiagramMode.Diagram" style="position:relative;left: 100%; display: inline; width: 1px; top: 43px; z-index: 900">
    <d3s-overlay-window width="500" maxHeight="700" padding="0" [(visible)]="isWindowVisible" [headerText]="(showNodeTabs || showLinkTabs) ? headerText : ''" [overflowScroll]="'visible'">
        <div *ngIf="!showNodeTabs && !showLinkTabs && readonly" style="padding:10px;">Nothing selected</div>
        <ul class="tab-menu" *ngIf="showNodeTabs || showLinkTabs || !readonly">
            <li (click)="selectTab('info')" class="tab-item" [class.selected]="tab == 'info'" *ngIf="showInfoTab">
                <i class="fa fa-info-circle fa-2x"></i>
            </li>
            <li (click)="selectTab('add')" class="tab-item" [class.selected]="tab == 'add'" *ngIf="!readonly">
                <i class="fa fa-pencil fa-2x"></i>
            </li>
        </ul>
        <div *ngIf="showNodeTabs || showLinkTabs || !readonly" [ngSwitch]="tab" style="background-color: #fff; padding: 10px;">
            <ng-container *ngSwitchCase="'info'" >
                <div *ngIf="showNodeTabs">
                    <d3s-lineage-info [node]="selectedData" [diagram]="diagram" (selectionChange)="ChangedSelection()"></d3s-lineage-info>
                </div>
                <div *ngIf="showLinkTabs && readonly">
                    <div class="row">
                        <div class="col s12">
                            <div class="FieldName">Predicate</div>
                            <div>
                                {{selectedData.fullText || '[unknown]'}}
                            </div>
                        </div>
                    </div>
                </div>
                <div *ngIf="showLinkTabs && !readonly && filteredIntersectTypes.length == 1">
                    <div class="row">
                        <div class="col s12">
                            <div class="FieldName">Predicate</div>
                            <div>
                                {{selectedData.fullText || '[unknown]'}}
                            </div>
                        </div>
                    </div>
                </div>
            </ng-container>
            <ng-container *ngSwitchCase="'add'" >
                <div *ngIf="showLinkTabs && !readonly && filteredIntersectTypes.length > 1">
                    <div class="row">
                        <div class="col s12">
                            <div class="FieldName">Predicate</div>
                            <div>
                                <select [ngModel]="selectedData.intersectTypeId" (ngModelChange)="changeIntersectType($event)" style="width: 95%">
                                    <option value="0"></option>
                                    <option *ngFor="let i of filteredIntersectTypes" [value]="i.intersectTypeId">{{i.predicateName}} / {{i.predicateInverse}}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div *ngIf="showLinkTabs && readonly && selectedData.predicate != ''">
                    <div class="row">
                        <div class="col s12">
                            <div class="FieldName">Predicate</div>
                            <div>
                                {{selectedData.predicate || '[unknown]'}}
                            </div>
                        </div>
                    </div>
                </div>
                <div *ngIf="!readonly">
                    <div class="row">
                        <div class="col s12">
                            <div class="FieldName">
                                Object Type
                            </div>
                            <div>
                                <select style="width: 95%" [ngModel]="selectedAssetTypeId" (ngModelChange)="selectObjectType($event);">
                                    <option></option>
                                    <option *ngFor="let o of objectTypes" [value]="o.value">{{o.label}}</option>
                                </select>
                            </div>
                        </div>
                        <div class="col s12" *ngIf="selectedAssetTypeId == null || selectedAssetTypeId == ''" style="padding:5px">&nbsp;</div>
                        <div class="col s12" *ngIf="selectedAssetTypeId != null && selectedAssetTypeId != ''">
                            <div class="FieldName">
                                Choose Objects
                            </div>
                            <div *ngIf="objectsLoading">
                                <d3s-loading isLoading="true"></d3s-loading>
                            </div>
                            <div *ngIf="!objectsLoading">
                                <input #gb type="text" pInputText size="100" placeholder="Search..." class="grid-simple-filter">
                                <p-dataTable #dt [globalFilter]="gb" scrollable="true" scrollWidth="100%" [rowsPerPageOptions]="defaultPagingOptions" [value]="objects" [rows]="defaultInitialItemsPerPage" paginator="true" pageLinks="3"  [(selection)]="selectedObjects">
                                    <p-footer *ngIf="dt.totalRecords"><d3s-grid-paging-info [totalRecords]="dt.totalRecords" [first]="dt.first" [rows]="dt.rows"></d3s-grid-paging-info></p-footer>
                                    <p-column selectionMode="multiple" [style]="{'width':'30px'}"></p-column>
                                    <p-column field="name" header="Name"></p-column>
                                </p-dataTable>                       
                            </div>
                        </div>
                        <div class="col s12" *ngIf="selectedAssetTypeId != null">
                            <button pButton label="Add Selected Objects" type="button" (click)="add()" [disabled]="selectedAssetTypeId == null || selectedObjects == null || selectedObjects.length < 1"></button>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    </d3s-overlay-window>
</div>

<div class="tile tile-detail" *ngIf="isLoading">
    <div class="row">
        <div class="col s12">
            <d3s-loading isLoading="true"></d3s-loading>
        </div>
    </div>
</div>
<div class="tile tile-detail" [hidden]="isLoading">
    <header>
        &nbsp;
        <d3s-tile-actions hasMenu="true" [menuItems]="menuItems" (menuClick)="menuClick($event)"></d3s-tile-actions>
    </header>
    <div class="row">
        <div class="col s12" style="padding: 0">
            <table>
                <tbody>
                    <tr>
                        <td style="vertical-align: top;">
                            <div #diagram id="LineageDiagram" style="overflow: hidden;" class="diagram"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
