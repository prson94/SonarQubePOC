<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="formMode == FormMode.Default">
    <header>
        &nbsp;
        <d3s-tile-actions *ngIf="!isLoading" [hasExport]="true" (exportClick)="export()" [hasFilterMode]="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
    </header>



    <input type="text" [hidden]="!showSimpleFilter" pInputText size="100" (input)="dt.filterGlobal($event.target.value, 'contains')" i18n-placeholder placeholder="Search..." class="grid-simple-filter">
    <p-table #dt [value]="history" [scrollable]="true" selectionMode="single" [metaKeySelection]="true" [globalFilterFields]="['Comment','Status','StartedOn','CompletedOn','StartedBy','Name']" [pageLinks]="3" [paginator]="true" [rows]="5" [rowsPerPageOptions]="defaultPagingOptions">
        <ng-template pTemplate="colgroup">
            <colgroup>
                <col style="width:180px">
                <col style="width:80px">
                <col style="width:100px">
                <col style="width:100px">
                <col style="width:100px">
                <col style="width:100px">

            </colgroup>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th [pSortableColumn]="'Comment'" style="width: 180px">
                    <ng-container i18n>Comment</ng-container>
                    <d3s-sortIcon [field]="'Comment'"></d3s-sortIcon>
                </th>
                <th [pSortableColumn]="'Status'" style="width: 80px">
                    <ng-container i18n>Status</ng-container>
                    <d3s-sortIcon [field]="'Status'"></d3s-sortIcon>
                </th>
                <th [pSortableColumn]="'StartedOn'" style="width: 100px">
                    <ng-container i18n>Started On</ng-container>
                    <d3s-sortIcon [field]="'StartedOn'"></d3s-sortIcon>
                </th>
                <th [pSortableColumn]="'CompletedOn'" style="width: 100px">
                    <ng-container i18n>Completed On</ng-container>
                    <d3s-sortIcon [field]="'CompletedOn'"></d3s-sortIcon>
                </th>
                <th [pSortableColumn]="'StartedBy'" style="width: 100px">
                    <ng-container i18n>Started By</ng-container>
                    <d3s-sortIcon [field]="'StartedBy'"></d3s-sortIcon>
                </th>
                <th [pSortableColumn]="'Name'" style="width: 100px">
                    <ng-container i18n>Object</ng-container>
                    <d3s-sortIcon [field]="'Name'"></d3s-sortIcon>
                </th>
            </tr>
            <tr [hidden]="showSimpleFilter">
                <th><d3s-column-filter [field]="'Comment'" [datatype]="'text'"></d3s-column-filter></th>
                <th><d3s-column-filter [field]="'Status'" [datatype]="'text'"></d3s-column-filter></th>
                <th><d3s-column-filter [field]="'StartedOn'" [datatype]="'text'"></d3s-column-filter></th>
                <th><d3s-column-filter [field]="'CompletedOn'" [datatype]="'text'"></d3s-column-filter></th>
                <th><d3s-column-filter [field]="'StartedBy'" [datatype]="'text'"></d3s-column-filter></th>
                <th><d3s-column-filter [field]="'Name'" [datatype]="'text'"></d3s-column-filter></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr [pSelectableRow]="item">
                <td>
                    {{item.Comment}}
                    <div *ngIf="item.ActivityType == WorkflowActivityType.Form">
                        <a (click)="selection = item; formMode = FormMode.FormHistory" style="text-decoration:underline;cursor:pointer;">View Form History</a>
                    </div>
                </td>
                <td>{{item.Status}}</td>
                <td>
                    <span>{{item.StartedOn | date:'short'}}</span>
                </td>
                <td>
                    <span>{{item.CompletedOn | date:'short'}}</span>
                </td>
                <td>{{item.StartedBy}}</td>
                <td>
                    <a *ngIf="item.NgUrl != null" (click)="navigate(item.NgUrl)">{{item.Name}}</a>
                    <span *ngIf="item.NgUrl == null">{{item.Name}}</span>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="summary">
            <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
        </ng-template>
    </p-table>
</div>
<div *ngIf="formMode == FormMode.FormHistory">
    <div style="float: right">
        <button pButton type="button" label="Back to history" (click)="formMode = FormMode.Default; selection = null;"></button>
    </div>
    <d3s-workflow-form-history [itemStepId]="selection.ItemStepID"
                               [settings]="selection.SettingsObject"
                               [fields]="selection.FieldsObject"
                               [completed]="selection.CompletedOn != null">
    </d3s-workflow-form-history>
</div>
