<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="formMode == FormMode.Default">
    <header>
        &nbsp;
        <d3s-tile-actions [hasExport]="true" (exportClick)="export()" [hasFilterMode]="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
    </header>
    <input [hidden]="!showSimpleFilter" #gb type="text" pInputText size="100" placeholder="Search..." class="grid-simple-filter">
    <p-dataTable *ngIf="!isLoading" #dt [globalFilter]="gb" [value]="history" selectionMode="single" [rows]="5" [rowsPerPageOptions]="[5,10,15]" [paginator]="true" [pageLinks]="3" scrollable="true" scrollWidth="560px">
        <p-footer *ngIf="dt.totalRecords"><d3s-grid-paging-info [totalRecords]="dt.totalRecords" [first]="dt.first" [rows]="dt.rows"></d3s-grid-paging-info></p-footer>
        <p-column header="Object" field="Name" [style]="{'width' : '120px'}" sortable="true" [filter]="!showSimpleFilter" filterMatchMode="contains">
            <ng-template pTemplate="body" let-item="rowData">
                <a>{{item.Name}}</a>
            </ng-template>
        </p-column>
        <p-column header="Status" field="Status" [style]="{'width' : '80px'}" sortable="true" [filter]="!showSimpleFilter" filterMatchMode="contains">></p-column>
        <p-column header="Started On" field="StartedOn" [style]="{'width' : '100px'}" sortable="true" [filter]="!showSimpleFilter" filterMatchMode="contains">
            <ng-template pTemplate="body" let-item="rowData">
                <span>{{item.StartedOn | date:'short'}}</span>
            </ng-template>
        </p-column>
        <p-column header="Completed On" field="CompletedOn" [style]="{'width' : '100px'}" sortable="true" [filter]="!showSimpleFilter" filterMatchMode="contains">
            <ng-template pTemplate="body" let-item="rowData">
                <span>{{item.CompletedOn | date:'short'}}</span>
            </ng-template>
        </p-column>
        <p-column header="Started By" field="StartedBy" [style]="{'width' : '100px'}" sortable="true" [filter]="!showSimpleFilter" filterMatchMode="contains"></p-column>
        <p-column header="Comment" field="Comment" [style]="{'width' : '180px'}" sortable="true" [filter]="!showSimpleFilter" filterMatchMode="contains">
            <ng-template pTemplate type="body" let-item="rowData">
                {{item.Comment}}
                <div *ngIf="item.ActivityType == WorkflowActivityType.Form">
                    <a (click)="selection = item; formMode = FormMode.FormHistory" style="text-decoration:underline;">View Form History</a>
                </div>
            </ng-template>
        </p-column>
    </p-dataTable>
</div>
<div *ngIf="formMode == FormMode.FormHistory">
    <div style="float: right">
        <button pButton type="button" label="Back to history" (click)="formMode = FormMode.Default; selection = null;"></button>
    </div>
    <d3s-workflow-form-history
                               [itemStepId]="selection.ItemStepID"
                               [settings]="selection.SettingsObject"
                               [fields]="selection.FieldsObject"
                               [completed]="selection.CompletedOn != null">
    </d3s-workflow-form-history>
</div>
