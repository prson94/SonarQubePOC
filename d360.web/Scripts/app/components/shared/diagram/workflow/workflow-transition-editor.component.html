<div class="row">
    <div class="col s12">
        <div class="FieldName" i18n>Name</div>
        <div>
            <input type="text" style="width: 95%" [ngModel]="transition.name" (ngModelChange)="transition.name = $event; transitionChange.emit(transition)" />
        </div>
    </div>
    <div class="col s12">
        <div class="FieldName" i18n>Transition Type</div>
        <div>
            <select [ngModel]="transition.transitionType" (ngModelChange)="changeType($event)" style="width: 95%">
                <option *ngFor="let t of transitionTypes" [value]="t.ID">{{t.Name}}</option>
            </select>
        </div>
    </div>
</div>
<div [ngSwitch]="transition.transitionType">
    <div *ngSwitchCase="TransitionType.Condition" class="row">
        <div class="col s12">
            <d3s-workflow-condition-list (addClick)="add()"
                                         (removeClick)="remove($event)"
                                         [conditions]="transition.condition"
                                         [hideAllAnyOption]="true">
            </d3s-workflow-condition-list>

            <d3s-workflow-condition-editor *ngIf="formMode == FormMode.Adding || formMode == FormMode.Editing"
                                           [objectId]="objectId"
                                           [objectType]="objectType"
                                           [issueObject]="issueObject"
                                           [condition]="condition"
                                           (onSave)="saveCondition($event)"
                                           (onClose)="formMode = FormMode.Default"
                                           [formFields]="formFields"
                                           [httpFields]="httpFields"
                                           [outputFields]="outputFields"
                                           [changeType]="workflowChangeType"
                                           [diagram]="diagram"
                                           [isForTransition]="true">
            </d3s-workflow-condition-editor>

        </div>
    </div>
    <div *ngSwitchCase="TransitionType.Timer" class="row">
        <div class="col s12" style="padding-bottom:15px">
            <div class="FieldName" i18n>Frequency (Days)</div>
            <div>
                <input type="number" [ngModel]="transition.settings.TimerInterval" (ngModelChange)="transition.settings.TimerInterval = $event; transitionChange.emit(transition)" style="width: 95%" />
            </div>
        </div>
    </div>
    <div *ngSwitchCase="TransitionType.Always" class="row">
        <div class="col s12" style="padding-bottom:5px">
            &nbsp;
        </div>
    </div>
</div>
