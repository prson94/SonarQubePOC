<d3s-loading [isLoading]="isLoading"></d3s-loading>
<div *ngIf="!isLoading">
    <div class="row">
        <div class="col s6" *ngIf="settings != null">
            <div class="FieldName">Form Response Type</div>
            <div>{{settings.FormResponseType}}</div>
        </div>
        <div class="col s6" *ngIf="fields != null">
            <div class="FieldName">Total Resources</div>
            <div>{{fields['@TotalResources']}}</div>
        </div>
        <div class="col s6" *ngIf="fields != null && fields.form != null">
            <div class="FieldName">Completed Forms</div>
            <div>
                <select [ngModel]="selectedFormIndex" (ngModelChange)="selectedFormIndex = $event; selectForm($event)" style="width: 95%">
                    <option value="-1"></option>
                    <option *ngFor="let f of fields.form; let i = index" [value]="i">{{f.ResourceName}}</option>
                </select>
            </div>
        </div>
        <div class="col s6" *ngIf="fields != null">
            <div class="FieldName">Number of Responses</div>
            <div>{{fields['@NumberOfResponses'] || '0'}}</div>
        </div>
    </div>
    <div class="row"><div class="col s12">&nbsp;</div></div>
    <div *ngIf="selectedForm != null && selectedForm.field != null">
        <header>
            Form Details - {{selectedForm.ResourceName}}
        </header>
        <div *ngFor="let f of selectedForm.field; let i = index" class="row">
            <div class="col s12">
                <div class="FieldName">{{f['@label']}}</div>
                <div *ngIf="f['@fieldtype'] == 'boolean'">
                    <p-toggleButton onLabel="Yes" offLabel="No" onIcon="fa-check-square" offIcon="fa-times" [ngModel]="f['@value']" disabled></p-toggleButton>
                </div>
                <div *ngIf="f['@fieldtype'] == 'textarea'">
                    <textarea style="width: 100%;" [ngModel]="f['@value']" readonly></textarea>
                </div>
                <div *ngIf="f['@fieldtype'] == 'date'">
                    <p-calendar [ngModel]="f['@value']" disabled></p-calendar>
                </div>
                <div *ngIf="f['@fieldtype'] == 'text' || f['@fieldtype'] == 'integer'">
                    <div>{{f['@value']}}</div>
                </div>
            </div>
            <!--<div class="col s12">
                <div class="FieldName">{{f['@label']}}</div>
                <div>{{f['@value']}}</div>
            </div>-->
        </div>
    </div>
</div>
