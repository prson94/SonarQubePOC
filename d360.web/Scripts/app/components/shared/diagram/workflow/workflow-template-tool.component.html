<div class="ql-custom-field-tool"
    #cont
    style="display: inline-block">
    <select style="font-size: 1em; font-weight: normal; display: block !important;"
        #sel
        [ngModel]="selected"
        (ngModelChange)="clickItem($event)">
        <option value="none"
            disabled i18n>Append field value...</option>
        <option *ngFor="let f of fields"
            [value]="f.value"
            style="color:#000;">{{f.label}}</option>
    </select>
</div>
