<div class="tile tile-detail">
    <header>
        <span>Impact</span>
        <span *ngIf="isLoading" id="LoadingProgress" style="color: #e2792a"><i class="fa fa-refresh fa-spin fa-lg fa-fw"></i>Loading...</span>
        <d3s-tile-actions hasMenu="true" [menuItems]="menuItems" (menuClick)="menuAction($event)"></d3s-tile-actions>
    </header>
    <div style="position:relative;left: 100%; display: inline; width: 1px;">
        <d3s-overlay-window [width]="overlayWidth" [maxHeight]="overlayMaxHeight" padding="0" [(visible)]="isWindowVisible" [headerText]="(selectedObject && selectedObjectID) ? headerText : ''" overflowScroll="false">
            <div *ngIf="!selectedObject || !selectedObjectID" style="padding:10px;">Nothing selected</div>
            <ul class="tab-menu" *ngIf="selectedObject && selectedObjectID">
                <li (click)="selectTab('info')" class="tab-item" [class.selected]="tab == 'info'" >
                    <i class="fa fa-info-circle fa-2x"></i>
                </li>
                <li (click)="selectTab('user')" class="tab-item" [class.selected]="tab == 'user'">
                    <i class="fa fa-user fa-2x"></i>
                </li>                
            </ul>
            <div *ngIf="selectedObject && selectedObjectID && isWindowVisible" [ngSwitch]="tab"  style="background-color: #fff; padding: 10px; overflow-y:scroll; max-height: 300px">
                <div *ngSwitchCase="'info'">
                    <div style="float:right;">
                        <button pButton type="button" [label]="showDetail ? 'Hide Detail' : 'Show Detail'" [icon]="showDetail ? 'fa fa-compress' : 'fa fa-expand'" (click)="toggleDetail()"></button>
                    </div>
                    <d3s-lineage-object-detail *ngIf="!showDetail && selectedObject && selectedObjectID" [objectType]="selectedObject" [objectId]="selectedObjectID"></d3s-lineage-object-detail>
                    <object-detail *ngIf="showDetail && selectedObject && selectedObjectID" [objectType]="selectedObject" [objectID]="selectedObjectID"></object-detail>
                </div>                
            </div>
        </d3s-overlay-window>
        <d3s-overlay-window width="500" maxHeight="400" padding="0" [(visible)]="isFilterVisible" headerText="Filter" overflowScroll="false">
            <div>
                <div class="row">
                    <div class="col s12">
                        <div class="FieldName">
                            Predicates
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col s6">
                        <div *ngFor="let f of filters; let i=index">
                            <div *ngIf="f.type == FilterType.Predicate && i % 2 == 0">
                                <input type="checkbox" [(ngModel)]="f.selected" (ngModelChange)="checkFilter()" /> {{f.name}}
                            </div>
                        </div>
                    </div>
                    <div class="col s6">
                        <div *ngFor="let f of filters; let i=index">
                            <div *ngIf="f.type == FilterType.Predicate && i % 2 == 1">
                                <input type="checkbox" [(ngModel)]="f.selected" (ngModelChange)="checkFilter()" /> {{f.name}}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col s12">
                        <div class="FieldName">
                            Types
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col s6">
                        <div *ngFor="let f of filters; let i=index">
                            <div *ngIf="f.type == FilterType.Category && i % 2 == 0">
                                <input type="checkbox" [(ngModel)]="f.selected" (ngModelChange)="checkFilter()" /> {{f.name}}
                            </div>
                        </div>
                    </div>
                    <div class="col s6">
                        <div *ngFor="let f of filters; let i=index">
                            <div *ngIf="f.type == FilterType.Category && i % 2 == 1">
                                <input type="checkbox" [(ngModel)]="f.selected" (ngModelChange)="checkFilter()" /> {{f.name}}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div style="height:20px">&nbsp;</div>
                </div>
                <div class="row">
                    <div class="col s12 right">
                        <button pButton type="button" label="Select All" (click)="selectAll()"></button>
                        <button pButton type="button" label="Deselect All" (click)="selectNone()"></button>
                        <button pButton type="button" label="Apply" (click)="filterView()" [disabled]="!canApplyFilter"></button>
                    </div>
                </div>
                <div class="row">
                    <div style="height:20px">&nbsp;</div>
                </div>
            </div>
        </d3s-overlay-window>
    </div>
    <div id="ImpactDiagram" style="overflow: hidden;" class="diagram" #diagram></div>
</div>
