    <div class="editor" *ngIf="linkData">
        <div class="header">
            <span class="asset-name">Connector</span>
        </div>
        <div class="gov-editor-v2">
            <div class="row">
                <div class="col s12">
                    <p-autoComplete [(ngModel)]="text" [suggestions]="labels" (completeMethod)="search($event)"
                                    [dropdown]="true" (onSelect)="select($event)"></p-autoComplete>
                </div>
            </div>
        </div>
    </div>
