<div class="process-list-view" *ngIf="nodeArray">
    <div class="search">
        <input igInput type="text" placeholder="Search..." name="name" maxlength="250" (input)="dt.filterGlobal($event.target.value, 'contains')" />
        <i class="fa fa-search"></i>
    </div>

    <p-table #dt [value]="nodeArray"
             [paginator]="true"
             [(selection)]="selected"
             dataKey="key"
             selectionMode="multiple"
             (onHeaderCheckboxToggle)="toggleAll($event)"
             styleClass="process-table treetable"
             sortField="StepNo"
             [customSort]="true"
             (sortFunction)="customSort($event)"
             [globalFilterFields]="['StepNo','Name','assetTypeName','governanceDisplayValue']"
             [rows]="rowsPerPage"
             [rowsPerPageOptions]="defaultPagingOptions"
             [scrollable]="true"
             [scrollHeight]="tableScrollHeight">
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 30px;">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>
                <th [pSortableColumn]="'StepNo'">
                    Step No
                    <p-sortIcon [field]="'StepNo'"></p-sortIcon>
                </th>
                <th [pSortableColumn]="'Name'">
                    Name
                    <p-sortIcon [field]="'Name'"></p-sortIcon>
                </th>
                <th [pSortableColumn]="'assetTypeName'">
                    Diagram Asset Type Name
                    <p-sortIcon [field]="'assetTypeName'"></p-sortIcon>
                </th>
                <th [pSortableColumn]="'governanceDisplayValue'">
                    Governance Role
                    <p-sortIcon [field]="'governanceDisplayValue'"></p-sortIcon>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
            <tr #el [pSelectableRow]="item">
                <td (click)="selectSingleItem($event,item,el,rowIndex);" style="width:30px">
                    <p-tableCheckbox [value]="item"></p-tableCheckbox>
                </td>
                <td (click)="selectSingleItem($event,item,el,rowIndex);">{{item.StepNo}}</td>
                <td (click)="selectSingleItem($event,item,el,rowIndex);">{{item.Name}}</td>
                <td (click)="selectSingleItem($event,item,el,rowIndex);">{{item.assetTypeName}}</td>
                <td (click)="selectSingleItem($event,item,el,rowIndex);">{{item.governanceDisplayValue ? item.governanceDisplayValue : '---'}}</td>
            </tr>
        </ng-template>
    </p-table>
    <div class="ui-table-summary">
        <d3s-grid-paging-info [first]="dt.first" [rows]="dt.rows" [totalRecords]="dt.totalRecords"></d3s-grid-paging-info>
    </div>
</div>
