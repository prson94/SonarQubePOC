<ng-container *ngIf="!isLoading">
    <p-dropdown styleClass="icon-picker"
                panelStyleClass="icon-panel"
                [style]="style"
                [options]="categories"
                [disabled]="disabled"
                [group]="true"
                [ngModel]="ngModel"
                (ngModelChange)="ngModelChange.emit($event)"
                [filter]="true"
                [showClear]="true"
                appendTo="body"
                scrollHeight="320px"
                [attr.required]="isRequired"
                [placeholder]="(isRequired ? 'Required' : 'Optional')"
                filterPlaceholder="Type to filter">
        <ng-template let-group pTemplate="group">
            <span>{{group.label}}</span>
        </ng-template>
        <ng-template let-item pTemplate="selectedItem">
            <div class="iconfield-item-selected">
                <span class="iconfield-swatch">
                    <img [src]="item.path" *ngIf="item.img">
                    <i [class]="'fa ' + item.value" *ngIf="!item.img"></i>
                </span>
                <span class="iconfield-item-label">
                    {{item.label}}
                </span>
            </div>
        </ng-template>
        <ng-template let-item pTemplate="item">
            <div class="iconfield-item">
                <span class="iconfield-swatch">
                    <img [src]="item.path" *ngIf="item.img">
                    <i [class]="'fa ' + item.value" *ngIf="!item.img"></i>
                </span>
                <span class="iconfield-item-label">
                    {{item.label}}
                </span>
            </div>
        </ng-template>
    </p-dropdown>
</ng-container>
