<div #switch [attr.id]="inputId" [attr.tabindex]="tabindex" [ngStyle]="style" [class]="styleClass" (keydown.space)="toggle($event)" class="switch {{value === true ? ' checked' : ''}} {{value === undefined ? 'unset' : ''}} {{disabled ? 'disabled':''}}">
    <button tabindex="-1" (click)="tryChangeValue(true)" class="check" [attr.aria-label]="trueLabel">{{trueLabel}}</button>
    <button tabindex="-1" (click)="tryChangeValue(false)" class="uncheck" [attr.aria-label]="falseLabel">{{falseLabel}}</button>
</div>
