<div #tagPicker [attr.id]="inputId" [attr.tabIndex]="-1" [ngStyle]="style" [class]="getStyleClasses">
    <div class="selected-tags">
        <div *ngIf="!disabled" class="tooltip-wrapper">
            <div class="tag-tooltip">
                <i *ngIf="!isTooltipLoaded" class="fa fa-spinner fa-spin fa-2x"></i>
                <ng-container *ngIf="isTooltipLoaded">
                    <span class="span-break">{{tagTooltip.Value}}</span>
                    <span i18n>Tag added by {{tagTooltip.CreatedBy}} on {{(tagTooltip.CreatedOn | date:'short')}}</span>
                </ng-container>
            </div>
        </div>
        <ng-container *ngIf="value && value.length > 0">
            <div class="selected-tag" *ngFor="let item of value">
                <div class="tag-value" (mouseout)="leave()" (mouseenter)="enter(item,$event.target)">
                    {{item.title}}
                </div>
                <div *ngIf="!disabled && !readOnly && canDeleteTag(item.title)" i18n-pTooltip pTooltip="Remove Tag" tooltipPosition="top" (click)="removeItem(item)" [attr.target]="'_blank'" class="link-button">
                    <i style="padding-left:10px" class="fa fa-times-circle"></i>
                </div>
            </div>
        </ng-container>
        <div class="add-tag-wrapper" *ngIf="!disabled && !readOnly">
            <p-autoComplete [(ngModel)]="tagAutocompleteValue"
                            (onBlur)="resetValue()"
                            scrollHeight="400px"
                            [tabindex]="tabindex"
                            value="tagAutocompleteValue"
                            inputStyleClass="inputBox"
                            placeholder="Click to add..."
                            [suggestions]="searchResults"
                            (onKeyUp)="checkKey($event,tagAutocompleteValue)"
                            (onSelect)="saveTag($event)"
                            field="name"
                            (completeMethod)="search($event,$event.query)">
                <ng-template let-elm pTemplate="item">
                    <span [innerHTML]="highlight(elm.title,tagAutocompleteValue)"></span>
                </ng-template>
            </p-autoComplete>
        </div>
    </div>
</div>
