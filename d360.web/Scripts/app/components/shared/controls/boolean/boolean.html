<div class="d3s-checkbox">    
    <div #switch tabindex="0" class="switch {{value == true ? 'checked' : ''}}">
        <button tabindex="-1" (click)="tryChangeValue(true)" class="check">Yes</button>
        <button tabindex="-1" (click)="tryChangeValue(false)" class="uncheck">No</button>
    </div>
</div>
