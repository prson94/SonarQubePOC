<span class="ig-search-field {{infoTooltip ? 'has-tooltip' : ''}}">
    <input igInput #iginput
           [tabindex]="tabindex"
           type="text" autocomplete="off" placeholder="{{placeholder}}" maxlength="{{maxLength}}"
           [disabled]="disabled"
           [ngModel]="value"
           (ngModelChange)="writeValue($event)"
           (keydown)="onInputKey($event)"
           (keyup)="onInputKey($event)"
           (blur)="onModelTouched()"
           (input)="onModelChange($event.target.value)">
    <button *ngIf="hasValue"
            class="ig-search-field-button clear"
            [disabled]="disabled"
            tabindex="-1"
            type="button"
            (click)="clearValue()"
            pTooltip="Clear search"
            tooltipPosition="top"
            tooltipStyleClass="ig-tooltip">
        <span aria-hidden="true" class="fa fa-times"></span>
    </button>
    <span *ngIf="infoTooltip"
          class="ig-search-field-tooltip clear"
          pTooltip="{{infoTooltip}}"
          [escape]="false"
          tooltipPosition="bottom"
          tooltipStyleClass="ig-tooltip ig-tooltip-medium">
        <i class="fa fa-question-circle"></i>
    </span>
    <button *ngIf="isEnter(); else keypressicon"
            class="ig-search-field-button"
            [ngClass]="{'keypress':isKeypress()}"
            [disabled]="disabled"
            tabindex="-1"
            type="button"
            (click)="clicksearch()"
            pTooltip="Search"
            tooltipPosition="top"
            tooltipStyleClass="ig-tooltip">
        <span aria-hidden="true" class="fa fa-search"></span>
    </button>
    <ng-template #keypressicon>
        <span class="ig-search-field-keypress"><span aria-hidden="true" class="fa fa-search"></span></span>
    </ng-template>
</span>
