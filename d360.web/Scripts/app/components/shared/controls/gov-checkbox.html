
<div class="d3s-checkbox">
    <div class="label">{{label}}</div>
    <div class="options">
        <div (click)="changeValue(true)" class="option {{value == true ? 'selected' : ''}}">Yes</div>
        <div (click)="changeValue(false)" class="option {{value == false ? 'selected' : ''}}">No</div>
    </div>
</div>

<style>

    .d3s-checkbox {
        color: black;
        height: 34px;
        line-height: 34px;
    }

    .options {
        background-color: #e0e0e0;
        color: black;
        display: inline-block;
        height: 34px;
    }

    .label {
        display: inline-block;
        height: 34px;
        margin-right: 15px;
    }

    .option {
        display: inline-block;
        background-color: #e0e0e0;
        margin: 3px;
        line-height: 28px;
        padding: 0px 10px;
        width: 42px;
    }

        .option.selected {
            background-color: rgb(0,111,186);
            color: white;
        }

        .option:hover {
            background-color: rgb(0,111,186);
            color: white;
            cursor:pointer;
        }
</style>
