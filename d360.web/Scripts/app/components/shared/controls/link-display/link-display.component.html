<a [href]="linkUrl" [routerLink]="routeUrl" [target]="isRoute ? null : '_blank'">
	{{linkName}}
	<span *ngIf="tooltipVisible" style="text-decoration:none !important">&nbsp;&nbsp;<i class="fa fa-external-link" i18n-pTooltip pTooltip="This link will open in a new tab" tooltipStyleClass="ig-tooltip" tooltipPosition="top"></i></span>
</a>
