<p-calendar
            [ngModel]="ngModel"
            (ngModelChange)="ngModelChange.emit($event)"
            [name]="name"
            [style]="style"
            [styleClass]="getStyleClass"
            [inputStyle]="inputStyle"
            [inputStyleClass]="inputStyleClass"
            [placeholder]="placeholder"
            [appendTo]="appendTo"
            [minDate]="minDate"
            [maxDate]="maxDate"
            [required]="required"
            [disabled]="disabled"
            [dateFormat]="dateFormat">

</p-calendar>
