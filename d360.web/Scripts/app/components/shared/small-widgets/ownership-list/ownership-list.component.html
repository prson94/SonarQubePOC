<span *ngIf="listLength===0">---</span>
<ul *ngIf="listLength > 0" class="ownershiplist {{(listLength === 1 ? 'single-entry' : '')}}">
    <li *ngFor="let owner of list; let i = index" [ngClass]="{'noshow': ((i >= moreLimit) && !showMore)}">
         <span>
          <ng-container *ngIf="!interceptLinkClick">
          <a (click)="onClick($event, owner)" [href]="owner.ResourceItemUrl" [innerHtml]="owner.ResourceName"></a> {{formatResponsibilityTypes(owner.ResponsibilityTypes)}}
        </ng-container>
        <ng-container *ngIf="interceptLinkClick">
                   <a context-link (click)="onClick($event, owner)" [innerHtml]="owner.ResourceName" data-link-type="resource"></a> {{formatResponsibilityTypes(owner.ResponsibilityTypes)}}
        </ng-container>
        </span>
    </li>
</ul>
<a *ngIf="listLength > moreLimit" [innerHtml]="moreText()" (click)="toggleMore($event)"></a>
