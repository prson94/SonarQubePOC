<div class="d3s-score-badge">
    <div *ngIf="score.ScoreType" class="scoretitle">{{getType()}}</div>
    <div class="d3s-score-pill" [style.background-color]="getBackgroundColor()" title="{{lastCalculatedMessage()}}">
        <d3s-dynamic-percentage [percentage]="getValuePct()"></d3s-dynamic-percentage>
        <div class="text">{{score.Value | scoreDisplay:1}}</div>
    </div>
</div>
