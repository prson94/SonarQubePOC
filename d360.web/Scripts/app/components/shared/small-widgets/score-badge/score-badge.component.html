<div class="{{scoreBadgeClass}}">
    <div class="score-tooltip">
        <span class="item">
            <span class="item-name"><strong class="gov-bold">{{getType()}}</strong></span> {{score.Value | scoreDisplay:1}}
        </span>

        <span class="item">
            <span class="item-name"><strong class="gov-bold">Score Threshold</strong></span> {{getCurrentScoreThreshold()}}
        </span>
        <div class="score-ranges">
            <div class="score-range">
                <span class="score-box score-poor"></span>
                <span class="text">0%-{{lowerThreshold}}%</span>
            </div>
            <div class="score-range">
                <span class="score-box score-average"></span>
                <span class="text">{{lowerThreshold}}.%-{{upperThreshold}}%</span>
            </div>
            <div class="score-range">
                <span class="score-box score-good"></span>
                <span class="text">{{upperThreshold}}.%-100%</span>
            </div>
        </div>

        <span class="item">
            <strong class="gov-bold">Last Run Date</strong> {{lastRunDate | date:'shortDate'}}
        </span>
    </div>
    <ng-container *ngIf="igBadgeStyle; else oldschool">
        <ig-badge [text]="getBadgeText()" [variant]="getScoreVariantColor()"></ig-badge>
    </ng-container>
    <ng-template #oldschool>
        <div *ngIf="score.ScoreType" [class]="displayAsFieldClass">{{getType()}}</div>
        <div class="d3s-score-pill {{getScoreCSSClass()}}">
            <d3s-dynamic-percentage *ngIf="!mast && showSparkline" [percentage]="getValuePct()"></d3s-dynamic-percentage>
            <div class="text">{{score.Value | scoreDisplay:1}}</div>
        </div>
    </ng-template>
</div>
