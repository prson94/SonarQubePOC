<div class="check-tree-header">
    <h2 [innerHTML]="title"></h2><span *ngIf="showClearSelection()" class="clear-tree" (click)="clearSelection()">Clear filter</span>
</div>
<d3s-loading [isLoading]="loading"></d3s-loading>

<div *ngIf="!loading" [ngStyle]="style" [class]="styleClass">
    <div *ngIf="filter" class="ui-tree-filter-container">
        <input #filter type="text" autocomplete="off" class="ui-tree-filter ui-inputtext ui-widget ui-state-default ui-corner-all" [attr.placeholder]="filterPlaceholder"
               (keydown.enter)="$event.preventDefault()" (input)="onFilter($event)">
        <span class="ui-tree-filter-icon pi pi-search"></span>
    </div>
    <ul *ngIf="getRootNode()" role="tree" [attr.aria-label]="ariaLabel" [attr.aria-labelledby]="ariaLabelledBy">
        <d3s-check-treeNode *ngFor="let node of getRootNode(); let firstChild=first;let lastChild=last; let index=index; trackBy: nodeTrackBy" [node]="node"
                            [firstChild]="firstChild" [lastChild]="lastChild" [index]="index"></d3s-check-treeNode>
    </ul>
    <div class="ui-tree-empty-message" *ngIf="value == null || value.length === 0">{{emptyMessage}}</div>
</div>
