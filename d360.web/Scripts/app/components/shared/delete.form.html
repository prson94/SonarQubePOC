<div>
    <div class="row">
        <div *ngIf="isLoading" style="text-align:center;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
        <div *ngIf="!isLoading">{{prompt}}</div>
    </div>    
    <div class="row">
        <form-message [message]="message"></form-message>
        <button pButton (click)="delete()" label="Delete" [disabled]="isLoading" class="left"></button>
        <button pButton (click)="cancel()" label="Cancel" class="left"></button>
    </div>
</div>
