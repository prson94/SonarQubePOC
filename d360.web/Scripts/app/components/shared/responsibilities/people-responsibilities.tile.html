<div *ngIf="assetID">
    <div>
        <header>
            {{title}}
            <d3s-tile-actions [hasAdd]="hasRootCreatePermissions()" (addClick)="add();" *ngIf="!isEditing && !isAdding && !isDeleting" hasFilterMode="true" [(filterMode)]="showSimpleFilter"></d3s-tile-actions>
        </header>
    </div>
    <div *ngIf="isLoading" style="width:100%; text-align:center;">
        <div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
    </div>
    <div *ngIf="!isLoading">
        <div *ngIf="!isEditing && !isDeleting && !isAdding">
            <input [hidden]="!showSimpleFilter" #gb type="text" pInputText size="100" placeholder="Search..." class="grid-simple-filter" />
            <p-dataTable #dt [globalFilter]="gb" [value]="responsibilities" selectionMode="single" (onRowSelect)="selectedRow = $event.data" [rows]="defaultInitialItemsPerPage" [rowsPerPageOptions]="defaultPagingOptions" paginator="true" (onRowDblclick)="onDoubleClick($event)">
                <p-footer *ngIf="dt.totalRecords"><d3s-grid-paging-info [totalRecords]="dt.totalRecords" [first]="dt.first" [rows]="dt.rows"></d3s-grid-paging-info></p-footer>
                <p-column field="ResponsibilityTypeName" header="Responsibility" sortable="custom" (sortFunction)="columnSort($event)" [style]="{'width':'200px'}" [filter]="!showSimpleFilter"></p-column>
                <p-column field="LastName" header="Resource" sortable="custom" (sortFunction)="columnSort($event)" [filter]="!showSimpleFilter" [style]="{'min-width':'200px'}">
                    <ng-template let-item="rowData" pTemplate type="body">
                        <d3s-preview-tooltip objectType="Resource" [objectId]="item.ResourceID">{{item.FirstName}} {{item.LastName}}</d3s-preview-tooltip>
                    </ng-template>
                </p-column>
                <p-column field="SecurityAssetName" header="Via Group" sortable="custom" (sortFunction)="columnSort($event)" [style]="{'width':'200px'}" [filter]="!showSimpleFilter">
                    <ng-template let-item="rowData" pTemplate type="body">
                        <div *ngIf="item.SecurityAsset != 'R'">{{item.SecurityAssetName}}</div>
                    </ng-template>
                </p-column>
                <p-column field="Context" header="Context" [style]="{'min-width':'300px'}">
                    <ng-template let-item="rowData" pTemplate type="body">
                        <div>{{this.htmlDecode(item.Context)}}</div>
                    </ng-template>
                </p-column>
                <p-column field="OverrideItemID" [hidden]="true">
                    <ng-template let-item="rowData" pTemplate type="body">
                        <div>{{item.OverrideItemID}}</div>
                    </ng-template>
                </p-column>
                <p-column [style]="{'width':'40px'}">
                    <ng-template let-item="rowData" pTemplate type="body">
                        <div *ngIf="!item.RuleName && hasRootUpdatePermissions()" class="RowTools">
                            <a (click)="selectedRow = item; edit(item.ID)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                        </div>
                    </ng-template>
                </p-column>
                <p-column [style]="{'width':'40px'}">
                    <ng-template let-item="rowData" pTemplate type="body">
                        <div *ngIf="!item.RuleName && hasRootDeletePermissions()" class="RowTools">
                            <a (click)="selectedRow = item; delete(item.ID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                        </div>
                    </ng-template>
                </p-column>
            </p-dataTable>
        </div>
        <div *ngIf="isEditing">
            <d3s-responsibility-item-form [item]="selectedRow" (onSaveComplete)="load(); isEditing=false;" (onCancel)="selectedRow=$event.item;isEditing=false;"></d3s-responsibility-item-form>
        </div>
        <div *ngIf="isDeleting" style="padding:15px;">
            <d3s-delete-form [uri]="'/form/DeleteResponsibilityByID?id=' + selectedRow.OverrideItemID"
                         [method]="'delete'"
                         [prompt]="'Are you sure you want to delete this owner?'"
                         (onDeleteSuccess)="confirmDeleteRow(selectedRow.OverrideItemID)"
                         (onCancel)="isDeleting=false;">
            </d3s-delete-form>
        </div>
        <div *ngIf="isAdding">
            <d3s-responsibility-item-form [item]="addingRow" (onSaveComplete)="load(); isAdding=false;" (onCancel)="isAdding=false;"></d3s-responsibility-item-form>
        </div>
    </div>
</div>
