<div *ngIf="isLoading">
    <div style="text-align:center;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
</div>
<div *ngIf="!isLoading">
    <form #responsibilityForm="ngForm" (ngSubmit)="save()">
        <div class="row">
            <div class="col l6 m6 s12">
                <label id='ResponsibilityTypeTip' class="FieldNameRequired">Responsibility</label>
                <p-dropdown [options]="model.responsibilityTypes" [(ngModel)]="model.selectedResponsibilityType" [style]="{'width':'90%', 'display':'block'}" name="responsibilityType" required></p-dropdown>
            </div>
            <div class="col l6 m6 s12">
                <label id='ResponsibleObjectTip' class="FieldNameRequired">Resource</label>
                <p-dropdown [options]="model.resources" [(ngModel)]="model.selectedResource" [style]="{'width':'90%', 'display':'block'}" name="resource" required [filter]="true"></p-dropdown>
            </div>
        </div>
        <div class="row">
            <div class="col s12">&nbsp;</div>
        </div>
        <div class="row">
            <div class="col s12">
                <button pButton [disabled]="!responsibilityForm.form.valid" label="Save" type="submit"></button> <button pButton (click)="cancel()" label="Cancel" type="button"></button>  <form-message [message]="message" [inline]="true"></form-message>
            </div>
        </div>
    </form>
</div>
