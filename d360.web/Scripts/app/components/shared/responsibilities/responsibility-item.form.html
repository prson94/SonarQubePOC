<div *ngIf="isLoading">
    <div style="text-align:center;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
</div>
<div *ngIf="!isLoading">
    <form #responsibilityForm="ngForm" (ngSubmit)="save()">
        <div class="row">
            <div class="col l6 m6 s12">
                <label id='ResponsibilityTypeTip' class="FieldNameRequired" i18n>Responsibility</label>
                <p-dropdown [options]="model.responsibilityTypes" [(ngModel)]="model.selectedResponsibilityType" [disabled]="IsResponsibilityDisabled" (onChange)="getResponsibilityTypes();" [style]="{'width':'90%', 'display':'block'}" name="responsibilityType" required></p-dropdown>
                <div>&nbsp;</div>
                <div>
                    <label id='ResponsibilityContextTip' class="FieldNameRequired">Context</label>
                    <p-editor [ngModelOptions]="{standalone: true}" [(ngModel)]="model.responsibility.Context" name="Context" [style]="{'height':'150px','width':'100%'}">
                        <header style="padding-bottom:0px !important">
                            <span class="ql-formats">
                                <select class="ql-header">
                                    <option value="1">Heading</option>
                                    <option value="2">Subheading</option>
                                    <option selected>Normal</option>
                                </select>
                                <select class="ql-font">
                                    <option selected>Sans Serif</option>
                                    <option value="serif">Serif</option>
                                    <option value="monospace">Monospace</option>
                                </select>
                            </span>
                            <span class="ql-formats">
                                <button class="ql-bold"></button>
                                <button class="ql-italic"></button>
                                <button class="ql-underline"></button>
                            </span>
                            <span class="ql-formats">
                                <select class="ql-color"></select>
                                <select class="ql-background"></select>
                            </span>
                            <span class="ql-formats">
                                <button class="ql-list" value="ordered"></button>
                                <button class="ql-list" value="bullet"></button>
                                <select class="ql-align">
                                    <option selected></option>
                                    <option value="center"></option>
                                    <option value="right"></option>
                                    <option value="justify"></option>
                                </select>
                            </span>
                            <span class="ql-formats">
                                <button class="ql-link"></button>
                                <button class="ql-code-block"></button>
                            </span>
                            <span class="ql-formats">
                                <button class="ql-clean"></button>
                            </span>
                        </header>
                    </p-editor>
                </div>
            </div>
            <div class="col l6 m6 s12">
                <label id='ResponsibleObjectTip' class="FieldNameRequired" i18n>Resource</label>

                <p *ngIf="!resourceGrid">{{resouceAssigned}} <a style="cursor:pointer;" (click)="showResourceGrid()"><i class="fa fa-pencil"></i></a></p>
                <div *ngIf="resourceGrid">
                    <d3s-resource-multiselect-grid [multiple]="false" [(ngModel)]="fieldValue" [showSelectedSummary]="false" showToolTip="true" ngDefaultControl [field]="field" [ngModelOptions]="{standalone: true}" [showResourceType]="true"></d3s-resource-multiselect-grid>
                </div>


            </div>
        </div>

        <div class="row">
            <div class="col s12">&nbsp;</div>
        </div>
        <div class="row">
            <div class="col s12">
                <button pButton [disabled]="!isValid()" i18n-label label="Save" type="submit"></button> <button pButton (click)="cancel()" i18n-label label="Cancel" type="button"></button>  <form-message [message]="message" [inline]="true"></form-message>
            </div>
        </div>
    </form>
</div>
