<div class="scoring">
    <div class="score-breakdown">
        <div class="row">
            <div class="col s12">
                <div class="heading breakdown">
                    <button *ngIf="hasAnyScoreType(ScoreType.Governance)" [ngClass]="{'selected': showGovernanceScores}" (click)="setSelectedButton(ScoreType.Governance)" class="button ng-star-inserted"><span>Governance Score</span></button>
                    <button *ngIf="hasAnyScoreType(ScoreType.DataQuality)" [ngClass]="{'selected': showDQScores}" (click)="setSelectedButton(ScoreType.DataQuality)" class="button ng-star-inserted"><span>Data Quality Score</span></button>
                    
                        <div *ngIf="!isAllCollapsed() && !showEmptyMessage && showExpandAndCollapse;else expand" (click)="setCollapsed(true)" class="collapse-btn">Collapse All</div>
                        <ng-template #expand><div *ngIf="!showEmptyMessage && showExpandAndCollapse" (click)="setCollapsed(false)" class="collapse-btn">Expand All</div></ng-template>
                   
                </div>
                <div class="scorecards-container" *ngIf="!showEmptyMessage; else emptyMessage">
                    <d3s-object-health-details-item *ngFor="let item of pointBreakdownTree" [item]="item" [definition]="scoreDefinition" [showtype]="selectedScoreType" [isloading]="isloading" (checkExpander)="hasAnyExpanders()"></d3s-object-health-details-item>
                </div>
                <ng-template #emptyMessage>
                    <div class="scorecards-container">
                        <div class="scorecard-item empty">
                            This score was calculated and sent in from an external source. No measures have been defined.
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
        <div class="row">&nbsp;</div>
    </div>
    <div *ngIf="!isLoading; else chartLoading" class="score-chart-container">
        <div class="heading">
            <div class="heading-text" [innerHTML]="calculatedScoreText | safeHtml"></div>
        </div>
        <div class="score-chart">
            <div class="chart-header">{{getScoreType()}} Score History</div>
            <chart [options]="scoreHistory"></chart>
        </div>
    </div>
    <ng-template #chartLoading>
        <d3s-loading [isLoading]="isLoading"></d3s-loading>
    </ng-template>
</div>
