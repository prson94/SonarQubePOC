<div class="score-chart-container">
    <div class="heading">
        <div class="heading-text" [innerHTML]="calculatedScoreText | safeHtml"></div>
    </div>
    <div class="score-chart">
        <div class="chart-header">{{getScoreType()}} Score History</div>
        <div id="healthChart"></div>
        <div #scoreTable class="score-table">
            <div class="col s12">
                <div class="row score-tbl-header">
                    <div class="col s6 column">Date (UTC)</div>
                    <div class="col s6 column">Score</div>
                </div>
                <div class="body">
                    <div class="row {{isSameDate(item.EffectiveDate,scoreDate) ? 'selected' : ''}}" (click)="scoreTableClick(item)" *ngFor="let item of scoresPoints">
                        <div class="col s6 column">{{item.EffectiveDate | utcDate | date:'shortDate'}}</div>
                        <ng-container [ngSwitch]="item.ScoreProgression">
                            <div *ngSwitchCase="1" class="col s6 column">
                                <i class="fa fa-caret-up arrow-up"></i> {{item.Score}}%
                            </div>
                            <div *ngSwitchCase="-1" class="col s6 column">
                                <i *ngSwitchCase="-1" class="fa fa-caret-down arrow-down"></i> {{item.Score}}%
                            </div>
                            <div *ngSwitchCase="0"
                                 pTooltip="Although the final score remains unchanged, the scores of individual measures have changed, which may be worth investigating."
                                 tooltipPosition="top"
                                 tooltipStyleClass="ig-tooltip"
                                 class="col s6 column">
                                <i class="fa fa-square turn"></i>
                                {{item.Score}}%
                            </div>
                            <div *ngSwitchDefault class="col s6 column">
                                {{item.Score}}%
                            </div>
                        </ng-container>
                    </div>
                    <div class="row">

                    </div>
                </div>
            </div>
            <div class="clearfix"></div>
        </div>
        <div class="table-caption">
            All dates are based on UTC
        </div>
    </div>

</div>
