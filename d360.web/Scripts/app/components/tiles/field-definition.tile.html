<div *ngIf="objectType && objectID">
    <div>
        <header>
            {{title}}            
            <d3s-tile-actions [hasAdd]="true" (addClick)="add()"></d3s-tile-actions>                            
        </header>
    </div>
    <div *ngIf="isLoading" style="width:100%; text-align:center;">
        <div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
    </div>
    <div *ngIf="isEditing">
        <d3s-field-type-form [id]="selectedRow != null? selectedRow.ID : 0" [objectType]="objectType" [objectID]="objectID" (onCancel)="isEditing = false;" (onComplete)="editComplete($event)"></d3s-field-type-form>
    </div>    
    <div *ngIf="isDeleting">
        <delete-form [uri]="'/form/DeleteFieldTypeByID?id=' + selectedRow.ID"
                     [method]="'delete'"
                     [prompt]="'Are you sure you want to delete this field type definition?'"
                     (onDeleteSuccess)="isDeleting=false;"
                     (onCancel)="isDeleting=false;">
        </delete-form>
    </div>
    <div *ngIf="!isLoading && !isEditing && !isDeleting">
        <input #gb type="text" pInputText size="100" placeholder="Search..." style="margin-bottom:10px;width:100%;">                                                             
        <p-dataTable [globalFilter]="gb" [value]="fieldDefinitions" selectionMode="single" [(selection)]="selectedRow" [rows]="20" [paginator]="true" (onRowDblclick)="isEditing=true;">
            <p-column field="FriendlyName" header="Field" sortable="true" [style]="{ 'width': '22%' }"></p-column>
            <p-column field="Category" header="Category" sortable="true" [style]="{ 'width': '22%' }"></p-column>
            <p-column field="IsRequired" header="Required?" sortable="true" [style]="{ 'width': '22%' }">
                <template let-item="rowData" pTemplate type="body">
                    <input type="checkbox" [(ngModel)]="item.IsRequired" disabled />
                </template>
            </p-column>
            <p-column field="IsListable" header="Listable?" sortable="true" [style]="{ 'width': '22%' }">
                <template let-item="rowData" pTemplate type="body">
                    <input type="checkbox" [(ngModel)]="item.IsListable" disabled />
                </template>
            </p-column>
            <p-column [style]="{ 'width': '30px' }">
                <template let-col let-item="rowData" pTemplate type="body">
                    <div class="RowTools">
                        <a (click)="edit(item.ID)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>                        
                    </div>
                </template>
            </p-column>
            <p-column [style]="{ 'width': '30px' }">
                <template let-col let-item="rowData" pTemplate type="body">
                    <div class="RowTools">                        
                        <a (click)="delete(item.ID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                    </div>
                </template>
            </p-column>
        </p-dataTable>
    </div>
</div>
