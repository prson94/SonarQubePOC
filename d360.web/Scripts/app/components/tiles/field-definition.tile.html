<div *ngIf="objectType && objectID">
    <div>
        <header>
            {{title}}
            <div id="FieldsTile_tools" class="TileTools">
                <a class="btn btn-floating waves-effect waves-light brown lighten-1">
                    <i class="fa fa-plus" title="Add definition attribute"></i>
                </a>
            </div>
        </header>
    </div>
    <div *ngIf="isLoading" style="width:100%; text-align:center;">
        <div style="padding:10px;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
    </div>
    <div *ngIf="!isLoading">
        <p-dataTable [value]="fieldDefinitions" selectionMode="single" [(selection)]="selectedRow" [rows]="20" [paginator]="true">
            <p-column field="FriendlyName" header="Field" sortable="true" [filter]="true" filterMatchMode="contains" [style]="{ 'width': '22%' }"></p-column>
            <p-column field="Category" header="Category" sortable="true" [filter]="true" filterMatchMode="contains" [style]="{ 'width': '22%' }"></p-column>
            <p-column field="IsRequired" header="Required?" sortable="true" [filter]="true" filterMatchMode="contains" [style]="{ 'width': '22%' }">
                <template let-item="rowData">
                    <input type="checkbox" [(ngModel)]="item.IsRequired" disabled />
                </template>
            </p-column>
            <p-column field="IsListable" header="Listable?" sortable="true" [filter]="true" filterMatchMode="contains" [style]="{ 'width': '22%' }">
                <template let-item="rowData">
                    <input type="checkbox" [(ngModel)]="item.IsListable" disabled />
                </template>
            </p-column>
            <p-column [style]="{ 'width': '16%' }">
                <template let-col let-item="rowData">
                    <div class="RowTools">
                        <a (click)="edit(item.ID)" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                        <a (click)="delete(item.ID)" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                    </div>
                </template>
            </p-column>
        </p-dataTable>
    </div>
</div>
