<div *ngIf="isLoading">
    <div style="padding:10px;text-align:center;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>
</div>
<div *ngIf="!isLoading" [ngSwitch]="formMode">
    <div class="form-instructions"></div>
    <div class="root-tile" *ngSwitchDefault>
        <header>Synchronization Filters<d3s-tile-actions [hasAdd]="true" (addClick)="add()"></d3s-tile-actions></header>
        <div id="FiltersOverlayGrid"></div>
        <p-dataTable [value]="fusionFilters" selectionMode="single" (onRowSelect)="selectedRow = $event.data;">
            <p-column field="Name" header="Name"></p-column>
            <p-column field="Filter" header="Filter"></p-column>
            <p-column>
                <template let-item="rowData">
                    <div class="RowTools">
                        <a (click)="selectedRow = item; edit();" style="cursor:pointer;"><i class="fa fa-pencil"></i></a>
                        <a (click)="selectedRow = item; delete();" style="cursor:pointer;"><i class="fa fa-trash-o"></i></a>
                    </div>
                </template>
            </p-column>
        </p-dataTable>
    </div>
    <div class="root-tile" *ngSwitchCase="FormMode.Editing">
        <div class="row">
            <div class="col s12">
                <div class="FieldName">Filter</div>
                <input pInputText type="text" [(ngModel)]="newFilter.Filter" style="width:100%" />
            </div>
        </div>
        <div class="row">
            <div class="col s12" style="padding-top:10px;">
                <button pButton type="button" label="Save" (click)="save()"></button><button pButton type="button" label="Cancel" (click)="formMode = FormMode.Default;"></button>
            </div>
        </div>
    </div>
    <div class="root-tile" *ngSwitchCase="FormMode.Deleting">
        //DeleteFusionFilterByID(int fusionID, int fusionAttributeTypeID)

        <delete-form [uri]="'form/DeleteFusionFilterByID?fusionID=' + selectedRow.FusionID + '&fusionAttributeTypeID=' + selectedRow.FusionAttributeTypeID"
                     [method]="'delete'"
                     [prompt]="'Are you sure you want to delete this filter?'"
                     (onCancel)="formMode = FormMode.Default;"
                     (onDeleteComplete)="formMode = FormMode.Default; load();">
        </delete-form>
    </div>
    <div class="root-tile" *ngSwitchCase="FormMode.Adding">
        <div class="row">
            <div class="col s6">
                <div class="FieldName">Fusion Attribute Type</div>
                <p-dropdown [options]="fusionTypeList" [(ngModel)]="selectedFusionType" [style]="{ 'width': '98%' }"></p-dropdown>
            </div>
            <div class="col s6">
                <div class="FieldName">Filter</div>
                <input pInputText type="text" [(ngModel)]="newFilter.Filter" style="width:98%"/>
            </div>
        </div>
        <div class="row" *ngIf="errorMessage.length > 0">
            <div class="col s12">
                <div class="error">{{errorMessage}}</div>
            </div>
        </div>
        <div class="row">
            <div class="col s12" style="padding-top:10px;">
                <button pButton type="button" label="Save" (click)="save()"></button><button pButton type="button" label="Cancel" (click)="formMode = FormMode.Default;"></button>
            </div>
        </div>
    </div>
</div>
