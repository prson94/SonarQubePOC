trigger:
  branches:
    include: 
      - '*sprint*'
  paths:
    include: 
      - '/'
    exclude:
    - '/DBUpdateScripts'
    - '/igx.*'
  batch: True
pr: none
#  autoCancel: false
#  drafts: false
#  branches:
#    include:
#    - '*sprint*'
#  paths:
#    include: 
#      - '/'
#    exclude:
#    - '/DBUpdateScripts'
#    - '/igx.*'
name: $(SourceBranchName)-$(Date:MM-dd-yyyy)$(Rev:.r)
resources:
  repositories:
  - repository: self
    type: git
  - repository: templates
    type: github
    name: Infogix/govern-pipeline-templates
    ref: refs/heads/GOV-16997---Create-Pipeline-templates-YAML
    endpoint: 'govern-build - Service Endpoint'
stages:
- stage: BUILD_NAME
  displayName: 'Set build name'
  dependsOn: []
  jobs:
  - template: build/jobs/job-build-name.yml@templates
- stage: UNIT_TESTS
  displayName: 'Run unit tests'
  dependsOn: []
  jobs:
  - template: build/jobs/job-govern-UI-dotnet-unit-tests.yml@templates
- stage: BUNDLE_SCRIPTS
  displayName: 'Bundle scripts'
  dependsOn: []
  jobs: 
  - job: BundleScripts
    displayName: "Bundle scripts"
    timeoutInMinutes: 0
    cancelTimeoutInMinutes: 5
    variables:
      npm_config_cache: $(Pipeline.Workspace)/.npm
    pool: 
      vmImage: windows-2019
    steps:
    - checkout: self   
    - template: build/steps/step-npm-build.yml@templates
      parameters:
        workingDir: 'd360.web'
        buildScript: 'run build-dev-ops-prod'
    - publish: $(Build.Repository.LocalPath)/d360.web/Scripts/dist
      displayName: 'Publish bundled scripts for later use'
      artifact: dist
- stage: BUILD
  displayName: 'Build solution'
  dependsOn: 
  - UNIT_TESTS
  - BUNDLE_SCRIPTS
  jobs:
  - job: UiBuild
    displayName: 'UI Build and deploy'
    timeoutInMinutes: 0
    cancelTimeoutInMinutes: 5
    pool:
      vmImage: windows-2019
    steps:
    - checkout: self
    - download: current
      artifact: dist
    - task: CopyFiles@2
      displayName: 'Copy bundled scripts'
      inputs:
        sourceFolder: $(Pipeline.Workspace)
        contents: 'dist/**'
        targetFolder: $(Build.Repository.LocalPath)/d360.web/Scripts/
    - template: build/steps/step-t4-transform.yml@templates
    - template: build/steps/step-dotnet-build.yml@templates
      parameters:
        solutionToRestore: D360.sln
        solutionToBuild: d360.web/d360.web.csproj
        nuGetCommand: 'restore -Project2ProjectTimeOut 20'
        buildArguments: '/p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=Package  /p:PackageAsSingleFile=true  /p:PackageLocation="$(Build.Repository.LocalPath)\d360.web\bin\Release\web.zip" /p:PrecompileBeforePublish=true '
    - template: build/steps/step-govern-attribution-report.yml@templates
    - task: ArchiveFiles@2
      displayName: 'Add License Attirubtion File to Distro'
      inputs:
        rootFolderOrFile: $(Build.Repository.LocalPath)\WEB\
        includeRootFolder: false
        sevenZipCompression: 5
        archiveFile: $(Build.Repository.LocalPath)\d360.web\bin\Release\web.zip
        replaceExistingArchive: false
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Web Distro to Build'
      inputs:
        PathtoPublish: $(Build.Repository.LocalPath)\d360.web\bin\Release\web.zip
        ArtifactName: Govern-UI
- stage: UPDATE_VG_DB_DEPLOYMENTS
  displayName: 'Update Variable Groups for DB deployments'
  dependsOn: []
  jobs:
  - template: build/jobs/job-update-vg-db-deployments.yml@templates
